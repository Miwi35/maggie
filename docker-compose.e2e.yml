# Deterministic e2e stack (MAG-94).
#
# Standalone on purpose — not a profile of docker-compose.yml and not an
# override of it. The three things that must differ from dev are exactly the
# three a profile shares: named volumes, fixed host ports, and the project
# name. See agent-os/specs/2026-09-30-1700-e2e-environment/shape.md.
#
# Run it through `task e2e:up`, never `docker compose -f` by hand: the task
# derives COMPOSE_PROJECT_NAME from the worktree path and resolves the
# ephemeral host port, and both are load-bearing.
#
# Three rules hold this file together:
#   1. No host port anywhere except traefik, which publishes one ephemeral one.
#   2. No persistent volume. Data directories are tmpfs, so a stack that never
#      persists cannot leak state between runs and `e2e:down` cannot forget to
#      remove anything.
#   3. Every service carries `maggie.stack`, and this stack's Traefik only
#      looks at containers carrying its own value. Without that, the dev
#      Traefik would claim these containers and two e2e stacks would fight
#      over the same router names.

# Memory budget (MAG-137). Every service has a `mem_limit`, and `memswap_limit`
# equal to it so nothing spills into swap: a service that outgrows its share is
# OOM-killed inside its own container, never on the workstation (an unbounded
# php-fpm from this stack once made the kernel kill the owner's browser).
#
# Steady state, in MiB: elasticsearch 1024, php 512, agent 320, wiremock 320,
# database 256, rabbitmq 256, worker 160, ciqual 128, traefik 48, mercure 48,
# nginx 32 = 3104 (~3.0 GiB of ceilings; ~2.3 GiB actually used at rest, and
# Elasticsearch alone took 1.3 GiB before it was tuned). The ticket aimed at
# 2.5 GiB; below these, measured services hit their limit (Elasticsearch at
# 896 MB sat at 842 MB) or trip their own alarms (RabbitMQ's watermark).
# Two one-shots sit outside the sum: admin-build (1280, gone once the bundle
# exists) and playwright (1536, behind a profile). Raise a limit here, never
# remove it. `task e2e:up` refuses to start below 5 GB available (wt/guard.sh).

x-stack-label: &stack-label
  maggie.stack: ${COMPOSE_PROJECT_NAME:-maggie-e2e}

# One image for php and worker: same Dockerfile, same args, so one build and one
# pull. The tag is the hash of the build inputs, set by e2e/images.sh in CI
# (MAG-135); locally the variable is unset and `build:` does the work.
x-php-image: &php-image
  image: ${E2E_IMAGE_PHP:-${COMPOSE_PROJECT_NAME:-maggie-e2e}-php}
  build:
    context: .
    dockerfile: .docker/php/Dockerfile
    target: e2e
    labels:
      # Links the pushed image to this repository, so GHCR lets its workflows pull and push it.
      org.opencontainers.image.source: https://github.com/Miwi35/maggie
    args:
      PHP_VERSION: ${PHP_VERSION:-8.4}
      UID: ${UID:-1000}
      GID: ${GID:-1000}

x-php-environment: &php-environment
  APP_ENV: e2e
  APP_DEBUG: "0"
  APP_SECRET: e2e-secret-not-used-outside-the-test-stack
  DATABASE_URL: "postgresql://maggie:maggie@database:5432/maggie_e2e?serverVersion=17&charset=utf8"
  # Real RabbitMQ and a real worker. Dispatching synchronously would skip the
  # async path the journeys exist to check.
  MESSENGER_TRANSPORT_DSN: "amqp://guest:guest@rabbitmq:5672/%2f/messages"
  MERCURE_URL: http://mercure/.well-known/mercure
  MERCURE_PUBLIC_URL: ${E2E_BASE_URL:-http://localhost}/.well-known/mercure
  # At least 32 bytes, and that is not decoration: lcobucci/jwt refuses to sign
  # HS256 with anything shorter, so a 144-bit secret made every publish throw
  # "Key provided is shorter than 256 bits". MercurePublishMiddleware catches
  # and logs that, so the stack looked healthy and simply had no real-time at
  # all — found by the first browser journey to assert on it (MAG-97).
  MERCURE_JWT_SECRET: e2e-mercure-secret-at-least-32-bytes-long
  ELASTICSEARCH_URL: http://elasticsearch:9200
  CIQUAL_SERVICE_URL: http://ciqual:8002
  CORS_ALLOW_ORIGIN: '^https?://(localhost|127\.0\.0\.1)(:[0-9]+)?$$'
  ADMIN_URL: ${E2E_BASE_URL:-http://localhost}/admin
  SERVICE_TOKEN: e2e-service-token
  E2E_LOGIN_TOKEN: ${E2E_LOGIN_TOKEN:-e2e-login-token}
  # Their own directory, so the stack never picks up dev keys with a different
  # passphrase. `task e2e:up` generates them.
  JWT_SECRET_KEY: /var/www/api/config/jwt/e2e/private.pem
  JWT_PUBLIC_KEY: /var/www/api/config/jwt/e2e/public.pem
  JWT_PASSPHRASE: e2e-jwt-passphrase
  # Google sign-in is replaced by the test login, so these are placeholders.
  GOOGLE_CLIENT_ID: e2e-google-client-id
  GOOGLE_CLIENT_SECRET: e2e-google-client-secret
  GOOGLE_REDIRECT_URI: ${E2E_BASE_URL:-http://localhost}/api/auth/google/callback
  GOOGLE_WEBHOOK_URL: ${E2E_BASE_URL:-http://localhost}/api/calendar/google/webhook
  GOOGLE_WEBHOOK_TOKEN: e2e-webhook-token
  # Calendar and Tasks do have callers, so they go to WireMock.
  GOOGLE_API_BASE_URL: http://wiremock:8080/google/
  ENABLE_BANKING_APPLICATION_ID: e2e-application-id
  ENABLE_BANKING_PRIVATE_KEY: /var/www/api/config/bank/e2e.pem
  ENABLE_BANKING_BASE_URL: http://wiremock:8080/enablebanking
  BANK_CALLBACK_URL: ${E2E_BASE_URL:-http://localhost}/api/finance/bank-callback
  TRUSTED_PROXIES: 0.0.0.0/0

services:
  # ===========================================================================
  # Traefik — the stack's single door, on one ephemeral host port
  # ===========================================================================
  traefik:
    image: traefik:v3.6
    command:
      - "--api.dashboard=false"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=${COMPOSE_PROJECT_NAME:-maggie-e2e}-net"
      # The isolation guarantee. Drop this line and this Traefik starts
      # routing to the dev stack, and the dev one to this stack.
      - "--providers.docker.constraints=Label(`maggie.stack`,`${COMPOSE_PROJECT_NAME:-maggie-e2e}`)"
      # Plain HTTP: no certificate for Playwright to trust, no /etc/hosts entry,
      # no HTTPS redirect. The cost is that the e2e stack does not exercise TLS,
      # which Traefik terminates identically in dev and prod anyway.
      - "--entrypoints.web.address=:80"
    ports:
      # No host port chosen: Docker picks a free one, `task e2e:url` resolves
      # it. Bound to the loopback, because E2E_LOGIN_TOKEN has a committed
      # default — on 0.0.0.0 anyone on the same network could mint a JWT
      # against a running stack.
      - "127.0.0.1::80"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    mem_limit: 48m
    memswap_limit: 48m
    labels:
      <<: *stack-label
    networks:
      - e2e

  # ===========================================================================
  # PHP-FPM — the worktree's own code, in the e2e environment
  # ===========================================================================
  php:
    <<: *php-image
    volumes:
      # The whole point of a per-worktree stack: this is the branch's code,
      # not the main checkout the dev stack mounts.
      - ./api:/var/www/api:cached
    environment: *php-environment
    depends_on:
      database:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      wiremock:
        condition: service_healthy
      # Started, not healthy: Elasticsearch takes the longest to come up, and
      # composer, cache:clear and the migrations do not touch it. Waiting for it
      # here would serialise its boot in front of all of them. The final
      # `up --wait` still waits for it (the worker declares it healthy, but the
      # final wait runs with --no-deps, so that wait is what enforces it).
      elasticsearch:
        condition: service_started
    mem_limit: 512m
    memswap_limit: 512m
    labels:
      <<: *stack-label
    networks:
      - e2e

  # ===========================================================================
  # Nginx — serves the built admin and proxies PHP, same config as dev
  # ===========================================================================
  nginx:
    image: ${E2E_IMAGE_NGINX:-${COMPOSE_PROJECT_NAME:-maggie-e2e}-nginx}
    build:
      context: .
      dockerfile: .docker/nginx/Dockerfile
      target: dev
      labels:
        # Links the pushed image to this repository, so GHCR lets its workflows pull and push it.
        org.opencontainers.image.source: https://github.com/Miwi35/maggie
    volumes:
      - ./api/public:/var/www/api/public:ro
      - ./admin/dist:/var/www/admin:ro
    environment:
      APP_DOMAIN: localhost
      NGINX_ENVSUBST_OUTPUT_DIR: /etc/nginx/conf.d
    depends_on:
      php:
        condition: service_started
      admin-build:
        condition: service_completed_successfully
    healthcheck:
      # The favicon location answers 204 without touching PHP, so this checks
      # nginx itself rather than the whole chain behind it. 127.0.0.1, not
      # localhost: that resolves to ::1 here and nginx only listens on IPv4.
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1/favicon.ico || exit 1"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s
      start_interval: 1s
    mem_limit: 32m
    memswap_limit: 32m
    labels:
      <<: *stack-label
      traefik.enable: "true"
      traefik.http.routers.e2e-api.rule: "PathPrefix(`/api`) || PathPrefix(`/_mcp`) || PathPrefix(`/bundles`) || PathPrefix(`/admin`) || Path(`/`) || Path(`/privacy`) || Path(`/terms`)"
      traefik.http.routers.e2e-api.entrypoints: "web"
      traefik.http.services.e2e-api.loadbalancer.server.port: "80"
    networks:
      - e2e

  # ===========================================================================
  # Admin build — runs once, then exits; nginx waits for it
  # ===========================================================================
  # Journeys test the built SPA, the way production serves it, rather than the
  # Vite dev server. A bug that only appears in a production build — and those
  # exist — would otherwise reach users unseen.
  admin-build:
    image: node:${NODE_VERSION:-22}-alpine
    working_dir: /var/www/admin
    user: ${UID:-1000}:${GID:-1000}
    volumes:
      - ./admin:/var/www/admin:cached
    environment:
      # Relative URLs, so the build does not depend on the ephemeral host port.
      VITE_API_URL: /api
      VITE_MERCURE_PUBLIC_URL: /.well-known/mercure
      VITE_GOOGLE_CLIENT_ID: e2e-google-client-id
      # The container runs as the host's uid, which has no entry in the image's
      # passwd — so HOME resolves to / and npm cannot write its cache there.
      HOME: /tmp
      npm_config_cache: /tmp/.npm-cache
      npm_config_update_notifier: "false"
      # Vite's default heap ceiling is sized from the host, not the container:
      # below it the build is OOM-killed instead of garbage-collected.
      NODE_OPTIONS: --max-old-space-size=1024
      E2E_ADMIN_PREBUILT: ${E2E_ADMIN_PREBUILT:-}
    command:
      - sh
      - -c
      - |
        set -e
        # CI restores a bundle built from this exact source (MAG-180): the
        # build is the longest step of the start-up and nothing else waits on
        # less than it.
        if [ -n "$$E2E_ADMIN_PREBUILT" ] && [ -f dist/index.html ]; then
          echo "admin bundle restored from cache, build skipped"
          exit 0
        fi
        if [ ! -d node_modules ] || [ package-lock.json -nt node_modules ]; then
          npm ci
        fi
        npm run build
    mem_limit: 1280m
    memswap_limit: 1280m
    labels:
      <<: *stack-label
    networks:
      - e2e

  # ===========================================================================
  # Worker — consumes the async transport, as in production
  # ===========================================================================
  worker:
    <<: *php-image
    volumes:
      - ./api:/var/www/api:cached
    environment: *php-environment
    depends_on:
      database:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    command: ["php", "bin/console", "messenger:consume", "async", "--time-limit=3600", "--memory-limit=96M"]
    restart: unless-stopped
    healthcheck:
      # A consumer has no endpoint, so this checks the only thing that matters:
      # the process is actually running. Without it `up --wait` returns as soon
      # as the container is "started", which is also true of one crash-looping
      # on a missing vendor/ — and a journey then waits forever for an indexed
      # entity that nobody is indexing.
      test: ["CMD-SHELL", "pgrep -f 'messenger:consume' >/dev/null || exit 1"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 10s
      start_interval: 1s
    mem_limit: 160m
    memswap_limit: 160m
    labels:
      <<: *stack-label
    networks:
      - e2e

  # ===========================================================================
  # PostgreSQL — in memory, unpublished
  # ===========================================================================
  database:
    image: postgres:${POSTGRES_VERSION:-17}-alpine
    environment:
      POSTGRES_USER: maggie
      POSTGRES_PASSWORD: maggie
      POSTGRES_DB: maggie_e2e
    volumes:
      - ./.docker/postgres/init-agent-db.sql:/docker-entrypoint-initdb.d/10-create-agent-db.sql:ro
    tmpfs:
      # Faster, and it makes "state survived a down" impossible by construction.
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U maggie -d maggie_e2e"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 10s
      start_interval: 1s
    mem_limit: 256m
    memswap_limit: 256m
    labels:
      <<: *stack-label
    networks:
      - e2e

  # ===========================================================================
  # Mercure
  # ===========================================================================
  mercure:
    # Pinned by digest, and it has to stay pinned. `dunglas/mercure` untagged
    # moved to a build that renamed the subscribe parameter from `topic` to
    # `match`/`match_urlpattern`; the admin, the agent, the mobile app and the
    # subscriber tokens all still speak the old one, so an unpinned hub answers
    # `400 unknown topic matcher query parameter` and every real-time update
    # dies at once. CI pulls fresh, so it broke there first (MAG-97).
    #
    # This exact digest is what production runs, so it is the version validated
    # by use — no tag points at it any more. Moving to the new parameter is its
    # own ticket.
    image: dunglas/mercure@sha256:916834e499613d475e9ad5118cd2349875338f52d99d65b58aeff82f97ccb0c6
    environment:
      SERVER_NAME: ':80'
      MERCURE_PUBLISHER_JWT_KEY: e2e-mercure-secret-at-least-32-bytes-long
      MERCURE_SUBSCRIBER_JWT_KEY: e2e-mercure-secret-at-least-32-bytes-long
      MERCURE_EXTRA_DIRECTIVES: |
        cors_origins *
    mem_limit: 48m
    memswap_limit: 48m
    labels:
      <<: *stack-label
      traefik.enable: "true"
      traefik.http.routers.e2e-mercure.rule: "PathPrefix(`/.well-known/mercure`)"
      traefik.http.routers.e2e-mercure.entrypoints: "web"
      traefik.http.services.e2e-mercure.loadbalancer.server.port: "80"
    networks:
      - e2e

  # ===========================================================================
  # RabbitMQ
  # ===========================================================================
  rabbitmq:
    image: rabbitmq:3-alpine
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
      # The default watermark is 0.4 of the container limit, ~100 MB here, and
      # an idle node already holds about that: the memory alarm would block
      # every publisher at boot. The container limit is the real ceiling.
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: -rabbit vm_memory_high_watermark 0.8
    tmpfs:
      - /var/lib/rabbitmq
    healthcheck:
      # The probe runs as root: if it fires before the server has written its
      # cookie, it creates `.erlang.cookie` itself (root, 0400) and the server,
      # running as `rabbitmq`, dies with eacces. Hence the file test first.
      test: ["CMD-SHELL", "test -f /var/lib/rabbitmq/.erlang.cookie && rabbitmq-diagnostics -q ping"]
      interval: 2s
      timeout: 5s
      retries: 40
      start_period: 20s
      start_interval: 1s
    mem_limit: 256m
    memswap_limit: 256m
    labels:
      <<: *stack-label
    networks:
      - e2e

  # ===========================================================================
  # Elasticsearch — always on here, unlike dev where it sits behind a profile
  # ===========================================================================
  # A stale or missing index returns an empty list in silence, so search
  # journeys would pass for the wrong reason without it.
  elasticsearch:
    image: elasticsearch:8.17.0
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.enrollment.enabled=false
      # Machine learning is unused here and its native processes were ~450 MB of
      # the 1.3 GB this node took at rest with a 512 MB heap. Measured: heap
      # 384 MB and no ML boot at ~840 MB, which the 1 GB limit leaves room above.
      - xpack.ml.enabled=false
      - "ES_JAVA_OPTS=-Xms384m -Xmx384m"
    tmpfs:
      - /usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health || exit 1"]
      # Polled every 2 s: `up --wait` returns one interval after the node is
      # ready, so a long interval is dead time on every start.
      interval: 2s
      timeout: 5s
      retries: 75
      start_period: 15s
      start_interval: 1s
    mem_limit: 1024m
    memswap_limit: 1024m
    labels:
      <<: *stack-label
    networks:
      - e2e

  # ===========================================================================
  # Python Agent Hub
  # ===========================================================================
  agent:
    image: ${E2E_IMAGE_AGENT:-${COMPOSE_PROJECT_NAME:-maggie-e2e}-agent}
    build:
      context: .
      dockerfile: .docker/python/Dockerfile
      target: dev
      labels:
        # Links the pushed image to this repository, so GHCR lets its workflows pull and push it.
        org.opencontainers.image.source: https://github.com/Miwi35/maggie
      args:
        PYTHON_VERSION: ${PYTHON_VERSION:-3.12}
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    volumes:
      - ./agent:/app:cached
      - ./api/config/jwt/e2e/public.pem:/etc/jwt/public.pem:ro
      # The eval suite's scenarios and nothing else the agent needs — it reads
      # them from inside this container, where the stack is reachable.
      - ./scripts:/scripts:ro
      # The agent runs `uv pip install` on every start, since its dependencies
      # are not baked into the image. The cache turns that from a download into
      # a copy; CI restores it keyed on the agent's lockfile (MAG-135).
      - ./.e2e-cache/uv:/home/app/.cache/uv
    environment:
      UV_LINK_MODE: copy
      # Maggie answers from agent/fixtures/fake-llm/ instead of calling Claude:
      # a journey that talks to her is fast, free and the same every time
      # (MAG-95). `E2E_LLM_PROVIDER=anthropic` switches this stack to the real
      # model — what `task e2e:eval` does, and nothing else should.
      LLM_PROVIDER: ${E2E_LLM_PROVIDER:-fake}
      # Empty under the fake, which needs no key. Only the eval sets it.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # Passed through from the caller when set, absent otherwise — no default,
      # because the one thing that cares is `task e2e:eval`, which has to run on
      # the model production serves, and a value pinned here would silently win
      # over the caller's. eval.yml reads it from infra/k8s/configmap.yaml, the
      # only place that decides it. Under the fake it merely labels a metric.
      ANTHROPIC_MODEL:
      OPENAI_API_KEY: e2e-openai-key
      OPENAI_BASE_URL: http://wiremock:8080/openai/v1
      # edge_tts opens its own WebSocket to Microsoft, so there is no URL to
      # redirect — the provider switch is the only way out.
      TTS_PROVIDER: fake
      MCP_SERVER_URL: http://nginx/_mcp
      MERCURE_URL: http://mercure/.well-known/mercure
      MERCURE_PUBLIC_URL: ${E2E_BASE_URL:-http://localhost}/.well-known/mercure
      MERCURE_JWT_SECRET: e2e-mercure-secret-at-least-32-bytes-long
      SERVICE_TOKEN: e2e-service-token
      # The eval runner logs in from inside this container, the same way any
      # other e2e client does.
      E2E_LOGIN_TOKEN: ${E2E_LOGIN_TOKEN:-e2e-login-token}
      DATABASE_URL: "postgresql://maggie:maggie@database:5432/maggie_e2e"
      AGENT_DATABASE_URL: "postgresql://maggie:maggie@database:5432/maggie_agent"
      RABBITMQ_URL: "amqp://guest:guest@rabbitmq:5672/"
      AGENT_BASE_URL: ${E2E_BASE_URL:-http://localhost}/agent
      # Four instead of the default ten, so two exchanges are enough to summarize a
      # thread and a journey can assert on the summary without sending five (MAG-11).
      CONTEXT_SUMMARY_EVERY_MESSAGES: "4"
      # Two instead of the default eight, so the global window of the history holds the
      # previous exchange and nothing more (MAG-13). That is what makes
      # 72-thread-history-recall.yaml a proof: a sentence from an older thread can only be
      # in the history because that thread's own messages were loaded. Raise it and the
      # journey still passes for the wrong reason.
      RECENT_HISTORY_MESSAGES: "2"
    depends_on:
      database:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      nginx:
        condition: service_started
      wiremock:
        condition: service_healthy
    healthcheck:
      # `up --wait` only waits for services that declare one. Without this the
      # agent is still running `uv sync` when a journey's first request
      # arrives, and Traefik answers 502 — a flaky failure that looks like a
      # broken route.
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8001/health')\" || exit 1"]
      interval: 2s
      timeout: 5s
      retries: 100
      start_period: 10s
      start_interval: 1s
    mem_limit: 320m
    memswap_limit: 320m
    labels:
      <<: *stack-label
      traefik.enable: "true"
      traefik.http.routers.e2e-agent.rule: "PathPrefix(`/agent`)"
      traefik.http.routers.e2e-agent.entrypoints: "web"
      traefik.http.services.e2e-agent.loadbalancer.server.port: "8001"
    networks:
      - e2e

  # ===========================================================================
  # Ciqual — food composition, called by the recipe and grocery journeys
  # ===========================================================================
  ciqual:
    image: ${E2E_IMAGE_CIQUAL:-${COMPOSE_PROJECT_NAME:-maggie-e2e}-ciqual}
    build:
      context: .
      dockerfile: .docker/ciqual/Dockerfile
      target: dev
      labels:
        # Links the pushed image to this repository, so GHCR lets its workflows pull and push it.
        org.opencontainers.image.source: https://github.com/Miwi35/maggie
      args:
        PYTHON_VERSION: ${PYTHON_VERSION:-3.12}
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    volumes:
      - ./ciqual:/app:cached
    mem_limit: 128m
    memswap_limit: 128m
    labels:
      <<: *stack-label
      traefik.enable: "true"
      traefik.http.routers.e2e-ciqual.rule: "PathPrefix(`/ciqual`)"
      traefik.http.routers.e2e-ciqual.entrypoints: "web"
      traefik.http.services.e2e-ciqual.loadbalancer.server.port: "8002"
    networks:
      - e2e

  # ===========================================================================
  # WireMock — every third-party API the stack would otherwise call
  # ===========================================================================
  # See .docker/e2e/wiremock/README.md for what is stubbed and what is not.
  wiremock:
    image: wiremock/wiremock:3.9.1
    command: ["--disable-banner", "--local-response-templating"]
    environment:
      # The JVM sizes its heap from the container limit; a quarter of 320 MB
      # leaves too little for templating.
      JAVA_OPTS: -XX:MaxRAMPercentage=50
    volumes:
      - ./.docker/e2e/wiremock/mappings:/home/wiremock/mappings:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8080/__admin/health || exit 1"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 15s
      start_interval: 1s
    mem_limit: 320m
    memswap_limit: 320m
    labels:
      <<: *stack-label
    networks:
      - e2e

  # ===========================================================================
  # Playwright — the browser harness (MAG-97), one shot, on demand
  # ===========================================================================
  # Behind a profile: `task e2e:up` must not start it, and `docker compose run`
  # enables the profile of whatever it is asked to run.
  #
  # It browses `http://traefik` — the stack's own router, from inside its
  # network. That is the one origin every relative URL the admin is built with
  # (`/api`, `/.well-known/mercure`, `/agent`) resolves against, exactly as in
  # production; and it means the journeys never have to discover the ephemeral
  # host port.
  playwright:
    profiles: [tools]
    # The tag must match @playwright/test in e2e/web/package.json: the image
    # bakes the browsers, and Playwright refuses a version it did not ship.
    image: mcr.microsoft.com/playwright:v1.63.0-noble
    working_dir: /e2e
    user: ${UID:-1000}:${GID:-1000}
    volumes:
      - ./e2e/web:/e2e:cached
      # Read-only, and only this: the journeys read ids from the seed manifest
      # and must not be able to write anything back into the repository.
      - ./api/var/e2e:/seed:ro
    environment:
      E2E_BASE_URL: http://traefik
      E2E_LOGIN_TOKEN: ${E2E_LOGIN_TOKEN:-e2e-login-token}
      E2E_SEED_MANIFEST: /seed/seed-manifest.json
      # Retries, the GitHub reporter and `forbidOnly` all key off this.
      CI: ${CI:-}
      # The container runs as the host's uid, which has no entry in the image's
      # passwd — HOME would resolve to / and npm could not write its cache.
      HOME: /tmp
      npm_config_cache: /tmp/.npm-cache
      npm_config_update_notifier: "false"
    mem_limit: 1536m
    memswap_limit: 1536m
    labels:
      <<: *stack-label
    networks:
      - e2e

networks:
  e2e:
    # Named explicitly so Traefik's --providers.docker.network can point at it
    # without guessing how Compose prefixed it.
    name: ${COMPOSE_PROJECT_NAME:-maggie-e2e}-net
    driver: bridge
