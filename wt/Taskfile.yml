version: '3'

# Worktree-local checks: the fast path for an agent verifying its own change.
#
# `task api:*` talks to the dev stack, which mounts the main checkout — wrong
# code in a worktree. `task e2e:*` is right but heavy: eleven services for a
# lint is not a trade anyone should make.
#
# These sit between the two. Five rules, in order of how much trouble breaking
# them causes on a machine shared by several agents:
#
#   1. Minimal      — only what the command needs. PHPStan and lint want a PHP
#                     container and nothing else; the API suite wants Postgres
#                     too. Never the whole stack.
#   2. One shot     — `docker run --rm`, or Compose up followed by an
#                     unconditional `down -v` through a trap. Nothing survives
#                     the command.
#   3. No fixed port — nothing published at all here. Nothing needs it.
#   4. Guarded      — wt:guard refuses to start when the machine is short of
#                     memory or already loaded, waits briefly, then sends you
#                     to CI.
#   5. Released     — resources come back when the command ends, not when the
#                     session does.
#
# Dependencies come from a shared cache keyed by lockfile hash, the same way
# `actions/cache` keys them in ci.yml, mounted read-only. No per-worktree
# install.

vars:
  # Declared first because PHP_IMAGE below references it.
  #
  # Named WT_PROJECT, not PROJECT: file-level vars collide across included
  # Taskfiles, and e2e/Taskfile.yml defines a PROJECT of its own — which is
  # what the image tag silently picked up before this.
  WT_PROJECT:
    sh: |
      slug=$(basename "{{.ROOT_DIR}}" | tr '[:upper:]' '[:lower:]' | tr -c 'a-z0-9-' '-' | sed 's/-*$//')
      hash=$(printf '%s' "{{.ROOT_DIR}}" | sha1sum | cut -c1-8)
      echo "maggie-wt-${slug}-${hash}"
  # Tagged with the hash of what the image is built from, like CI's (MAG-135):
  # two worktrees on the same Dockerfile share it, two on different ones get
  # different tags, and nothing rebuilds until .docker/php/** changes.
  PHP_IMAGE:
    # The fallback keeps `wt:down`, `wt:ps` and `wt:prune` working when Compose or
    # jq cannot compute the hash: stopping must not depend on the build inputs.
    sh: '{{.ROOT_DIR}}/wt/image.sh tag 2>/dev/null || echo maggie-wt-php:unknown'
  NODE_IMAGE: 'node:{{.NODE_VERSION | default "22"}}-alpine'
  GUARD: '{{.ROOT_DIR}}/wt/guard.sh'
  STACK: '{{.ROOT_DIR}}/wt/stack.sh'
  IMAGE_SH: '{{.ROOT_DIR}}/wt/image.sh'
  DEPS_CACHE: '{{.ROOT_DIR}}/wt/deps-cache.sh'

# Thresholds live in wt/limits.env, loaded by the root Taskfile — Task refuses
# a `dotenv` declaration in an included file. The scripts carry the same
# defaults, so running them directly still works.

tasks:
  # ===========================================================================
  # The guard — every task below goes through it
  # ===========================================================================
  guard:
    desc: Refuse to start local work when the machine is too busy
    # once: `task fix:all` chains a dozen wt tasks; one check per run is enough.
    run: once
    cmds:
      # WT_SELF_PROJECT: this worktree's own stack is not "another" one, and
      # any wt task counts as activity that keeps it alive.
      - WT_SELF_PROJECT='{{.WT_PROJECT}}' {{.GUARD}}
    silent: true

  # ===========================================================================
  # PHP: PHPStan and the API suite
  # ===========================================================================
  image:
    desc: Make sure the PHP image the worktree tasks use exists (built only when .docker/php/** changed)
    # The e2e target: production php.ini, no Xdebug.
    #
    # The tag is the hash of the build inputs, so "already built" is exact: a
    # branch touching .docker/php/Dockerfile gets a new tag and builds once, any
    # other branch finds its image and runs `docker image inspect`, nothing else.
    # CI's image for the same hash is pulled in preference to a build.
    run: once
    deps: [guard]
    cmds:
      - '{{.IMAGE_SH}} ensure'

  phpstan:
    desc: PHPStan on this worktree (task wt:phpstan -- modules/core/src/Foo.php)
    # One container, no network, no database, no port. Analysing only the files
    # you pass keeps it to seconds; with no arguments it runs the whole
    # configured paths list, like CI.
    #
    # Caveat of a partial run: PHPStan reports `trait.unused` for a trait whose
    # users are outside the file list. That is an artefact of the subset, not a
    # finding — re-run without arguments, or with the traits' users included,
    # before believing it.
    cmds:
      # phpstan.neon reads the compiled Symfony container, so it has to exist
      # before the analysis — this is why the task warms the cache rather than
      # calling phpstan straight away.
      - task: _php
        vars:
          COMMAND: 'php bin/console cache:warmup -q && vendor/bin/phpstan analyse --memory-limit=1G --no-progress {{.CLI_ARGS}}'

  phpstan:changed:
    desc: PHPStan on the PHP files changed since origin/main, on this worktree's code
    # Committed, staged, unstaged and untracked files alike, so it can run
    # before the commit. wt/changed-php.sh keeps only what phpstan.neon
    # analyses: PHPStan would happily analyse a test file passed by name, which
    # CI never does.
    cmds:
      - |
        set -euo pipefail
        FILES="$({{.ROOT_DIR}}/wt/changed-php.sh | tr '\n' ' ')"
        if [ -z "$FILES" ]; then
          echo "PHPStan: no changed PHP file under the paths phpstan.neon analyses."
          exit 0
        fi
        echo "PHPStan on: $FILES"
        task wt:phpstan -- $FILES

  cs:fix:
    desc: PHP-CS-Fixer in write mode on this worktree
    cmds:
      - task: _php
        vars:
          COMMAND: 'vendor/bin/php-cs-fixer fix --diff --no-interaction {{.CLI_ARGS}}'

  cs:check:
    desc: PHP-CS-Fixer dry run on this worktree, like CI
    cmds:
      - task: _php
        vars:
          COMMAND: 'vendor/bin/php-cs-fixer fix --dry-run --diff --no-interaction {{.CLI_ARGS}}'

  _php:
    internal: true
    deps: [image]
    cmds:
      # The vendor cache is resolved here rather than in `vars`, because Task
      # evaluates `vars` before `deps` — and filling it needs the image the
      # `image` dep builds.
      - |
        set -euo pipefail
        VENDOR="$({{.DEPS_CACHE}} api {{.PHP_IMAGE}})"
        # PHPStan's result cache lives under sys_get_temp_dir(), which --rm
        # would throw away, making every run cold. TMPDIR points it at a shared
        # host directory instead; the cache is keyed on file contents, so a
        # stale entry is not a risk.
        PHPSTAN_CACHE="$(task wt:cache:path)/phpstan"
        mkdir -p "$PHPSTAN_CACHE"
        # /app is this worktree's api/, read-write: php-cs-fixer rewrites it.
        docker run --rm \
          --memory {{.WT_MEMORY}} --cpus {{.WT_CPUS}} \
          -u $(id -u):$(id -g) \
          -e APP_ENV=dev -e APP_DEBUG=1 -e TMPDIR=/tmp/phpstan \
          -v "{{.ROOT_DIR}}/api":/app \
          -v "$VENDOR":/app/vendor:ro \
          -v "$PHPSTAN_CACHE":/tmp/phpstan \
          -w /app \
          --entrypoint sh {{.PHP_IMAGE}} -c '{{.COMMAND}}'

  up:
    desc: Keep this worktree's Postgres up for a test loop (stop it with task wt:down)
    # The 40 s of a `wt:test:api` run that are not tests — image check, Compose
    # up, Postgres boot — happen once here. Then every `wt:test:*` reuses the
    # stack and only recreates the schema. One per worktree, nothing published.
    #
    # Safety net: a stack with no wt:* launch for WT_IDLE_MINUTES is removed by
    # the guard and by a detached reaper started below.
    deps: [image]
    cmds:
      - task: :e2e:keys
      - |
        set -euo pipefail
        COMPOSE_PROJECT_NAME='{{.WT_PROJECT}}'
        export COMPOSE_PROJECT_NAME="${COMPOSE_PROJECT_NAME:?the worktree project name must not be empty}"
        export WT_VENDOR_DIR="$({{.DEPS_CACHE}} api {{.PHP_IMAGE}})"
        export WT_PHP_IMAGE='{{.PHP_IMAGE}}'
        export WT_MEMORY='{{.WT_MEMORY}}'
        export WT_DB_MEMORY='{{.WT_DB_MEMORY}}'
        export WT_CPUS='{{.WT_CPUS}}'
        export UID_GID="$(id -u):$(id -g)"
        compose() { docker compose -f '{{.ROOT_DIR}}/wt/docker-compose.wt.yml' "$@"; }
        # A failed start must not leave a half-built stack for the reaper to
        # find in a quarter of an hour.
        trap 'rc=$?; [ $rc -eq 0 ] || {{.STACK}} down "$COMPOSE_PROJECT_NAME" >&2' EXIT
        # Stamp first: a stale one from an earlier stack must not let another
        # worktree's guard prune this one while it is still starting.
        {{.STACK}} touch "$COMPOSE_PROJECT_NAME"
        compose up -d --wait database
        # Created here, once: the test runs then only drop and recreate the schema.
        compose run --rm --entrypoint sh php -c \
          'bin/console --env=test doctrine:database:create --no-interaction --if-not-exists -q'
        {{.STACK}} touch "$COMPOSE_PROJECT_NAME"
        {{.STACK}} start-reaper "$COMPOSE_PROJECT_NAME"
        echo "wt stack $COMPOSE_PROJECT_NAME is up — reused by task wt:test:api, removed by task wt:down or after {{.WT_IDLE_MINUTES}} idle minutes."

  down:
    desc: Remove this worktree's kept stack — and only this one
    # Not guarded, not depending on the image: stopping must always work, even
    # on a busy machine. wt/stack.sh only touches containers labelled with this
    # worktree's project name, never dev, e2e, or another worktree.
    cmds:
      - '{{.STACK}} down {{.WT_PROJECT}}'

  ps:
    desc: List the kept worktree stacks on this machine and how long each has been idle
    cmds:
      - '{{.STACK}} list'

  prune:
    desc: Remove the kept worktree stacks idle for more than WT_IDLE_MINUTES
    cmds:
      - '{{.STACK}} prune'

  test:api:
    desc: PHPUnit on this worktree — on the kept stack if `wt:up` started one, else a throwaway Postgres
    # The one task here that needs Compose: the suite talks to a real database.
    #
    # Two modes, picked by whether this worktree's stack is running:
    #   kept     reuse it, recreate only the schema (drop, create): seconds.
    #   one shot bring Postgres up, run, `down -v` through a trap, as before.
    deps: [image]
    cmds:
      # Lexik needs a key pair to sign with. Reusing the e2e generator rather
      # than adding a second one: the keys are gitignored local test keys, and
      # two generators would mean two passphrases to keep in step.
      - task: :e2e:keys
      - |
        set -euo pipefail
        # :? — an empty name would make Compose fall back to the compose
        # file's directory (`wt`), shared by every worktree, and the teardown
        # below would then reach somebody else's stack.
        COMPOSE_PROJECT_NAME='{{.WT_PROJECT}}'
        export COMPOSE_PROJECT_NAME="${COMPOSE_PROJECT_NAME:?the worktree project name must not be empty}"
        export WT_VENDOR_DIR="$({{.DEPS_CACHE}} api {{.PHP_IMAGE}})"
        export WT_PHP_IMAGE='{{.PHP_IMAGE}}'
        export WT_MEMORY='{{.WT_MEMORY}}'
        export WT_DB_MEMORY='{{.WT_DB_MEMORY}}'
        export WT_CPUS='{{.WT_CPUS}}'
        export UID_GID="$(id -u):$(id -g)"
        compose() { docker compose -f '{{.ROOT_DIR}}/wt/docker-compose.wt.yml' "$@"; }

        if {{.STACK}} running "$COMPOSE_PROJECT_NAME"; then
          # The clock restarts when the run ends too, not only when it starts.
          trap '{{.STACK}} touch "$COMPOSE_PROJECT_NAME"' EXIT
          REUSE=1
        else
          REUSE=0
          # Rule 2: the teardown is registered before anything starts, so it
          # runs whatever happens next. EXIT alone — Task's shell does not
          # accept signal names, and it fires EXIT on interrupt anyway.
          trap 'compose down -v --remove-orphans >/dev/null || echo "WARNING: teardown failed — run: task wt:down" >&2' EXIT
          compose up -d --wait database
        fi

        # UPDATE_CONTRACT is forwarded so the contract files under
        # api/contract/ can be regenerated from here. It is read only by the
        # Contract suite, and unset it is a plain verification run.
        #
        # Kept stack: the database exists (wt:up created it) and holds the
        # previous run's schema, so it is emptied rather than created over.
        compose run --rm -e "UPDATE_CONTRACT=${UPDATE_CONTRACT:-}" -e "WT_REUSE=$REUSE" --entrypoint sh php -c '
          if [ "$WT_REUSE" = 1 ]; then
            bin/console --env=test doctrine:schema:drop --no-interaction --force --full-database -q
          else
            bin/console --env=test doctrine:database:create --no-interaction --if-not-exists -q
          fi \
          && bin/console --env=test doctrine:schema:create --no-interaction -q \
          && bin/phpunit {{.CLI_ARGS}}
        '

  # ===========================================================================
  # Admin
  # ===========================================================================
  lint:admin:
    desc: ESLint and tsc on this worktree
    deps: [guard]
    cmds:
      - |
        set -euo pipefail
        MODULES="$({{.DEPS_CACHE}} admin {{.NODE_IMAGE}})"
        NPM_CACHE="$(task wt:cache:path)/npm"
        docker run --rm \
          --memory {{.WT_MEMORY}} --cpus {{.WT_CPUS}} \
          -u $(id -u):$(id -g) \
          -e HOME=/tmp -e npm_config_cache=/tmp/npm-cache -e npm_config_update_notifier=false \
          -v "{{.ROOT_DIR}}/admin":/app \
          -v "$MODULES":/app/node_modules:ro \
          -v "$NPM_CACHE":/tmp/npm-cache \
          -w /app {{.NODE_IMAGE}} \
          sh -c 'npm run lint && npm run typecheck'

  fix:admin:
    desc: ESLint --fix on this worktree's admin code
    deps: [guard]
    cmds:
      - |
        set -euo pipefail
        MODULES="$({{.DEPS_CACHE}} admin {{.NODE_IMAGE}})"
        NPM_CACHE="$(task wt:cache:path)/npm"
        docker run --rm \
          --memory {{.WT_MEMORY}} --cpus {{.WT_CPUS}} \
          -u $(id -u):$(id -g) \
          -e HOME=/tmp -e npm_config_cache=/tmp/npm-cache -e npm_config_update_notifier=false \
          -v "{{.ROOT_DIR}}/admin":/app \
          -v "$MODULES":/app/node_modules:ro \
          -v "$NPM_CACHE":/tmp/npm-cache \
          -w /app {{.NODE_IMAGE}} \
          sh -c 'npm run lint -- --fix'

  test:admin:
    desc: Vitest on this worktree
    deps: [guard]
    cmds:
      - |
        set -euo pipefail
        MODULES="$({{.DEPS_CACHE}} admin {{.NODE_IMAGE}})"
        NPM_CACHE="$(task wt:cache:path)/npm"
        # Vitest writes into node_modules, which is mounted read-only from the
        # shared cache. A tmpfs covers just the two directories it needs;
        # mode=1777 because a Docker tmpfs belongs to root and this container
        # runs as the host user.
        #
        # api/contract is mounted too, read-only: useMercure.contract.test.ts
        # compares the admin's Mercure subscriptions against what the API
        # says it publishes. /app is admin/, so the contract sits at
        # /api/contract — the same place relative to the sources as in the
        # checkout, which is what the test walks up to find.
        docker run --rm \
          --memory {{.WT_MEMORY}} --cpus {{.WT_CPUS}} \
          -u $(id -u):$(id -g) \
          -e HOME=/tmp -e npm_config_cache=/tmp/npm-cache -e npm_config_update_notifier=false \
          -v "{{.ROOT_DIR}}/admin":/app \
          -v "$MODULES":/app/node_modules:ro \
          -v "$NPM_CACHE":/tmp/npm-cache \
          -v "{{.ROOT_DIR}}/api/contract":/api/contract:ro \
          --tmpfs /app/node_modules/.vite-temp:mode=1777 \
          --tmpfs /app/node_modules/.vite:mode=1777 \
          -w /app {{.NODE_IMAGE}} \
          sh -c 'npm run test -- --run {{.CLI_ARGS}}'

  # ===========================================================================
  # Agent and ciqual — a shared uv download cache, one venv per worktree
  # ===========================================================================
  # Unlike api and admin, these keep a per-worktree `.venv`: uv builds it in
  # the project directory, and pointing several worktrees at one environment
  # would make two branches with different dependencies overwrite each other.
  # The shared cache is the downloads, so building it is seconds, not minutes.
  #
  # `--frozen`, matching ci.yml's `uv sync --frozen --extra dev`: use the lock
  # as it stands, never rewrite it. A verification command that edits a tracked
  # lockfile behind the author's back is a bug — this one did, until it was
  # caught in review.
  #
  # Which makes a stale lock fatal *here* and invisible in CI, where `uv run`
  # without `--frozen` quietly resolves what the lock is missing. agent/uv.lock
  # was stale for edge-tts and prometheus-client, so `wt:test:agent` could not
  # import the app at all while agent-test stayed green; MAG-95 relocked it.
  # If this command dies on ModuleNotFoundError for a package pyproject.toml
  # does declare, that is the same failure again: run `uv lock`, commit it.
  lint:agent:
    desc: Ruff on this worktree's agent code
    deps: [guard]
    cmds:
      - task: _uv
        vars:
          DIR: agent
          COMMAND: 'uv run --frozen --extra dev ruff check app/ evals/ && uv run --frozen --extra dev ruff format --check app/ evals/'

  fix:agent:
    desc: Ruff --fix then ruff format on this worktree's agent code
    deps: [guard]
    cmds:
      # Lint fixes first, formatting last, so the tree ends up formatted.
      - task: _uv
        vars:
          DIR: agent
          COMMAND: 'uv run --frozen --extra dev ruff check --fix app/ evals/ && uv run --frozen --extra dev ruff format app/ evals/'

  test:agent:
    desc: pytest on this worktree's agent code
    deps: [guard]
    cmds:
      - task: _uv
        vars:
          DIR: agent
          COMMAND: 'uv run --frozen --extra dev pytest -q {{.CLI_ARGS}}'

  lint:ciqual:
    desc: Ruff on this worktree's ciqual code
    # `task ciqual:*` execs into the dev stack, so in a worktree it lints the
    # main checkout — the same mistake wt:* exists to remove for the others.
    deps: [guard]
    cmds:
      - task: _uv
        vars:
          DIR: ciqual
          # ciqual has no lockfile — ci.yml installs it with `uv venv && uv
          # pip install -e ".[dev]"`, so this does the same. The venv binaries
          # are called directly rather than through `uv run`, which would
          # write a uv.lock as a side effect: a command whose job is to check
          # the code must not add a file to the tree.
          COMMAND: 'uv venv -q --allow-existing && uv pip install -q -e ".[dev]" && .venv/bin/ruff check app/ tests/ && .venv/bin/ruff format --check app/ tests/'

  fix:ciqual:
    desc: Ruff --fix then ruff format on this worktree's ciqual code
    deps: [guard]
    cmds:
      - task: _uv
        vars:
          DIR: ciqual
          COMMAND: 'uv venv -q --allow-existing && uv pip install -q -e ".[dev]" && .venv/bin/ruff check --fix app/ tests/ && .venv/bin/ruff format app/ tests/'

  test:ciqual:
    desc: pytest on this worktree's ciqual code
    deps: [guard]
    cmds:
      - task: _uv
        vars:
          DIR: ciqual
          COMMAND: 'uv venv -q --allow-existing && uv pip install -q -e ".[dev]" && .venv/bin/pytest -q {{.CLI_ARGS}}'

  _uv:
    internal: true
    cmds:
      - |
        set -euo pipefail
        # A host directory rather than a named volume: Docker creates a named
        # volume owned by root, and these containers run as the host user, so
        # uv cannot write its cache there. Creating the directory ourselves
        # gets the ownership right, and it lands beside the other caches where
        # `wt:cache:prune` can see it.
        UV_CACHE="$(task wt:cache:path)/uv"
        mkdir -p "$UV_CACHE"
        docker run --rm \
          --memory {{.WT_MEMORY}} --cpus {{.WT_CPUS}} \
          -u $(id -u):$(id -g) \
          -e HOME=/tmp -e UV_CACHE_DIR=/cache -e UV_LINK_MODE=copy \
          -v "{{.ROOT_DIR}}/{{.DIR}}":/app \
          -v "$UV_CACHE":/cache \
          -w /app ghcr.io/astral-sh/uv:python3.12-alpine \
          sh -c '{{.COMMAND}}'

  # ===========================================================================
  # Cache housekeeping
  # ===========================================================================
  cache:prune:
    desc: Drop dependency cache entries unused for 14 days, keeping the 3 newest, and the stale php images
    cmds:
      - '{{.DEPS_CACHE}} prune'
      - '{{.IMAGE_SH}} prune'

  cache:path:
    desc: Print where the shared dependency caches live
    cmds:
      - 'echo "${WT_CACHE_ROOT:-${XDG_CACHE_HOME:-$HOME/.cache}/maggie}"'
    silent: true
