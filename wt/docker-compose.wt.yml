# The one place a worktree-local check needs Compose: the API suite talks to a
# real database.
#
# Two services, nothing published, no named volume — `task wt:test:api` brings
# it up and tears it down with `down -v` through a trap, so nothing outlives
# the command. Everything else under `task wt:*` is a plain `docker run --rm`.
#
# Never invoke this by hand: the project name and the vendor mount come from
# the Taskfile, and the first is what keeps worktrees apart.

services:
  database:
    image: postgres:${POSTGRES_VERSION:-17}-alpine
    environment:
      POSTGRES_USER: maggie
      POSTGRES_PASSWORD: maggie
      POSTGRES_DB: maggie
    # In memory and unpublished: a suite that cannot persist cannot leak into
    # the next run, and nothing outside this compose file needs to reach it.
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U maggie -d maggie"]
      interval: 2s
      timeout: 5s
      retries: 30
    mem_limit: ${WT_MEMORY:-2g}
    networks:
      - wt

  php:
    # Tag is per-worktree, passed by the Taskfile: a shared tag would let two
    # worktrees with different Dockerfiles overwrite each other's image.
    image: ${WT_PHP_IMAGE:?the Taskfile must pass the image tag}
    user: ${UID_GID:-1000:1000}
    volumes:
      - ../api:/var/www/api
      # Read-only, from the lockfile-keyed shared cache: no per-worktree
      # install, and two worktrees on the same lockfile share one copy.
      - ${WT_VENDOR_DIR:?the Taskfile must resolve the vendor cache}:/var/www/api/vendor:ro
    working_dir: /var/www/api
    environment:
      APP_ENV: test
      APP_DEBUG: "1"
      DATABASE_URL: "postgresql://maggie:maggie@database:5432/maggie?serverVersion=17&charset=utf8"
      MESSENGER_TRANSPORT_DSN: "sync://"
      # No Elasticsearch here: the `elasticsearch` group is excluded from the
      # default suite, so nothing in it reaches this URL.
      ELASTICSEARCH_URL: http://localhost:19200
      MERCURE_URL: https://mercure.test/.well-known/mercure
      MERCURE_PUBLIC_URL: https://mercure.test/.well-known/mercure
      MERCURE_JWT_SECRET: test-secret-for-mercure-testing-only
      # The same local test keys the e2e stack uses, generated by the shared
      # `e2e:keys` task. One generator, one passphrase, two runners.
      JWT_SECRET_KEY: /var/www/api/config/jwt/e2e/private.pem
      JWT_PUBLIC_KEY: /var/www/api/config/jwt/e2e/public.pem
      JWT_PASSPHRASE: e2e-jwt-passphrase
      ADMIN_URL: http://localhost/admin
      SERVICE_TOKEN: wt-service-token
    depends_on:
      database:
        condition: service_healthy
    mem_limit: ${WT_MEMORY:-2g}
    cpus: ${WT_CPUS:-4}
    networks:
      - wt

networks:
  wt:
    name: ${COMPOSE_PROJECT_NAME:-maggie-wt}-net
