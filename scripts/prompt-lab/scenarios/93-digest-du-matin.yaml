# The morning digest, one text read or heard (MAG-709, rewritten by MAG-807, the digest skill). Played by hand
# on the real model (`task e2e:eval -- --only digest-du-matin`), never in CI.
#
# The proaction of the planning comes due: she loads the digest skill, reads the day and answers one text —
# the code makes the vocal, so she never calls `send_voice_message`. The order is weather, the day in
# chronological order (appointments with their hour, tasks with an hour, meals, the session), the tasks
# without an hour, then a decision if there is one. No finance, no trips, no question, nothing on what is empty.
name: digest-du-matin
description: The morning digest answers one text in the order of the day, without trips, finance, question or empty part, with vous.
channel: chat

mock_tool_results:
  get_weather: '{"days": [{"date": "2026-10-30", "temperature_min_c": 9.5, "temperature_max_c": 18.5, "rain_probability_percent": 70, "rain_mm": 3.4, "alerts": []}]}'
  get_events_by_date: '{"events": [{"id": "01JKINE", "summary": "Kiné", "startAt": "2026-10-30T09:15:00+01:00", "allDay": false, "status": "confirmed", "agenda": "Défaut", "location": "12 rue de Brest, Rennes"}], "count": 1}'
  get_tasks: '{"tasks": [{"title": "Appeler le garage", "scheduledDate": "2026-10-30", "scheduledMoment": "time", "scheduledTime": "18:00", "isDone": false}, {"title": "Renvoyer le dossier de la mutuelle", "scheduledDate": null, "overdueDays": 2, "urgency": "high", "isDone": false}], "counts": {"today": 1}}'
  manage_meals: '{"meals": [{"date": "2026-10-30", "slot": "dinner", "recipes": [{"name": "Soupe de potiron"}]}]}'
  get_grocery_list: '{"stores": []}'

steps:
  - user_message: >
      [Proaction due maintenant] Fais le digest du matin (compétence digest).
    expected_tools: [get_skill, get_weather, get_events_by_date, get_tasks, manage_meals]
    forbidden_tools: [send_voice_message, list_trips, get_finance_scores, ask_owner]
    expected_absent: ["?", "**", "Aucun", "Rien n'", "demain", "départ"]
    expected_behavior: >
      Un seul texte, sans Markdown, fait pour être lu ou écouté. Il suit l'ordre : la météo en une phrase
      (une information, pas un conseil), puis la journée dans l'ordre (Kiné à 9 h 15, la soupe de potiron le
      soir, l'appel au garage à 18 h), puis la tâche sans heure (le dossier de la mutuelle). Il ne parle ni
      de finance, ni de départ, ni de demain, ne pose aucune question. Une idée par phrase, « monsieur »
      une seule fois, vouvoiement, une pointe d'humour permise.
