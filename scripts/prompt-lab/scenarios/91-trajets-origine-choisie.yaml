# Trips replanned: the origin the user chose the evening before is kept (MAG-657).
#
# The replan recomputes from where the phone is, except when the user decided the origin
# (`originDecidedBy: user`): then set_trip keeps it and only the durations move. A model that
# recomputes everything from `position` silently overwrites what the user answered.
name: trajets-origine-choisie
description: Told to replan the trips of the day, she keeps the origin the user chose the evening before and recomputes the rest from the position.
channel: chat

steps:
  - user_message: >
      Replanifier les trajets du jour. Raison : l'heure d'un événement d'aujourd'hui vient de changer.
      Lis les trajets enregistrés du jour (list_trips), recalcule (estimate_trip) et enregistre (set_trip)
      ceux qui ne tiennent plus. Un trajet dont l'origine a été choisie par l'utilisateur garde son origine.
    expected_tools: [list_trips]
    expected_behavior: >
      Elle lit les trajets du jour avant de recalculer. Pour un trajet marqué originDecidedBy « user »,
      elle recalcule avec la même origine (jamais « position ») ; pour les autres elle part de la
      position réelle, et n'appelle set_trip que si l'heure de départ a bougé de plus de 2 minutes.
      Elle n'écrit rien d'autre qu'un compte rendu bref.
