# A place the owner names is saved with save_place after list_places, never read from the phone or made an event (MAG-1021).
name: lieu-enregistre
description: Asked to add an address to her places, she checks list_places first, then saves the place.
channel: chat

steps:
  - user_message: "Ajoute le bureau, 10 rue de la Paix à Paris, à mes lieux."
    expected_tools: [list_places, save_place]
    forbidden_tools: [get_my_location, create_event]
    expected_behavior: >
      Elle lit les lieux enregistrés avant d'écrire, puis enregistre « le bureau » avec l'adresse donnée
      (sans doublon si le lieu existe déjà : elle le modifie). Elle ne lit pas la position du téléphone
      et ne crée aucun événement. Elle confirme brièvement.
