# Memory has to be proactive: the prompt asks her to write a fiche for a personal
# fact without being told to — the conversation itself is already kept by the code.
# A model that answers warmly and writes nothing looks fine in the moment and has
# forgotten by tomorrow.
name: memoire-fait-personnel
description: A personal fact mentioned in passing gets a fiche.
channel: chat

steps:
  - user_message: "Au fait, je suis allergique aux fruits à coque."
    expected_tools: [memory_write_fiche]
    expected_behavior: >
      Elle écrit une fiche dont le titre est une phrase vraie (« Il est allergique
      aux fruits à coque »), avec la source (la conversation et l'heure) et la
      provenance « dit », et répond en une phrase, sans demander la permission.

  - user_message: "Tu te souviens de mes allergies ?"
    expected_tools: [memory_search, memory_open]
    expected_contains: ["coque"]
    expected_behavior: >
      Elle retrouve la fiche, l'ouvre avant d'affirmer, et ne se contente pas de
      répéter l'historique de la conversation.
