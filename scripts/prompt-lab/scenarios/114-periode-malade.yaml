# « Je suis malade » (MAG-812): an open period, ended when he is better. No dedicated tool.
name: periode-malade
description: Open a « Malade » period, then end it when he says he is better.
channel: chat

steps:
  - user_message: "Je suis malade."
    expected_tools: [manage_periods]
    forbidden_tools: [ask_owner]
    expected_contains: ["Malade"]
    expected_behavior: >
      Elle crée une période « Malade » commençant aujourd'hui, ouverte sur la durée, et dit
      en une phrase qu'elle l'a notée, sans poser de question.

  - user_message: "Ça va mieux."
    expected_tools: [manage_periods]
    expected_behavior: >
      Elle termine la période « Malade » (update de la période existante, pas une nouvelle)
      et répond en une phrase.
