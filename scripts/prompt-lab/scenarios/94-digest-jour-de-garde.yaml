# The morning digest on a day the owner already knows by heart (MAG-807): nothing but the weather and the
# evening meal. She says that, and not what is empty. Played by hand on the real model
# (`task e2e:eval -- --only digest-jour-de-garde`), never in CI.
name: digest-jour-de-garde
description: On a quiet day the digest says the weather and the meal, nothing about what is empty or already known.
channel: chat

mock_tool_results:
  get_weather: '{"days": [{"date": "2026-10-30", "temperature_min_c": 11, "temperature_max_c": 11, "rain_probability_percent": 90, "alerts": []}]}'
  get_events_by_date: '{"events": [{"id": "01JGARDE", "summary": "Garde des enfants", "allDay": true, "startDate": "2026-10-30", "endDate": "2026-10-31", "lastDay": "2026-10-30", "status": "confirmed", "agenda": "Garde"}], "count": 1}'
  get_tasks: '{"tasks": [], "counts": {"today": 0}}'
  manage_meals: '{"meals": [{"date": "2026-10-30", "slot": "dinner", "recipes": [{"name": "Gratin de pâtes"}]}]}'
  get_grocery_list: '{"stores": []}'

steps:
  - user_message: >
      [Proaction due maintenant] Fais le digest du matin (compétence digest).
    expected_tools: [get_weather, get_events_by_date, get_tasks, manage_meals]
    forbidden_tools: [send_voice_message, list_trips, get_finance_scores, ask_owner]
    expected_absent: ["?", "**", "Aucun", "Rien n'", "demain", "départ"]
    expected_behavior: >
      Un court texte : la météo (11 degrés, pluie probable), le gratin de pâtes du soir. L'événement « toute la
      journée » de la garde n'est pas un rendez-vous et le propriétaire le sait déjà. Rien sur les tâches, la
      finance ou les départs, aucune phrase sur ce qui est vide, aucune question.
