version: '3'

# Load guard and container limits for `task wt:*`. Declared here because Task
# refuses `dotenv` in an included Taskfile; the values are documented in the
# file itself.
dotenv: ['wt/limits.env']

includes:
  api:
    taskfile: ./api/Taskfile.yml
    dir: ./api
  admin:
    taskfile: ./admin/Taskfile.yml
    dir: ./admin
  agent:
    taskfile: ./agent/Taskfile.yml
    dir: ./agent
  ciqual:
    taskfile: ./ciqual/Taskfile.yml
    dir: ./ciqual
  e2e:
    taskfile: ./e2e/Taskfile.yml
  wt:
    taskfile: ./wt/Taskfile.yml

tasks:
  ci:watch:
    desc: Follow a PR's CI safely — conflict check, CI must start within 2 min, then watch (task ci:watch -- <pr>)
    # The one way agents wait for CI. A hand-rolled `until … sleep` loop waited
    # 9 minutes on a conflicting PR, for which GitHub never starts a run.
    silent: true
    cmds:
      - |
        set -euo pipefail
        PR='{{.CLI_ARGS}}'
        [ -n "$PR" ] || { echo "usage: task ci:watch -- <pr number>" >&2; exit 64; }
        # 1. A conflicting PR gets no CI at all.
        for _ in 1 2 3 4 5 6; do
          M=$(gh pr view "$PR" --json mergeable -q .mergeable)
          [ "$M" != UNKNOWN ] && break
          sleep 5   # GitHub computes mergeability lazily after a push
        done
        if [ "$M" = CONFLICTING ]; then
          echo "PR #$PR conflicts with main: no CI will run. Rebase: git fetch origin && git rebase origin/main, resolve, git push --force-with-lease." >&2
          exit 2
        fi
        # 2. A CI run must exist for the PR's head within 2 minutes.
        SHA=$(gh pr view "$PR" --json headRefOid -q .headRefOid)
        for i in $(seq 1 12); do
          RUN=$(gh run list --commit "$SHA" --workflow CI --json databaseId -q '.[0].databaseId' 2>/dev/null || true)
          [ -n "$RUN" ] && break
          sleep 10
        done
        if [ -z "${RUN:-}" ]; then
          echo "No CI run for $SHA after 2 minutes. Check: the push reached GitHub (git ls-remote), the workflow triggers, https://www.githubstatus.com. Still nothing: comment it, needs-human, stop." >&2
          exit 3
        fi
        echo "CI run $RUN started for $SHA — watching."
        # 3. Only now, wait for the checks.
        gh pr checks "$PR" --watch --fail-fast
  # ===========================================================================
  # Docker Compose Commands
  # ===========================================================================
  up:
    desc: Start all containers
    cmds:
      - docker compose up -d

  up:dev:
    desc: Start all containers including dev services (node)
    cmds:
      - docker compose --profile dev up -d

  up:search:
    desc: Start all containers including Elasticsearch
    cmds:
      - docker compose --profile search up -d

  up:all:
    desc: Start all containers including dev and search services
    cmds:
      - docker compose --profile dev --profile search up -d

  down:
    desc: Stop all containers
    cmds:
      - docker compose down

  down:volumes:
    desc: Stop all containers and remove volumes
    cmds:
      - docker compose down -v

  restart:
    desc: Restart all containers
    cmds:
      - docker compose restart

  logs:
    desc: Tail all container logs
    cmds:
      - docker compose logs -f

  logs:php:
    desc: Tail PHP container logs
    cmds:
      - docker compose logs -f php

  logs:nginx:
    desc: Tail Nginx container logs
    cmds:
      - docker compose logs -f nginx

  logs:agent:
    desc: Tail Agent Hub container logs
    cmds:
      - docker compose logs -f agent

  logs:traefik:
    desc: Tail Traefik container logs
    cmds:
      - docker compose logs -f traefik

  ps:
    desc: Show running containers
    cmds:
      - docker compose ps

  # ===========================================================================
  # Build Commands
  # ===========================================================================
  build:
    desc: Build all containers
    cmds:
      - docker compose build

  build:nocache:
    desc: Build all containers without cache
    cmds:
      - docker compose build --no-cache

  # ===========================================================================
  # Shell Access
  # ===========================================================================
  shell:php:
    desc: Open shell in PHP container
    cmds:
      - docker compose exec php sh

  shell:node:
    desc: Open shell in Node container
    cmds:
      - docker compose exec node sh

  shell:agent:
    desc: Open shell in Agent Hub container
    cmds:
      - docker compose exec agent bash

  shell:db:
    desc: Open psql shell in database container
    cmds:
      - docker compose exec database psql -U $POSTGRES_USER -d $POSTGRES_DB
    env:
      POSTGRES_USER: '{{.POSTGRES_USER | default "maggie"}}'
      POSTGRES_DB: '{{.POSTGRES_DB | default "maggie"}}'

  # ===========================================================================
  # Quick Setup
  # ===========================================================================
  install:
    desc: Install all dependencies (composer + npm + pip)
    cmds:
      - task: api:install
      - task: admin:install

  setup:
    desc: Full project setup (build, start, install deps, run migrations)
    cmds:
      - task: hosts:check
      - task: build
      - task: up:dev
      - task: install
      - task: api:console
        vars:
          CLI_ARGS: doctrine:migrations:migrate --no-interaction

  # ===========================================================================
  # Hosts Management
  # ===========================================================================
  hosts:check:
    desc: Check if APP_DOMAIN is in /etc/hosts
    vars:
      APP_DOMAIN:
        sh: grep -oP '^APP_DOMAIN=\K.*' .env || echo "maggie.local"
    cmds:
      - |
        if grep -q "{{.APP_DOMAIN}}" /etc/hosts; then
          echo "✓ {{.APP_DOMAIN}} is configured in /etc/hosts"
        else
          echo "✗ {{.APP_DOMAIN}} is NOT in /etc/hosts"
          echo ""
          echo "Run the following command to add it:"
          echo "  sudo sh -c 'echo \"127.0.0.1 {{.APP_DOMAIN}}\" >> /etc/hosts'"
          echo ""
          echo "Or run: task hosts:add"
        fi
    silent: true

  hosts:add:
    desc: Add APP_DOMAIN to /etc/hosts (requires sudo)
    vars:
      APP_DOMAIN:
        sh: grep -oP '^APP_DOMAIN=\K.*' .env || echo "maggie.local"
    cmds:
      - sudo sh -c 'echo "127.0.0.1 {{.APP_DOMAIN}}" >> /etc/hosts'
      - echo "✓ Added {{.APP_DOMAIN}} to /etc/hosts"

  open:
    desc: Open the application in the default browser
    vars:
      APP_DOMAIN:
        sh: grep -oP '^APP_DOMAIN=\K.*' .env || echo "maggie.local"
    cmds:
      - xdg-open "http://{{.APP_DOMAIN}}" 2>/dev/null || open "http://{{.APP_DOMAIN}}" 2>/dev/null || echo "Open http://{{.APP_DOMAIN}} in your browser"

  # ===========================================================================
  # Cleanup
  # ===========================================================================
  clean:
    desc: Remove all containers, volumes, and build cache
    cmds:
      - docker compose down -v --rmi local
      - docker builder prune -f

  # ===========================================================================
  # Testing
  # ===========================================================================
  test:all:
    desc: Run all tests (api + admin + agent + ciqual)
    cmds:
      - task: api:test
      - task: admin:test
      - task: agent:test
      - task: ciqual:test

  test:integration:
    desc: Run end-to-end integration tests
    cmds:
      - scripts/test-integration.sh

  # ===========================================================================
  # Linting
  # ===========================================================================
  lint:all:
    desc: Run all linters (php-cs-fixer + phpstan + ruff + eslint + typecheck)
    cmds:
      - task: api:cs:check
      - task: api:phpstan
      - task: agent:lint
      - task: ciqual:lint
      - task: admin:lint
      - task: admin:typecheck

  fix:all:
    desc: Fixers in write mode, then linters, on this checkout's own code — run before every push
    # Built on `wt:*`, not on the dev-stack tasks: those mount the main checkout,
    # so from a worktree they would fix and lint the owner's files instead of
    # yours. Fixers first, so the linters see the final tree; PHPStan last, on
    # the PHP files this branch changed since origin/main. Stops at the first
    # failure. Exit 75 means the machine is busy (see wt:guard), not that your
    # change is wrong: push and let CI run.
    cmds:
      - task: wt:cs:fix
      - task: wt:fix:agent
      - task: wt:fix:ciqual
      - task: wt:fix:admin
      - task: wt:cs:check
      - task: wt:lint:agent
      - task: wt:lint:ciqual
      - task: wt:lint:admin
      - task: wt:phpstan:changed

  # ===========================================================================
  # CI (local)
  # ===========================================================================
  ci:
    desc: Run full CI pipeline locally (lint + test)
    cmds:
      - task: lint:all
      - task: test:all

  # ===========================================================================
  # Deploy
  # ===========================================================================
  deploy:build:
    desc: Build all production Docker images locally
    cmds:
      - docker build -f .docker/php/Dockerfile --target prod -t maggie-php:latest .
      - docker build -f .docker/python/Dockerfile --target prod -t maggie-agent:latest .
      - docker build -f .docker/nginx/Dockerfile --target prod --build-arg PHP_IMAGE=maggie-php:latest -t maggie-nginx:latest .
      - docker build -f .docker/ciqual/Dockerfile --target prod -t maggie-ciqual:latest .

  deploy:push:
    desc: Tag and push production images to GHCR
    vars:
      TAG:
        sh: git rev-parse --short HEAD
    cmds:
      - docker tag maggie-php:latest ghcr.io/miwi35/maggie-php:{{.TAG}}
      - docker tag maggie-php:latest ghcr.io/miwi35/maggie-php:latest
      - docker tag maggie-nginx:latest ghcr.io/miwi35/maggie-nginx:{{.TAG}}
      - docker tag maggie-nginx:latest ghcr.io/miwi35/maggie-nginx:latest
      - docker tag maggie-agent:latest ghcr.io/miwi35/maggie-agent:{{.TAG}}
      - docker tag maggie-agent:latest ghcr.io/miwi35/maggie-agent:latest
      - docker tag maggie-ciqual:latest ghcr.io/miwi35/maggie-ciqual:{{.TAG}}
      - docker tag maggie-ciqual:latest ghcr.io/miwi35/maggie-ciqual:latest
      - docker push ghcr.io/miwi35/maggie-php:{{.TAG}}
      - docker push ghcr.io/miwi35/maggie-php:latest
      - docker push ghcr.io/miwi35/maggie-nginx:{{.TAG}}
      - docker push ghcr.io/miwi35/maggie-nginx:latest
      - docker push ghcr.io/miwi35/maggie-agent:{{.TAG}}
      - docker push ghcr.io/miwi35/maggie-agent:latest
      - docker push ghcr.io/miwi35/maggie-ciqual:{{.TAG}}
      - docker push ghcr.io/miwi35/maggie-ciqual:latest
