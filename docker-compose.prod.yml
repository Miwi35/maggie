services:
  # ===========================================================================
  # PHP-FPM (Symfony API + MCP Server)
  # ===========================================================================
  php:
    image: ghcr.io/miwi35/maggie-php:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: .env.prod
    environment:
      APP_ENV: prod
      APP_DEBUG: "0"
      ELASTICSEARCH_URL: http://elasticsearch:9200
      CIQUAL_SERVICE_URL: http://ciqual:8002
    volumes:
      - jwt_keys:/var/www/api/config/jwt
    depends_on:
      database:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    networks:
      - internal

  # ===========================================================================
  # Nginx (PHP-FPM gateway + Admin SPA + static assets)
  # ===========================================================================
  nginx:
    image: ghcr.io/miwi35/maggie-nginx:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      APP_DOMAIN: maggieai.fr
      NGINX_ENVSUBST_OUTPUT_DIR: /etc/nginx/conf.d
    depends_on:
      - php
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.maggie-web.rule=Host(`maggieai.fr`)"
      - "traefik.http.routers.maggie-web.entrypoints=websecure"
      - "traefik.http.routers.maggie-web.tls.certresolver=letsencrypt"
      - "traefik.http.services.maggie-web.loadbalancer.server.port=80"
    networks:
      - internal
      - traefik-public

  # ===========================================================================
  # PostgreSQL
  # ===========================================================================
  database:
    image: postgres:17-alpine
    restart: unless-stopped
    env_file: .env.prod
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  # ===========================================================================
  # Mercure (Real-time updates hub)
  # ===========================================================================
  mercure:
    image: dunglas/mercure
    restart: unless-stopped
    environment:
      SERVER_NAME: ':80'
      MERCURE_PUBLISHER_JWT_KEY: ${MERCURE_JWT_SECRET}
      MERCURE_SUBSCRIBER_JWT_KEY: ${MERCURE_JWT_SECRET}
      MERCURE_EXTRA_DIRECTIVES: |
        cors_origins https://maggieai.fr
    env_file: .env.prod
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.maggie-mercure.rule=Host(`maggieai.fr`) && PathPrefix(`/.well-known/mercure`)"
      - "traefik.http.routers.maggie-mercure.entrypoints=websecure"
      - "traefik.http.routers.maggie-mercure.tls.certresolver=letsencrypt"
      - "traefik.http.services.maggie-mercure.loadbalancer.server.port=80"
    networks:
      - internal
      - traefik-public

  # ===========================================================================
  # Elasticsearch (Full-text search)
  # ===========================================================================
  elasticsearch:
    image: elasticsearch:8.17.0
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.enrollment.enabled=false
      - "ES_JAVA_OPTS=-Xms256m -Xmx512m"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  # ===========================================================================
  # RabbitMQ (Message Queue)
  # ===========================================================================
  rabbitmq:
    image: rabbitmq:3-management-alpine
    restart: unless-stopped
    env_file: .env.prod
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  # ===========================================================================
  # Worker (Symfony Messenger consumer)
  # ===========================================================================
  worker:
    image: ghcr.io/miwi35/maggie-php:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: .env.prod
    environment:
      APP_ENV: prod
      APP_DEBUG: "0"
      ELASTICSEARCH_URL: http://elasticsearch:9200
      CIQUAL_SERVICE_URL: http://ciqual:8002
    depends_on:
      database:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    command: ["php", "bin/console", "messenger:consume", "async", "--time-limit=3600", "--memory-limit=128M"]
    networks:
      - internal

  # ===========================================================================
  # Cron (Scheduled tasks)
  # ===========================================================================
  cron:
    image: ghcr.io/miwi35/maggie-php:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: .env.prod
    environment:
      APP_ENV: prod
      APP_DEBUG: "0"
      ELASTICSEARCH_URL: http://elasticsearch:9200
      CIQUAL_SERVICE_URL: http://ciqual:8002
    depends_on:
      database:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    command: ["crond", "-f", "-l", "2"]
    user: root
    networks:
      - internal

  # ===========================================================================
  # Ciqual (ANSES food composition microservice)
  # ===========================================================================
  ciqual:
    image: ghcr.io/miwi35/maggie-ciqual:${IMAGE_TAG:-latest}
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.maggie-ciqual.rule=Host(`maggieai.fr`) && PathPrefix(`/ciqual`)"
      - "traefik.http.routers.maggie-ciqual.entrypoints=websecure"
      - "traefik.http.routers.maggie-ciqual.tls.certresolver=letsencrypt"
      - "traefik.http.services.maggie-ciqual.loadbalancer.server.port=8002"
    networks:
      - internal
      - traefik-public

  # ===========================================================================
  # Python Agent Hub (FastAPI)
  # ===========================================================================
  agent:
    image: ghcr.io/miwi35/maggie-agent:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: .env.prod
    volumes:
      - jwt_keys:/etc/jwt:ro
    depends_on:
      - nginx
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.maggie-agent.rule=Host(`maggieai.fr`) && PathPrefix(`/agent`)"
      - "traefik.http.routers.maggie-agent.entrypoints=websecure"
      - "traefik.http.routers.maggie-agent.tls.certresolver=letsencrypt"
      - "traefik.http.services.maggie-agent.loadbalancer.server.port=8001"
      # Prometheus auto-discovery
      - "prometheus.scrape=true"
      - "prometheus.port=8001"
      - "prometheus.path=/agent/metrics"
    networks:
      - internal
      - traefik-public
      - monitoring

networks:
  internal:
    driver: bridge
  traefik-public:
    external: true
  monitoring:
    external: true

volumes:
  postgres_data:
  rabbitmq_data:
  elasticsearch_data:
  jwt_keys:
