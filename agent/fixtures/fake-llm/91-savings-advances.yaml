# « Combien je dois remettre sur mon livret ? » (MAG-276, MAG-277): the savings
# advances per source and the salary delay through `get_finance_summary`, then the
# account balances through `manage_accounts` list: Maggie works out the transfer
# herself. The fake does not read the results: the journey asserts both tools ran and
# reads the same figures on `GET /api/finance/savings-advances`; what the summary
# returns is `FinanceSummaryToolTest`'s business.
name: savings-advances
description: Read what is left to give back to each savings source, and what to transfer, through MCP.

match:
  user_contains: "remettre sur mon livret"

turns:
  - tools:
      - name: get_finance_summary
        input: {}
      - name: manage_accounts
        input: {action: list}
  - text: "Voici ce qu'il reste à rendre à votre livret, avance par avance, et les soldes de vos comptes pour tout remettre."
