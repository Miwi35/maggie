# Three consignes dictated at the Consignes step, each classed by Maggie (MAG-753, extends MAG-99):
# a Rappel is a dated proaction tomorrow, a Tâche a task due tomorrow, a Consigne a lasting rule
# learned. One add_bilan_consigne call each: the tool gives it the provenance « bilan-soir » and enters it in
# the bilan's `instructions`, which the next morning's digest reads. `${tomorrow}` is the day after the stack's
# clock, in Paris; the review's day is `${today}`.
name: bilan-soir-consignes
description: Consignes dictated in the evening review, classed as reminder, task and learned instruction.

match:
  user_contains: ["garage", "acheter du pain", "je pars plus tôt"]

turns:
  - tools:
      - name: add_bilan_consigne
        input:
          day: '${today}'
          kind: reminder
          text: "Appeler le garage"
          scheduled_at: '${tomorrow}T09:00:00+01:00'
      - name: add_bilan_consigne
        input: {day: '${today}', kind: task, text: "Acheter du pain", due_date: '${tomorrow}'}
      - name: add_bilan_consigne
        input: {day: '${today}', kind: instruction, text: "Le mardi, je pars plus tôt", instruction_kind: planning}
  - text: "Un rappel demain à neuf heures pour le garage, une tâche pour demain, acheter du pain, et une consigne que je retiens, le mardi vous partez plus tôt."
