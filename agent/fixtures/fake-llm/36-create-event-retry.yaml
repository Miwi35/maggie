# A write that fails the first time, then lands: the answer is the last step alone (MAG-229).
#
# Three model turns, so the gateway runs three iterations. The first announces and
# calls `create_event` on an agenda id that does not exist — the real handler answers
# `No agenda found.` — the second apologises and retries on the default agenda, the
# third closes. Only the third is stored, shown and read aloud; the journey asserts the
# first two never reach the bubble.
#
# Dated 2099 for the reason given in 35-create-event.yaml.
name: create-event-retry
description: Book a concert after a first tool call that fails.

match:
  user_contains: "black wizards"

turns:
  - text: "Je prends une durée standard de 2 heures."
    tools:
      - name: create_event
        input:
          title: "Black Wizards"
          date: "2099-11-03"
          time: "19:00"
          duration: 120
          agenda_id: "00000000000000000000000000"
  - text: "Il y a un souci technique avec l'identifiant de votre agenda."
    tools:
      - name: create_event
        input:
          title: "Black Wizards"
          date: "2099-11-03"
          time: "19:00"
          duration: 120
  - text: "C'est noté : les Black Wizards en concert le 3 novembre 2099 à 19h, pour deux heures."
