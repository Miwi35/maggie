# What Maggie says once the user has authorized a held action: the agent re-prompts her
# with « L'utilisateur a validé <tool>(<args>). Résultat : … Annonce-le brièvement »
# (`announce_approved_action`, agent/app/api/routes.py), and the answer is stored in the
# conversation and published on the chat topic.
#
# The event's id is in the sentence, as in 73-delete-event-held.yaml: several runs of the
# approval journey share one account and one thread, and an announcement worded the same
# for every event could not be told from another run's.
name: delete-event-approved
description: Announce that the deleted event is gone, after the user authorized it.

match:
  user_matches: 'a validé delete_event\(.*?([0-9A-HJKMNP-TV-Z]{26})'

turns:
  - text: "C'est fait : l'événement Test validation est supprimé (\\1)."
