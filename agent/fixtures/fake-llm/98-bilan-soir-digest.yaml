# The morning digest reads yesterday's consignes (MAG-753, extends MAG-99): the run loads the digest
# skill, reads the bilan's status next to the day, and answers a written digest whose « Tes consignes
# d'hier soir » section lists them. The fake reads no tool result, so the section is always scripted:
# the rule that it is absent without a consigne is the skill's, judged on the real model.
name: bilan-soir-digest
description: The digest of the morning after an evening review, with its consignes section.

match:
  user_contains: ["[Proaction due maintenant]", "digest MAG-753"]

turns:
  - tools:
      - name: get_skill
        input: {name: digest}
  - tools:
      - name: get_events_by_date
        input: {date: '${today}'}
      - name: get_tasks
        input: {view: today}
      - name: get_activity_status
        input: {activity: bilan}
  - text: "**Tes consignes d'hier soir** : appeler le garage à neuf heures, acheter du pain, et le mardi vous partez plus tôt. (digest MAG-753)"
