# A code written to the chat is held back (MAG-871): the turn carries the `[Message retenu]` block and the
# message reads `[masqué]`. The router does not receive the block, so it cannot land on this scenario.
name: secret-held
description: Maggie says she does not take codes in the conversation.

match:
  user_contains: ["[Message retenu]", "[masqué]"]

turns:
  - text: "Je ne prends pas les codes dans la conversation, monsieur. Gardez-le pour vous."
