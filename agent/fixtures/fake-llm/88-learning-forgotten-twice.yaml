# A rule announced as learned twice, never stored (MAG-340).
#
# The model answers « C'est noté » without a tool, is sent back by the claim guard,
# and claims it again. The guard does not send it back a second time: the second
# announcement goes out as the model wrote it, and the gap is signalled (`claim_unbacked`).
name: learning-forgotten-twice
description: A rule about recipes — announced twice as learned, never stored.

match:
  user_contains: "quantités pour deux"

turns:
  - text: "C'est noté."
  - text: "Je retiens : les recettes en quantités pour deux."
