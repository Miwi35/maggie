# A long answer that takes its time (MAG-223): the journey cuts Maggie off while it is
# still being written, then checks the end of the story never shows up.
#
# `history_contains` is the first dictation's answer (41-grocery-add-dictated.yaml), so
# this is the second dictation of the journey. `stream_delay_ms` spaces the deltas out:
# the whole text takes about thirty seconds, the window in which the journey presses the
# mic. Twelve were not enough: on a CI emulator Maestro needs more than ten seconds to
# notice the first words, and the story was over before the mic was pressed.
#
# Sorted before 41-grocery-add-dictated.yaml, which would match the same sentence.
name: dictated-long-story
description: Tell a long story slowly, so a journey can interrupt it.

match:
  user_matches: "ajoute.*tomate"
  history_contains: "quatre tomates"

stream_delay_ms: 1000

turns:
  - text: "Il était une fois, dans un petit village au pied des montagnes, un jardinier qui cultivait des tomates si rouges que les voisins venaient de loin pour les admirer. Chaque matin, il arrosait ses plants en chantant, et chaque soir, il comptait les fruits mûrs, un par un, en les nommant comme de vieux amis. Un jour, un voyageur frappa à sa porte et lui demanda le secret de ses récoltes. Le jardinier sourit, remplit un panier, et commença un très long récit sur la patience, la pluie, le soleil, et les saisons qui se suivent sans jamais se ressembler. Le voyageur écouta, puis écouta encore, tandis que la nuit tombait doucement sur le potager et que les lucioles s'allumaient entre les rangs. FIN DE L'HISTOIRE."
