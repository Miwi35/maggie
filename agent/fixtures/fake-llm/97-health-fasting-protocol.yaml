# « Je passe au 18:6 à partir de 13 h » (MAG-770).
#
# The intermittent fast is two fields of the health profile: she changes the
# protocol and the start of the eating window with update_health_profile, the
# other fields keep their value. The fake does not read the result: the
# journey reads the profile back from the API.
name: health-fasting-protocol
description: Switch the intermittent fast to 18:6 with a window opening at 13:00.

match:
  user_matches: '^je passe au 18:6 [àa] partir de 13\s?h\W*$'

turns:
  - tools:
      - name: update_health_profile
        input: {fastingProtocol: '18:6', fastingWindowStart: '13:00'}
  - text: "Jeûne 18:6 : votre fenêtre s'ouvre à 13 h et dure 6 h."
