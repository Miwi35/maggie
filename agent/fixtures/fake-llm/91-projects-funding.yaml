# « Pour la voiture, prends 1 000 € sur le Livret jeune et emprunte 6 000 € sur 24 mois à 4 % »
# (MAG-524): she reads the projects and the accounts in one round, then sets the Voiture's
# sources with `manage_project_funding` set — the whole list, the rate in basis points. Both ids
# come from this run's results, which `results_matches` captures: the project first, the
# account after, as the round lists them (`id` then `name` in both tools' JSON).
#
# The fake does not read the answer: the figures below are the scenario's own (6 000 € over
# 24 months at 4 %: 260,55 € a month; 10 000 − 1 000 − 6 000 = 3 000 € left to save). The
# journey reads the sources on GET /api/finance/projects/{id} and the projected loan on
# GET /api/loans. Facts only: never which option is better.
name: projects-funding
description: Fund a project with savings and a projected loan through MCP.

match:
  user_matches: 'pour la voiture.*livret jeune.*emprunte'

results_matches: 'id\W+([0-9A-HJKMNP-TV-Z]{26})\W+name\W+Voiture\W[\s\S]*?id\W+([0-9A-HJKMNP-TV-Z]{26})\W+name\W+Livret jeune\W'

turns:
  - tools:
      - name: manage_projects
        input: {action: list}
      - name: manage_accounts
        input: {action: list}
  - tools:
      - name: manage_project_funding
        input:
          action: set
          projectId: '\1'
          sources:
            - kind: savings
              amountCents: 100000
              account: '\2'
            - kind: loan
              amountCents: 600000
              loan:
                annualRateBasisPoints: 400
                durationMonths: 24
  - text: "C'est noté pour la Voiture : 1 000 € pris sur le Livret jeune et 6 000 € empruntés sur 24 mois à 4 %, soit 260,55 € par mois. Il reste 3 000 € à épargner sur ton salaire."
