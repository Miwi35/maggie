[project]
name = "maggie-agent"
version = "0.1.0"
description = "Maggie AI Agent Hub — LLM gateway with MCP tool integration"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "anthropic>=0.42.0",
    "mcp>=1.0.0",
    "httpx>=0.28.0",
    "httpx-sse>=0.4.0",
    "pydantic-settings>=2.7.0",
    "pyyaml>=6.0",
    "pyjwt>=2.9.0",
    "cryptography>=43.0.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.30.0",
    "a2a-sdk[http-server]>=0.3.20,<0.4.0",
    "aio-pika>=9.4.0",
    "openai>=1.30.0",
    "edge-tts>=7.0.0",
    "prometheus_client>=0.21.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
    "pytest-httpx>=0.35.0",
    "respx>=0.22.0",
    "ruff>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
