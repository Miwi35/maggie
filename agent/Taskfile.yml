version: '3'

vars:
  COMPOSE_FILE: '{{.ROOT_DIR}}/docker-compose.yml'

tasks:
  # ===========================================================================
  # Dependencies
  # ===========================================================================
  install:
    desc: Install Python dependencies
    cmds:
      - docker compose -f {{.COMPOSE_FILE}} exec agent uv pip install --system -e ".[dev]"

  # ===========================================================================
  # Development
  # ===========================================================================
  dev:
    desc: Start agent with auto-reload (default CMD)
    cmds:
      - docker compose -f {{.COMPOSE_FILE}} up agent

  # ===========================================================================
  # Testing
  # ===========================================================================
  test:
    desc: Run Python tests
    cmds:
      - docker compose -f {{.COMPOSE_FILE}} exec agent pytest {{.CLI_ARGS}}

  memory:rebuild:
    desc: "Drop the note index and rebuild it from the bucket, agent STOPPED first: task agent:memory:rebuild -- --offline [user id]"
    cmds:
      - docker compose -f {{.COMPOSE_FILE}} run --rm agent python -m app.memory.rebuild {{.CLI_ARGS}}

  # ===========================================================================
  # Code Quality
  # ===========================================================================
  lint:
    desc: Run ruff linter
    cmds:
      - docker compose -f {{.COMPOSE_FILE}} exec agent ruff check app/ evals/

  lint:fix:
    desc: Fix linting issues
    cmds:
      - docker compose -f {{.COMPOSE_FILE}} exec agent ruff check --fix app/ evals/

  format:
    desc: Format code with ruff
    cmds:
      - docker compose -f {{.COMPOSE_FILE}} exec agent ruff format app/ evals/

  format:check:
    desc: Check code formatting (CI mode)
    cmds:
      - docker compose -f {{.COMPOSE_FILE}} exec agent ruff format --check app/ evals/
