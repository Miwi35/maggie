# The Android the screen tests run against (MAG-242).
#
# Pinned rather than left to `targetSdk`, for two reasons: the jar Robolectric
# downloads is keyed on this number, so a `compileSdk` bump would silently make
# every runner fetch another 100 MB, and an API level is part of the fixture —
# a screen that renders differently on 34 and 35 should fail here, not change
# under the suite.
#
# 34 and not 35: it is the level the emulator journeys run on
# (`.github/workflows/ci.yml`, `api-level: 34`), so the two halves of the mobile
# suite see the same Android.
sdk=34

# The screen the tests are laid out on. Robolectric's default is a small
# 320×470 dp one, where a `LazyColumn` composes four rows and a test asking for
# the fifth fails as « the line is not on the list » — the exact failure the
# screen tests exist to report truthfully. A Pixel-sized window keeps a list of a
# dozen rows in one viewport; a timeline taller than it is still scrolled to, with
# `performScrollTo()`, the way the journeys scrolled.
qualifiers=w411dp-h891dp-xhdpi

# A bare Application, not `MaggieApp`.
#
# Robolectric instantiates the `android:name` of the merged manifest, and
# `MaggieApp.onCreate` starts Koin, opens Room, builds Ktor and registers the
# notification channels — the whole app, for a test about one screen. It also
# fails on the second test of a class: Koin is global and nothing stops it
# between tests, so `startKoin` throws « already started ».
#
# A screen test is handed the ViewModel it drives, so it needs no container.
# Anything that reaches for `koinViewModel()` here fails loudly, which is the
# right answer: that is a screen asking for its own dependencies, and the test
# would be asserting the graph rather than the screen.
application=android.app.Application
