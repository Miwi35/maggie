version: '3'

# Run from the repository root as `task mobile:<name>` (included with dir: ./mobile).

vars:
  ADB: '{{.ADB | default (printf "%s/Android/Sdk/platform-tools/adb" .HOME)}}'

tasks:
  install:
    desc: Build the signed prodRelease APK (incremental, never clean) and install it on the connected phone
    cmds:
      - |
        if ! "{{.ADB}}" get-state >/dev/null 2>&1; then
          echo "Aucun téléphone connecté (adb get-state) : branche-le et autorise le débogage USB." >&2
          exit 1
        fi
      # prodRelease only: Google sign-in works with the release key alone. Gradle
      # reuses build/, so only what changed is rebuilt (R8 still runs on the whole app).
      - ./gradlew installProdRelease
