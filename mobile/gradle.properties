android.useAndroidX=true
kotlin.code.style=official
org.gradle.java.home=/opt/android-studio-for-platform/jbr
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m
# The bounded heaps of the agents' local runs are not set here: a
# ~/.gradle/gradle.properties wins over this file, so `task wt:test:mobile` passes
# its own on the command line (wt/limits.env), and CI keeps the values above.
# An idle Gradle daemon leaves after 30 minutes instead of 3 hours: warm across
# the pauses of a session, gone when nobody builds. No effect on CI: every job is
# a fresh runner.
org.gradle.daemon.idletimeout=1800000
# The local build cache (~/.gradle/caches/build-cache-1) is per user, not per
# directory: a worktree reuses what another one, or the main checkout, compiled.
org.gradle.caching=true
GOOGLE_CLIENT_ID=945014393623-rr1ja004uel8ml327e0gg0vsf51o2ajk.apps.googleusercontent.com

