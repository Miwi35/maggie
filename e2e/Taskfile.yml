version: '3'

# Tasks for the deterministic e2e stack (MAG-94).
#
# Two things make this stack safe to run beside the dev stack, and beside
# another worktree's e2e stack:
#
#   COMPOSE_PROJECT_NAME  derived from the worktree's absolute path, so
#                         containers, volumes and the network never collide.
#                         The hash covers the path, not the branch, so two
#                         worktrees of the same branch still differ.
#   E2E_BASE_URL          resolved after Traefik starts, because the host port
#                         is ephemeral and nothing can know it beforehand.
#
# Export COMPOSE_PROJECT_NAME yourself to override the derivation — CI passes
# the run id.

vars:
  COMPOSE_FILE: '{{.ROOT_DIR}}/docker-compose.e2e.yml'
  PROJECT:
    sh: |
      if [ -n "$COMPOSE_PROJECT_NAME" ]; then
        echo "$COMPOSE_PROJECT_NAME"
      else
        slug=$(basename "{{.ROOT_DIR}}" | tr '[:upper:]' '[:lower:]' | tr -c 'a-z0-9-' '-' | sed 's/-*$//')
        hash=$(printf '%s' "{{.ROOT_DIR}}" | sha1sum | cut -c1-8)
        echo "maggie-e2e-${slug}-${hash}"
      fi
  COMPOSE: 'docker compose -f {{.COMPOSE_FILE}} -p {{.PROJECT}}'
  # `UID` is a shell variable, not an environment one, so `${UID:-1000}` in a
  # Compose file silently falls back to 1000. On a host whose user is not 1000
  # every bind mount then becomes unwritable — `npm ci` is the first to hit it.
  # The dev stack papers over this with a gitignored .env; a worktree has none.
  HOST_UID:
    sh: id -u
  HOST_GID:
    sh: id -g
  # The e2e clock (MAG-234). `E2E_NOW` (ISO-8601, e.g. 2026-10-11T23:50:00+02:00,
  # or a name from `e2e/clock.sh names` resolved with `e2e/clock.sh resolve`)
  # fixes "now" for the whole stack: libfaketime on the API, the worker and the
  # agent, `Date` in the browser, the emulator's clock. The variable is empty
  # without it, and nothing changes. Set it before `task e2e:up`: the services
  # are started with it.
  E2E_FAKETIME:
    sh: '{{.ROOT_DIR}}/e2e/clock.sh faketime'

env:
  COMPOSE_PROJECT_NAME: '{{.PROJECT}}'
  UID: '{{.HOST_UID}}'
  GID: '{{.HOST_GID}}'
  E2E_FAKETIME: '{{.E2E_FAKETIME}}'

tasks:
  # ===========================================================================
  # Lifecycle
  # ===========================================================================
  up:
    desc: Start the e2e stack for this worktree (ephemeral port, isolated volumes)
    cmds:
      # Eleven containers, ~3 GiB of limits: refuse to start when the machine
      # has less than E2E_MIN_AVAILABLE_MB (5 GB) available or is loaded, wait,
      # then exit 75 — fall back to CI. Without it a stack started on a busy
      # machine took the owner's browser down with the kernel's OOM killer
      # (MAG-137). A no-op on CI.
      - '{{.ROOT_DIR}}/wt/guard.sh e2e'
      - task: keys
      # Created here rather than left to Docker, which makes a missing bind
      # mount source itself, owned by root: the agent's uv cache (MAG-135), and
      # api/vendor, which `wt:*` mounts a cache over in a fresh worktree and
      # `e2e:install` then cannot write to (MAG-287). A leftover root-owned
      # directory stops here with the command to remove it.
      - '{{.ROOT_DIR}}/wt/mountpoints.sh api/vendor api/var admin/node_modules ciqual/db .e2e-cache/uv'
      # The third-party images one at a time, retried: ECR Public refuses more
      # than one anonymous pull per second, and the `up` below pulls several at
      # once (10 Oct.). CI has pulled them in e2e/images.sh already.
      - '{{if .E2E_PREBUILT}}true{{else}}{{.ROOT_DIR}}/e2e/images.sh pull{{end}}'
      # Traefik first and alone: its published port is what every other
      # service's public URLs are built from, and Docker only assigns it once
      # the container exists.
      - '{{.COMPOSE}} up -d traefik'
      # Elasticsearch is the last service to be ready, and it needs neither the
      # port nor anything else: it boots from here on, beside everything below.
      - '{{.COMPOSE}} up -d --no-deps elasticsearch'
      # The API and what it needs, with the admin bundle building beside it: the
      # build needs nothing the API starts (MAG-180), and it was the longest
      # step still waiting behind `up php`.
      - task: _up:first
      # Then the two halves that do not depend on each other, side by side: the
      # slow services boot (agent install, Elasticsearch) while the API is
      # prepared. Sequentially these were the stack's whole start-up time
      # (MAG-135).
      - task: _up:parallel
      # The worker comes last, once vendor/ and the schema exist. Started with
      # the rest it dies on "Dependencies are missing", and `restart:
      # unless-stopped` then backs off exponentially — so it is still asleep
      # when the first journey dispatches a message, and an indexed entity
      # never becomes findable. The failure looks like a broken index, not
      # like a worker that never woke up.
      #
      # This `up --wait` is also the stack's readiness gate: it returns when
      # every service with a healthcheck is healthy — Elasticsearch and the
      # agent included, which the steps above deliberately did not wait for.
      - task: _up:wait
      # After _up:wait, because it needs the container running — and it is not
      # part of _up:prepare, which runs while ciqual is still being created.
      - task: ciqual:db
      - task: url

  _up:api:
    internal: true
    vars:
      BASE_URL:
        sh: 'echo "http://127.0.0.1:$(docker compose -f {{.COMPOSE_FILE}} -p {{.PROJECT}} port traefik 80 | sed "s/.*://")"'
    env:
      E2E_BASE_URL: '{{.BASE_URL}}'
    cmds:
      # --build, not just up, locally: the images bake the host's uid into their
      # `app` user, and Compose reuses an existing image without checking whether
      # the build args still match. Layer caching makes the no-change case cheap.
      #
      # E2E_PREBUILT=1 (CI) is the opposite: e2e/images.sh has already pulled or
      # built every image under its hash tag, and --no-build makes a missing one
      # fail here instead of being quietly rebuilt from scratch.
      #
      # php pulls in its dependencies (database, rabbitmq, wiremock, and
      # Elasticsearch merely started) and nothing else. No worker: it needs
      # vendor/ and the migrated schema, which do not exist yet.
      - '{{.COMPOSE}} up -d {{if .E2E_PREBUILT}}--no-build{{else}}--build{{end}} php'

  _up:first:
    internal: true
    deps:
      - _up:api
      - _up:admin

  # Started alone and detached: `--no-deps` keeps Compose from converging the
  # services nginx depends on, and `_up:edge` waits for the one-shot itself.
  # Not `up nginx`, which would run it a second time once it has exited.
  _up:admin:
    internal: true
    cmds:
      - '{{.COMPOSE}} up -d --no-deps admin-build'

  _up:parallel:
    internal: true
    deps:
      - _up:edge
      - _up:prepare

  _up:edge:
    internal: true
    vars:
      BASE_URL:
        sh: 'echo "http://127.0.0.1:$(docker compose -f {{.COMPOSE_FILE}} -p {{.PROJECT}} port traefik 80 | sed "s/.*://")"'
    env:
      E2E_BASE_URL: '{{.BASE_URL}}'
    cmds:
      # The agent, ciqual and mercure first: they need nothing nginx serves, and
      # the agent's dependency install (~15 s) used to wait behind the admin
      # bundle for nothing. Its MCP connection is best-effort at start and
      # re-made on the first call, so nginx coming up after it is harmless.
      # `--no-deps`: php and the databases are already healthy, and Compose
      # would re-run the finished admin-build.
      #
      # Not --wait: the install and Elasticsearch finish during `_up:prepare`,
      # and `_up:wait` collects them.
      - '{{.COMPOSE}} up -d --no-deps {{if .E2E_PREBUILT}}--no-build{{else}}--build{{end}} agent ciqual mercure'
      # nginx needs the bundle `_up:admin` started building at the very beginning.
      - |
        code=$(docker wait "$({{.COMPOSE}} ps -aq admin-build)")
        if [ "$code" != 0 ]; then
          echo "admin-build exited with status $code" >&2
          {{.COMPOSE}} logs --no-log-prefix --tail=100 admin-build >&2
          exit 1
        fi
      - '{{.COMPOSE}} up -d --no-deps {{if .E2E_PREBUILT}}--no-build{{else}}--build{{end}} nginx'

  _up:prepare:
    internal: true
    cmds:
      - task: install
      - task: cache:clear
      - task: migrate

  _up:wait:
    internal: true
    vars:
      BASE_URL:
        sh: 'echo "http://127.0.0.1:$(docker compose -f {{.COMPOSE_FILE}} -p {{.PROJECT}} port traefik 80 | sed "s/.*://")"'
    env:
      E2E_BASE_URL: '{{.BASE_URL}}'
    cmds:
      # --no-deps with the services spelled out, and not a bare `up`: Compose
      # starts an exited container again, so a bare `up` would re-run
      # admin-build — a second Vite build, racing the nginx that is already
      # serving the first. The one-shot has done its job; it is not waited for.
      - '{{.COMPOSE}} up -d --wait --no-deps php worker nginx agent ciqual mercure database rabbitmq elasticsearch wiremock'

  down:
    desc: Stop the e2e stack and remove its volumes
    cmds:
      # -v even though the data directories are tmpfs: anonymous volumes an
      # image declares would otherwise pile up, one set per run.
      - '{{.COMPOSE}} down -v --remove-orphans {{.CLI_ARGS}}'

  restart:
    desc: Restart the e2e stack
    cmds:
      - task: down
      - task: up

  build:
    desc: Build the e2e images
    cmds:
      - '{{.COMPOSE}} build {{.CLI_ARGS}}'

  ps:
    desc: Show the e2e stack's containers
    cmds:
      - '{{.COMPOSE}} ps'

  logs:
    desc: Tail the e2e stack's logs (task e2e:logs -- php)
    cmds:
      - '{{.COMPOSE}} logs -f {{.CLI_ARGS}}'

  logs:dump:
    desc: Print the e2e stack's logs and return — what CI uploads on failure
    cmds:
      - '{{.COMPOSE}} logs --no-log-prefix --tail=400 {{.CLI_ARGS}}'

  url:
    desc: Print the URL the e2e stack answers on
    cmds:
      - 'echo "http://127.0.0.1:$({{.COMPOSE}} port traefik 80 | sed "s/.*://")"'
    silent: true

  project:
    desc: Print this worktree's Compose project name
    cmds:
      - 'echo "{{.PROJECT}}"'
    silent: true

  # ===========================================================================
  # Data
  # ===========================================================================
  install:
    desc: Install PHP dependencies inside the e2e stack
    # A fresh worktree has no api/vendor, and the stack mounts the worktree
    # rather than an image with dependencies baked in. Skipped when the lock
    # file has not moved since the last install.
    sources:
      - '{{.ROOT_DIR}}/api/composer.lock'
    generates:
      - '{{.ROOT_DIR}}/api/vendor/autoload.php'
    cmds:
      # No simulated clock for composer: a download under a date from the
      # future fails its TLS checks for a reason nobody would look for.
      - '{{.COMPOSE}} exec -T -e LD_PRELOAD= -e FAKETIME= php composer install --no-interaction --no-progress'

  ciqual:db:
    desc: Build the Ciqual food database the recipe journeys read
    # The ciqual service is built from the `dev` target, which bakes no
    # database — only `prod` does — and the stack mounts ./ciqual over /app, so
    # a baked one would be hidden anyway. Left alone, `db/ciqual.db` is the
    # empty directory the repository ships, every /ciqual/foods call answers
    # 500, and a recipe created with a Ciqual ingredient fails on an
    # autocomplete that returns nothing rather than on anything the journey is
    # about. The API's own IngredientFromCiqualResolver calls the same service,
    # so the write fails too.
    #
    # Three seconds from the committed XML for the real 3484 foods, so there is
    # nothing to gain from a cut-down fixture — and a `status` rather than a
    # one-shot, because the bytes are identical every time: a stack coming up
    # again on the same worktree skips it.
    #
    # The check counts rows rather than testing the file exists. An import
    # killed halfway leaves a non-empty file, and `test -s` would then skip the
    # rebuild for ever, with the indirect symptom the standard describes: an
    # autocomplete that is simply always empty.
    # Opened read-only, so the probe cannot create the very file it is checking
    # for: a plain `sqlite3.connect` would leave a zero-byte database behind on
    # the first run.
    status:
      - >-
        {{.COMPOSE}} exec -T ciqual python -c
        "import sqlite3,sys; c=sqlite3.connect('file:db/ciqual.db?mode=ro', uri=True);
        sys.exit(0 if c.execute('select count(*) from food').fetchone()[0] > 3000 else 1)"
    cmds:
      - '{{.COMPOSE}} exec -T ciqual python -m app.import_ciqual'

  cache:clear:
    desc: Rebuild the e2e container cache after changing PHP code or config
    # APP_DEBUG=0 means the compiled service container is never invalidated on
    # its own. The stack mounts your worktree, so a change to a service, a
    # route or a config file is invisible until this runs. Part of `e2e:up`;
    # run it by hand after editing during a session.
    cmds:
      - '{{.COMPOSE}} exec -T php bin/console --env=e2e cache:clear'

  admin:build:
    desc: Rebuild the admin bundle after changing admin code — the SPA's cache:clear
    # nginx serves ./admin/dist, which `admin-build` produced once and then
    # exited. Compose will not re-run a one-shot whose definition has not
    # changed, so an edit to admin/src is invisible to the browser until this
    # runs — the same trap as APP_DEBUG=0 on the PHP side, with the same
    # symptom: your change appears to do nothing at all.
    cmds:
      - '{{.COMPOSE}} up --force-recreate --no-deps admin-build'

  migrate:
    desc: Apply Doctrine migrations to the e2e database
    cmds:
      - '{{.COMPOSE}} exec -T php bin/console --env=e2e doctrine:migrations:migrate --no-interaction --allow-no-migration'

  seed:
    desc: Reset the e2e database to its deterministic fixture set
    cmds:
      - '{{.COMPOSE}} exec -T php bin/console --env=e2e app:e2e:seed {{.CLI_ARGS}}'
      - task: seed:agent
      - task: seed:wiremock

  seed:wiremock:
    desc: Put WireMock's all-day "today" Google event on the seed's anchor day (MAG-234)
    cmds:
      - COMPOSE='{{.COMPOSE}}' '{{.ROOT_DIR}}/e2e/wiremock-today.sh'

  seed:agent:
    desc: Empty the agent's own database — conversations, contexts, memory
    # `app:e2e:seed` is a Symfony command and only knows the API database. The
    # agent keeps its state in maggie_agent: messages, contexts, memories,
    # instructions, proactions. Left alone, a second run of a journey starts
    # with the first run's conversation behind it — Maggie then answers with
    # context nobody seeded, and the failure looks like a flaky assertion.
    #
    # Everything in that database is agent state, so emptying all of it is the
    # whole reset. The loop skips the tables the agent has not created yet,
    # which is the case on a stack that has just come up.
    cmds:
      - |
        {{.COMPOSE}} exec -T database psql -U maggie -d maggie_agent -v ON_ERROR_STOP=1 -q -c "
        DO \$\$
        DECLARE t text;
        BEGIN
          FOR t IN SELECT tablename FROM pg_tables WHERE schemaname = 'public'
          LOOP
            EXECUTE format('TRUNCATE TABLE %I CASCADE', t);
          END LOOP;
        END \$\$;"

  console:
    desc: Run a Symfony command in the e2e stack (task e2e:console -- debug:router)
    cmds:
      - '{{.COMPOSE}} exec php bin/console --env=e2e {{.CLI_ARGS}}'

  # ===========================================================================
  # Tests
  # ===========================================================================
  test:api:
    desc: Run PHPUnit inside this worktree's e2e stack — the worktree-safe way
    # `task api:test` runs against the dev stack, which mounts the main
    # checkout: in a worktree it would test the wrong code. This one mounts
    # this worktree.
    cmds:
      - task: test:prepare
      # The unit tests own their clock (ClockMock, fixed dates): the stack's
      # one would only fight them.
      - '{{.COMPOSE}} exec -T -e LD_PRELOAD= -e FAKETIME= php bin/phpunit {{.CLI_ARGS}}'

  test:prepare:
    desc: Create the PHPUnit database inside the e2e stack
    # PHPUnit forces APP_ENV=test, which reads api/.env.test and points at its
    # own database — one the e2e stack has never created. Without this the
    # whole suite errors out on "database does not exist", which reads like
    # hundreds of broken tests rather than one missing schema.
    cmds:
      - '{{.COMPOSE}} exec -T -e LD_PRELOAD= -e FAKETIME= php bin/console --env=test doctrine:database:create --no-interaction --if-not-exists'
      - '{{.COMPOSE}} exec -T -e LD_PRELOAD= -e FAKETIME= php bin/console --env=test doctrine:schema:drop --no-interaction --force --full-database'
      - '{{.COMPOSE}} exec -T -e LD_PRELOAD= -e FAKETIME= php bin/console --env=test doctrine:schema:create --no-interaction'

  eval:
    desc: Replay the prompt-lab scenarios on the real model (needs ANTHROPIC_API_KEY)
    # The other half of MAG-95. Journeys run on the fake and assert on plumbing;
    # this asks the real model for judgement — right tool, right tone, keeps the
    # thread — against the same seeded data, so a failure is the prompt or the
    # model and never the fixtures.
    #
    # It restarts the agent with LLM_PROVIDER=anthropic and puts the fake back
    # afterwards, even on failure: a stack left on the real model would make the
    # next journey slow, billed and flaky, which is exactly what this ticket
    # removed.
    #
    # Separate from CI on purpose (the `eval` job of .github/workflows/nightly.yml, nightly and on
    # demand): a prompt regression is a signal, not a merge blocker.
    #
    # Three things to know before reading a local run's report. It reseeds first,
    # because the scenarios write and a second run on an unreseeded stack has the
    # model failing for a data reason. It does *not* reseed afterwards, so it
    # leaves its own writes and the last scenario's conversation behind — run
    # `task e2e:seed` before a journey. And unless you export ANTHROPIC_MODEL, the
    # agent falls back to its own default rather than what production serves — the
    # nightly reads that from infra/k8s/configmap.yaml, and the two have differed.
    # The report header prints whichever model answered.
    vars:
      BASE_URL:
        sh: 'echo "http://127.0.0.1:$(docker compose -f {{.COMPOSE_FILE}} -p {{.PROJECT}} port traefik 80 | sed "s/.*://")"'
    env:
      # Same as `_up:api`: recreating a service without it would rebuild its
      # public URLs from the `http://localhost` default.
      E2E_BASE_URL: '{{.BASE_URL}}'
    preconditions:
      - sh: '[ -n "$ANTHROPIC_API_KEY" ]'
        msg: 'ANTHROPIC_API_KEY is empty — the eval suite calls the real model.'
    cmds:
      # --no-deps: `up agent` would otherwise pull in its dependency chain, and
      # nginx waits on admin-build, a one-shot that has already run. Compose
      # re-runs it, `npm ci` fails on a tree it built once, and the agent never
      # gets recreated. Everything agent needs is already up.
      - defer: '{{.COMPOSE}} up -d --wait --no-deps --force-recreate agent'
      # CLI_ARGS is global in Task: it reaches every task called with `- task:`,
      # and `seed` passes it to app:e2e:seed. Left alone, `task e2e:eval --
      # --report …` — what the nightly `eval` job always runs — dies on "The --report option
      # does not exist", before the agent is ever flipped to the real model.
      - task: seed
        vars:
          CLI_ARGS: ''
      - 'E2E_LLM_PROVIDER=anthropic {{.COMPOSE}} up -d --wait --no-deps --force-recreate agent'
      - '{{.COMPOSE}} exec -T agent python -m evals.runner {{.CLI_ARGS}}'

  eval:check:
    desc: Check the eval scenarios parse, without calling the model
    # No key, no restart, no tokens: what to run after editing a scenario file.
    # The runner refuses unknown expectation keys, so a typo surfaces here rather
    # than as a step that silently asserted nothing at 3am.
    cmds:
      - '{{.COMPOSE}} exec -T agent python -m evals.runner --check {{.CLI_ARGS}}'

  # ===========================================================================
  # The browser harness (MAG-97)
  # ===========================================================================
  web:
    desc: Run the Playwright journeys for the admin (task e2e:web -- --project=phone)
    # Reseeds first, deliberately. The journeys write — a chat message opens a
    # context, a tool call lands a row — so a second run on an unreseeded stack
    # starts in a world the first one moved, and the failure looks like a flaky
    # assertion rather than like leftover data.
    # The one task here that really needs the stack; lint and typecheck do not.
    preconditions:
      - sh: '{{.COMPOSE}} ps --status running --services | grep -qx traefik'
        msg: 'The e2e stack is not running — start it with `task e2e:up`.'
    cmds:
      - task: seed
        # CLI_ARGS is global in Task: without this, `task e2e:web -- --project=phone`
        # reaches app:e2e:seed too and dies on an option it has never heard of.
        vars:
          CLI_ARGS: ''
      - task: web:run
        vars:
          # The journeys' own service: it shares Traefik's network namespace so
          # the browser's origin is `http://localhost`, a trustworthy one (MAG-145).
          SERVICE: playwright-journeys
          COMMAND: 'npx playwright test {{.CLI_ARGS}}'

  web:lint:
    desc: ESLint on the journeys — part of `task lint:all`
    # ESLint carries eslint-plugin-playwright, which catches the mistakes that
    # make a suite lie: an `expect` nobody awaited passes whatever happens, a
    # conditional assertion, a `test.only` left behind.
    #
    # No stack needed — `compose run` starts a one-off container on its own.
    cmds:
      - task: web:run
        vars:
          COMMAND: 'npx eslint .'

  web:typecheck:
    desc: Type-check the journeys without running them
    # What to run after editing a helper: seconds, where a journey would take
    # the whole stack and several minutes.
    cmds:
      - task: web:run
        vars:
          COMMAND: 'npx tsc --noEmit'

  web:install:
    desc: Install the journeys' dependencies (also done by e2e:web)
    cmds:
      - task: web:run
        vars:
          COMMAND: 'true'

  web:shell:
    desc: Open a shell in the Playwright container
    cmds:
      - task: web:run
        vars:
          COMMAND: 'bash'
          TTY: '1'

  web:run:
    internal: true
    # --no-deps on purpose. Compose would otherwise re-evaluate nginx's
    # dependency chain, and nginx waits on admin-build — a one-shot that has
    # already completed. Compose re-runs it, `npm ci` fails on a tree it built
    # once, and the browser never starts.
    #
    # No precondition here: `compose run` brings up a one-off container and
    # its network on its own, which is all lint and typecheck need. Only
    # `web` requires a running stack, and it says so itself.
    cmds:
      # Created here rather than relied upon: Docker would otherwise make the
      # bind mount itself, owned by root, and the read-only seed mount would
      # then point at an empty directory nobody can explain.
      - mkdir -p {{.ROOT_DIR}}/api/var/e2e {{.ROOT_DIR}}/e2e/coverage
      - >-
        {{.COMPOSE}} --profile tools run --rm --no-deps {{if .TTY}}{{else}}-T{{end}} {{.SERVICE | default "playwright"}}
        bash -lc 'if [ ! -d node_modules ] || [ package-lock.json -nt node_modules ]; then npm ci --no-audit --no-fund; fi && {{.COMMAND}}'
      # `compose run` creates the network and never removes it, so linting on
      # a machine with no stack up would leave one empty bridge behind per
      # worktree. Removed only when nothing else is using it, so this is a
      # no-op while the stack is running. `defer`, so it also runs when the
      # command above failed.
      - defer: '{{.COMPOSE}} ps -q | grep -q . || docker network rm {{.PROJECT}}-net >/dev/null 2>&1 || true'

  # ===========================================================================
  # The emulator harness (MAG-98)
  # ===========================================================================
  mobile:
    desc: Run the Maestro journeys for the Android app (task e2e:mobile -- --include-tags voice)
    # Reseeds first, for the reason `web` does: the flows write — a chat message
    # opens a context, a tool call lands a row — so a second run on an unreseeded
    # stack starts in a world the first one moved, and the failure reads as a
    # flaky assertion rather than as leftover data.
    #
    # Needs a device: `e2e/mobile/run.sh` bridges this stack's ephemeral port
    # onto a fixed one with `adb reverse`, builds and installs the `e2e` flavor,
    # and runs the flows. It says what is missing when something is.
    vars:
      BASE_URL:
        sh: 'echo "http://127.0.0.1:$(docker compose -f {{.COMPOSE_FILE}} -p {{.PROJECT}} port traefik 80 | sed "s/.*://")"'
    preconditions:
      - sh: '{{.COMPOSE}} ps --status running --services | grep -qx traefik'
        msg: 'The e2e stack is not running — start it with `task e2e:up`.'
    cmds:
      - task: seed
        # CLI_ARGS is global in Task: without this, `task e2e:mobile --
        # --include-tags voice` reaches app:e2e:seed too and dies on an option it
        # has never heard of.
        vars:
          CLI_ARGS: ''
      - 'E2E_BASE_URL={{.BASE_URL}} {{.ROOT_DIR}}/e2e/mobile/run.sh {{.CLI_ARGS}}'

  mobile:lint:
    desc: Check the Maestro flows — syntax, testTags, tag roots, applicationId, unawaited assertions — part of `task lint:all`
    # No stack, no emulator, seconds. Every check here is a failure that has
    # already cost an emulator job: a command Maestro does not know, an `id:` that
    # no longer matches a testTag in ui/UiTags.kt, a window carrying a tag without
    # its own `uiTagRoot()`, and an `assertVisible` left on Maestro's invisible
    # default timeout straight after an action.
    cmds:
      - '{{.ROOT_DIR}}/e2e/mobile/lint.sh'

  mobile:maestro:
    desc: Download the pinned Maestro CLI and print its path (also done by e2e:mobile)
    cmds:
      - '{{.ROOT_DIR}}/e2e/mobile/maestro.sh --path'
    silent: true

  smoke:
    desc: Run the smoke journey against the running e2e stack
    vars:
      BASE_URL:
        sh: 'echo "http://127.0.0.1:$(docker compose -f {{.COMPOSE_FILE}} -p {{.PROJECT}} port traefik 80 | sed "s/.*://")"'
    cmds:
      - 'E2E_BASE_URL={{.BASE_URL}} {{.ROOT_DIR}}/e2e/smoke/smoke.sh'

  # ===========================================================================
  # Debugging
  # ===========================================================================
  sh:
    desc: Open a shell in an e2e container (task e2e:sh -- agent)
    cmds:
      - '{{.COMPOSE}} exec {{.CLI_ARGS | default "php"}} sh'

  psql:
    desc: Open psql on the e2e database
    cmds:
      - '{{.COMPOSE}} exec database psql -U maggie -d maggie_e2e'

  restart:wiremock:
    desc: Reload the WireMock stubs after editing a mapping file
    cmds:
      - '{{.COMPOSE}} restart wiremock'

  # ===========================================================================
  # Internals
  # ===========================================================================
  keys:
    desc: Generate the signing keys this worktree's e2e stack needs
    cmds:
      - task: keys:jwt
      - task: keys:bank

  keys:jwt:
    internal: true
    # Their own directory, not api/config/jwt/: that one may already hold dev
    # keys with a different passphrase, and Lexik would then fail to load them
    # with an error nowhere near the cause. This is the last file the e2e stack
    # would have shared with dev.
    status:
      - test -f {{.ROOT_DIR}}/api/config/jwt/e2e/private.pem
      - test -f {{.ROOT_DIR}}/api/config/jwt/e2e/public.pem
    cmds:
      - mkdir -p {{.ROOT_DIR}}/api/config/jwt/e2e
      - openssl genpkey -algorithm RSA -out {{.ROOT_DIR}}/api/config/jwt/e2e/private.pem -aes256 -pkeyopt rsa_keygen_bits:4096 -pass pass:e2e-jwt-passphrase
      - openssl pkey -in {{.ROOT_DIR}}/api/config/jwt/e2e/private.pem -passin pass:e2e-jwt-passphrase -pubout -out {{.ROOT_DIR}}/api/config/jwt/e2e/public.pem

  keys:bank:
    internal: true
    # EnableBankingClient signs every call with this key. WireMock does not
    # check the signature, but the client refuses to build a request without a
    # readable key, so the sync journey needs one.
    status:
      - test -f {{.ROOT_DIR}}/api/config/bank/e2e.pem
    cmds:
      - mkdir -p {{.ROOT_DIR}}/api/config/bank
      - openssl genpkey -algorithm RSA -out {{.ROOT_DIR}}/api/config/bank/e2e.pem -pkeyopt rsa_keygen_bits:2048
