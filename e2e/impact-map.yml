# What each e2e journey depends on — the one map the pull request, the night and
# the quarantine read (owner's decision, 8 Oct.).
#
# A pull request plays the journeys its changed files touch, plus the critical
# core of each platform that plays at all; the night plays everything. Read by
# `scripts/e2e/impacted.sh` (selection, and `check` in CI) and
# `scripts/e2e/verdict.sh` (quarantine). The rules, in the order they apply to
# each changed file:
#
#   1. `ignored` — selects nothing (docs, unit tests, this map).
#   2. `transversal` — the whole suite, web and mobile; `transversal_web` /
#      `transversal_mobile` — every journey of that platform.
#   3. a journey's own file, its `paths` and the globs of its `areas` — that journey,
#      unless the file is `only` the other platform's (an admin screen never
#      selects a Maestro flow, an Android screen never a Playwright file).
#   4. `unmapped` — a file under one of these roots that nothing above claims
#      plays every journey of the platforms listed: a file the map forgot runs
#      too much, never too little. So a file of `e2e/` no journey claims (a
#      fixture, a page object used everywhere, a runner) plays the suite of its
#      platform, and `e2e/` outside `web/` and `mobile/` plays both. An area that
#      only the core uses (`stack`) claims nothing here: the core plays anyway,
#      and a new module must not hide behind it.
#
# Globs: `**` crosses directories, `*` and `?` do not, `{a,b}` is either.
#
# A journey:
#   areas       named sets of globs below; the night reports a red journey by its
#               area and the last commit that touched it.
#   paths       extra globs that only this journey depends on.
#   critical    the small core always played beside whatever else its platform
#               plays: sign-in, the basic chat, the smoke. Never in quarantine
#               (`impacted.sh check` refuses it). Keep it small.
#   quarantine  {since: YYYY-MM-DD, reason: …} — still played everywhere, but its
#               failure only warns in the job summary. Lift it once the night has
#               been green on it for a week.
#
# Every journey on disk must be listed here, and every journey listed must exist:
# `impacted.sh check` fails the `Infra scripts and workflows` job otherwise.

ignored:
  - '**/*.md'
  - e2e/impact-map.yml
  - 'admin/src/**/*.test.{ts,tsx}'
  - admin/src/test/**
  - admin/eslint.config.js
  - api/modules/*/tests/**
  - api/tests/**
  - 'api/phpstan*'
  - api/phpunit.dist.xml
  - agent/tests/**
  - agent/conftest.py
  - ciqual/tests/**
  - mobile/app/src/test/**
  - mobile/app/src/testProd/**

# The safety rule: these play everything.
transversal:
  # The shared API: the kernel, the core module (users, auth, search index, the
  # e2e seed), its configuration, its contract with the clients.
  - api/modules/core/**
  - api/contract/**
  - api/config/**
  - api/src/**
  - api/bin/**
  - api/public/**
  - api/migrations/**
  - api/fixtures/e2e/10-core.yaml
  # Authentication, wherever it lives.
  - admin/src/auth/**
  - agent/app/auth.py
  - mobile/app/src/main/java/com/maggie/app/data/auth/**
  - mobile/app/src/main/java/com/maggie/app/ui/navigation/AuthRedirect.kt
  - mobile/app/src/main/java/com/maggie/app/ui/screens/{login,lock}/**
  - mobile/app/src/main/java/com/maggie/app/data/model/User.kt
  # The stack and the harness.
  - docker-compose.e2e.yml
  - .docker/**
  - '**/Taskfile*.yml'
  - scripts/e2e/**
  - .github/workflows/ci.yml
  # Lockfiles and dependencies.
  - '**/composer.{json,lock}'
  - '**/package{,-lock}.json'
  - '**/{pyproject.toml,uv.lock}'
  - '**/*.gradle.kts'
  - mobile/gradle/**
  - mobile/gradle.properties

# What every admin screen goes through.
transversal_web:
  - admin/src/{App,main}.tsx
  - admin/src/{breakpoints,dates}.ts
  - admin/src/components/{layout,form,list}/**
  - admin/src/i18n/**
  - admin/src/hooks/{useItemTransitions,useNarrowScreen}.ts
  - admin/index.html
  - admin/public/**
  - 'admin/vite.config.*'
  - 'admin/tsconfig*.json'

# What every screen of the app goes through, and the e2e flavor itself.
transversal_mobile:
  - mobile/app/src/main/java/com/maggie/app/{MainActivity,MaggieApp}.kt
  - mobile/app/src/main/java/com/maggie/app/ui/UiTagRoot.kt
  - mobile/app/src/main/java/com/maggie/app/ui/{layout,theme}/**
  - mobile/app/src/main/java/com/maggie/app/ui/navigation/NavGraph.kt
  - mobile/app/src/main/java/com/maggie/app/ui/components/{AppDrawer,EmptyState,ErrorSnackbar,MaggieTopBar}.kt
  - mobile/app/src/main/java/com/maggie/app/ui/screens/loading/**
  - mobile/app/src/main/java/com/maggie/app/data/api/MaggieApiService.kt
  - mobile/app/src/main/java/com/maggie/app/data/local/**
  - mobile/app/src/main/java/com/maggie/app/util/ResultExt.kt
  - mobile/app/src/main/res/**
  - mobile/app/src/main/AndroidManifest.xml
  - mobile/app/src/{e2e,debug,google}/**
  - mobile/app/proguard-rules.pro

only:
  web:
    - admin/**
    - e2e/web/**
  mobile:
    - mobile/**
    - e2e/mobile/**

unmapped:
  all:
    - api/**
    - agent/**
    - ciqual/**
    - design/**
    - scripts/prompt-lab/**
    # e2e/ outside web/ and mobile/: the clock, the images, the smoke suite.
    - e2e/*
    - e2e/smoke/**
  web:
    - admin/**
    - e2e/web/**
  mobile:
    - mobile/**
    - e2e/mobile/**

areas:
  # Anything the stack runs: the smoke journey stands for it.
  stack:
    - api/**
    - admin/**
    - agent/**
    - ciqual/**
    - design/**
    # `e2e:eval:check` runs beside the smoke journey: a typo in a scenario fails there.
    - scripts/prompt-lab/**
  chat:
    - agent/**
    - admin/src/components/{chat,mind}/**
    # The chat's dictation in the admin records and transcribes through these.
    - admin/src/hooks/{useAgUiStream,agentFeed,agentTopics,useVoiceRecorder,useTranscription}.ts
    - admin/src/screenContext.ts
    - mobile/app/src/main/java/com/maggie/app/ui/screens/{chat,contexts}/**
    - mobile/app/src/main/java/com/maggie/app/ui/components/{ApprovalCard,ChatBottomBar,ChatMessageList,ChatSheet,ContextListSheet,MessageBubble}.kt
    - mobile/app/src/main/java/com/maggie/app/data/api/AgUiStreamParser.kt
    - mobile/app/src/main/java/com/maggie/app/data/repository/{Approval,Chat,ChatPreferences,Context}Repository.kt
    - mobile/app/src/main/java/com/maggie/app/data/model/{AgUiEvent,ChatMessage,Context,PendingApproval}.kt
    - mobile/app/src/main/java/com/maggie/app/util/ChatDateFormatter.kt
    - e2e/web/pages/ChatPanel.ts
    - e2e/web/helpers/{agui,chatLock}.ts
  voice:
