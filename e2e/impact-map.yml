    - mobile/app/src/main/java/com/maggie/app/ui/components/{AssistantOverlay,SpokenApprovals,SpokenReplies,VoiceControlBar}.kt
    - mobile/app/src/main/java/com/maggie/app/data/model/TtsVoice.kt
    - e2e/mobile/scripts/event-api.js
  interruptions:
    - admin/src/components/maggie/**
  realtime:
    - admin/src/hooks/{useMercure,mercureUrl}.ts
    - mobile/app/src/main/java/com/maggie/app/data/mercure/**
