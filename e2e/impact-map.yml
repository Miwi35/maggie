mobile:
  # The critical core: sign in, read the dashboard, get an answer from Maggie.
  e2e/mobile/flows/01-login-chat.yaml:
    critical: true
    areas: [chat, dashboard]
    paths:
      # The e2e flavor's sign-in test runs beside the APK this journey installs.
      - mobile/app/src/testE2e/**
      # Lists every flow reads but no flow's behaviour hangs on: a tag added for
      # a new screen, a flow added to a shard. `e2e/mobile/lint.sh`, in the
      # `E2E Mobile APK` job that playing any flow starts, checks every flow
      # against them — a renamed tag fails there, not in a full run.
      - mobile/app/src/main/java/com/maggie/app/ui/UiTags.kt
      - e2e/mobile/{config.yaml,shards.txt}

  e2e/mobile/flows/02-voice-overlay.yaml:
    areas: [chat, voice, dashboard]
    quarantine:
      since: 2026-10-08
      reason: >-
        Red then green on a re-run with no change (7-8 Oct.); hung 17 minutes once
        on a CI emulator before passing.
  e2e/mobile/flows/04-calendar-import.yaml:
    areas: [calendar, google, realtime]
  e2e/mobile/flows/05-deep-links.yaml:
    areas: [calendar, chat, finance, cookbook]
    paths: [mobile/app/src/main/java/com/maggie/app/ui/navigation/DeepLinks.kt]
    quarantine:
      since: 2026-10-08
      reason: Red then green on a re-run with no change (7-8 Oct.).
  e2e/mobile/flows/08-grocery-realtime.yaml:
    areas: [grocery, realtime]
  e2e/mobile/flows/09-finance-banks.yaml:
    areas: [finance]
  e2e/mobile/flows/11-calendar-all-day-series.yaml:
    areas: [calendar]
    quarantine:
      since: 2026-10-08
      reason: Red then green on a re-run with no change (7-8 Oct.).
  e2e/mobile/flows/12-event-date-picker.yaml:
    areas: [calendar]
  e2e/mobile/flows/12-finance-rente.yaml:
    areas: [finance]
  e2e/mobile/flows/12-recipe-realtime.yaml:
    areas: [cookbook, realtime]
  e2e/mobile/flows/13-chat-opens-on-latest.yaml:
    areas: [chat, voice]
    paths: [e2e/mobile/scripts/chat-api.js]
