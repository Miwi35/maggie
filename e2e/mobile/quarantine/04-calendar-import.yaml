appId: com.maggie.app.e2e
name: 04-calendar-import
tags:
  - calendar
---
# QUARANTINED (MAG-209): fails on the same `calendar_span_…` bar as flow 03.
# Run it alone with `task e2e:mobile -- quarantine/04-calendar-import.yaml`.
# Importing a Google calendar updates the screen by itself (MAG-204). The
# regression it holds is `2dfdbb3`: the calendar fetched its events once, so what
# an import brought in stayed invisible until the user pulled to refresh or
# reopened the screen.
#
# **The import is asynchronous**, which is what makes this worth a journey. The
# API answers « connected » at once and pulls the events in the background; they
# reach the database — and the screen, through Mercure — some time later. So no
# amount of refreshing right after the tap would show them, and a flow that
# *did* refresh would pass on a screen that never listens. This one does nothing
# after the last tap: no pull-to-refresh, no navigation, no view switch. The event
# either appears by itself or the journey fails.
#
# The witness is « Escapade importée de Google », an all-day event dated today in
# the WireMock stub (`.docker/e2e/wiremock/mappings/google.json`), templated on
# the run's date because the stub's other event is pinned to March 2026 — nowhere
# near any view this journey opens. All-day, so the week view draws it in the bar
# row at the top, whatever the hour. The bar is matched by its title and not by
# its dates: the day it covers is the API's reading of a date with no time, and
# this journey is about the screen refreshing, not about that.
#
# Reseeded by `task e2e:mobile`: the dialog offers only calendars not already
# connected, so a second run on the same data would open it empty.

- launchApp:
    clearState: true
    permissions:
      all: allow

- runFlow: ../subflows/sign-in.yaml

- runFlow: ../subflows/open-calendar.yaml

# The starting point, so the appearance below is a change and not something that
# was always there. Today's header is already waited for by `open-calendar`, and
# an absence has nothing more to wait for.
- assertNotVisible:
    text: "Escapade importée de Google"

# Through the screen's own options menu, which is a window of its own: the id is
# only readable because the menu carries a tag root (`FullCalendarScreen.kt`).
- tapOn:
    id: "calendar_options"

- tapOn:
    id: "calendar_import_google"

# The dialog loads the list from Google (through the stub) before it draws any
# row, behind a spinner.
- extendedWaitUntil:
    visible:
      id: "google_import_.*"
    timeout: 20000

- tapOn:
    id: "google_import_.*"

# The whole assertion, and the only step with a long timeout: connect, queue the
# pull, run it, publish on Mercure, refetch. Nothing is touched while it waits.
- extendedWaitUntil:
    visible:
      id: "calendar_span_.*"
      text: "Escapade importée de Google"
    timeout: 60000
