appId: com.maggie.app.e2e
name: 10-voice-settings
tags:
  - voice
---
# Settings > Voix carries the assistant role and the quick ways to open Maggie,
# and no longer offers a background listening option (MAG-240). The assistant key
# itself is system behaviour Maestro cannot drive: it is accepted by hand on the
# phone (Recette). What a journey can prove is what the screen says.

- launchApp:
    clearState: true
    permissions:
      all: allow

- runFlow: ../subflows/sign-in.yaml

- tapOn:
    id: "nav_menu"
- extendedWaitUntil:
    visible:
      id: "drawer_settings"
    timeout: 20000
- tapOn:
    id: "drawer_settings"

- extendedWaitUntil:
    visible: "Voix"
    timeout: 20000
- tapOn: "Voix"

- extendedWaitUntil:
    visible: ".*Assistant par défaut.*"
    timeout: 20000
- assertNotVisible: ".*Mot d'activation.*"
- assertNotVisible: ".*Batterie non restreinte.*"

- scrollUntilVisible:
    element: ".*Ouvrir Maggie rapidement.*"
