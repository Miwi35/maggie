appId: com.maggie.app.e2e
name: 12-recipe-steps
tags:
  - cookbook
---
# The equipment and the steps of a recipe, on the sheet and from the phone (MAG-492,
# extends 12-recipe-realtime). The recipe is the steps spec's reference example, created
# over HTTP by `scripts/recipe-api.js` as Maggie or the admin would send it: what the sheet
# must show is what the API really serves, not a fixture of the phone's. Then a utensil is
# added from the phone through the full-screen search, with creation on the fly, and it comes
# back on the sheet. Its micronutrients unfold under the values of one serving (MAG-648). The
# recipe, its ingredients and the utensils are this flow's own and are deleted at the end.

- runFlow: ../subflows/new-user.yaml

- launchApp:
    clearState: true
    permissions:
      all: allow
    arguments:
      e2e_journey: e2e/mobile/flows/12-recipe-steps.yaml
      e2e_email: ${output.journeyEmail}

- runFlow: ../subflows/sign-in.yaml

- runScript:
    file: ../scripts/recipe-api.js
    env:
      EMAIL: ${output.journeyEmail}
      ACTION: create-method
      RECIPE: Pâtes aux légumes MAG-492

# Opened by its link: the cookbook list shows a page of the recipes of the whole test database.
- openLink: "maggie-e2e://recipe/${output.recipeId}"

- extendedWaitUntil:
    visible: "Matériel"
    timeout: 20000
- scrollUntilVisible:
    element: "Casserole MAG-492"
- scrollUntilVisible:
    element: "Poêle MAG-492"

# MAG-630: the quantities read as the Cuisine activity writes them, never « 1.0 kg ».
- scrollUntilVisible:
    element: "Pâtes MAG-492"
    direction: UP
- extendedWaitUntil:
    visible: "1 kg"
    timeout: 10000
- assertNotVisible: "1.0 kg"

# The steps, with what the cook needs to know to chain them.
- scrollUntilVisible:
    element: "Cuire les pâtes"
- extendedWaitUntil:
    visible: "12 min · en fond"
    timeout: 10000
# Top to bottom, each one scrolled to: on a tablet the sheet is short, so an
# element read without scrolling to it is below the screen and absent from the hierarchy.
- scrollUntilVisible:
    element: "Faire revenir les légumes"
- scrollUntilVisible:
    element: "8 min"
- scrollUntilVisible:
    element: "Égoutter, mélanger"
- scrollUntilVisible:
    element: "attend 3, 4"

# MAG-630: the values of one serving close the sheet.
# Scrolled to the line itself: its block's title can be on screen with the line under the tablet's pane foot.
- scrollUntilVisible:
    element: "≈ 500 kcal"
- extendedWaitUntil:
    visible: "≈ 500 kcal"
    timeout: 10000
# One line below « ≈ 500 kcal », which can sit on the screen's bottom edge: scroll to it, as for every other line.
- scrollUntilVisible:
    element: "Protéines 20 g"

# MAG-648: the micronutrients fold under the macros; unfolded, vitamin C reads as a share of its reference
# (300 g of vegetables linked to Ciqual 20385, 20.1 mg per 100 g, for 2 servings: 30 mg, 38 % of 80 mg).
- scrollUntilVisible:
    element:
      id: "recipe_micronutrients_toggle"
- extendedWaitUntil:
    visible: "Micronutriments · .*"
    timeout: 10000
- assertNotVisible: "Vitamine C"
- tapOn:
    id: "recipe_micronutrients_toggle"
- scrollUntilVisible:
    element: "Vitamine C"
- scrollUntilVisible:
    element: "38 %"
- scrollUntilVisible:
    element: "Minéraux"

# A utensil from the phone: the full-screen search, a name the catalogue lacks, created on the spot.
- scrollUntilVisible:
    element:
      id: "recipe_utensil"
    direction: UP
# MAG-630: editing is in the ⋮ menu of the sheet's top bar, not a button in its body.
- extendedWaitUntil:
    visible:
      id: "recipe_menu"
    timeout: 10000
- tapOn:
    id: "recipe_menu"
- extendedWaitUntil:
    visible:
      id: "recipe_edit"
    timeout: 10000
- tapOn:
    id: "recipe_edit"
# The edit form is its own screen: scrolling while the sheet is still leaving can land the swipe on an
# ingredient field and open its search dialog (red then flaky on the 24 and 25 Oct. nights).
- extendedWaitUntil:
    visible: "Modifier la recette"
    timeout: 20000
- scrollUntilVisible:
    element:
      id: "recipe_utensil_add"
    centerElement: true
- tapOn:
    id: "recipe_utensil_add"
- extendedWaitUntil:
    visible:
      id: "recipe_utensil_search"
    timeout: 20000
- tapOn:
    id: "recipe_utensil_search"
- inputText: "Mixeur MAG-492"
- extendedWaitUntil:
    visible:
      id: "recipe_utensil_create"
    timeout: 20000
- tapOn:
    id: "recipe_utensil_create"

# Back on the form, the new utensil is among the recipe's; saved, it is on the sheet.
- scrollUntilVisible:
    element: "Mixeur MAG-492"
# No centering: « Enregistrer » ends the form, so on a tall screen (foldable) the scroll
# cannot bring it to the middle and Maestro swipes until the timeout (MAG-571).
- scrollUntilVisible:
    element:
      id: "recipe_save"
    timeout: 40000
# The button can still be cut by the bottom bar once « visible »: a tap on its clipped centre does nothing
# and the form stays open. One more swipe (a no-op at the end of the form) brings it whole.
- scroll
- tapOn:
    id: "recipe_save"
- extendedWaitUntil:
    notVisible: "Modifier la recette"
    timeout: 30000
# The sheet comes back where it was scrolled, or reloaded at the top: scroll to the equipment either way.
- scrollUntilVisible:
    element: "Mixeur MAG-492"
    direction: UP
    timeout: 30000
- scrollUntilVisible:
    element: "Matériel"
    direction: UP
- extendedWaitUntil:
    visible: "Casserole MAG-492"
    timeout: 10000

# Left as found.
- runScript:
    file: ../scripts/recipe-api.js
    env:
      EMAIL: ${output.journeyEmail}
      ACTION: remove
      RECIPE: Pâtes aux légumes MAG-492
