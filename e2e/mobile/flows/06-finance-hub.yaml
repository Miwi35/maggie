appId: com.maggie.app.e2e
name: 06-finance-hub
tags:
  - navigation
---
# One « Finance » entry in the menu, and the finance dashboard leads to the rest
# (MAG-196). The drawer holds one entry per module; the dashboard orders the parts
# of the module by how often they are used, and every finance screen comes back to
# it by the back arrow.

- launchApp:
    clearState: true
    permissions:
      all: allow

- runFlow: ../subflows/sign-in.yaml

- tapOn:
    id: "nav_menu"

- extendedWaitUntil:
    visible:
      id: "drawer_finance_dashboard"
    timeout: 20000

# The other parts of the module are no longer in the menu.
- assertNotVisible:
    id: "drawer_budgets"
- assertNotVisible:
    id: "drawer_accounts"

- tapOn:
    id: "drawer_finance_dashboard"

- extendedWaitUntil:
    visible:
      id: "finance_access_budgets"
    timeout: 30000

- tapOn:
    id: "finance_access_budgets"

- extendedWaitUntil:
    visible: "Budgets"
    timeout: 20000

# Back lands on the finance dashboard, not on the main dashboard.
- tapOn: "Retour"

- extendedWaitUntil:
    visible:
      id: "finance_access_budgets"
    timeout: 20000
