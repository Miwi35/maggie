appId: com.maggie.app.e2e
name: 17d-task-bravo
tags:
  - calendar
---
# The bravo of a task done (MAG-508, extends MAG-100): a tick from « Aujourd'hui » opens it.
#
# Given today's day holding five tasks of the journey's own, the first two done
# (`scripts/bravo-api.js`), when the third is ticked from the list (MAG-766), then the Bravo shows
# « … · faite », a message and the day bar, the reward is stored as a star, and « Retour à ma
# journée » is the only way on — no « Suivante » (MAG-716) — and goes back to the day.
#
# A new user (MAG-766): its five tasks are the only ones of the day, so the bar reads « 3 sur 5 ». The message bank, the
# shooting stars and the switches of the vibration and the sound are `RewardApiTest`'s,
# `BravoViewModelTest`'s and `BravoScreenTest`'s; the shooting star of a full day is the
# Playwright journey's.

- runFlow: ../subflows/new-user.yaml

- runScript:
    file: ../scripts/bravo-api.js
    env:
      ACTION: setup
      TODAY: ${TODAY}
      EMAIL: ${output.journeyEmail}

- launchApp:
    clearState: true
    permissions:
      all: allow
    arguments:
      e2e_journey: e2e/mobile/flows/17d-task-bravo.yaml
      e2e_email: ${output.journeyEmail}

- runFlow: ../subflows/sign-in.yaml

- runFlow:
    file: ../subflows/open-destination.yaml
    env:
      DEST: tasks
- extendedWaitUntil:
    visible:
      id: "tasks"
    timeout: 20000

# The day: the third among the tasks of the day, two of five done.
- extendedWaitUntil:
    visible:
      id: "tasks_today_check_${output.thirdId}"
    timeout: 30000
- assertVisible: ".*Bravo 3 MAG-508.*"

# Ticked from the list (MAG-766): the Bravo, with the task, a message and the day so far.
- tapOn:
    id: "tasks_today_check_${output.thirdId}"
- extendedWaitUntil:
    visible:
      id: "bravo"
    timeout: 20000
- assertVisible:
    id: "bravo_title"
    text: ".*Bravo 3 MAG-508 · faite.*"
- assertVisible:
    id: "bravo_message"
- assertVisible:
    id: "bravo_day_bar"
- assertVisible: ".*3 sur 5 aujourd'hui.*"
- runScript:
    file: ../scripts/bravo-api.js
    env:
      ACTION: expect-reward
      TODAY: ${TODAY}
      EMAIL: ${output.journeyEmail}

# No « Suivante » (MAG-716): « Retour à ma journée » is the only button, and goes back to the day.
- assertNotVisible: ".*Suivante.*"
- assertVisible:
    id: "bravo_back"
- tapOn:
    id: "bravo_back"
- extendedWaitUntil:
    visible:
      id: "tasks_ring"
    timeout: 20000
- assertVisible: ".*Bravo 4 MAG-508.*"
