appId: com.maggie.app.e2e
name: 17-tasks-views
tags:
  - calendar
---
# The Tâches screen, in three sections (MAG-408, MAG-934): « Aujourd'hui », « Tâches » (« À venir » and « Un jour »
# grouped CETTE SEMAINE · PLUS TARD · SANS DATE), « Archives », chosen from the header « Tâches › … ▾ » (MAG-626). Reached from the drawer / the rail. « Aujourd'hui »
# is the day since MAG-497: five slots and a reserve folded under its count
# (`17b-tasks-day` plays it).
#
# The witnesses are the seeded tasks of `api/fixtures/e2e/20-calendar.yaml`, each in
# the one view the API puts it in: « Renvoyer le formulaire de la mutuelle » (due two
# days ago, never done: put off, so it waits in the day's reserve, « reportée »),
# « Appeler le garage » (in three days), « Trier les
# photos de vacances » (no day), « Sortir les poubelles » (done yesterday). The menu
# labels carry counts, which the seed and the other journeys move: they are not
# asserted (the entries are tapped by id). The ordering and the counts are the API's
# (`TaskViewsTest`) and the ViewModel's (`TasksViewModelTest`).
#
# Then the gestures: a task added in « Tâches » has no date, so it is in SANS DATE; « Aujourd’hui » on its row
# plans it today, it leaves the section for « Aujourd'hui », ticking it there takes it to « Archives », and its detail (a sheet on a phone, the pane on a
# tablet) is read and edited through the pencil, and its bin deletes it after a confirmation, so the shared server is left as it was.

- launchApp:
    clearState: true
    permissions:
      all: allow
    arguments:
      e2e_journey: e2e/mobile/flows/17-tasks-views.yaml

- runFlow: ../subflows/sign-in.yaml

- runFlow:
    file: ../subflows/open-destination.yaml
    env:
      DEST: tasks
- extendedWaitUntil:
    visible:
      id: "tasks"
    timeout: 20000
# One header (MAG-670): the breadcrumb « Tâches › Aujourd'hui ▾ » in the top bar, and no bar title above it.
- assertVisible:
    id: "breadcrumb_module"
    text: "Tâches"
# The tag is on the section's button and its text on a child: two nodes, two checks.
- assertVisible:
    id: "breadcrumb_section"
- assertVisible: "Aujourd'hui"
- assertNotVisible:
    id: "top_bar_title"

# « Aujourd'hui » shows the tasks of the day (MAG-766), with no reserve: the late task is one of
# them and reads « reportée » — never late in red (MAG-497).
# On a tablet or a foldable the list is the left pane and the 88 dp portrait band (MAG-624) clips
# the content: the late task may be below the fold, and `scrollUntilVisible` swipes from the screen
# centre, i.e. the detail pane (MAG-571). The phone keeps its own scroll.
- runFlow:
    when:
      visible:
        id: "detail_pane"
    file: ../subflows/scroll-list-end.yaml
- extendedWaitUntil:
    visible:
      id: "tasks_today"
    timeout: 30000
- scrollUntilVisible:
    element: ".*Renvoyer le formulaire de la mutuelle.*"
    timeout: 20000
- extendedWaitUntil:
    visible:
      text: ".*reportée depuis.*"
      below: ".*Renvoyer le formulaire de la mutuelle.*"
    timeout: 20000
- assertNotVisible: ".*En retard.*"

- runFlow:
    file: ../subflows/open-tasks-view.yaml
    env:
      VIEW: stock
- extendedWaitUntil:
    visible: "Appeler le garage"
    timeout: 20000
# « Appeler le garage » is dated, « Trier les photos de vacances » is not: it is under SANS DATE.
- scrollUntilVisible:
    element:
      id: "tasks_stock_group_undated"
    timeout: 20000
- scrollUntilVisible:
    element: "Trier les photos de vacances"
    timeout: 20000

# The floating « + » (MAG-721) opens « Nouvelle tâche » with no due day: « Créer » and the task lands in SANS DATE.
- tapOn:
    id: "tasks_add"
- tapOn:
    id: "task_form_title"
- inputText: "Tâche MAG-408"
- tapOn:
    id: "task_form_submit"
- scrollUntilVisible:
    element: "Tâche MAG-408"
    timeout: 20000

# « Aujourd’hui » on its row plans it today: it leaves the section and is in « Aujourd'hui ».
# By its description (« Faire aujourd’hui « <titre> »»): rightOf picked another row's button in CI.
- tapOn: "Faire aujourd.hui .*Tâche MAG-408.*"
- extendedWaitUntil:
    notVisible: "Tâche MAG-408"
    timeout: 20000

- runFlow:
    file: ../subflows/open-tasks-view.yaml
    env:
      VIEW: today
- scrollUntilVisible:
    element: "Tâche MAG-408"
    timeout: 20000

# Ticked from « Aujourd'hui »: the Bravo, back to the day, and the task is in « Archives ».
- tapOn:
    id: "tasks_today_check_.*"
    leftOf: "Tâche MAG-408"
- extendedWaitUntil:
    visible:
      id: "bravo"
    timeout: 20000
- tapOn:
    id: "bravo_back"
- extendedWaitUntil:
    visible:
      id: "tasks_ring"
    timeout: 20000

- runFlow:
    file: ../subflows/open-tasks-view.yaml
    env:
      VIEW: done
- extendedWaitUntil:
    visible: "Tâche MAG-408"
    timeout: 20000
- assertVisible: "Sortir les poubelles"
# MAG-636: the API's English words (criticality, priority) never reach the screen.
- assertNotVisible: "low|medium|high|critical"

# Its fiche is read only (MAG-721): the pencil opens « Modifier la tâche », a new title and « Enregistrer »
# show on the fiche, and the bin deletes it.
- tapOn: "Tâche MAG-408"
- extendedWaitUntil:
    visible: ".*Priorité.*"
    timeout: 20000
- assertVisible:
    id: "task_detail_delete"
- tapOn:
    id: "task_detail_edit"
- extendedWaitUntil:
    visible: "Modifier la tâche"
    timeout: 20000
- tapOn:
    id: "task_form_title"
- inputText: " éditée"
- tapOn:
    id: "task_form_submit"
- tapOn: "Tâche MAG-408 éditée"
- extendedWaitUntil:
    visible:
      id: "task_detail_edit"
    timeout: 20000
# The bin beside the pencil (MAG-796): « Annuler » keeps the task, « Supprimer » deletes it from the fiche, which
# leaves the seeded server as it was.
- tapOn:
    id: "task_detail_delete"
- extendedWaitUntil:
    visible: "Supprimer la tâche « Tâche MAG-408 éditée » ?"
    timeout: 20000
- tapOn:
    id: "task_delete_cancel"
- extendedWaitUntil:
    visible:
      id: "task_detail_delete"
    timeout: 20000
- tapOn:
    id: "task_detail_delete"
- extendedWaitUntil:
    visible:
      id: "task_delete_confirm"
    timeout: 20000
- tapOn:
    id: "task_delete_confirm"
- extendedWaitUntil:
    notVisible: "Tâche MAG-408 éditée"
    timeout: 20000
