appId: com.maggie.app.e2e
name: 17-tasks-views
tags:
  - calendar
---
# The Tâches screen, in four views (MAG-408): « Aujourd'hui », « À venir », « Un jour »,
# « Faites », chosen from the header « Tâches › … ▾ » (MAG-626). Reached from the drawer / the rail. « Aujourd'hui »
# is the day since MAG-497: five slots and a reserve folded under its count
# (`17b-tasks-day` plays it).
#
# The witnesses are the seeded tasks of `api/fixtures/e2e/20-calendar.yaml`, each in
# the one view the API puts it in: « Renvoyer le formulaire de la mutuelle » (due two
# days ago, never done: put off, so it waits in the day's reserve, « reportée »),
# « Appeler le garage » (in three days), « Trier les
# photos de vacances » (no day), « Sortir les poubelles » (done yesterday). The menu
# labels carry counts, which the seed and the other journeys move: they are not
# asserted (the entries are tapped by id). The ordering and the counts are the API's
# (`TaskViewsTest`) and the ViewModel's (`TasksViewModelTest`).
#
# Then the gestures: a task added in « À venir » gets tomorrow, ticking it takes it out
# of the view and into « Faites », and its detail (a sheet on a phone, the pane on a
# tablet) deletes it, so the shared server is left as it was.

- launchApp:
    clearState: true
    permissions:
      all: allow
    arguments:
      e2e_journey: e2e/mobile/flows/17-tasks-views.yaml

- runFlow: ../subflows/sign-in.yaml

- runFlow:
    file: ../subflows/open-destination.yaml
    env:
      DEST: tasks
- extendedWaitUntil:
    visible:
      id: "tasks"
    timeout: 20000
# One header (MAG-670): the breadcrumb « Tâches › Aujourd'hui ▾ » in the top bar, and no bar title above it.
- assertVisible:
    id: "breadcrumb_module"
    text: "Tâches"
# The tag is on the section's button and its text on a child: two nodes, two checks.
- assertVisible:
    id: "breadcrumb_section"
- assertVisible: "Aujourd'hui"
- assertNotVisible:
    id: "top_bar_title"

# The seed's day is not confirmed and the clock is past the morning time: « Ta journée »
# opens first (MAG-498, `17b-tasks-day` plays it). « Plus tard » leaves it as it is.
- runFlow:
    when:
      visible:
        id: "detail_pane"
    file: ../subflows/scroll-list-end.yaml
- tapOn:
    id: "tasks_morning_later"
    optional: true

# « Aujourd'hui » then shows the day: the seed plans none, so the late task waits in
# the reserve, folded, and reads « reportée » — never late in red (MAG-497).
# On a tablet or a foldable the list is the left pane and the 88 dp portrait band (MAG-624) clips
# the content: the reserve and what it holds are below the fold, and `scrollUntilVisible` swipes
# from the screen centre, i.e. the detail pane (MAG-571). The phone keeps its own scroll.
- runFlow:
    when:
      visible:
        id: "detail_pane"
    file: ../subflows/scroll-list-end.yaml
- extendedWaitUntil:
    visible:
      id: "tasks_reserve_toggle"
    timeout: 30000
- tapOn:
    id: "tasks_reserve_toggle"
- runFlow:
    when:
      visible:
        id: "detail_pane"
    file: ../subflows/scroll-list-end.yaml
- scrollUntilVisible:
    element: ".*Renvoyer le formulaire de la mutuelle.*"
    timeout: 20000
- extendedWaitUntil:
    visible:
      text: ".*reportée depuis.*"
      below: ".*Renvoyer le formulaire de la mutuelle.*"
    timeout: 20000
- assertNotVisible: ".*En retard.*"

- runFlow:
    file: ../subflows/open-tasks-view.yaml
    env:
      VIEW: upcoming
- extendedWaitUntil:
    visible: "Appeler le garage"
    timeout: 20000

# Quick add in « À venir »: the field names tomorrow, the task lands in the tab.
- tapOn:
    id: "tasks_add_input"
- inputText: "Tâche MAG-408"
- tapOn:
    id: "tasks_add_submit"
- extendedWaitUntil:
    visible: "Tâche MAG-408"
    timeout: 20000

# Ticking takes it out of « À venir » and into « Faites ». « Appeler le garage » is
# the only other task of the tab and is dated later, so the new one is the box above it.
- tapOn:
    id: "tasks_check_.*"
    above: "Appeler le garage"
- extendedWaitUntil:
    notVisible: "Tâche MAG-408"
    timeout: 20000
- assertVisible: "Appeler le garage"

- runFlow:
    file: ../subflows/open-tasks-view.yaml
    env:
      VIEW: someday
- extendedWaitUntil:
    visible: "Trier les photos de vacances"
    timeout: 20000

- runFlow:
    file: ../subflows/open-tasks-view.yaml
    env:
      VIEW: done
- extendedWaitUntil:
    visible: "Tâche MAG-408"
    timeout: 20000
- assertVisible: "Sortir les poubelles"
# MAG-636: the API's English words (criticality, priority) never reach the screen.
- assertNotVisible: "low|medium|high|critical"

# Its detail deletes it, which leaves the seeded server as it was. On a foldable the detail
# is a sheet taller than the screen: « Supprimer » is at its foot.
- tapOn: "Tâche MAG-408"
- extendedWaitUntil:
    visible: ".*Priorité.*"
    timeout: 20000
- runFlow:
    when:
      notVisible: "Supprimer"
    commands:
      - swipe:
          from:
            text: ".*Priorité.*"
          direction: UP
- extendedWaitUntil:
    visible:
      text: "Supprimer"
    timeout: 20000
- tapOn: "Supprimer"
- extendedWaitUntil:
    notVisible: "Tâche MAG-408"
    timeout: 20000
