appId: com.maggie.app.e2e
name: 26-finance-timeline
tags:
  - finance
---
# La frise sur 20 ans de la carte Planning, on every format (MAG-554, extends MAG-102; MAG-611 for the wide layouts).
#
# Étant donné un scénario suivi (créé par le script) qui atteint l'indépendance dans les 20 ans
# Quand j'ouvre Finance › Planification › Projets et que je passe la carte Planning de « 36 mois » à « 20 ans »
# Alors la frise remplace le Gantt, l'événement « Indépendance financière » est là
# Alors il porte la date N du scénario suivi, telle que l'API la calcule
# Alors les hypothèses (« matelas intact, revenus stables… ») sont dites sous la frise
# Quand je choisis le scénario « Qualité de vie » à comparer
# Alors une seconde ligne apparaît, avec la phrase de l'écart de N (celle de l'API, sans verdict)
#
# The date N is read by `scripts/timeline-api.js` from the same request the phone sends: the flow does
# not write a date down. The 36-month default, the events' order, their colours, the refused comparison
# and the retry are the screen tests' (`TimelineFriseScreenTest`, `FinanceTimelineViewModelTest`); the
# API's figures are `FinanceTimelineControllerTest`'s. What only a device shows is that the phone's own
# request (`GET /api/finance/timeline`, no contract records it yet) meets the server's answer.
#
# The tablet draws the same frise under the project list (« frise du bas »): the flow scrolls to the card
# wherever the format puts it, and asserts the same texts.

- runScript:
    file: ../scripts/timeline-api.js
    # `output.nLabel` is « décembre 2045 »: the month the independence event must carry.

- launchApp:
    clearState: true
    permissions:
      all: allow
    arguments:
      e2e_journey: e2e/mobile/flows/26-finance-timeline.yaml
      e2e_email: e2e@maggie.local

- runFlow: ../subflows/sign-in.yaml

- openLink: "maggie-e2e://finance/projects"
# The Planning card sits under the scenarios and the project rows on a tablet or a foldable, so it is
# scrolled to (extendedWaitUntil does not scroll). The card opens on 36 months; « 20 ans » draws the frise in its place.
- scrollUntilVisible:
    element:
      id: "timeline_horizon_240"
    centerElement: true
    timeout: 30000
- tapOn:
    id: "timeline_horizon_240"
# The horizon toggle was centred: the top of the frise is on screen, and the container is taller than the screen.
- extendedWaitUntil:
    visible:
      id: "timeline_frise"
    timeout: 30000
# The independence event sits below the fold: scrollUntilVisible reaches it.
- scrollUntilVisible:
    element:
      id: "timeline_event_independence_reached"
    timeout: 30000
# The event's title and its month are separate text nodes: the month is matched inside the event.
- scrollUntilVisible:
    element:
      id: "timeline_event_independence_reached"
      containsDescendants:
        - text: "Indépendance financière"
        - text: "${output.nLabel} · Indépendance"
    timeout: 10000
- scrollUntilVisible:
    element:
      id: "timeline_assumptions"
    timeout: 10000
- scrollUntilVisible:
    element:
      text: ".*matelas intact, revenus stables.*"
    timeout: 10000

# A second scenario beside the followed one: its own line, and the API's sentence on the gap of N.
# « Qualité de vie » is `auto-quality` until a journey stores it, then a ULID:
# reach its chip by the scenario's name, inside a compare chip. The chip's label is a child text node,
# not the chip's own text: match it with containsDescendants. The chips sit at the top of the frise,
# above the events the flow just scrolled down to: scroll back up.
- scrollUntilVisible:
    element:
      id: "timeline_compare_.*"
      containsDescendants:
        - text: "Qualité de vie"
    direction: UP
    timeout: 20000
- tapOn:
    id: "timeline_compare_.*"
    containsDescendants:
      - text: "Qualité de vie"
- scrollUntilVisible:
    element:
      id: "timeline_compared_track"
    timeout: 30000
- scrollUntilVisible:
    element:
      id: "timeline_difference"
    timeout: 10000
