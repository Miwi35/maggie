appId: com.maggie.app.e2e
name: 13-meals-planning
tags:
  - calendar
  - cookbook
---
# The meals' agenda stays out of the user's list, and the Cuisine module opens on
# the week's meals (MAG-354, MAG-628).
#
# Three things, over one seeded meal (« Pâtes à la tomate », tomorrow's dinner, from
# `api/fixtures/e2e/40-cookbook.yaml`), one seeded event that is not a meal
# (« Stage de voile MAG-288 », an all-day series starting today) and the journey's
# own meal (`scripts/meal-week-api.js`: two recipes of 4 servings, for 4 guests, today):
#
# - the general calendar's agenda drawer has the single « Repas » line, which is
#   the meals' filter and not an agenda of the user's;
# - Cuisine opens on Repas, and the week shows the meals and not the event (there is
#   no Planning any more: the meals are the page);
# - Given a meal of two recipes this week, when I open Cuisine, Repas shows and I
#   pass a recipe from 4 to 2 portions: its quantities halve, the other recipe's do
#   not, and the meal still holds 4 guests (a simulation, never a write).
#
# Tomorrow can be in the next week (on a Sunday): the flow first gives the meals time
# to arrive, and only steps forward when the seeded meal still is not on screen.
# Checking at once would step forward on every run, since the meals load after the
# heading is drawn.

- launchApp:
    clearState: true
    permissions:
      all: allow
    arguments:
      e2e_journey: e2e/mobile/flows/13-meals-planning.yaml

- runFlow: ../subflows/sign-in.yaml

- runFlow: ../subflows/open-calendar.yaml

- tapOn:
    id: "calendar_options"
- tapOn: "Agendas"
- extendedWaitUntil:
    visible:
      id: "calendar_meals_filter"
    timeout: 20000
- assertVisible: "Perso"
- back

- runScript:
    file: ../scripts/meal-week-api.js
    env:
      ACTION: create

# From the burger to Cuisine: it opens on Repas.
- runFlow:
    file: ../subflows/open-destination.yaml
    env:
      DEST: cookbook
# The breadcrumb « Cuisine › Repas ▾ » is the only header (MAG-670): « Cuisine » shows once.
- extendedWaitUntil:
    visible:
      id: "breadcrumb_section"
    timeout: 20000
- assertVisible: "Repas"
- assertNotVisible:
    id: "top_bar_title"
- assertNotVisible: "Planning"

# 4 → 2 portions on the first recipe: its quantity halves, the second's does not.
- scrollUntilVisible:
    element: "Tarte MAG-628"
    timeout: 30000
- extendedWaitUntil:
    visible: ".*Farine MAG-628 400 g.*"
    timeout: 20000
- tapOn:
    id: "meal_recipe_portions_minus"
    below: "Soupe MAG-628"
- tapOn:
    id: "meal_recipe_portions_minus"
    below: "Soupe MAG-628"
- extendedWaitUntil:
    visible: ".*Farine MAG-628 200 g.*"
    timeout: 20000
- assertVisible:
    id: "meal_recipe_portions_value"
    text: "2"
    below: "Soupe MAG-628"
# The title of the second card is on screen, its ingredients under the tablet's pane foot or
# the foldable's chat bar: a short fling brings them up (nothing moves when they already show).
- swipe:
    start: 25%, 55%
    end: 25%, 35%
- extendedWaitUntil:
    visible: ".*Farine MAG-628 400 g.*"
    timeout: 10000
- runScript:
    file: ../scripts/meal-week-api.js
    env:
      ACTION: expect-unchanged

# The seeded meal is there, the event that is not a meal is not. The week's header stays on
# screen while the days scroll, so « › » is always at hand.
- scrollUntilVisible:
    element: ".*Pâtes à la tomate.*"
    timeout: 10000
    optional: true
- runFlow:
    when:
      notVisible: ".*Pâtes à la tomate.*"
    commands:
      - tapOn:
          id: "meals_week_next"
- scrollUntilVisible:
    element: ".*Pâtes à la tomate.*"
    timeout: 30000
- assertNotVisible: ".*Stage de voile MAG-288.*"

# Left as found.
- runScript:
    file: ../scripts/meal-week-api.js
    env:
      ACTION: remove
