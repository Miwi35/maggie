appId: com.maggie.app.e2e
name: 13-finance-to-control
tags:
  - finance
---
# « Reconnues à contrôler », a group at a time, from the phone (MAG-460, extends MAG-102).
#
# Étant donné 3 dépenses de ce mois reconnues par la règle « contient COURSES MAG460 »
# Quand j'ouvre Reconnues à contrôler et que je touche « Tout à conserver » sur le groupe
# Alors les 3 lignes sont jugées « À conserver », contrôlées, et le groupe disparaît (lu par le script)
#
# MAG-507: the page opens on the list; a line opens its fiche (Précédent / Suivant, « 1 / 3 »), and back
# returns to the list before the group gesture, which lives on the list.
#
# The data is set by `scripts/to-control-api.js` on the seed's second user, who holds no other
# finance data: the list is this one group. The rule is written before the lines, so it recognises
# them as they arrive. The script reads the server back after the gesture: a check is kept by the API,
# so the group must not come back in `GET /api/finance/review/recognised`, whatever the phone shows.
#
# What is not here: the single-line gestures on a fiche — « Superflue », « Corriger », « Voir la règle »,
# « Voir la fiche » (`RecognisedToControlViewModelTest`, `RecognisedToControlScreenTest`) —
# and the admin's side of the same API (`finance-to-sort.spec.ts`).

- launchApp:
    clearState: true
    permissions:
      all: allow
    arguments:
      e2e_journey: e2e/mobile/flows/13-finance-to-control.yaml
      e2e_email: e2e-other@maggie.local

- runFlow: ../subflows/sign-in.yaml

- runScript:
    file: ../scripts/to-control-api.js
    env:
      ACTION: create

- openLink: "maggie-e2e://finance/to-control"

- extendedWaitUntil:
    visible:
      id: "to_control_group"
    timeout: 30000
- assertVisible: "3 reconnues à contrôler"
- assertVisible: "COURSES MAG460 · 3"
- assertVisible: "COURSES MAG460 111"
- assertVisible: ".*Courses MAG-460.*"

# The list first: a line opens its fiche, where Précédent / Suivant walk the three lines.
- tapOn:
    id: "to_control_row"
    index: 0
- extendedWaitUntil:
    visible:
      id: "to_control_fiche"
    timeout: 10000
- assertVisible:
    id: "review_position"
    text: "1 / 3"
- assertVisible:
    id: "to_control_correct"
- tapOn:
    id: "review_next"
- extendedWaitUntil:
    visible:
      id: "review_position"
      text: "2 / 3"
    timeout: 10000
- tapOn:
    id: "review_previous"
- extendedWaitUntil:
    visible:
      id: "review_position"
      text: "1 / 3"
    timeout: 10000

# Back to the list, then the whole group in one tap.
- tapOn:
    id: "review_back_to_list"
- extendedWaitUntil:
    visible:
      id: "to_control_group"
    timeout: 10000
- tapOn:
    id: "to_control_keep_all"

- extendedWaitUntil:
    visible:
      id: "to_control_empty"
    timeout: 30000
- assertVisible: "Rien à contrôler"
- runScript:
    file: ../scripts/to-control-api.js
    env:
      ACTION: check

# Left as found.
- runScript:
    file: ../scripts/to-control-api.js
    env:
      ACTION: remove
