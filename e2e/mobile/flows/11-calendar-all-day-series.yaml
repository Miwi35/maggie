appId: com.maggie.app.e2e
name: 11-calendar-all-day-series
tags:
  - calendar
---
# An all-day recurring event whose rule ends on a date opens in the week view,
# with no error (MAG-288). The regression it holds: `RruleUtils.expandRrule` handed
# lib-recur an absolute start and a `UNTIL=YYYYMMDD`, which the library refuses
# (« using floating start times with absolute until values »), and the exception
# left `FullCalendarViewModel` and took the app down as soon as the calendar opened.
#
# The witness is « Stage de voile MAG-288 » (`api/fixtures/e2e/20-calendar.yaml`),
# an all-day weekly series that starts today, so one of its occurrences is in the
# week `open-calendar` leaves on screen. The bar is matched by its title, not by
# its dates: which days it covers is the JVM's business (`RruleUtilsExpandTest`).
#
# Then a one-day event shows on its day and not the next (MAG-382). « Journée du
# 1er MAG-382 » is all-day, startDate = endDate = the 1st of the anchor's month.
# Stored as midnight UTC, Paris's offset pushed its end to 01:00 on the 2nd and the
# app drew it on both days; it is now a pair of dates, read with no zone. The flow
# finds it in the month, opens the 1st by its number, then steps to the 2nd and
# waits for that day to be drawn before asking that the event is not there. Which
# days a longer event covers is the JVM's business (`AllDayEventDaysTest`).

- launchApp:
    clearState: true
    permissions:
      all: allow

- runFlow: ../subflows/sign-in.yaml

- runFlow: ../subflows/open-calendar.yaml

- extendedWaitUntil:
    visible:
      id: "calendar_span_.*"
      text: ".*Stage de voile MAG-288.*"
    timeout: 30000

- assertNotVisible: ".*using floating start times.*"

- evalScript: ${output.first = TODAY.substring(0, 8) + '01'}
- evalScript: ${output.second = TODAY.substring(0, 8) + '02'}

- tapOn:
    id: "calendar_view_month"

- extendedWaitUntil:
    visible:
      id: "calendar_month_slot_${output.first}_.*"
      text: ".*Journée du 1er MAG-382.*"
    timeout: 20000

- tapOn:
    id: "calendar_month_date_${output.first}"

- extendedWaitUntil:
    visible:
      id: "calendar_all_day_${output.first}"
      text: ".*Journée du 1er MAG-382.*"
    timeout: 20000

- tapOn:
    id: "calendar_next"

- extendedWaitUntil:
    visible:
      id: "calendar_day_view_${output.second}"
    timeout: 20000

- assertNotVisible:
    id: "calendar_all_day_${output.second}"
    text: ".*Journée du 1er MAG-382.*"
