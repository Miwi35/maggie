appId: com.maggie.app.e2e
name: 13-finance-budget-nesting
tags:
  - finance
---
# Envelopes in nesting dolls on the phone (MAG-412, extends MAG-102), and a spend
# attributed to a one-off envelope (MAG-414).
#
# Given Loisirs at 300 € and Obsydian (Loisirs › Bars › Obsydian) at 100 €, no envelope
# on Bars, when a 40 € spend is filed in Obsydian, then the budget screen reads
# Obsydian 40 / 100 € nested under Loisirs 40 / 300 €, and Bars is not drawn as an
# envelope. A 25 € spend on Bars then counts in Loisirs alone: 65 / 300 €, Obsydian
# unchanged. Then, given a one-off « Hellfest 2026 » of 400 € and an 89 € ticket filed in
# Loisirs (154 / 300 €), when the ticket is attributed to Hellfest from its sheet, then
# « Hors budget mensuel » shows Hellfest 89 / 400 € and Loisirs is back to 65 / 300 €.
# Last, given Cinéma at 20 € with a season at 45 € from next month on, when this month is
# rolled into the next, then next month's Cinéma reads 45 € and names its season (MAG-415).
# The same journeys over the admin are in `finance-budget.spec.ts`.
#
# On the phone the tree is folded at first and read-only (MAG-418): Loisirs shows its
# cumulated 40 / 300 € and unfolds into Bars › Obsydian; touching Loisirs lists the month's
# lines of the whole subtree, the Obsydian spend among them.
#
# What is not here: the red and orange states with their icon and word, and the totals
# counting the mother once — `BudgetViewModelTest`, `EnvelopeTest` and the API's
# `BudgetStatusControllerTest` check them with figures.
#
# It signs in as the seed's second user, who holds no finance data of its own, and the
# script removes what it made. Amounts are matched with either decimal separator: the
# device's locale is not the journey's concern.

- runFlow: ../subflows/new-user.yaml

- launchApp:
    clearState: true
    permissions:
      all: allow
    arguments:
      e2e_journey: e2e/mobile/flows/13-finance-budget-nesting.yaml
      e2e_email: ${output.journeyEmail}

- runFlow: ../subflows/sign-in.yaml

- runScript:
    file: ../scripts/finance-budget-api.js
    env:
      EMAIL: ${output.journeyEmail}
      ACTION: create
      TODAY: ${TODAY}

- openLink: "maggie-e2e://finance/budgets"

# Folded at first: Loisirs carries the cumulated 40 / 300 €, Obsydian is not drawn yet.
- extendedWaitUntil:
    visible: "Loisirs"
    timeout: 30000
- assertVisible: "40[.,]00 EUR / 300[.,]00 EUR"
- assertNotVisible: "Bars › Obsydian"
# The phone only reads the tree (no « Nouvelle enveloppe », no bin): from 600 dp the same screen has both,
# so nothing is asserted here on a format the flow cannot tell — `BudgetTreeScreenTest` owns the phone's side.

# The phone folds the tree and opens a detail screen. From 840 dp (the tablet, with its chat panel) the
# screen is the configuration pane: a flat tree, always open, its detail beside it, no « Déplier » and no
# « Bars › Obsydian » path. `budget_tree` exists only there.
- evalScript: ${0}
- runFlow:
    when:
      visible:
        id: "budget_tree"
    commands:
      # Obsydian 40 / 100 € is a row of its own under Loisirs 40 / 300 €.
      - extendedWaitUntil:
          visible: "Obsydian"
          timeout: 10000
      - assertVisible: "40[.,]00 EUR / 100[.,]00 EUR"
- evalScript: ${0}
- runFlow:
    when:
      notVisible:
        id: "budget_tree"
    commands:
      # Unfolded: Obsydian 40 / 100 € nested under Loisirs 40 / 300 €.
      - tapOn: "Déplier Loisirs"
      - extendedWaitUntil:
          visible: "Bars › Obsydian"
          timeout: 10000
      - assertVisible: "40[.,]00 EUR / 100[.,]00 EUR"
      # Bars has no envelope: it only appears inside Obsydian's path.
      - assertNotVisible: "Bars"
      # Touching Loisirs lists the month's lines of the subtree, Obsydian's spend included.
      - tapOn: "Loisirs"
      - extendedWaitUntil:
          visible:
            id: "budget_detail"
          timeout: 20000
      - extendedWaitUntil:
          visible: "OBSYDIAN MAG-412"
          timeout: 20000
      - back

# A 25 € spend on Bars, while the screen is open: the period is reloaded.
- runScript:
    file: ../scripts/finance-budget-api.js
    env:
      EMAIL: ${output.journeyEmail}
      ACTION: spend-bars
      TODAY: ${TODAY}
# One reload at a time: the previous month is empty, then the shown one is read again.
- tapOn: "Mois précédent"
# The phone and the foldable say the month is empty; the tablet's pane has no empty state, its tree just
# loses Obsydian's figures.
- evalScript: ${0}
- runFlow:
    when:
      notVisible:
        id: "budget_tree"
    commands:
      - extendedWaitUntil:
          visible: "Aucune enveloppe pour cette période.*"
          timeout: 30000
- evalScript: ${0}
- runFlow:
    when:
      visible:
        id: "budget_tree"
    commands:
      - extendedWaitUntil:
          notVisible: "40[.,]00 EUR / 100[.,]00 EUR"
          timeout: 30000
- tapOn: "Mois suivant"

- extendedWaitUntil:
    visible: "65[.,]00 EUR / 300[.,]00 EUR"
    timeout: 30000
- assertVisible: "40[.,]00 EUR / 100[.,]00 EUR"

# A one-off « Hellfest 2026 » of 400 €, and an 89 € ticket filed in Loisirs: 154 / 300 €.
- runScript:
    file: ../scripts/finance-budget-api.js
    env:
      EMAIL: ${output.journeyEmail}
      ACTION: hellfest
      TODAY: ${TODAY}

# The ticket is attributed to Hellfest from its sheet, through the full-screen choice.
- openLink: "maggie-e2e://finance/accounts"
- extendedWaitUntil:
    visible: "EUR · Compte MAG-412"
    timeout: 20000
- tapOn: "EUR · Compte MAG-412"
# The accounts are a pager now (MAG-422): the dot moves to the account, whose page opens on its
# days; the full list of lines (and its sheet) is one button away. With the chat panel there is no
# pager, the card opens the account in a pane beside the list.
- evalScript: ${0}
- runFlow:
    when:
      notVisible:
        id: "chat_panel"
    commands:
      - extendedWaitUntil:
          visible: "Compte MAG-412"
          timeout: 20000
- extendedWaitUntil:
    visible:
      id: "account_all_transactions"
    timeout: 20000
- tapOn:
    id: "account_all_transactions"
- extendedWaitUntil:
    visible: "BILLET HELLFEST MAG-414"
    timeout: 30000
- tapOn: "BILLET HELLFEST MAG-414"
# The field sits far down the sheet: on the tablet and the foldable the detail pane is short and
# the field is below the fold, so wait for the sheet itself, then scroll (never wait for the field).
- extendedWaitUntil:
    visible:
      id: "sheet_section_classement"
    timeout: 20000
# Maggie's bar takes the bottom of the page (MAG-426): bring the field to the middle first.
- scrollUntilVisible:
    element:
      id: "transaction_one_off_envelope"
    centerElement: true
- tapOn:
    id: "transaction_one_off_envelope"
- extendedWaitUntil:
    visible: "Hellfest 2026"
    timeout: 20000
- tapOn: "Hellfest 2026"
# The sheet answers with the event the server now holds it under (the pane may be back at the top).
- scrollUntilVisible:
    element: "Enveloppe ponctuelle, Hellfest 2026"
- extendedWaitUntil:
    visible: "Enveloppe ponctuelle, Hellfest 2026"
    timeout: 30000

# Hellfest 89 / 400 € apart from the month, Loisirs no longer counting the ticket.
- openLink: "maggie-e2e://finance/budgets"
- extendedWaitUntil:
    visible: "65[.,]00 EUR / 300[.,]00 EUR"
    timeout: 30000
- tapOn:
    id: "subview_outside"
- scrollUntilVisible:
    element:
      id: "budget_outside_monthly"
- scrollUntilVisible:
    element: "89[.,]00 EUR / 400[.,]00 EUR"
- extendedWaitUntil:
    visible: "Hellfest 2026"
    timeout: 10000
- tapOn:
    id: "subview_month"

# Cinéma 20 € this month, 45 € in a season from next month on: rolled over, next month
# reads the season's amount and names it.
- runScript:
    file: ../scripts/finance-budget-api.js
    env:
      EMAIL: ${output.journeyEmail}
      ACTION: cinema
      TODAY: ${TODAY}
- tapOn: "Mois suivant"
- tapOn: "Reconduire le mois précédent"
- extendedWaitUntil:
    visible: "Cinéma"
    timeout: 30000
# The season is named on the phone's and the foldable's cards; the tablet's tree rows carry the amount only.
- evalScript: ${0}
- runFlow:
    when:
      notVisible:
        id: "budget_tree"
    commands:
      - scrollUntilVisible:
          element: ".*45[.,]00 EUR · saison.*"
      - extendedWaitUntil:
          visible: ".*45[.,]00 EUR · saison.*"
          timeout: 30000
- evalScript: ${0}
- runFlow:
    when:
      visible:
        id: "budget_tree"
    commands:
      - extendedWaitUntil:
          visible: ".*45[.,]00 EUR.*"
          timeout: 30000

# Left as found.
- runScript:
    file: ../scripts/finance-budget-api.js
    env:
      EMAIL: ${output.journeyEmail}
      ACTION: remove
      TODAY: ${TODAY}
