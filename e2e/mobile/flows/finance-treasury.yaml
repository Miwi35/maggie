appId: com.maggie.app.e2e
name: finance-treasury
tags:
  - finance
---
# The treasury until the salary comes, from the phone (MAG-280, extends MAG-102).
#
# Étant donné un salaire attendu aujourd'hui et pas encore reçu ce mois-ci ni le mois dernier,
#   un Courant de 200,00 € et un loyer de 900,00 € prévu dans trois jours,
#   un Livret de 5 000,00 €
# Quand j'ouvre les finances
# Alors le bandeau « Découvert prévu » est là
# Quand je l'ouvre
# Alors l'écran dit « Salaire en retard de » N jours, le découvert prévu
#   et l'avance conseillée depuis le Livret
#
# The data is set by `scripts/treasury-api.js` on the treasury account (`e2e_email`), whose
# salary day no other journey reads, relative to TODAY: the day expected is today's, so the
# delay is last month's whole length whatever the day the suite runs. The amounts are not
# asserted — they are drawn with the phone's locale; `TreasuryScreenTest` reads them.
#
# Then, on the same account, the savings advances screen opens from the Trésorerie menu (MAG-278, MAG-426): the total « Reste à rendre » and the salary day field are drawn
# whatever the account holds. What the screen does with advances, proposals and a late salary
# is `SavingsAdvancesScreenTest` and `SavingsAdvancesViewModelTest`; the numbers are the API's.
#
# What is not here: tapping « Je l'ai fait » (it needs the two legs paired by the server),
# the overdraft limit field and « Préparer l'avance » opening the new transaction pre-filled
# (`TreasuryViewModelTest`, `TreasuryScreenTest`, `TransactionPrefillScreenTest`), and the
# admin's side of the same API (`finance-treasury.spec.ts`).

- launchApp:
    clearState: true
    permissions:
      all: allow
    arguments:
      e2e_journey: e2e/mobile/flows/finance-treasury.yaml
      e2e_email: e2e-treasury@maggie.local

- runFlow: ../subflows/sign-in.yaml

- runScript:
    file: ../scripts/treasury-api.js
    env:
      ACTION: create

- openLink: "maggie-e2e://finance"

- extendedWaitUntil:
    visible:
      id: "treasury_banner"
    timeout: 30000
- extendedWaitUntil:
    visible: ".*Découvert prévu le.*"
    timeout: 10000

- tapOn:
    id: "treasury_banner"

- extendedWaitUntil:
    visible: "Trésorerie"
    timeout: 20000
- extendedWaitUntil:
    visible: ".*Salaire en retard de.*"
    timeout: 20000

- scrollUntilVisible:
    element: ".*Découvert prévu le.*"
    timeout: 30000

# MAG-506: the cumulated inflows and outflows are drawn under the balance, with a horizon choice.
- scrollUntilVisible:
    element:
      id: "treasury_flows_chart"
    timeout: 30000
- extendedWaitUntil:
    visible: "1 an"
    timeout: 10000

# The advance comes from the Livret, the only savings account of the table.
- scrollUntilVisible:
    element: ".*depuis Livret MAG-280.*"
    timeout: 30000
- extendedWaitUntil:
    visible: ".*reste à rendre.*"
    timeout: 10000
- scrollUntilVisible:
    element:
      id: "treasury_prepare_advance"
    timeout: 30000

# The rings and the curve first, on the dashboard.
- openLink: "maggie-e2e://finance"

# MAG-417: the week and month rings, then the rhythm curve. Data-agnostic: the seed has no
# monthly envelope, no rent on the 5th and no variable spending, so the amounts are not asserted.
# The rings open the screen: the balance card sits below them, off screen until scrolled to.
- extendedWaitUntil:
    visible:
      id: "finance_score_ring_week"
    timeout: 30000
- assertVisible:
    id: "finance_score_ring_month"
# The status is a word, never a colour alone.
- assertVisible: ".*(Dans le vert|Dans les clous|Attention|Dépassement|Aucune enveloppe).*"
# A tap on a ring lists the reasons, a second one hides them.
- tapOn:
    id: "finance_score_ring_month"
- extendedWaitUntil:
    visible:
      id: "finance_score_reasons"
    timeout: 10000
- tapOn:
    id: "finance_score_ring_month"
- scrollUntilVisible:
    element:
      id: "finance_rhythm_curve"
    timeout: 30000
- scrollUntilVisible:
    element:
      id: "finance_tile_accounts"
    timeout: 30000
# The savings advances screen: the Trésorerie menu's tab, then its block (MAG-426).
- tapOn:
    id: "finance_menu_treasury"
- extendedWaitUntil:
    visible:
      id: "finance_block_savings_advances"
    timeout: 20000
- tapOn:
    id: "finance_block_savings_advances"

# The total only exists once the answer came: a failed load draws « Réessayer » instead.
- extendedWaitUntil:
    visible:
      id: "savings_advances_total"
    timeout: 20000
- assertVisible: "Reste à rendre"
- assertVisible:
    id: "savings_advances_salary_day"

# Left as found.
- runScript:
    file: ../scripts/treasury-api.js
    env:
      ACTION: remove
