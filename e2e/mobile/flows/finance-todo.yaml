appId: com.maggie.app.e2e
name: finance-todo
tags:
  - finance
onFlowComplete:
  - runScript:
      file: ../scripts/finance-todo-api.js
      env:
        ACTION: remove
---
# What is to do, in the tiles of the finance home, from the phone (MAG-421, extends MAG-102).
#
# Étant donné 3 lignes à trier et 1 rejet
# Quand j'ouvre les finances
# Alors la tuile Comptes affiche « 3 à trier » et « 1 rejet »
# Et aucune pastille « On te doit / Tu dois » : ce compte n'a ni créance ni dette (MAG-455)
# Et une revue du mois à faire (une dépense non évaluée le mois dernier, MAG-631)
# Alors la carte « Revue d'<mois> · ce soir · 20 h » est en tête, avec « Lancer », et rien ne dit « Revue ce soir »
# Quand je touche « Lancer »
# Alors l'activité Comptes de la revue s'ouvre
# Quand je touche « 3 à trier »
# Alors la Revue s'ouvre filtrée sur À qualifier, sur la ligne la plus ancienne
#
# The data is set by `scripts/finance-todo-api.js` on the seed's second user, who holds no other
# finance data: the pile is these three lines (the rejection pair is not one) and the rejection is
# the one, plus a categorised debit of last month that makes the review due. It runs as that user,
# not as the owner of `finance-overview`, whose pile other flows leave lines in. `onFlowComplete` removes it even when a step failed: left behind, the three lines
# would head the pile of `19-finance-contacts`, next in the shard.
#
# What is not here: « rien à faire, aucune pastille » on a home with no data at all
# (`FinanceDashboardTilesScreenTest`, and the admin's journey), the Budget tile's advance pill (its count is
# the API's, `GetFinanceDashboardTodoTest`).

- launchApp:
    clearState: true
    permissions:
      all: allow
    arguments:
      e2e_journey: e2e/mobile/flows/finance-todo.yaml
      e2e_email: e2e-other@maggie.local

- runFlow: ../subflows/sign-in.yaml

- runScript:
    file: ../scripts/finance-todo-api.js
    env:
      ACTION: create

- openLink: "maggie-e2e://finance"

# The rejection raises a notification, and the open app shows it over the screen (MAG-314):
# « Plus tard » puts it away. `14-interruption` plays them.
- extendedWaitUntil:
    visible:
      id: "interruption"
    timeout: 20000
    optional: true
- tapOn:
    id: "interruption_later"
    optional: true
- extendedWaitUntil:
    notVisible:
      id: "interruption"
    timeout: 10000
    optional: true

- extendedWaitUntil:
    visible:
      id: "finance_score_ring_week"
    timeout: 30000

# The review is due: its card heads the home (MAG-631), « Lancer » opens the Comptes activity.
# Not the mock-up's: no month navigator, no big « Revue ce soir » button.
- extendedWaitUntil:
    visible:
      id: "finance_review_card"
    timeout: 30000
- assertVisible: "Revue d.*"
- assertVisible: "ce soir · 20 h"
- assertNotVisible: "Revue ce soir"
- assertNotVisible: "Mois précédent"
- assertNotVisible: "Mois suivant"
- tapOn:
    id: "finance_review_shortcut"
- extendedWaitUntil:
    visible:
      id: "review_activity"
    timeout: 30000
- tapOn:
    id: "review_activity_quit"
- extendedWaitUntil:
    visible:
      id: "finance_score_ring_week"
    timeout: 30000

- scrollUntilVisible:
    element:
      id: "finance_pill_to_sort"
    centerElement: true
    timeout: 30000
- extendedWaitUntil:
    visible: "3 à trier"
    timeout: 10000
- scrollUntilVisible:
    element:
      id: "finance_pill_rejections"
    timeout: 30000
- extendedWaitUntil:
    visible: "1 rejet"
    timeout: 10000
# No créance nor dette: the « On te doit / Tu dois » pill is not drawn. Its presence, and where it
# leads, is `22-finance-peer-debts`.
- assertNotVisible:
    id: "finance_pill_owed"

# The old « À qualifier · n · montant » pill left the home (it stays on the budget screen).
- assertNotVisible:
    id: "to_qualify_pill"

# « 1 rejet » opens the account on its Incidents tab.
- scrollUntilVisible:
    element:
      id: "finance_pill_rejections"
    centerElement: true
    timeout: 30000
- tapOn:
    id: "finance_pill_rejections"
- extendedWaitUntil:
    visible:
      id: "incident_row"
    timeout: 30000
- back
# The list keeps its scroll position: the rings are above the screen, the pill just tapped is where it stopped.
- extendedWaitUntil:
    visible:
      id: "finance_pill_rejections"
    timeout: 30000

# « 3 à trier » opens the Revue on its « À qualifier » pill, every date.
- scrollUntilVisible:
    element:
      id: "finance_pill_to_sort"
    centerElement: true
    timeout: 30000
- tapOn:
    id: "finance_pill_to_sort"
- extendedWaitUntil:
    visible:
      id: "review_list_row"
    timeout: 30000
- assertVisible:
    id: "subview_to_qualify"
- assertVisible: "À qualifier · 3"
- assertVisible: "A TRIER MAG-421 A"
- tapOn: "A TRIER MAG-421 A"
- extendedWaitUntil:
    visible:
      id: "review_fiche"
    timeout: 30000
- assertVisible: "A TRIER MAG-421 A"
