appId: com.maggie.app.e2e
name: 23-finance-projects
tags:
  - finance
---
# Les projets de Planification, on every format (MAG-519, extends MAG-102; MAG-611 for the wide layouts).
#
# Étant donné l'app sur Finance › Planification
# Quand je touche la carte « Projets »
# Alors la liste des projets s'ouvre (MAG-530)
# Alors le Gantt du planning (MAG-527) affiche les deux lignes, « Déménagement » et « Canapé »
# Étant donné « Déménagement » (position 0) et « Canapé » (position 1), tels que le seed les écrit
# Quand je fais glisser « Canapé » en haut de la liste
# Alors l'ordre change, et il reste après réouverture de l'écran
# Étant donné « Canapé » sans date
# Quand je lui donne une date limite
# Alors la liste l'affiche
#
# The drag goes through the row's handle, which drags at once: Maestro's swipe moves from its first
# millisecond, so it cannot hold still for the long press the row itself waits for (same gesture
# library, same reorder; the long press is the handle's twin on the whole row). The reorder is a
# custom controller no contract records, so `scripts/projects-api.js` reads the order the API stored.
# The date picker opens on today: the date itself is not asserted, only « Date limite ».
#
# The Gantt sits above the list on a phone (the mockup's frieze first). Its line labels are plain
# texts, apart from the list rows' « 1. Déménagement … »: two lines, one per project, in the same order.
# Its bars, the 36 months and the reread after a reorder are the unit tests' and the web journey's.
#
# Les sources et les options (MAG-525), sur le téléphone :
# Étant donné « Voiture » (10 000 €) financée par 1 000 € d'économies et 6 000 € d'emprunt (24 mois, 4 %),
# posés par l'API
# Quand j'ouvre la fiche « Voiture »
# Alors la ligne et la fiche lisent « économies + emprunt + salaire », et les trois coûts totaux sont là
#
# The row's tap opens the sheet, whose pencil opens the form. The sheet is read-only on a phone: the
# editing of the sources is the tablet's (`ProjectSheetScreenTest`), and the figures themselves are the
# API's (`api/contract`). The amounts are matched loosely, as the app formats them in the device's
# locale (« 10000,00 EUR », « 10000.00 EUR »), and the delays are not asserted.
#
# Under the Gantt, the funding chart month by month (MAG-528): scrolling the list brings it into
# view, with its legend of the three sources. Which months are flagged follows the seeded
# capacity, so the flags, the bars and the tap detail are the unit tests' and the web journey's.
#
# What is not here: the badges, the dependency line and its warning, the empty state, a refused
# reorder put back, the form's refusals (`ProjectListScreenTest`, `ProjectViewModelTest`,
# `ProjectDraftTest`), and the admin's side of the same API.
#
# The seed is put back before and after: a run that failed half-way is taken as it was left.

- runScript:
    file: ../scripts/projects-api.js
    env:
      ACTION: reset

- launchApp:
    clearState: true
    permissions:
      all: allow
    arguments:
      e2e_journey: e2e/mobile/flows/23-finance-projects.yaml
      e2e_email: e2e@maggie.local

- runFlow: ../subflows/sign-in.yaml

# Planification › Projets: the list is the first sub-view (MAG-530, MAG-537).
- openLink: "maggie-e2e://finance"
- extendedWaitUntil:
    visible:
      id: "breadcrumb_section"
    timeout: 30000
# Planification › Projets: the section's menu, then its first sub-view (MAG-537).
- tapOn:
    id: "breadcrumb_section"
- tapOn:
    id: "breadcrumb_menu_planning"
- extendedWaitUntil:
    visible:
      id: "subview_projects"
    timeout: 20000
- assertVisible:
    id: "subview_loans"
- assertVisible:
    id: "subview_independence"
- extendedWaitUntil:
    visible:
      id: "projects"
    timeout: 30000
# The rows: scrolled to from the top, which reaches them on every format. The phone has the Gantt above the
# list, a tablet or a foldable (from 600 dp) the scenarios above it and the Gantt under it.
# A row is one node for accessibility: its texts are read together, hence the `.*`.
- scrollUntilVisible:
    element: ".*1. Déménagement.*"
    timeout: 20000
- extendedWaitUntil:
    visible:
      text: ".*2. Canapé.*"
      below: ".*1. Déménagement.*"
    timeout: 10000

# ---------------------------------------------------------------------------
# « Canapé » dragged to the top: the order changes on screen, then on the server.
# ---------------------------------------------------------------------------
- scrollUntilVisible:
    element: "Déplacer Canapé"
    timeout: 20000
- swipe:
    from:
      text: "Déplacer Canapé"
    direction: UP
    duration: 2000
- extendedWaitUntil:
    visible:
      text: ".*2. Déménagement.*"
      below: ".*1. Canapé.*"
    timeout: 10000
- runScript:
    file: ../scripts/projects-api.js
    env:
      ACTION: expect-order
      ORDER: Canapé|Déménagement

# Opened again: the list is read from the server, not from the screen that moved it.
- openLink: "maggie-e2e://finance"
- extendedWaitUntil:
    visible:
      id: "finance_score_ring_week"
    timeout: 30000
- openLink: "maggie-e2e://finance/projects"
- scrollUntilVisible:
    element: ".*1. Canapé.*"
    timeout: 30000
- extendedWaitUntil:
    visible:
      text: ".*2. Déménagement.*"
      below: ".*1. Canapé.*"
    timeout: 30000

# The Gantt of the planning: one line per project, in the new order. From the top again, so that the same
# scroll down reaches it above the list (phone) or under it (tablet, foldable).
- scrollUntilVisible:
    element:
      id: "project_gantt"
    centerElement: true
    timeout: 30000
- extendedWaitUntil:
    visible: "Déménagement"
    timeout: 10000
- extendedWaitUntil:
    visible: "Canapé"
    timeout: 10000

# The funding chart under it, read-only on a phone: scroll down to it, the legend names the sources.
- scrollUntilVisible:
    element:
      id: "funding_chart"
    centerElement: true
    timeout: 20000
- extendedWaitUntil:
    visible:
      id: "funding_legend"
    timeout: 10000
- extendedWaitUntil:
    visible: ".*Salaire.*"
    timeout: 10000
- extendedWaitUntil:
    visible: ".*Économies.*"
    timeout: 10000
- extendedWaitUntil:
    visible: ".*Capital libéré.*"
    timeout: 10000

# Back on top for the row: it is above the chart on a tablet and under it on a phone.
- openLink: "maggie-e2e://finance"
- extendedWaitUntil:
    visible:
      id: "finance_score_ring_week"
    timeout: 30000
- openLink: "maggie-e2e://finance/projects"
- scrollUntilVisible:
    element: ".*1. Canapé.*"
    timeout: 30000

# ---------------------------------------------------------------------------
# « Canapé » gets a date limite in the full-screen form, and the list shows it.
# ---------------------------------------------------------------------------
- tapOn: ".*1. Canapé.*"
- extendedWaitUntil:
    visible:
      id: "project_sheet"
    timeout: 20000
- tapOn:
    id: "project_sheet_edit"
- extendedWaitUntil:
    visible:
      id: "project_form"
    timeout: 10000
- tapOn:
    id: "project_date_mode_deadline"
- extendedWaitUntil:
    visible:
      id: "project_target_on"
    timeout: 10000
- tapOn:
    id: "project_target_on"
- tapOn:
    id: "picker_confirm"
# From 600 dp (MAG-553) a new project is previewed first: « Ajouter » of the dialog is the creation.
- runFlow:
    when:
      visible: "Voir l'aperçu"
    commands:
      - tapOn:
          id: "project_save"
      - extendedWaitUntil:
          visible:
            id: "project_preview_confirm"
          timeout: 20000
      - tapOn:
          id: "project_preview_confirm"
- runFlow:
    when:
      notVisible: "Voir l'aperçu"
    commands:
      - tapOn:
          id: "project_save"
- extendedWaitUntil:
    visible:
      id: "projects"
    timeout: 20000
- scrollUntilVisible:
    element: ".*Date limite · .*"
    timeout: 20000
- runScript:
    file: ../scripts/projects-api.js
    env:
      ACTION: expect-deadline

# Left as the seed wrote it.
- runScript:
    file: ../scripts/projects-api.js
    env:
      ACTION: reset

# ---------------------------------------------------------------------------
# « Voiture » funded: the row names its sources, the sheet gives the three options.
# ---------------------------------------------------------------------------
- runScript:
    file: ../scripts/projects-api.js
    env:
      ACTION: fund-car

- launchApp:
    clearState: true
    permissions:
      all: allow
    arguments:
      e2e_journey: e2e/mobile/flows/23-finance-projects.yaml
      e2e_email: e2e-stock@maggie.local

- runFlow: ../subflows/sign-in.yaml

- openLink: "maggie-e2e://finance/projects"
- scrollUntilVisible:
    element: ".*1. Voiture.*"
    timeout: 30000
- extendedWaitUntil:
    visible: ".*économies \\+ emprunt \\+ salaire.*"
    timeout: 10000
- tapOn: ".*1. Voiture.*"
- extendedWaitUntil:
    visible:
      id: "project_sheet"
    timeout: 20000
- extendedWaitUntil:
    visible: "économies \\+ emprunt \\+ salaire"
    timeout: 5000
- extendedWaitUntil:
    visible:
      id: "project_options"
    timeout: 20000
# The cash and loan total costs, whatever the decimal sign of the locale: 10 000 / 10 421,86.
# The partial option depends on the seed's saving capacity: the unit tests own it.
- extendedWaitUntil:
    visible: "10000[,.]00 EUR"
    timeout: 20000
- assertVisible: "10421[,.]86 EUR"

# Left as the seed wrote it: no source.
- runScript:
    file: ../scripts/projects-api.js
    env:
      ACTION: reset-car
