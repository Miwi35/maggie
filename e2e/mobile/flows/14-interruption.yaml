appId: com.maggie.app.e2e
name: 14-interruption
tags:
  - interruption
---
# Maggie interrupts the open app instead of notifying (MAG-314).
#
# Maggie creates a notification while the app is in front: the owner sees her toaster over
# the Accueil — veil, bubble « MAGGIE · maintenant », the message, « C'est noté », the
# link and « Plus tard » — and no system notification. Queue order, the 30 seconds, the dedupe
# between FCM and Mercure, reduced animations and what each button does are
# `InterruptionHostScreenTest`, `InterruptionViewModelTest` and `InterruptionCenterTest`
# (JVM); this flow proves the live chain: agent → MCP → Mercure → the open app → the window.
#
# The notification is raised over HTTP (`scripts/interruption-api.js`) once the Accueil is
# showing, so it can only arrive from the live feed. Tapping « Plus tard » closes the toaster;
# the second notification is then answered with its link, which opens what it announces.
#
# Needs `E2E_BASE_URL` and `E2E_LOGIN_TOKEN`, which `run.sh` passes with `-e`.

- launchApp:
    clearState: true
    permissions:
      all: allow
    arguments:
      e2e_journey: e2e/mobile/flows/14-interruption.yaml

- runFlow: ../subflows/sign-in.yaml

- runScript:
    file: ../scripts/interruption-api.js

- extendedWaitUntil:
    visible:
      id: "interruption"
    timeout: 40000
- assertVisible: "MAGGIE · maintenant"
- assertVisible: "Un point sur tes comptes ?"
- assertVisible: "C'est noté"
- assertVisible: "Ouvrir les finances"

# « Plus tard » puts it away.
- tapOn:
    id: "interruption_later"
- extendedWaitUntil:
    notVisible:
      id: "interruption"
    timeout: 20000
- assertVisible:
    id: "home_screen"

# A second one, answered with its link: it opens what it announces.
- runScript:
    file: ../scripts/interruption-api.js
- extendedWaitUntil:
    visible:
      id: "interruption_second"
    timeout: 40000
- tapOn:
    id: "interruption_second"
- extendedWaitUntil:
    notVisible:
      id: "interruption"
    timeout: 20000
- extendedWaitUntil:
    visible: "Comptes"
    timeout: 20000
- assertNotVisible:
    id: "home_screen"

# The morning task alert (MAG-410): the cron files a `task_due` notification titled « Dans 3 j : … »;
# the open app says it with « Fait » (which completes the task) and « Plus tard »; opening the task
# from the notification, and the cron run itself, are the JVM tests' and the smoke journey's (the
# seeded task's id is not known to a scripted scenario).
- runScript:
    file: ../scripts/interruption-api.js
    env:
      MESSAGE: "MAG-410 interruption : une tâche arrive à échéance"
- extendedWaitUntil:
    visible:
      id: "interruption"
    timeout: 40000
- assertVisible: "Dans 3 j : Appeler le garage"
- assertVisible: "Fait"
- tapOn:
    id: "interruption_later"
- extendedWaitUntil:
    notVisible:
      id: "interruption"
    timeout: 20000

# The envelope alert (MAG-49, extends MAG-102): a bank sync — Enable Banking simulated by
# WireMock — brings a 40 € cinema ticket to a « Loisirs » at 70 % of its 300 €. Maggie
# interrupts with where it stands, « C'est noté » and « Voir les enveloppes », which opens
# the budgets; a second sync of the same month brings nothing new and says nothing. Its own
# seeded account: the alert goes out once per period.
- launchApp:
    clearState: true
    permissions:
      all: allow
    arguments:
      e2e_journey: e2e/mobile/flows/14-interruption.yaml
      e2e_email: e2e-envelope-alert-mobile@maggie.local

- runFlow: ../subflows/sign-in.yaml

- runScript:
    file: ../scripts/envelope-alert-sync.js
    env:
      IMPORTED: "1"

- extendedWaitUntil:
    visible:
      id: "interruption"
    timeout: 40000
- assertVisible: "Loisirs : 83 % du budget.*"
- assertVisible: "C'est noté"
- assertVisible: "Voir les enveloppes"

- tapOn:
    id: "interruption_second"
- extendedWaitUntil:
    notVisible:
      id: "interruption"
    timeout: 20000
- extendedWaitUntil:
    visible: "Budgets"
    timeout: 20000

# The same month, nothing new crossed: nothing to say.
- runScript:
    file: ../scripts/envelope-alert-sync.js
    env:
      IMPORTED: "0"
- waitForAnimationToEnd:
    timeout: 5000
- assertNotVisible:
    id: "interruption"
