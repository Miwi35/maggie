appId: com.maggie.app.e2e
name: 10-meal-ingredient-choice
tags:
  - cookbook
  - grocery
---
# Planning a meal opens the choice of what to buy (MAG-297, extends MAG-101): a
# full screen listing the ingredients, with the ones out or low on stock ticked,
# and what the owner validates is what reaches the grocery list. What it holds is
# the half no JVM test sees: the requests the phone really sends
# (`GET /api/meals/{id}/grocery_preview`, `POST …/grocery_items`) answered by the
# real API, and the list that follows.
#
# Given « Riz » out of stock, bought by the 500 g pack, and « Légumes pour couscous »
# in the cupboard, bought by the jar — both in one recipe, created by
# `scripts/meal-api.js` (no seed holds a stock or a packaging). A planned meal puts
# nothing on the list (MAG-300): only the choice does, so the rice the owner
# unticked must never appear. The real-time side of the list
# is `08-grocery-realtime`'s; the web's own screen is `e2e/web/tests/meals-grocery-choice.spec.ts`.
#
# MAG-483 adds the guests: the owner steps « Convives » to 4 (the recipe is for 2), the
# meal holds 4, the choice says « Quantités pour 4 convives » and the list holds 2 jars.
# Setting the default and the recipe simulation are the JVM's (`MealSettingsScreenTest`, `RecipeGuestsSimulationTest`)
# and the web journey's (`meals-guests.spec.ts`).
#
# The Menu is chosen in a full-screen search, « Créer » is tapped twice in a row and
# makes one meal, named by the API after its recipe (MAG-378); at the end a tap on the
# meal opens its sheet, not a second creation: the owner gives it a title of his own,
# the week shows it, and he deletes the meal from the sheet.
#
# Everything is the journey's own and deleted at the end, the meal and its lines with it.

- launchApp:
    clearState: true
    permissions:
      all: allow
    arguments:
      e2e_journey: e2e/mobile/flows/10-meal-ingredient-choice.yaml

- runFlow: ../subflows/sign-in.yaml

- runScript:
    file: ../scripts/meal-api.js
    env:
      ACTION: create

# When I plan the meal from the week: Sunday lunch (never a day gone: a past meal
# adds nothing to the list, MAG-400), the « Menu » field opens a full-screen search,
# I pick the recipe and come back, then « Créer » twice in a row.
- runFlow:
    file: ../subflows/open-destination.yaml
    env:
      DEST: cookbook
- tapOn: "Repas"
- extendedWaitUntil:
    visible: "Déjeuner"
    timeout: 20000
- tapOn:
    id: "meal_slot_lunch_6"
- extendedWaitUntil:
    visible:
      id: "meal_menu_field"
    timeout: 20000
- tapOn:
    id: "meal_menu_field"
- extendedWaitUntil:
    visible:
      id: "meal_recipe_search_field"
    timeout: 20000
- inputText: "Riz au curry"
- extendedWaitUntil:
    visible: "Riz au curry MAG-297"
    timeout: 20000
- tapOn: "Riz au curry MAG-297"
- tapOn:
    id: "meal_recipe_search_done"
- extendedWaitUntil:
    visible:
      id: "meal_menu_recipe"
    timeout: 10000
# The « Convives » field starts on the default, marked « par défaut »; a tap on « + »
# twice makes it 4 and the mark goes (MAG-483).
- extendedWaitUntil:
    visible:
      id: "meal_guests_default"
    timeout: 10000
- tapOn:
    id: "meal_guests_plus"
- tapOn:
    id: "meal_guests_plus"
- extendedWaitUntil:
    visible:
      id: "meal_guests_value"
      text: "4"
    timeout: 10000
- assertNotVisible:
    id: "meal_guests_default"
- doubleTapOn:
    id: "meal_create_submit"

# Then the choice opens, not a dialog: only the rice, out of stock, is ticked. The
# double tap made one meal, titled with the recipe alone (no « Déjeuner : » prefix).
- extendedWaitUntil:
    visible: "Ingrédients du repas"
    timeout: 30000
- runScript:
    file: ../scripts/meal-api.js
    env:
      ACTION: expect-single
      EXPECT_GUESTS: "4"
# The choice says what the quantities are scaled to: the 4 guests of the meal.
- assertVisible:
    id: "meal_choice_guests"
    text: ".*4 convives.*"
- extendedWaitUntil:
    visible: "Riz MAG-297.*"
    timeout: 20000
- assertVisible: "Légumes pour couscous MAG-297.*"
- extendedWaitUntil:
    visible: "1 article à ajouter"
    timeout: 10000

# I untick the rice and tick the vegetables: the counter follows.
- tapOn: "Riz MAG-297.*"
- extendedWaitUntil:
    visible: "0 article à ajouter"
    timeout: 10000
- tapOn: "Légumes pour couscous MAG-297.*"
- extendedWaitUntil:
    visible: "1 article à ajouter"
    timeout: 10000

- tapOn: "Ajouter aux courses"

# The phone sent the choice: the meal says so in the database. Then the list holds
# the vegetables by the jar (1 jar for 2 servings, 4 guests: 2) and nothing for the rice.
- runScript:
    file: ../scripts/meal-api.js
    env:
      ACTION: expect-chosen
- runFlow:
    file: ../subflows/open-destination.yaml
    env:
      DEST: grocery
- extendedWaitUntil:
    visible:
      id: "grocery"
    timeout: 20000
# Scrolled to, not waited for: on a tall window the list's own bottom band hides the last
# group (« Non assigné ») until the list is scrolled; the scroll also covers the refresh.
- scrollUntilVisible:
    element: ".*Légumes pour couscous MAG-297.*"
    timeout: 30000
- extendedWaitUntil:
    visible: ".*2(\\.0)? (jars?|bocal|bocaux).*"
    timeout: 10000
# Waited for: the list follows the choice by a refresh.
- extendedWaitUntil:
    notVisible: ".*Riz MAG-297.*"
    timeout: 30000

# I tap the meal: its sheet opens, with the title field. I give it a title of my
# own, save, and the week shows it instead of the recipe's name.
- runFlow:
    file: ../subflows/open-destination.yaml
    env:
      DEST: cookbook
- tapOn: "Repas"
- extendedWaitUntil:
    visible: "Riz au curry MAG-297"
    timeout: 20000
- tapOn: "Riz au curry MAG-297"
- extendedWaitUntil:
    visible:
      id: "meal_detail_title"
    timeout: 10000
- tapOn:
    id: "meal_detail_title"
- inputText: "Dimanche en famille"
- runFlow: ../subflows/hide-keyboard.yaml
- tapOn:
    id: "meal_detail_save"
- extendedWaitUntil:
    visible: "Dimanche en famille"
    timeout: 20000
- extendedWaitUntil:
    notVisible: "Riz au curry MAG-297"
    timeout: 20000
- runScript:
    file: ../scripts/meal-api.js
    env:
      ACTION: expect-renamed

# I delete the meal from its sheet: « Supprimer » asks, the confirmation deletes, and
# it leaves the week without a reload; the API no longer has it.
- tapOn: "Dimanche en famille"
- extendedWaitUntil:
    visible:
      id: "meal_detail_delete"
    timeout: 10000
- tapOn:
    id: "meal_detail_delete"
- extendedWaitUntil:
    visible:
      id: "meal_delete_confirm"
    timeout: 10000
- tapOn:
    id: "meal_delete_confirm"
- extendedWaitUntil:
    notVisible: "Dimanche en famille"
    timeout: 20000
- runScript:
    file: ../scripts/meal-api.js
    env:
      ACTION: expect-deleted

# Left as found.
- runScript:
    file: ../scripts/meal-api.js
    env:
      ACTION: remove
