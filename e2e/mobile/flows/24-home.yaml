appId: com.maggie.app.e2e
name: 24-home
tags:
  - dashboard
---
# The Accueil (MAG-560): the landing screen after sign-in, a title « Accueil » and the
# « Aujourd'hui · Demain » selector over a stack of cards. Each module's ticket adds its
# card's steps here (the Agenda card's are in `24-home-agenda.yaml`); what a card holds and what the selector passes to it are
# `HomeScreenTest`'s, `HomeCardScreenTest`'s, `HomeViewModelTest`'s and each card's own.
#
# Given the signed-in user opens the app, then « Accueil » and the selector are on screen,
# on Aujourd'hui. When they tap « Demain », then the selector is on Demain.
#
# The Courses card (MAG-563, extends MAG-99): it signs in as the seed's home account, who has
# six open lines at one shop (`64-grocery-home.yaml`). Then the card shows five of them and
# « + 1 », and « Demain » leaves it as it was.
#
# The empty cards (MAG-594): the account has no meal, so the Cuisine card is not drawn and the cards
# that have something stay (`28-home-tasks.yaml` is the account with nothing but a task, on Aujourd'hui).
#
# The Finance card (MAG-565, extends MAG-102): the same account has a 1 000 € envelope and 10 €
# spent on the 1st (`65-finance-home.yaml`), so the card says what was spent for the week and the month,
# and one project, « Vélo », whose bar the card draws.

- launchApp:
    clearState: true
    permissions:
      all: allow
    arguments:
      e2e_journey: e2e/mobile/flows/24-home.yaml
      e2e_email: e2e-home@maggie.local

- runFlow: ../subflows/sign-in.yaml

- extendedWaitUntil:
    visible:
      id: "home_screen"
    timeout: 20000
- extendedWaitUntil:
    visible:
      id: "home_day_selector"
    timeout: 20000
- assertVisible: "Accueil"

# Aujourd'hui is selected on arrival.
- extendedWaitUntil:
    visible:
      id: "home_day_today"
      checked: true
    timeout: 20000

- tapOn:
    id: "home_day_tomorrow"

# Waited for, not asserted: the selection is a recomposition after the tap.
- extendedWaitUntil:
    visible:
      id: "home_day_tomorrow"
      checked: true
    timeout: 20000
- extendedWaitUntil:
    visible:
      id: "home_day_today"
      checked: false
    timeout: 20000

# The Courses card: the shop, five lines in the order of the list, and the rest as « + 1 ».
- scrollUntilVisible:
    element:
      id: "home_grocery_more"
    timeout: 20000
- extendedWaitUntil:
    visible: "Biocoop de l'Accueil"
    timeout: 20000
- assertVisible: "Article 1"
- assertVisible: "Article 5"
- assertNotVisible: "Article 6"
- assertVisible: "+ 1"

# It does not follow the selector: still on Demain, the same five lines.
- assertVisible:
    id: "home_day_tomorrow"
    checked: true
- assertVisible: "Article 5"
- assertNotVisible: "Article 6"

# The Finance card: both rings say what was spent, with no verdict (the ring's accessibility text carries it: the id sits on a parent node without text).
- scrollUntilVisible:
    element:
      id: "home_finance_ring_month"
    timeout: 20000
- extendedWaitUntil:
    visible:
      text: "Semaine : .*dépensés.*"
    timeout: 20000
- assertVisible:
    text: "Mois : .*dépensés.*"
# The next project under the rings, as the mock-up draws it.
- scrollUntilVisible:
    element:
      id: "home_finance_next_project"
    timeout: 20000
- extendedWaitUntil:
    visible:
      text: "Vélo"
    timeout: 5000

# No meal on this account: the Cuisine card is gone once read (Demain is selected), the Courses and
# Finance cards stay, and the sentence « Rien de prévu » is not said. Aujourd'hui is `28-home-tasks.yaml`'s.
- extendedWaitUntil:
    notVisible:
      id: "home_card_cuisine"
    timeout: 20000
- assertNotVisible:
    id: "home_empty"

# The navigation, to the letter of the mock-up `charte/Tiroir` (MAG-620, extends MAG-99): the
# drawer under 600 dp, the rail beyond. Maggie lives in the bottom bar, so there is no « Chat »
# entry; the modules are named « Agenda » and « Réglages ». Which entries and in which order is
# `DrawerDestinationsTest` / `AppDrawerScreenTest` (JVM); here the live wiring — no Chat entry
# on either format, and « Agenda » opens the agenda (Réglages, last, may sit under the fold of a
# short rail: the JVM tests say it).
- runFlow: ../subflows/open-navigation.yaml
- assertNotVisible:
    id: "drawer_chat"
- assertNotVisible:
    id: "rail_chat"
- assertNotVisible: "Calendrier"
- assertNotVisible: "Paramètres"

# « Agenda » opens the agenda: its week switch is on screen. The tap is the drawer's or the rail's,
# whichever this window draws.
- evalScript: ${0}
- runFlow:
    when:
      visible:
        id: "drawer_calendar"
    commands:
      - tapOn:
          id: "drawer_calendar"
- evalScript: ${0}
- runFlow:
    when:
      visible:
        id: "rail_calendar"
    commands:
      - tapOn:
          id: "rail_calendar"
- extendedWaitUntil:
    visible:
      id: "calendar_view_week"
    timeout: 20000
