appId: com.maggie.app.e2e
name: 37-cookbook-ingredients
tags:
  - cookbook
---
# Cuisine › Ingrédients (MAG-1057): a card per ingredient, the state pills and the search.
#
# Given two ingredients created by `scripts/recipe-api.js` (one linked to Ciqual with its
# energy, one with no values), when I open Cuisine then Ingrédients, both cards show;
# « Sans valeurs » keeps the one without values; under « Tous », typing the start of the
# other's name keeps only it. The ingredients are the journey's own, deleted at the end.

- launchApp:
    clearState: true
    permissions:
      all: allow
    arguments:
      e2e_journey: e2e/mobile/flows/37-cookbook-ingredients.yaml

- runFlow: ../subflows/sign-in.yaml

- runScript:
    file: ../scripts/recipe-api.js
    env:
      ACTION: create-ingredients
      RECIPE: ingredients MAG-1057

- runFlow:
    file: ../subflows/open-destination.yaml
    env:
      DEST: cookbook
- tapOn:
    id: "breadcrumb_section"
- tapOn:
    id: "breadcrumb_menu_ingredients"
- extendedWaitUntil:
    visible: "Rechercher un ingrédient"
    timeout: 20000

- tapOn:
    id: "ingredient_search_field"
- inputText: "MAG-1057"
- extendedWaitUntil:
    visible: "Oignon MAG-1057"
    timeout: 20000
- extendedWaitUntil:
    visible: "Sel MAG-1057"
    timeout: 20000
- assertVisible: "40 kcal · 1 pièce ≈ 100 g"

- tapOn:
    id: "subview_none"
- assertVisible: "Sel MAG-1057"
- assertNotVisible: "Oignon MAG-1057"

- tapOn:
    id: "subview_all"
- tapOn:
    id: "ingredient_search_field"
- eraseText: 20
- inputText: "oign"
- assertVisible: "Oignon MAG-1057"
- assertNotVisible: "Sel MAG-1057"

- runScript:
    file: ../scripts/recipe-api.js
    env:
      ACTION: remove-ingredients
      RECIPE: ingredients MAG-1057
