appId: com.maggie.app.e2e
name: 33-bilan-soir
tags:
  - dashboard
---
# The Bilan de la journée activity (MAG-751, extends the Cuisine activity journey 27-cooking-launch).
#
# Étant donné un compte sans bilan en cours
# Quand j'ouvre le bilan par son lien (celui de l'interruption du soir), il s'ouvre sur « Journée · 1 sur 5 »,
#   sans la barre de Maggie
# Et quand je tape « Suivant », l'étape est « Finance · 2 sur 5 »
# Et quand je tape ✕, aucune question : je suis sur l'Accueil, dont la carte « Bilan de la journée » dit
#   « Étape Finance » avec « Reprendre »
# Et la tâche non faite du jour, rangée par « Demain », a son échéance à demain (MAG-752)
# Alors « Reprendre » rouvre le bilan sur « Finance · 2 sur 5 »
# Et à l'étape Santé (MAG-754), quand je touche Moral 7 et Fatigue 4, puis ✕ et « Reprendre », les deux restent
#   choisis, et Santé › Journal montre 7 et 4
#
# MAG-755, the Demain step: étant donné un Dentiste demain, avec un lieu et sans trajet, quand j'arrive à
# « Demain · 5 sur 5 », le programme montre le Dentiste et Maggie demande d'où je pars; je tape « De la maison »,
# elle enregistre le trajet (faux modèle, vrai `set_trip`), la question suivante est celle du mode et le
# départ apparaît au programme; le trajet est lu côté API avec une origine décidée par moi (la carte du matin la
# garde). Terminer par « Bonne nuit » clôt le bilan : la carte de l'Accueil disparaît.
#
# MAG-826, the opening: étant donné la proaction « Bilan de la journée » jouée (`scripts/bilan-proaction-api.js`, heure du
# bilan réglée à 00:00), l'Accueil, avant toute réponse, montre la carte « Bilan de la journée » avec « Ouvrir »; le chat
# porte un seul message du bilan et sa carte (`chat_bilan_card`), dont « Ouvrir » ouvre l'activité.
#
# What a JVM test cannot see is the real activity in the real window, the deep link and the status
# held by the API. What is not here: each transition (`BilanActivityViewModelTest`), the phone and tablet
# layouts (`BilanActivityScreenTest`), the card's rules and the next-morning cut (`BilanHomeCardTest`,
# `BilanResumeViewModelTest`). The interruption itself, which Maggie sends in the evening, has no clock to wait
# for in a journey: its link is opened directly.

- runFlow: ../subflows/new-user.yaml

- runScript:
    file: ../scripts/bilan-tasks-api.js
    env:
      ACTION: setup
      TODAY: ${TODAY}
      EMAIL: ${output.journeyEmail}

- runScript:
    file: ../scripts/trip-api.js
    env:
      ACTION: create-tomorrow
      SUMMARY: "Dentiste"
      EMAIL: ${output.journeyEmail}

- runScript:
    file: ../scripts/bilan-proaction-api.js
    env:
      TODAY: ${TODAY}
      EMAIL: ${output.journeyEmail}

- launchApp:
    clearState: true
    permissions:
      all: allow
    arguments:
      e2e_journey: e2e/mobile/flows/33-bilan-soir.yaml
      e2e_email: ${output.journeyEmail}

- runFlow: ../subflows/sign-in.yaml

# The review's proaction has been played: the tile offers « Ouvrir » before any answer, and the chat carries the card.
- extendedWaitUntil:
    visible:
      id: "home_bilan_resume"
    timeout: 30000
- assertVisible: "Ouvrir"
- runFlow: ../subflows/open-chat.yaml
- extendedWaitUntil:
    visible:
      id: "chat_bilan_card"
    timeout: 20000
- assertVisible: "Bilan de la journée"
- tapOn:
    id: "chat_bilan_card_open"
- extendedWaitUntil:
    visible:
      id: "bilan_activity"
    timeout: 20000
- tapOn: "Got it"
  optional: true
- tapOn:
    id: "bilan_quit"
- extendedWaitUntil:
    visible:
      id: "home_bilan_resume"
    timeout: 20000

- openLink: "maggie-e2e://activity/bilan"
- extendedWaitUntil:
    visible:
      id: "bilan_activity"
    timeout: 20000
# Android's own « Viewing full screen » notice covers the top until dismissed.
- tapOn:
    text: "Got it"
    optional: true
- extendedWaitUntil:
    visible:
      id: "bilan_counter"
      text: "Journée · 1 sur 5"
    timeout: 20000
- assertNotVisible:
    id: "chat_open"

# Journée (MAG-752): the task left is put off to tomorrow, and the task itself carries it.
- extendedWaitUntil:
    visible:
      id: "bilan_task_${output.taskId}"
    timeout: 20000
- tapOn:
    id: "bilan_task_${output.taskId}_tomorrow"
- runScript:
    file: ../scripts/bilan-tasks-api.js
    env:
      ACTION: expect
      EXPECT: tomorrow
      TODAY: ${TODAY}
      EMAIL: ${output.journeyEmail}
      TASK_ID: ${output.taskId}

- tapOn:
    id: "bilan_next"
- extendedWaitUntil:
    visible:
      id: "bilan_counter"
      text: "Finance · 2 sur 5"
    timeout: 20000

# ✕: no question, the status stays where it was.
- tapOn:
    id: "bilan_quit"
- assertNotVisible: "Quitter"
- extendedWaitUntil:
    visible:
      id: "home_bilan_resume"
    timeout: 20000
- assertVisible: "Étape Finance"

- tapOn: "Reprendre"
- extendedWaitUntil:
    visible:
      id: "bilan_counter"
      text: "Finance · 2 sur 5"
    timeout: 20000

# Santé (MAG-754): each tap is written to the journal at once and kept in the bilan's answers.
- tapOn:
    id: "bilan_next"
- extendedWaitUntil:
    visible:
      id: "bilan_counter"
      text: "Santé · 3 sur 5"
    timeout: 20000
- tapOn:
    id: "bilan_sante_mood_7"
- tapOn:
    id: "bilan_sante_fatigue_4"
- extendedWaitUntil:
    visible:
      id: "bilan_sante_mood_7"
      checked: true
    timeout: 10000
- extendedWaitUntil:
    visible:
      id: "bilan_sante_fatigue_4"
      checked: true
    timeout: 10000

# Reprendre keeps them.
- tapOn:
    id: "bilan_quit"
- extendedWaitUntil:
    visible:
      id: "home_bilan_resume"
    timeout: 20000
- tapOn: "Reprendre"
- extendedWaitUntil:
    visible:
      id: "bilan_sante_mood_7"
      checked: true
    timeout: 20000
- extendedWaitUntil:
    visible:
      id: "bilan_sante_fatigue_4"
      checked: true
    timeout: 10000

# The Demain step (MAG-755).
- tapOn:
    id: "bilan_next"
- tapOn:
    id: "bilan_next"
- extendedWaitUntil:
    visible:
      id: "bilan_counter"
      text: "Demain · 5 sur 5"
    timeout: 20000
- extendedWaitUntil:
    visible:
      id: "bilan_tomorrow_card"
    timeout: 20000
- assertVisible: "Dentiste"
- assertVisible: ".*D’où partez-vous pour.*"

# « De la maison »: Maggie keeps tomorrow's trip, the next question is the mode.
- tapOn:
    id: "bilan_ask_0"
- extendedWaitUntil:
    visible: ".*Comment allez-vous.*"
    timeout: 30000
- assertVisible: "Départ pour dentiste"
- runScript:
    file: ../scripts/trip-api.js
    env:
      ACTION: expect-tomorrow
      EVENT_ID: ${output.eventId}
      EMAIL: ${output.journeyEmail}

# Quitting and resuming does not ask the origin again.
- tapOn:
    id: "bilan_quit"
- extendedWaitUntil:
    visible:
      id: "home_bilan_resume"
    timeout: 20000
- tapOn: "Reprendre"
- extendedWaitUntil:
    visible:
      id: "bilan_counter"
      text: "Demain · 5 sur 5"
    timeout: 20000
- assertNotVisible: ".*D’où partez-vous pour.*"

# « Bonne nuit » ends the review.
- tapOn:
    id: "bilan_next"
- extendedWaitUntil:
    notVisible:
      id: "bilan_activity"
    timeout: 20000

# Santé › Journal: the entry of the day carries them.
- openLink: "maggie-e2e://health/journal"
- extendedWaitUntil:
    visible:
      id: "journal_mood_7"
      checked: true
    timeout: 30000
- extendedWaitUntil:
    visible:
      id: "journal_fatigue_4"
      checked: true
    timeout: 10000
