appId: com.maggie.app.e2e
name: 13-finance-to-sort
tags:
  - finance
---
# The « À qualifier » pile, from the phone: the list first, a line opens its card, « Suivant » / « Précédent » walk
# the list's order (MAG-423, MAG-458, MAG-507, extends MAG-102).
#
# Étant donné deux lignes Carrefour sans catégorie
# Quand j'ouvre À qualifier, j'ouvre la première ligne puis touche « Suivant »
# Alors la fiche de la seconde s'affiche (2 / 2), « Précédent » revient à la première, et le retour mène à la liste
#
# Étant donné deux lignes Carrefour sans catégorie et une règle « contient CARREFOUR »
# Quand j'ouvre À qualifier et que je valide avec « Toujours pour ce marchand »
# Alors les deux lignes sont classées et la pile est vide
#
# Étant donné une dépense que rien ne reconnaît et une catégorie « Loisirs MAG-458 »
# Quand je la juge « Superflue » puis la range sous « Loisirs MAG-458 »
# Alors elle quitte À qualifier, jugée Superflue et rangée sous cette catégorie (lu par le script)
#
# A verdict does not file a line: the pile holds the lines without a category, so the line leaves
# on the category, not on the judgement.
#
# The data is set by `scripts/to-sort-api.js` on the seed's second user, who holds no other
# finance data: the pile is these two lines. The card says where the line would go and why
# (the rule), « Toujours » is an opt-in switch, and the rule that already claims the line
# files the other one in the same stroke — what the answer reports in the snackbar.
#
# What is not here: « Virement interne » and « Créer un filtre » (`ToSortViewModelTest`),
# the swipe (`ToSortScreenTest`), the tablet's list beside the card, and the admin's side of the same API
# (`finance-to-sort.spec.ts`).

- launchApp:
    clearState: true
    permissions:
      all: allow
    arguments:
      e2e_journey: e2e/mobile/flows/13-finance-to-sort.yaml
      e2e_email: e2e-other@maggie.local

- runFlow: ../subflows/sign-in.yaml

- runScript:
    file: ../scripts/to-sort-api.js
    env:
      ACTION: create

- openLink: "maggie-e2e://finance/to-sort"

# The list comes first, in the pile's order.
- extendedWaitUntil:
    visible:
      id: "to_sort_row"
    timeout: 30000
- assertVisible: "2 à qualifier"
- assertVisible: "CARREFOUR MARKET 1234"
- assertVisible: "CARREFOUR MARKET 5678"
- assertNotVisible:
    id: "to_sort_card"

# Open a line, walk to the next one and back, then return to the list.
- tapOn: "CARREFOUR MARKET 1234"
- extendedWaitUntil:
    visible:
      id: "to_sort_card"
    timeout: 30000
- assertVisible:
    id: "review_position"
    text: "1 / 2"
- tapOn:
    id: "review_next"
- extendedWaitUntil:
    visible: "CARREFOUR MARKET 5678"
    timeout: 30000
- assertVisible:
    id: "review_position"
    text: "2 / 2"
- tapOn:
    id: "review_previous"
- extendedWaitUntil:
    visible: "CARREFOUR MARKET 1234"
    timeout: 30000
- tapOn:
    id: "review_back_to_list"
- extendedWaitUntil:
    visible: "2 à qualifier"
    timeout: 30000
- assertNotVisible:
    id: "to_sort_card"

# Open the first line again to qualify it.
- tapOn: "CARREFOUR MARKET 1234"
- extendedWaitUntil:
    visible:
      id: "to_sort_card"
    timeout: 30000
- assertVisible: ".*contient CARREFOUR.*"
- assertVisible: ".*Courses MAG-423.*"

- tapOn:
    id: "to_sort_always"
- tapOn:
    id: "to_sort_validate"

- extendedWaitUntil:
    visible: ".*1 autre ligne classée.*"
    timeout: 30000
- extendedWaitUntil:
    visible:
      id: "to_sort_empty"
    timeout: 30000
- assertVisible: "Rien à qualifier"

# An expense nothing recognises: judged, then filed under another category.
- runScript:
    file: ../scripts/to-sort-api.js
    env:
      ACTION: add-leisure
- openLink: "maggie-e2e://finance/to-sort"
- extendedWaitUntil:
    visible:
      id: "to_sort_row"
    timeout: 30000
- assertVisible: "1 à qualifier"
- tapOn: "DUPONT MARTIN"
- extendedWaitUntil:
    visible:
      id: "to_sort_card"
    timeout: 30000
- assertVisible: "DUPONT MARTIN"
- scrollUntilVisible:
    element:
      id: "to_sort_avoidable"
- tapOn:
    id: "to_sort_avoidable"
- scrollUntilVisible:
    direction: UP
    element:
      id: "to_sort_other"
- tapOn:
    id: "to_sort_other"
- tapOn:
    id: "to_sort_search"
- inputText: "Loisirs"
- hideKeyboard
- tapOn: "Loisirs MAG-458"
- extendedWaitUntil:
    visible:
      id: "to_sort_empty"
    timeout: 30000
- assertVisible: "Rien à qualifier"
- runScript:
    file: ../scripts/to-sort-api.js
    env:
      ACTION: check-leisure

# Left as found.
- runScript:
    file: ../scripts/to-sort-api.js
    env:
      ACTION: remove
