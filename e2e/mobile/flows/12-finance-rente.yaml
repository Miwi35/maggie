appId: com.maggie.app.e2e
name: 12-finance-rente
tags:
  - finance
---
# Declaring a rente from the phone (MAG-257, extends MAG-102).
#
# The category dialog offers « Recette » and, on a Recette only, the « Rente » box;
# what is created comes back from the real API with `passiveIncome: true` and the
# list draws it « Recette · rente ». The same request over the admin is
# `finance-independence.spec.ts`.
#
# What is not here: the dashboard card losing « Aucune catégorie déclarée comme
# rente ». The e2e owner already has a rente in the seed, so the card never shows
# that state on this account — `IndependenceCardScreenTest` draws it instead.
#
# The name carries the ticket so a re-run on the same server finds its own line, and
# sorts after the seeded « Loyers perçus » (already a rente): the list is alphabetical,
# so only the new row can be the « Recette · rente » below it. The box is addressed by
# its tag — a toggleable row merges its texts, which no plain « Rente » would match.

- launchApp:
    clearState: true
    permissions:
      all: allow
    arguments:
      e2e_journey: e2e/mobile/flows/12-finance-rente.yaml

- runFlow: ../subflows/sign-in.yaml

- openLink: "maggie-e2e://finance/categories"

- extendedWaitUntil:
    visible: "Catégories"
    timeout: 20000

- tapOn: "Nouvelle catégorie"

- extendedWaitUntil:
    visible: "Nom"
    timeout: 10000

- tapOn: "Nom"
- inputText: "Redevances MAG-257"
- hideKeyboard

# The box is not there until the obligation is an income: the API refuses the
# flag anywhere else.
- assertNotVisible:
    id: "category_passive_income"
- tapOn: "Recette"

- extendedWaitUntil:
    visible:
      id: "category_passive_income"
    timeout: 10000

- tapOn:
    id: "category_passive_income"
- tapOn: "Créer"

- extendedWaitUntil:
    visible: "Redevances MAG-257"
    timeout: 30000

- extendedWaitUntil:
    visible:
      text: "Recette · rente"
      below: "Redevances MAG-257"
    timeout: 30000
