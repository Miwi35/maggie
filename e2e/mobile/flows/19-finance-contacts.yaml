appId: com.maggie.app.e2e
name: 19-finance-contacts
tags:
  - finance
---
# Contacts and the labels they appear under, from the phone (MAG-450, extends MAG-102).
#
# Étant donné un virement « VIR. DE TOM MARTIN » de +400 € sans contact
# Quand je l'associe depuis « À trier » en créant « Tom » dans le sélecteur plein écran
# Alors la fiche de Tom liste « VIR. DE TOM MARTIN » avec « 1 virement »,
# Et un second virement « VIR. DE TOM MARTIN » écrit ensuite est rattaché à Tom (« 2 virements »)
#
# The data is set by `scripts/contacts-api.js` on the seed's second user, who holds no other
# finance data: the pile is this one transfer, and the user has no contact yet. The second
# transfer is written through the API, as an import would: the API attaches it to Tom while
# writing it (the script checks), and the page says so once it is read again.
#
# My part of a shared spend (MAG-451):
#
# Étant donné un gîte de 800 € classé Voyages, dont l'enveloppe du mois est de 300 €
# Quand je déclare sur sa fiche ma part de 200 €, le reste partagé entre Julie, Tom et Inès
# Alors l'enveloppe Voyages affiche 200 € consommés
# Et la fiche de Tom, ouverte par « Voir tout ce qu'on te doit » puis sa ligne dépliée, dit « te doit 200 € » sous « En cours »
#
# The gîte, « Voyages », its envelope and the contacts Julie and Inès are written by the same
# script (`ACTION: share`); Tom is the one this flow created.
#
# A transfer to give back in part (MAG-452):
#
# Étant donné les deux virements de 400 € de Tom (800 € de recettes ce mois-ci)
# Quand je déclare sur la fiche de l'un d'eux « À rembourser » 280 €, envers Tom que son libellé propose
# Alors les recettes du mois ne sont plus que de 520 € (400 € + les 120 € qui restent du virement)
# Et la fiche de Tom dit « tu lui dois 280 € » sous « En cours »
#
# The month's income is read back by `contacts-api.js` (`ACTION: income`) from the dashboard.
# Since MAG-453 « À rembourser » is one answer of « Ce virement est » (`peer_kind_new_debt`).
#
# A received transfer allocated to a créance (MAG-453):
#
# Étant donné la créance « Gîte de Crozon » (Tom me doit 200 €) et un virement reçu de Tom de 400 €
# Quand je l'ouvre depuis « À trier » et réponds « Un remboursement » qui couvre le gîte
# Alors « Non affecté » montre 200 €, la part de Tom sur le gîte est soldée
# Et le virement garde 200 € non affectés (relu par `contacts-api.js`, `ACTION: allocated`)
#
# The créance and the transfer — filed, dated the day before so it is the oldest card — are
# written by `contacts-api.js` (`ACTION: allocation`).
#
# The safety cushion lowered by the créances (MAG-454):
#
# Étant donné un Livret A de 5 200 € compté dans le matelas, et le gîte des Cimes dont Julie, Tom et Inès
#   me doivent chacun 200 € (Tom a remboursé le gîte de Crozon, qui ne compte plus)
# Quand j'ouvre le matelas
# Alors la ligne « Avancé à des proches » montre −600 €, et le matelas 4 600 €
# Quand Julie rembourse ses 200 €
# Alors la ligne montre −400 € et le matelas est remonté à 4 800 €
#
# The Livret and Julie's transfer are written by `contacts-api.js` (`ACTION: cushion`, `repay`).
# The dette of 280 € owed to Tom is no créance: it never lowers the cushion.
#
# What is not here: « Peut-être aussi », « Retirer » and the notes (`ContactViewModelTest`,
# `ContactScreenTest`), amounts edited by hand, the steppers, switching a share off and the
# server's refusals (`TransactionViewModelTest`, `TransactionShareScreenTest`,
# `PeerTransferQualifierScreenTest`), « Nouvelle créance » and money sent, the tablet's
# page beside the list, and the admin's side of the same API.

- launchApp:
    clearState: true
    permissions:
      all: allow
    arguments:
      e2e_journey: e2e/mobile/flows/19-finance-contacts.yaml
      e2e_email: e2e-other@maggie.local

- runFlow: ../subflows/sign-in.yaml

- runScript:
    file: ../scripts/contacts-api.js
    env:
      ACTION: create

- openLink: "maggie-e2e://finance/to-sort"

- extendedWaitUntil:
    visible:
      id: "to_sort_row"
    timeout: 30000
- tapOn:
    id: "to_sort_row"
- extendedWaitUntil:
    visible:
      id: "to_sort_card"
    timeout: 30000
- assertVisible: "VIR. DE TOM MARTIN"

# « Associer à un contact ? », then « Tom » created in the full-screen picker.
- tapOn:
    id: "to_sort_contact"
- extendedWaitUntil:
    visible:
      id: "contact_picker_search"
    timeout: 10000
- tapOn:
    id: "contact_picker_search"
- inputText: "Tom"
- extendedWaitUntil:
    visible:
      id: "contact_picker_create"
    timeout: 10000
- assertVisible: "+ Créer « Tom »"
- tapOn:
    id: "contact_picker_create"

# The line stays to sort — a contact is not a category — and says whose it is.
- extendedWaitUntil:
    visible:
      id: "to_sort_contact_name"
    timeout: 30000
- assertVisible: "Contact : Tom"

# Tom's page, from « Comptes ».
- openLink: "maggie-e2e://finance/accounts"
- tapOn:
    id: "accounts_contacts"
- extendedWaitUntil:
    visible:
      id: "contact_row"
    timeout: 30000
- tapOn:
    id: "contact_row"
- extendedWaitUntil:
    visible: "Ses comptes"
    timeout: 30000
- extendedWaitUntil:
    visible:
      id: "contact_counterparty"
    timeout: 30000
- assertVisible: ".*TOM MARTIN.*"
- assertVisible: "1 virement"

# A second transfer under the same label, written afterwards: it is Tom's without a gesture.
- runScript:
    file: ../scripts/contacts-api.js
    env:
      ACTION: second
- back
- tapOn:
    id: "contact_row"
- extendedWaitUntil:
    visible: "2 virements"
    timeout: 30000

# MAG-451: a gîte of 800 € in « Voyages » (300 € this month), Julie and Inès beside Tom.
- runScript:
    file: ../scripts/contacts-api.js
    env:
      ACTION: share
- openLink: "maggie-e2e://finance/accounts"
- extendedWaitUntil:
    visible: "EUR · Compte MAG-450"
    timeout: 20000
- tapOn: "EUR · Compte MAG-450"
- extendedWaitUntil:
    visible: "GITE DES CIMES MAG-451"
    timeout: 30000
- tapOn: "GITE DES CIMES MAG-451"

# « Dépense partagée », my part of 200 €.
- scrollUntilVisible:
    element:
      id: "share_switch"
    centerElement: true
    timeout: 20000
- tapOn:
    id: "share_switch"
# Maggie's bar takes the bottom of the page: the field opened under the switch is below the fold.
- scrollUntilVisible:
    element:
      id: "share_mine"
    centerElement: true
    timeout: 10000
- tapOn:
    id: "share_mine"
- eraseText
- inputText: "200"
- hideKeyboard

# Julie, Tom and Inès, each picked in the full-screen picker (« In »: no accent typed on Android).
- scrollUntilVisible:
    element:
      id: "share_add_person"
    centerElement: true
- tapOn:
    id: "share_add_person"
- extendedWaitUntil:
    visible:
      id: "contact_picker_search"
    timeout: 10000
- tapOn:
    id: "contact_picker_search"
- inputText: "Julie"
- extendedWaitUntil:
    visible:
      id: "contact_picker_result"
    timeout: 10000
- tapOn:
    id: "contact_picker_result"
- scrollUntilVisible:
    element:
      id: "share_add_person"
    centerElement: true
- tapOn:
    id: "share_add_person"
- extendedWaitUntil:
    visible:
      id: "contact_picker_search"
    timeout: 10000
- tapOn:
    id: "contact_picker_search"
- inputText: "Tom"
- extendedWaitUntil:
    visible:
      id: "contact_picker_result"
    timeout: 10000
- tapOn:
    id: "contact_picker_result"
- scrollUntilVisible:
    element:
      id: "share_add_person"
    centerElement: true
- tapOn:
    id: "share_add_person"
- extendedWaitUntil:
    visible:
      id: "contact_picker_search"
    timeout: 10000
- tapOn:
    id: "contact_picker_search"
- inputText: "In"
- extendedWaitUntil:
    visible:
      id: "contact_picker_result"
    timeout: 10000
- tapOn:
    id: "contact_picker_result"

# The rest, 600 €, owed 200 € each; « Enregistrer » writes the part and the créance together.
- scrollUntilVisible:
    element: "On te doit 600[.,]00 EUR"
    centerElement: true
- scrollUntilVisible:
    element:
      id: "share_save"
    centerElement: true
- tapOn:
    id: "share_save"
- extendedWaitUntil:
    visible: "Partage enregistré"
    timeout: 30000

# « Voir tout ce qu'on te doit »: the contacts, where Tom's page says what he owes.
- scrollUntilVisible:
    element:
      id: "share_all_owed"
    centerElement: true
- tapOn:
    id: "share_all_owed"
- extendedWaitUntil:
    visible: "Tom"
    timeout: 30000
- tapOn: "Tom"
# Since MAG-455 the link lands on « Créances et dettes »: Tom's row opens, its link leads to his page.
- tapOn:
    id: "peer_debts_contact_link"
- extendedWaitUntil:
    visible: "En cours"
    timeout: 30000
- extendedWaitUntil:
    visible: "te doit 200[.,]00 EUR"
    timeout: 30000

# Only my part counts in « Voyages »: 200 of 300 €, not 800.
- openLink: "maggie-e2e://finance/budgets"
- extendedWaitUntil:
    visible: "Voyages"
    timeout: 30000
- extendedWaitUntil:
    visible: "200[.,]00 EUR / 300[.,]00 EUR"
    timeout: 30000

# MAG-452: Tom's transfers are 800 € of income; 280 € of one are to be given back.
- runScript:
    file: ../scripts/contacts-api.js
    env:
      ACTION: income
      EXPECTED_CENTS: "80000"
- openLink: "maggie-e2e://finance/accounts"
- extendedWaitUntil:
    visible: "EUR · Compte MAG-450"
    timeout: 20000
- tapOn: "EUR · Compte MAG-450"
- extendedWaitUntil:
    visible: ".*TOM MARTIN.*"
    timeout: 30000
- tapOn: ".*TOM MARTIN.*"

# « Ce virement est » « À rembourser »: Tom, the transfer's contact, is proposed.
- scrollUntilVisible:
    element:
      id: "peer_kind_new_debt"
    centerElement: true
    timeout: 20000
- tapOn:
    id: "peer_kind_new_debt"
- extendedWaitUntil:
    visible: "Envers : Tom"
    timeout: 10000
- scrollUntilVisible:
    element:
      id: "peer_amount"
    centerElement: true
- tapOn:
    id: "peer_amount"
- eraseText
- inputText: "280"
- hideKeyboard
- scrollUntilVisible:
    element:
      id: "peer_summary"
    centerElement: true
- extendedWaitUntil:
    visible: "Crée une dette de 280[.,]00 EUR envers Tom.*"
    timeout: 10000
- scrollUntilVisible:
    element:
      id: "peer_save"
    centerElement: true
- tapOn:
    id: "peer_save"
- extendedWaitUntil:
    visible: "Dette enregistrée"
    timeout: 30000

# The 280 € leave the income: 400 + 120 = 520 €.
- runScript:
    file: ../scripts/contacts-api.js
    env:
      ACTION: income
      EXPECTED_CENTS: "52000"

# Tom's page: « tu lui dois 280 € ».
- openLink: "maggie-e2e://finance/accounts"
- extendedWaitUntil:
    visible:
      id: "accounts_contacts"
    timeout: 30000
- tapOn:
    id: "accounts_contacts"
- extendedWaitUntil:
    visible:
      id: "contact_row"
    timeout: 30000
- extendedWaitUntil:
    visible: "Tom"
    timeout: 30000
- tapOn: "Tom"
- extendedWaitUntil:
    visible: "En cours"
    timeout: 30000
- extendedWaitUntil:
    visible: "tu lui dois 280[.,]00 EUR"
    timeout: 30000

# MAG-453: the créance « Gîte de Crozon » (Tom owes 200 €) and Tom's third transfer, of 400 €.
- runScript:
    file: ../scripts/contacts-api.js
    env:
      ACTION: allocation
- openLink: "maggie-e2e://finance/to-sort"
- extendedWaitUntil:
    visible:
      id: "to_sort_row"
    timeout: 30000
- tapOn:
    id: "to_sort_row"
- extendedWaitUntil:
    visible:
      id: "to_sort_card"
    timeout: 30000

# « Ce virement est » « Un remboursement », covering the gîte: the other 200 € stay « Non affecté ».
- scrollUntilVisible:
    element:
      id: "peer_kind_repayment"
    timeout: 20000
- tapOn:
    id: "peer_kind_repayment"
- scrollUntilVisible:
    element: "Gîte de Crozon"
    timeout: 20000
- tapOn: "Gîte de Crozon"
- scrollUntilVisible:
    element:
      id: "peer_unallocated"
- extendedWaitUntil:
    visible: "Non affecté : 200[.,]00 EUR"
    timeout: 10000
- scrollUntilVisible:
    element:
      id: "peer_save"
- tapOn:
    id: "peer_save"

# Tom's share of the gîte is settled; the transfer keeps 200 € not allocated.
- runScript:
    file: ../scripts/contacts-api.js
    env:
      ACTION: allocated

# MAG-454: the Livret A of 5 200 € counted in the cushion, the three shares of the gîte des Cimes open.
- runScript:
    file: ../scripts/contacts-api.js
    env:
      ACTION: cushion
- openLink: "maggie-e2e://finance/cushion"
- extendedWaitUntil:
    visible:
      id: "cushion_peer_claims"
    timeout: 30000
- assertVisible: "Avancé à des proches.*"
- assertVisible: "revient au remboursement"
- assertVisible: "−600[.,]00 EUR"
- assertVisible: "4.{0,1}600[.,]00 EUR sur.*"
- assertVisible: ".*dont 600[.,]00 EUR avancés à des proches.*"

# Julie gives her 200 € back: the cushion refills.
- runScript:
    file: ../scripts/contacts-api.js
    env:
      ACTION: repay
- openLink: "maggie-e2e://finance/cushion"
- extendedWaitUntil:
    visible: "−400[.,]00 EUR"
    timeout: 30000
- assertVisible: "4.{0,1}800[.,]00 EUR sur.*"

# Left as found.
- runScript:
    file: ../scripts/contacts-api.js
    env:
      ACTION: remove
