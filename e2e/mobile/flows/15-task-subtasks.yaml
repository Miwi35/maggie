appId: com.maggie.app.e2e
name: 15-task-subtasks
tags:
  - calendar
---
# A task brought from Google Tasks keeps its notes and its subtasks, in Google's
# order (MAG-404); « Aujourd'hui » goes by score, with each task's urgency (MAG-406).
#
# The witness is « Préparer le déménagement » (`api/fixtures/e2e/20-calendar.yaml`):
# note « Les cartons sont à la cave », due on the anchor day so the dashboard lists
# it under « Aujourd'hui », with two undated subtasks whose positions put « Réserver
# le camion » before « Changer d'adresse à la banque ». The subtasks are not rows of
# the dashboard's own lists but follow their parent in « Aujourd'hui » (MAG-405): they
# are read in their parent's sheet, which every format opens from the dashboard
# (the pane is the calendar's). Ticking, moving and adding are
# the JVM's business (`SubtasksViewModelTest`, `TaskDetailScreenTest`).

- launchApp:
    clearState: true
    permissions:
      all: allow
    arguments:
      e2e_journey: e2e/mobile/flows/15-task-subtasks.yaml

- runFlow: ../subflows/sign-in.yaml

# A task due two days ago and never done stays in « Aujourd'hui », said late in words
# and with its original day (MAG-405). Ticking it takes it out of the day.
- extendedWaitUntil:
    visible: "Renvoyer le formulaire de la mutuelle"
    timeout: 30000
- assertVisible: "En retard de 2 j"
- assertVisible: "prévue le .*"
# Its own box, the closest one left of its title: since MAG-406 the day goes by score,
# and « Payer la cantine » (78) comes before it (72).
- tapOn:
    id: "dashboard_task_check_.*"
    leftOf: "Renvoyer le formulaire de la mutuelle"
- extendedWaitUntil:
    notVisible: "Renvoyer le formulaire de la mutuelle"
    timeout: 30000

# « Aujourd'hui » goes by the order score, each task with its urgency in words (MAG-406):
# « Payer la cantine » 78 (haute), « Rendre le livre » 67 (haute), « Arroser » 55
# (normale), from the seed and the default weights.
- extendedWaitUntil:
    visible: "Payer la cantine"
    timeout: 30000
- assertVisible:
    text: "haute"
    below: "Payer la cantine"
- scrollUntilVisible:
    element: "Arroser"
    timeout: 30000
- extendedWaitUntil:
    visible:
      text: "Arroser"
      below: "Rendre le livre"
    timeout: 20000
- extendedWaitUntil:
    visible:
      text: "En retard de 1 j"
      below: "Rendre le livre"
    timeout: 20000
- extendedWaitUntil:
    visible:
      text: "normale"
      below: "Arroser"
    timeout: 20000

# The witness scores 68, above « Rendre le livre »: back up to it if it scrolled away.
- scrollUntilVisible:
    element: "Préparer le déménagement"
    direction: UP
    timeout: 30000
- tapOn: "Préparer le déménagement"

- extendedWaitUntil:
    visible: "Les cartons sont à la cave"
    timeout: 20000

# The subtasks load once the sheet is open, under the note.
- scrollUntilVisible:
    element: "Changer d'adresse à la banque"
    timeout: 20000

- extendedWaitUntil:
    visible:
      text: "Réserver le camion"
      below: "Les cartons sont à la cave"
    timeout: 20000

- extendedWaitUntil:
    visible:
      text: "Changer d'adresse à la banque"
      below: "Réserver le camion"
    timeout: 20000
