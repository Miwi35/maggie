appId: com.maggie.app.e2e
name: 15-task-subtasks
tags:
  - calendar
---
# A task brought from Google Tasks keeps its notes and its subtasks, in Google's
# order (MAG-404).
#
# The witness is « Préparer le déménagement » (`api/fixtures/e2e/20-calendar.yaml`):
# note « Les cartons sont à la cave », due on the anchor day, with two undated
# subtasks whose positions put « Réserver le camion » before « Changer d'adresse à la
# banque ». The subtasks are not rows of the lists but are read in their parent's
# sheet, opened from the Tâches screen (the Accueil no longer lists tasks, MAG-560).
# Ticking, moving and adding are the JVM's business (`SubtasksViewModelTest`,
# `TaskDetailScreenTest`); the day's order and the « reportée » wording are
# `17-tasks-views`' and `17b-tasks-day`'s.

- launchApp:
    clearState: true
    permissions:
      all: allow
    arguments:
      e2e_journey: e2e/mobile/flows/15-task-subtasks.yaml

- runFlow: ../subflows/sign-in.yaml

- runFlow:
    file: ../subflows/open-destination.yaml
    env:
      DEST: tasks
- extendedWaitUntil:
    visible:
      id: "tasks"
    timeout: 20000

# The witness sits in the reserve, folded under its count.
- tapOn:
    id: "tasks_morning_later"
    optional: true
- extendedWaitUntil:
    visible:
      id: "tasks_reserve_toggle"
    timeout: 30000
- tapOn:
    id: "tasks_reserve_toggle"

- scrollUntilVisible:
    element: "Préparer le déménagement"
    timeout: 30000
- tapOn: "Préparer le déménagement"

- extendedWaitUntil:
    visible: "Les cartons sont à la cave"
    timeout: 20000

# The subtasks load once the sheet is open, under the note.
- scrollUntilVisible:
    element: "Changer d'adresse à la banque"
    timeout: 20000

- extendedWaitUntil:
    visible:
      text: "Réserver le camion"
      below: "Les cartons sont à la cave"
    timeout: 20000

- extendedWaitUntil:
    visible:
      text: "Changer d'adresse à la banque"
      below: "Réserver le camion"
    timeout: 20000
