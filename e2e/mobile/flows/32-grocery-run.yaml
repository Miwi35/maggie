appId: com.maggie.app.e2e
name: 32-grocery-run
tags:
  - grocery
  - layout
---
# The Courses activity's « Tournée » (MAG-762, extends 27-cooking-launch for the activity frame).
#
# Étant donné deux magasins qui ont des articles à prendre (la graine du voisin : « Halles du voisin » puis
#   « Épicerie du coin », dans l'ordre habituel)
# Quand je lance les courses depuis Courses › Liste
# Alors la tournée montre les deux magasins dans l'ordre habituel, sans la barre de Maggie
# Et quand je fais glisser « Épicerie du coin » au-dessus de « Halles du voisin », l'ordre change
# Et quand je lance la tournée, le premier magasin montre son article, que je coche : la progression passe à 1 / 1
# (« Le magasin en cours », MAG-763)
# Et quand je le décoche puis le marque « Manquant », il quitte l'Épicerie du coin : son repli, les Halles du voisin,
#   vient plus loin dans la tournée (« Manquant », MAG-764)
# Et quand je termine l'Épicerie avec 42,80 €, les Halles s'ouvrent avec les Timbres, « manquant chez … », que je
#   prends ; le Poireau, lui, manque et son repli est déjà passé : quand je termine les Halles, l'étape « Manquants sans
#   repli » le montre, et « Prochaine fois » ferme l'activité en le laissant dans la liste (MAG-765).
#
# Signed in as the neighbour, like `08`: the seed gives it a line in each shop. What a JVM test cannot see is the
# real drag on the real list and the immersive window. What is not here: each transition of the tour
# (`GroceryRunViewModelTest`), what the screen draws on a tablet (`GroceryRunScreenTest`), « Supprimer », the amount
# stored on the errand (`EndErrandControllerTest`).

- launchApp:
    clearState: true
    permissions:
      all: allow
    arguments:
      e2e_journey: e2e/mobile/flows/32-grocery-run.yaml
      e2e_email: e2e-other@maggie.local

- runFlow: ../subflows/sign-in.yaml

- runFlow:
    file: ../subflows/open-destination.yaml
    env:
      DEST: grocery
- extendedWaitUntil:
    visible:
      id: "grocery_run_open"
    timeout: 20000
- tapOn:
    id: "grocery_run_open"

# The tour, in the shops' habitual order.
- extendedWaitUntil:
    visible:
      id: "grocery_run_tour"
    timeout: 20000
# Android's own « Viewing full screen » notice covers the top until dismissed.
- tapOn:
    text: "Got it"
    optional: true
- assertNotVisible:
    id: "chat_open"
- assertVisible:
    text: "Épicerie du coin"
    below: "Halles du voisin"

# The second shop dragged to the top: the session's order changes.
- swipe:
    from:
      text: "Déplacer Épicerie du coin"
    direction: UP
    duration: 2000
- extendedWaitUntil:
    visible:
      text: "Halles du voisin"
      below: "Épicerie du coin"
    timeout: 10000

# The store being done: its article, ticked with a thumb.
- tapOn:
    id: "grocery_run_go"
- extendedWaitUntil:
    visible:
      id: "grocery_run_items"
    timeout: 20000
- assertVisible:
    text: "Timbres du voisin"
- assertVisible:
    id: "grocery_run_store_progress"
    text: "0 / 1"
- tapOn:
    text: "Timbres du voisin"
- extendedWaitUntil:
    visible:
      id: "grocery_run_store_progress"
      text: "1 / 1"
    timeout: 10000

# « Manquant » (MAG-764): untick, then mark it missing; its fallback comes later in the tour, so it leaves this shop.
- tapOn:
    text: "Timbres du voisin"
- extendedWaitUntil:
    visible:
      id: "grocery_run_store_progress"
      text: "0 / 1"
    timeout: 10000
- tapOn:
    text: "Manquant"
- extendedWaitUntil:
    notVisible:
      text: "Timbres du voisin"
    timeout: 10000

# « Terminer le magasin » (MAG-765): the summary, then « Montant payé », then the next store of the tour.
- tapOn:
    id: "grocery_run_finish"
- extendedWaitUntil:
    visible:
      id: "grocery_run_recap"
    timeout: 10000
- assertVisible:
    text: ".*à prendre chez Halles du voisin.*"
- tapOn:
    id: "grocery_run_paid"
- inputText: "42,80"
- runFlow: ../subflows/hide-keyboard.yaml
- tapOn:
    id: "grocery_run_recap_confirm"
- extendedWaitUntil:
    visible:
      text: "Terminer Halles du voisin"
    timeout: 20000

# The Halles: the stamps came with « manquant chez … » and are taken; the leek is missing with its fallback behind.
- extendedWaitUntil:
    visible:
      text: "Timbres du voisin"
    timeout: 10000
- tapOn:
    text: "Timbres du voisin"
- tapOn:
    text: "Manquant"
- extendedWaitUntil:
    visible:
      text: ".*pas de repli.*"
    timeout: 10000
# Still there once the API has the mark and the list is read again (recette refusée, MAG-764).
- waitForAnimationToEnd:
    timeout: 3000
- assertVisible:
    text: ".*pas de repli.*"
- assertVisible:
    text: "Annuler"
- tapOn:
    id: "grocery_run_finish"
- extendedWaitUntil:
    visible:
      id: "grocery_run_recap_confirm"
    timeout: 10000
- tapOn:
    id: "grocery_run_recap_confirm"

# « Manquants sans repli », asked once, at the end: « Prochaine fois » keeps the leek, and the activity closes.
- extendedWaitUntil:
    visible:
      id: "grocery_run_leftovers"
    timeout: 20000
- assertVisible:
    text: "Poireau du voisin"
- tapOn:
    text: "Prochaine fois"
- extendedWaitUntil:
    visible:
      id: "grocery_run_end"
    timeout: 10000
- tapOn:
    id: "grocery_run_end_close"
- extendedWaitUntil:
    visible:
      text: ".*Poireau du voisin.*"
    timeout: 20000
