appId: com.maggie.app.e2e
name: 17-task-settings
tags:
  - settings
  - calendar
---
# Réglages › Tâches (MAG-407): when Maggie alerts on a task, per urgency. Every change is
# saved as it is made.
#
# The critical tasks alert at J-3 and J-1 (`scripts/task-settings-api.js` reset). The user
# opens Réglages › Tâches and switches J-3 off on « Critique »; « Enregistré » shows, the
# server holds [1], and the app, started again, reads it back: J-3 is no longer checked.
#
# Then the reminders (MAG-510): « Au plus, par jour » goes to 4 and « Calme » to 22:00 → 07:00;
# the server holds them, and they stay after going back to Réglages and returning, and after a
# restart.
#
# Only these are touched — the order levels, which order « Aujourd'hui » in
# `15-task-subtasks`, stay what the seed made them. « Heure du matin », « Mes moments »,
# « En retard », the sliders and their preview, the defaults, a refused save and the re-read on
# a Mercure message are the JVM's business (`SettingsViewModelTest`, `TaskSettingsScreenTest`).
#
# A chip is a `FilterChip` (role Checkbox): Android reports it `checked`, never `selected`.

- runScript:
    file: ../scripts/task-settings-api.js
    env:
      ACTION: reset

- launchApp:
    clearState: true
    permissions:
      all: allow
    arguments:
      e2e_journey: e2e/mobile/flows/17-task-settings.yaml

- runFlow: ../subflows/sign-in.yaml

- runFlow:
    file: ../subflows/open-destination.yaml
    env:
      DEST: settings
- extendedWaitUntil:
    visible:
      id: "settings_tasks"
    timeout: 20000
- tapOn:
    id: "settings_tasks"

- extendedWaitUntil:
    visible:
      id: "settings_tasks_chip_critical_d3"
      checked: true
    timeout: 30000
- tapOn:
    id: "settings_tasks_chip_critical_d3"
- extendedWaitUntil:
    visible:
      id: "settings_tasks_saved"
    timeout: 20000

- runScript:
    file: ../scripts/task-settings-api.js
    env:
      ACTION: expect
      CRITICAL_DAYS: "1"

# « Rappels et récompenses » (MAG-510): reset to 6 a day, quiet from 21:00 to 08:00. Two taps on
# « − » make it 4; « Calme » becomes 22:00 → 07:00 on the 24 h clock, an hour tapped on the dial,
# the minutes left at 00. The server holds them,
# and back in Réglages then into Tâches again, the screen shows them still.
- scrollUntilVisible:
    element:
      id: "settings_tasks_reminder_cap_minus"
    centerElement: true
    timeout: 20000
- tapOn:
    id: "settings_tasks_reminder_cap_minus"
- extendedWaitUntil:
    visible:
      id: "settings_tasks_reminder_cap_value"
      text: "5"
    timeout: 20000
- tapOn:
    id: "settings_tasks_reminder_cap_minus"
- extendedWaitUntil:
    visible:
      id: "settings_tasks_reminder_cap_value"
      text: "4"
    timeout: 20000

- tapOn:
    id: "settings_tasks_quiet_start"
- extendedWaitUntil:
    visible:
      id: "picker_confirm"
    timeout: 20000
# 22 is on the dial's inner ring, which Material 3 leaves out of the semantics tree (only
# « 0 heures » … « 11 heures » are there): tapped at its place on the CI phone's dial, the
# same angle as 10, closer to the centre.
- tapOn:
    point: "35%,51%"
- tapOn:
    id: "picker_confirm"
- extendedWaitUntil:
    visible:
      id: "settings_tasks_quiet_start"
      text: "22:00"
    timeout: 20000

- tapOn:
    id: "settings_tasks_quiet_end"
- extendedWaitUntil:
    visible:
      id: "picker_confirm"
    timeout: 20000
- tapOn:
    text: "0?7( .*)?"
- tapOn:
    id: "picker_confirm"
- extendedWaitUntil:
    visible:
      id: "settings_tasks_quiet_end"
      text: "07:00"
    timeout: 20000
- extendedWaitUntil:
    visible:
      id: "settings_tasks_saved"
    timeout: 20000

- runScript:
    file: ../scripts/task-settings-api.js
    env:
      ACTION: expect
      CRITICAL_DAYS: "1"
      CAP: "4"
      QUIET_START: "22:00"
      QUIET_END: "07:00"

- back
- extendedWaitUntil:
    visible:
      id: "settings_tasks"
    timeout: 20000
- tapOn:
    id: "settings_tasks"
- scrollUntilVisible:
    element:
      id: "settings_tasks_reminder_cap_value"
      text: "4"
    centerElement: true
    timeout: 30000
- extendedWaitUntil:
    visible:
      id: "settings_tasks_quiet_start"
      text: "22:00"
    timeout: 20000
- extendedWaitUntil:
    visible:
      id: "settings_tasks_quiet_end"
      text: "07:00"
    timeout: 20000

# Read back from the server, not from the screen that changed it: the app starts again,
# still signed in, and opens the section fresh.
- stopApp
- launchApp:
    arguments:
      e2e_journey: e2e/mobile/flows/17-task-settings.yaml
- extendedWaitUntil:
    visible:
      id: "dashboard"
    timeout: 40000
- runFlow:
    file: ../subflows/open-destination.yaml
    env:
      DEST: settings
- extendedWaitUntil:
    visible:
      id: "settings_tasks"
    timeout: 30000
- tapOn:
    id: "settings_tasks"
- extendedWaitUntil:
    visible:
      id: "settings_tasks_chip_critical_d1"
      checked: true
    timeout: 30000
- assertVisible:
    id: "settings_tasks_chip_critical_d3"
    checked: false
- scrollUntilVisible:
    element:
      id: "settings_tasks_reminder_cap_value"
      text: "4"
    centerElement: true
    timeout: 30000
