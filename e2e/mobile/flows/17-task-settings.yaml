appId: com.maggie.app.e2e
name: 17-task-settings
tags:
  - settings
  - calendar
---
# Réglages › Tâches (MAG-407): when Maggie alerts on a task, per urgency. Every change is
# saved as it is made.
#
# The critical tasks alert at J-3 and J-1 (`scripts/task-settings-api.js` reset). The user
# opens Réglages › Tâches and switches J-3 off on « Critique »; « Enregistré » shows, the
# server holds [1], and the app, started again, reads it back: J-3 is no longer selected.
#
# Only that chip is touched — the order levels, which order « Aujourd'hui » in
# `15-task-subtasks`, stay what the seed made them. The time picker, « En retard », the
# sliders and their preview, the defaults, a refused save and the re-read on a Mercure
# message are the JVM's business (`SettingsViewModelTest`, `TaskSettingsScreenTest`).

- runScript:
    file: ../scripts/task-settings-api.js
    env:
      ACTION: reset

- launchApp:
    clearState: true
    permissions:
      all: allow
    arguments:
      e2e_journey: e2e/mobile/flows/17-task-settings.yaml

- runFlow: ../subflows/sign-in.yaml

- runFlow:
    file: ../subflows/open-destination.yaml
    env:
      DEST: settings
- extendedWaitUntil:
    visible:
      id: "settings_tasks"
    timeout: 20000
- tapOn:
    id: "settings_tasks"

- extendedWaitUntil:
    visible:
      id: "settings_tasks_chip_critical_d3"
      selected: true
    timeout: 30000
- tapOn:
    id: "settings_tasks_chip_critical_d3"
- extendedWaitUntil:
    visible:
      id: "settings_tasks_saved"
    timeout: 20000

- runScript:
    file: ../scripts/task-settings-api.js
    env:
      ACTION: expect
      CRITICAL_DAYS: "1"

# Read back from the server, not from the screen that changed it: the app starts again,
# still signed in, and opens the section fresh.
- stopApp
- launchApp:
    arguments:
      e2e_journey: e2e/mobile/flows/17-task-settings.yaml
- extendedWaitUntil:
    visible:
      id: "dashboard"
    timeout: 40000
- runFlow:
    file: ../subflows/open-destination.yaml
    env:
      DEST: settings
- extendedWaitUntil:
    visible:
      id: "settings_tasks"
    timeout: 30000
- tapOn:
    id: "settings_tasks"
- extendedWaitUntil:
    visible:
      id: "settings_tasks_chip_critical_d1"
      selected: true
    timeout: 30000
- assertVisible:
    id: "settings_tasks_chip_critical_d3"
    selected: false
