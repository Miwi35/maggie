appId: com.maggie.app.e2e
name: 02-voice-overlay
tags:
  - voice
---
# The voice overlay opened on a conversation that already has an answer in it
# (MAG-93's voice family), and the chat input with the keyboard up.
#
# **What this proves, and how** (MAG-205). Three of MAG-93's regressions (`24b64ba`,
# `9e24327`, `54e35bd`) are Maggie reading an old reply aloud the moment the overlay
# opens. The flow proves it does not by asking the *server*, not the screen: the
# agent's fake TTS provider counts the syntheses it is asked for, and
# `GET /agent/e2e/tts/syntheses` (agent/app/e2e.py, mounted only under
# `TTS_PROVIDER=fake`, behind `E2E_LOGIN_TOKEN`) reports that number. The counter is
# zeroed just before the overlay opens, and read after a fixed quiet window with the
# old answer on screen — so a build that re-speaks it, however briefly, leaves a
# count of 1 and the flow fails.
#
# Why not look for « Maggie parle... » on screen, which is what this flow tried first.
# Three reasons, each enough on its own:
#
#   1. `VoiceManager.speak()` sets `SPEAKING`, then posts to `/agent/tts/
#      synthesize`. Under `TTS_PROVIDER=fake` that answers two silent 26 ms
#      frames instantly, so on a regressed build the label is on screen for a few
#      hundred milliseconds.
#   2. Maestro's `assertNotVisible` *waits for* a node to disappear. It passes as
#      soon as the state flips, so it would not fail even if it caught the blip.
#   3. `ci.yml` sets `disable-animations: true`, which zeroes
#      `animator_duration_scale`; Compose honours that, so `waitForAnimationToEnd`
#      returns at once and cannot be used as a timer either.
#
# The quiet window is an `extendedWaitUntil` on a text that never appears, `optional`
# so that running out its timeout is the intent: it is the one real timer a flow has.
#
# The setup is part of the proof: the overlay opens on a history that arrived over
# HTTP after composition — the asynchronous arrival all three fixes were about — and
# the old answer is asserted on screen, so there really was something to re-speak.
#
# Needs `E2E_BASE_URL` and `E2E_LOGIN_TOKEN`, which `run.sh` passes with `-e`.
#
# Regex selectors wrapped in `.*` for the reason given in `01-login-chat.yaml`.

- launchApp:
    clearState: true
    permissions:
      all: allow

- runFlow: ../subflows/sign-in.yaml

# ---------------------------------------------------------------------------
# A conversation with an answer in it — what the overlay used to re-speak.
# ---------------------------------------------------------------------------
- tapOn:
    id: "chat_open"
- tapOn:
    id: "chat_input"
- inputText: "Qu'est-ce que j'ai de prévu aujourd'hui ?"
- tapOn:
    id: "chat_send"
- extendedWaitUntil:
    visible: ".*déjeuner avec Alex et votre cours de piano.*"
    timeout: 60000

# ---------------------------------------------------------------------------
# The chat input survives the keyboard — the behaviour `fc168b5` protected,
# which today lives in the text-mode sheet's `windowInsetsPadding(ime ∪
# navigationBars)`.
#
# Asserted by *using* the control, not by looking at it: the IME is a separate
# window and does not clip the app window's node bounds, so a send button sitting
# under the keyboard still reports on-screen bounds and `assertVisible` would
# pass. A tap lands on whatever is actually on top — so if the button were behind
# the keyboard, nothing would be sent.
#
# And asserted on the *answer*, not on the message typed: the text field still
# holds what was typed when a send does not happen, so « the sentence is on
# screen » would pass on the broken build. A second scripted scenario
# (`70-budget-question.yaml`, picked because its answer differs from the first
# one's) gives a signal only a real send can produce.
#
# The keyboard is up: the sheet focuses its field on open, and the exchange above
# typed into it.
# ---------------------------------------------------------------------------
- tapOn:
    id: "chat_input"
- inputText: "Parlons de mes finances, où en est mon budget ?"
- tapOn:
    id: "chat_send"
- extendedWaitUntil:
    visible: ".*budget tient la route ce mois-ci.*"
    timeout: 60000

- tapOn:
    id: "chat_close"

# ---------------------------------------------------------------------------
# Restart the app, *without* clearing its state: still signed in, but the
# conversation now comes back from `GET /agent/messages` after composition. The
# three fixes were all about that arrival; sending and reopening within one
# session leaves the history in memory and the regression out of reach.
# ---------------------------------------------------------------------------
- stopApp
- launchApp
- extendedWaitUntil:
    visible:
      id: "dashboard"
    timeout: 40000

# From here on, any synthesis is the overlay's doing. Zeroed *now* rather than at
# the top of the flow: the text-mode exchanges above may legitimately have been read
# aloud, and the app was just relaunched. The reset's own answer is asserted, so a
# stack whose agent does not serve the counter fails here rather than passing a
# comparison against `undefined` later.
- evalScript: "${output.reset = json(http.delete(E2E_BASE_URL + '/agent/e2e/tts/syntheses', {headers: {'X-E2E-Token': E2E_LOGIN_TOKEN}}).body).count}"
- assertTrue: "${output.reset == 0}"

# The microphone opens the sheet in voice mode. It starts listening by itself —
# on a headless emulator with `-noaudio` that ends in `ERROR`, and neither state
# matters here.
- tapOn:
    id: "chat_mic"

- extendedWaitUntil:
    visible:
      id: "voice_state"
    timeout: 20000

# The reason the flow is worth running: the old answer is in the overlay, so the
# history really did load and there *was* something to re-speak.
- extendedWaitUntil:
    visible: ".*déjeuner avec Alex et votre cours de piano.*"
    timeout: 30000

# The quiet window. The regression speaks as soon as the history lands, which is
# what the wait above just saw, and the request it makes takes milliseconds; five
# seconds is generous for a slow emulator and cheap for a flow that runs a minute.
- extendedWaitUntil:
    visible: ".*ce texte n'apparaît jamais, il sert de minuterie.*"
    timeout: 5000
    optional: true

# The proof: no synthesis was requested since the overlay opened.
- evalScript: "${output.syntheses = json(http.get(E2E_BASE_URL + '/agent/e2e/tts/syntheses', {headers: {'X-E2E-Token': E2E_LOGIN_TOKEN}}).body).count}"
- assertTrue: "${output.syntheses == 0}"

# Kept for what it also catches: a `SPEAKING` that sticks.
- assertNotVisible: ".*Maggie parle.*"
