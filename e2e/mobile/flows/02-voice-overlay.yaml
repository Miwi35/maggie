appId: com.maggie.app.e2e
name: 02-voice-overlay
tags:
  - voice
---
# The voice overlay opened on a conversation that already has an answer in it
# (MAG-93's voice family), and the chat input with the keyboard up.
#
# **What this proves, and how** (MAG-205). Three of MAG-93's regressions (`24b64ba`,
# `9e24327`, `54e35bd`) are Maggie reading an old reply aloud the moment the overlay
# opens. The flow proves it does not by asking the *server*, not the screen: the
# agent's fake TTS provider counts the syntheses it is asked for, and
# `GET /agent/e2e/tts/syntheses` (agent/app/e2e.py, mounted only under
# `TTS_PROVIDER=fake`, behind `E2E_LOGIN_TOKEN`) reports that number. The counter is
# zeroed just before the overlay opens, and read after a fixed quiet window with the
# old answer on screen — so a build that re-speaks it, however briefly, leaves a
# count of 1 and the flow fails.
#
# Why not look for « Maggie parle... » on screen, which is what this flow tried first.
# Three reasons, each enough on its own:
#
#   1. `VoiceManager.speak()` sets `SPEAKING`, then posts to `/agent/tts/
#      synthesize`. Under `TTS_PROVIDER=fake` that answers two silent 26 ms
#      frames instantly, so on a regressed build the label is on screen for a few
#      hundred milliseconds.
#   2. Maestro's `assertNotVisible` *waits for* a node to disappear. It passes as
#      soon as the state flips, so it would not fail even if it caught the blip.
#   3. `ci.yml` sets `disable-animations: true`, which zeroes
#      `animator_duration_scale`; Compose honours that, so `waitForAnimationToEnd`
#      returns at once and cannot be used as a timer either.
#
# The quiet window is an `extendedWaitUntil` on a text that never appears, `optional`
# so that running out its timeout is the intent: it is the one real timer a flow has.
#
# The setup is part of the proof: the overlay opens on a history that arrived over
# HTTP after composition — the asynchronous arrival all three fixes were about — and
# the old answer is asserted on screen, so there really was something to re-speak.
#
# The flow also holds the mic to talk (MAG-221): holding the mic, then letting
# go, sends what was said. The emulator records silence and carries no Google engine,
# and a hold with no voice in it is sent nowhere (MAG-222), so the `e2e` flavor's
# speech engine is scripted, like the agent's fake LLM: `ScriptedDeviceSpeech` hears one
# fixed sentence (`src/e2e/.../ScriptedDeviceSpeech.kt`), and it is sent like a typed
# message. It runs right after the synthesis check, so the messages it adds cannot push
# the old answer out of the overlay before that check.
#
# Since MAG-222 that sentence arrives *uncleaned*: a message on its way to Maggie no
# longer pays for a second model call, only the rule that drops « euh ». The flow
# asserts the absence the same way it asserts the silence above — by asking the agent,
# through `GET /agent/e2e/transcription/cleanups`, how many cleanups the model was
# asked for. The real engine, « the phone's own first », is verified in recette on the
# owner's phone; the Whisper leg by the smoke journey and `chat.spec.ts`.
#
# What MAG-222's retour de recette added, and where each half is proved. « Thank you
# for watching » appeared in the chat without the owner saying a word — Whisper
# inventing subtitle credits over silence — and the hold stopped listening on a pause.
#
#   - *No text out of an audio with no speech.* The agent's gate is the authority and
#     is driven end to end by `chat.spec.ts` (« a clip with no speech in it comes back
#     with no text at all »), through the real route, against a WireMock mapping that
#     answers the hallucination for a marked clip. It cannot be driven from here: the
#     emulator has no sound card, so `src/e2e/` records placeholder bytes it cannot
#     choose, and real sound injected into the emulator was ruled out as too heavy
#     and fragile for CI (owner, 7 Oct.). The phone's own half — the hold that is
#     sent nowhere, « Je n'ai rien entendu » under the button — is
#     `SpeechPresenceTest` and `VoiceManagerTest`.
#   - *Held means held.* `SegmentedDeviceSpeech` restarts the engine at every segment
#     it closes by itself and joins the pieces; the engine is not drivable in CI, so it
#     is `SegmentedDeviceSpeechTest` plus the two `VoiceManagerTest` cases, and the
#     owner's own « phrase with a three-second pause » in recette.
#
# Needs `E2E_BASE_URL` and `E2E_LOGIN_TOKEN`, which `run.sh` passes with `-e`.
#
# Regex selectors wrapped in `.*` for the reason given in `01-login-chat.yaml`.

- launchApp:
    clearState: true
    permissions:
      all: allow
    arguments:
      e2e_journey: e2e/mobile/flows/02-voice-overlay.yaml

- runFlow: ../subflows/sign-in.yaml

# ---------------------------------------------------------------------------
# A conversation with an answer in it — what the overlay used to re-speak.
# ---------------------------------------------------------------------------
- tapOn:
    id: "chat_open"
- tapOn:
    id: "chat_input"
- inputText: "Qu'est-ce que j'ai de prévu aujourd'hui ?"
- tapOn:
    id: "chat_send"
- extendedWaitUntil:
    visible: ".*déjeuner avec Alex et votre cours de piano.*"
    timeout: 60000

# ---------------------------------------------------------------------------
# The chat input survives the keyboard — the behaviour `fc168b5` protected,
# which today lives in the text-mode sheet's `windowInsetsPadding(ime ∪
# navigationBars)`.
#
# Asserted by *using* the control, not by looking at it: the IME is a separate
# window and does not clip the app window's node bounds, so a send button sitting
# under the keyboard still reports on-screen bounds and `assertVisible` would
# pass. A tap lands on whatever is actually on top — so if the button were behind
# the keyboard, nothing would be sent.
#
# And asserted on the *answer*, not on the message typed: the text field still
# holds what was typed when a send does not happen, so « the sentence is on
# screen » would pass on the broken build. A second scripted scenario
# (`70-budget-question.yaml`, picked because its answer differs from the first
# one's) gives a signal only a real send can produce.
#
# The keyboard is up: the sheet focuses its field on open, and the exchange above
# typed into it.
# ---------------------------------------------------------------------------
- tapOn:
    id: "chat_input"
- inputText: "Parlons de mes finances, où en est mon budget ?"
- tapOn:
    id: "chat_send"
- extendedWaitUntil:
    visible: ".*budget tient la route ce mois-ci.*"
    timeout: 60000

- tapOn:
    id: "chat_close"

# ---------------------------------------------------------------------------
# Restart the app, *without* clearing its state: still signed in, but the
# conversation now comes back from `GET /agent/messages` after composition. The
# three fixes were all about that arrival; sending and reopening within one
# session leaves the history in memory and the regression out of reach.
# ---------------------------------------------------------------------------
- stopApp
- launchApp:
    arguments:
      e2e_journey: e2e/mobile/flows/02-voice-overlay.yaml
- extendedWaitUntil:
    visible:
      id: "dashboard"
    timeout: 40000

# From here on, any synthesis is the overlay's doing. Zeroed *now* rather than at
# the top of the flow: the text-mode exchanges above may legitimately have been read
# aloud, and the app was just relaunched. The reset's own answer is asserted, so a
# stack whose agent does not serve the counter fails here rather than passing a
# comparison against `undefined` later.
- evalScript: "${output.reset = json(http.delete(E2E_BASE_URL + '/agent/e2e/tts/syntheses', {headers: {'X-E2E-Token': E2E_LOGIN_TOKEN}}).body).count}"
- assertTrue: "${output.reset == 0}"

# The microphone opens the sheet in voice mode. It no longer listens by itself:
# talking is holding the sheet's own mic button (MAG-221), exercised below.
- tapOn:
    id: "chat_mic"

- extendedWaitUntil:
    visible:
      id: "voice_state"
    timeout: 20000

# The reason the flow is worth running: the old answer is in the overlay, so the
# history really did load and there *was* something to re-speak.
- extendedWaitUntil:
    visible: ".*déjeuner avec Alex et votre cours de piano.*"
    timeout: 30000

# The quiet window. The regression speaks as soon as the history lands, which is
# what the wait above just saw, and the request it makes takes milliseconds; five
# seconds is generous for a slow emulator and cheap for a flow that runs a minute.
- extendedWaitUntil:
    visible: ".*ce texte n'apparaît jamais, il sert de minuterie.*"
    timeout: 5000
    optional: true

# The proof: no synthesis was requested since the overlay opened.
- evalScript: "${output.syntheses = json(http.get(E2E_BASE_URL + '/agent/e2e/tts/syntheses', {headers: {'X-E2E-Token': E2E_LOGIN_TOKEN}}).body).count}"
- assertTrue: "${output.syntheses == 0}"

# Kept for what it also catches: a `SPEAKING` that sticks.
- assertNotVisible: ".*Maggie parle.*"

# Reopening Maggie on a history that ends with her answer reads nothing (MAG-227).
# This is the reproduction of the bug as the owner met it: the assistant gesture opens
# a fresh instance, whose history arrives while the surface is already up, and the old
# code took that load for a request and read the last answer aloud. MAG-205's check
# above missed it because its history was long loaded when the sheet opened.
#
# So: close, restart the app *without* clearing its state (still signed in, history
# on the server), and tap the mic as soon as the dashboard is there — no HTTP call in
# between, which would give the history time to land first. The counter was zero
# above and nothing has spoken since, so it is not reset again.
- tapOn:
    id: "chat_close"
- stopApp
- launchApp:
    arguments:
      e2e_journey: e2e/mobile/flows/02-voice-overlay.yaml
- extendedWaitUntil:
    visible:
      id: "dashboard"
    timeout: 40000
- tapOn:
    id: "chat_mic"
- extendedWaitUntil:
    visible:
      id: "voice_state"
    timeout: 20000
- extendedWaitUntil:
    visible: ".*déjeuner avec Alex et votre cours de piano.*"
    timeout: 30000
- extendedWaitUntil:
    visible: ".*ce texte n'apparaît jamais, il sert de minuterie.*"
    timeout: 5000
    optional: true
- evalScript: "${output.syntheses = json(http.get(E2E_BASE_URL + '/agent/e2e/tts/syntheses', {headers: {'X-E2E-Token': E2E_LOGIN_TOKEN}}).body).count}"
- assertTrue: "${output.syntheses == 0}"

# ---------------------------------------------------------------------------
# The assistant overlay comes and goes, and the sheet's mic still sends (MAG-217).
# `VoiceManager` is a singleton and used to keep one result callback that the sheet
# and the overlay both wrote: opening the overlay replaced the sheet's, closing it
# emptied it, and the next dictation from the sheet was transcribed and dropped.
# The overlay is opened through the e2e flavor's own link (`src/e2e/AndroidManifest
# .xml`) — the system's assistant gesture is out of reach — over the sheet, which
# stays composed behind its translucent window. Closed, the sheet is what is left.
# ---------------------------------------------------------------------------
- openLink: "maggie-e2e-assist://overlay"
- extendedWaitUntil:
    visible: ".*Je vous écoute.*"
    timeout: 20000
- tapOn: "Fermer"
- extendedWaitUntil:
    visible:
      id: "voice_state"
    timeout: 20000

# ---------------------------------------------------------------------------
# Hold to talk (MAG-221): hold the mic, let go, and the dictated sentence is sent.
# `longPressOn` holds for a few seconds, well past the 300 ms below which a press is
# taken for a mistake. The sentence is what `ScriptedDeviceSpeech` hears, minus its
# « euh » — the rule, not the model (MAG-222); the answer is the scripted one
# (`41-grocery-add-dictated.yaml`), which proves the text really went through the chat
# and not just onto the screen.
#
# The counter is zeroed first: the typed exchanges above cannot have cleaned anything,
# but a stack that served a stale count would otherwise pass the check below for the
# wrong reason.
# ---------------------------------------------------------------------------
- evalScript: "${output.cleanups = json(http.delete(E2E_BASE_URL + '/agent/e2e/transcription/cleanups', {headers: {'X-E2E-Token': E2E_LOGIN_TOKEN}}).body).count}"
- assertTrue: "${output.cleanups == 0}"

- longPressOn:
    id: "voice_mic"

- extendedWaitUntil:
    visible: ".*ajoute des tomates à la liste de courses.*"
    timeout: 60000
- extendedWaitUntil:
    visible: ".*quatre tomates.*"
    timeout: 60000

# The proof: the sentence reached Maggie without a cleanup on the way (MAG-222).
- evalScript: "${output.cleanups = json(http.get(E2E_BASE_URL + '/agent/e2e/transcription/cleanups', {headers: {'X-E2E-Token': E2E_LOGIN_TOKEN}}).body).count}"
- assertTrue: "${output.cleanups == 0}"

# ---------------------------------------------------------------------------
# Held actions in the overlay (MAG-310). A deletion Maggie asks permission for shows
# up as a card in the overlay — the one she is asked about in the chat, and the one
# the overlay used to ignore, leaving the owner to open the app to answer. The
# request is typed in the sheet (the fake model holds `delete_event`, as it does for
# the real one, `73-delete-event-held.yaml`), then the overlay is opened: the card is
# loaded with it, touched, and the event is gone from the database.
#
# The question is read aloud when the overlay opens: asked of the server, as above, by
# the syntheses counter.
#
# What is *not* driven here: saying « oui ». The stubbed Whisper hears one fixed
# sentence (« ajoute des tomates… »), so a spoken answer cannot be scripted without
# a stateful stub that would make the clips above fragile. It is covered on the JVM,
# piece by piece: the recognition of yes/no — « oui mais… », « non merci », silence —
# in `SpokenApprovalAnswerTest`; a yes only answering a card that was read out, in
# `ChatViewModelTest`; where a heard sentence goes, and the microphone freed after an
# answer, in `VoiceResultRouterTest` and `VoiceManagerTest`; the question asked and the
# listening reopened, in `AssistantOverlayScreenTest`. The card is answered here by
# touch, which is the same `approve` the voice calls.
# ---------------------------------------------------------------------------
# The voice sheet's close button, under the status bar, did not close it here once
# the hold-to-talk had run (MAG-310): the flow leaves the sheet as it does above, by
# restarting the app, still signed in.
- tapOn:
    id: "chat_close"
- stopApp
- launchApp:
    arguments:
      e2e_journey: e2e/mobile/flows/02-voice-overlay.yaml
- extendedWaitUntil:
    visible:
      id: "dashboard"
    timeout: 40000
- runScript:
    file: ../scripts/event-api.js
    env:
      ACTION: create
      SUMMARY: Test validation MAG-310
- tapOn:
    id: "chat_open"
- tapOn:
    id: "chat_input"
- inputText: "Supprime l'événement Test validation ${output.eventId}"
- tapOn:
    id: "chat_send"
- extendedWaitUntil:
    visible: ".*Je te demande ton accord pour supprimer.*"
    timeout: 60000
- tapOn:
    id: "chat_close"
- extendedWaitUntil:
    visible:
      id: "dashboard"
    timeout: 20000

# The card appears with the overlay, and the event is still there: nothing is done
# before the owner's word.
- evalScript: "${output.reset = json(http.delete(E2E_BASE_URL + '/agent/e2e/tts/syntheses', {headers: {'X-E2E-Token': E2E_LOGIN_TOKEN}}).body).count}"
- assertTrue: "${output.reset == 0}"
- openLink: "maggie-e2e-assist://overlay"
- extendedWaitUntil:
    visible: ".*Maggie demande ton accord.*"
    timeout: 30000
- extendedWaitUntil:
    visible: ".*ce texte n'apparaît jamais, il sert de minuterie.*"
    timeout: 5000
    optional: true
- evalScript: "${output.syntheses = json(http.get(E2E_BASE_URL + '/agent/e2e/tts/syntheses', {headers: {'X-E2E-Token': E2E_LOGIN_TOKEN}}).body).count}"
- assertTrue: "${output.syntheses >= 1}"
- runScript:
    file: ../scripts/event-api.js
    env:
      ACTION: expect
      STATE: present
      EVENT_ID: ${output.eventId}

- tapOn: "Autoriser"
- extendedWaitUntil:
    visible: ".*l'événement Test validation est supprimé.*"
    timeout: 60000
- extendedWaitUntil:
    notVisible: ".*Maggie demande ton accord.*"
    timeout: 30000
- runScript:
    file: ../scripts/event-api.js
    env:
      ACTION: expect
      STATE: absent
      EVENT_ID: ${output.eventId}
- tapOn: "Fermer"

# Settings > Voix used to end this flow — the assistant role row with its state,
# reached by relaunching the app and walking the drawer, because a flow of its own
# would have paid for a second sign-in. It is a screen reading a `RoleManager`, so
# it now runs on the JVM, where the role can be *set* and each of its three states
# asserted as itself instead of as an alternation:
# `mobile/app/src/test/…/settings/VoiceSettingsScreenTest.kt` (MAG-242).
#
# What is still nobody's test is the tap: it opens a system dialog outside this
# harness, and accepting it would make Maggie the emulator's assistant for the rest
# of the run. That one is the owner's, on his phone, in Recette. The screen context
# (`onHandleAssist`) is out of reach for the same reason and has its own unit tests:
# `AssistTextCollectorTest`, `ScreenContextTest`, `AssistLaunchCoordinatorTest`.
