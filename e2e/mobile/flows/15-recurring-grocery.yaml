appId: com.maggie.app.e2e
name: 15-recurring-grocery
tags:
  - grocery
  - recurring
---
# The owner can make a product come back by itself, from the phone (MAG-369, refused
# recette: the engine existed and the app had no way to reach it). Two ways in, both
# played here: the « Récurrent » setting in the detail of a list line, and the
# « Récurrents » tab with its product search. The tab reads the frequency and the next
# due date the API computes.
#
# Signed in as the neighbour, like `08`: the owner's « Lait » is already recurring and
# ticked, so a journey on it would rewrite the seed other suites rely on. « Timbres du
# voisin » is a product of the neighbour's list with no recurring item, and the flow
# leaves it as found (no item, no indicator) — `08-grocery-realtime` expects that line
# unticked and untouched.
#
# The JVM tests (`RecurringGroceryViewModelTest`, `RecurringGroceryScreenTest`) own the
# cases (no second item, the errors, the empty tab); this is the one run against the
# real API that the request bodies and the Mercure refresh are right.

- launchApp:
    clearState: true
    permissions:
      all: allow
    arguments:
      e2e_journey: e2e/mobile/flows/15-recurring-grocery.yaml
      e2e_email: e2e-other@maggie.local

- runFlow: ../subflows/sign-in.yaml

- runFlow:
    file: ../subflows/open-destination.yaml
    env:
      DEST: grocery
- extendedWaitUntil:
    visible:
      id: "grocery"
    timeout: 20000
- extendedWaitUntil:
    visible:
      text: ".*Timbres du voisin.*"
      below: "Épicerie du coin"
    timeout: 30000

# The screen opens on the list: no recurring item yet, so no indicator.
- extendedWaitUntil:
    notVisible:
      id: "recurring_indicator"
    timeout: 10000

# ---------------------------------------------------------------------------
# The line's detail: « Toutes les semaines ». The control is applied on tap; the form
# is then closed with « Enregistrer » because a sheet (phone) and a pane (tablet,
# foldable) are not dismissed the same way, and that button is on both.
# ---------------------------------------------------------------------------
- tapOn: "Timbres du voisin"
- extendedWaitUntil:
    visible:
      id: "recurring_option_weekly"
    timeout: 20000
- tapOn:
    id: "recurring_option_weekly"

# The form is taller than a short window: Maestro does not scroll for a tap.
- scrollUntilVisible:
    element: "Enregistrer"
- tapOn: "Enregistrer"

# The line says so: repeat icon and frequency, under its name.
- extendedWaitUntil:
    visible:
      id: "recurring_indicator"
    timeout: 30000

# ---------------------------------------------------------------------------
# The tab: label, frequency, next due date. The date is the API's (`nextDueAt`), so
# only its shape is asserted, not a day that moves with the clock.
# ---------------------------------------------------------------------------
- tapOn:
    id: "grocery_tab_recurring"
- extendedWaitUntil:
    visible:
      text: "Prochain ajout.*"
      below: "Timbres du voisin"
    timeout: 30000
- extendedWaitUntil:
    visible: "Toutes les semaines"
    timeout: 10000

# Removed from the tab.
- tapOn: "Retirer Timbres du voisin"
- extendedWaitUntil:
    notVisible: "Timbres du voisin"
    timeout: 30000

# ---------------------------------------------------------------------------
# The tab's « Ajouter un produit »: a full-screen search, then the frequency (weekly
# offered first), then « Ajouter ».
# ---------------------------------------------------------------------------
- tapOn:
    id: "recurring_add"
- extendedWaitUntil:
    visible:
      id: "product_search"
    timeout: 20000
# Touched before typing: the focus the dialog asks for is not something to count on.
- tapOn:
    id: "product_search"
- inputText: "Timbres"
- extendedWaitUntil:
    visible: "Timbres du voisin"
    timeout: 20000
- tapOn: "Timbres du voisin"

# Weekly is the default of the add dialog; the tab's row below proves it.
- extendedWaitUntil:
    visible:
      id: "recurring_option_weekly"
    timeout: 20000
- tapOn: "Ajouter"

- extendedWaitUntil:
    visible:
      text: "Prochain ajout.*"
      below: "Timbres du voisin"
    timeout: 30000
- extendedWaitUntil:
    visible: "Toutes les semaines"
    timeout: 10000

# ---------------------------------------------------------------------------
# Left as found: removed from the tab, and the list shows the line without indicator.
# ---------------------------------------------------------------------------
- tapOn: "Retirer Timbres du voisin"
- extendedWaitUntil:
    notVisible: "Timbres du voisin"
    timeout: 30000

- tapOn:
    id: "grocery_tab_list"
- extendedWaitUntil:
    visible:
      text: ".*Timbres du voisin.*"
      below: "Épicerie du coin"
    timeout: 30000
- extendedWaitUntil:
    notVisible:
      id: "recurring_indicator"
    timeout: 10000
