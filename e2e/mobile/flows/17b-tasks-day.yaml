appId: com.maggie.app.e2e
name: 17b-tasks-day
tags:
  - calendar
---
# « Aujourd'hui » as the tasks of the day (MAG-766, extends the tasks journey MAG-98).
#
# Étant donné une tâche à 10:00 en urgence Haute, et « Méditer » chronométrée de 20 min
# Quand j'ouvre Tâches › Aujourd'hui
# Alors « à 10:00 » et « Haute » sont affichés, et seule « Méditer » porte « 20 min »
# Quand je coche la première
# Alors l'anneau passe à « 1 sur 2 »
#
# À toute heure (MAG-825) : le soir ne remplace plus la journée — ni « Qu'est-ce qui t'a aidé ? »
# ni « Bonne nuit » sur Tâches ; le bilan du soir est l'activité « Bilan de la journée » (`33-bilan-soir`).
#
# A new user: the two tasks are its only ones, written by `scripts/today-tasks-api.js`. The tick
# opens the Bravo (MAG-508); « Retour à ma journée » brings the day back, the ring moved, and the
# script reads the task done in the database.
#
# What is not here: each pill's wording, the deadline pills, a task done struck without pills, the
# reserve, a tick refused, the Focus opened timer on (`TodayRowsTest`, `TasksDayScreenTest`,
# `TasksViewModelTest`, `FocusViewModelTest`).

- runFlow: ../subflows/new-user.yaml

- evalScript: ${output.tag = 'MAG-766 ' + (Math.floor(Math.random() * 90000) + 10000)}

- runScript:
    file: ../scripts/today-tasks-api.js
    env:
      ACTION: create
      EMAIL: ${output.journeyEmail}
      TAG: ${output.tag}
      TODAY: ${TODAY}

- launchApp:
    clearState: true
    permissions:
      all: allow
    arguments:
      e2e_journey: e2e/mobile/flows/17b-tasks-day.yaml
      e2e_email: ${output.journeyEmail}

- runFlow: ../subflows/sign-in.yaml

- runFlow:
    file: ../subflows/open-destination.yaml
    env:
      DEST: tasks
- extendedWaitUntil:
    visible:
      id: "tasks"
    timeout: 20000

# The day: both tasks with their box, the ring at « 0 sur 2 », no « C'est parti ».
- extendedWaitUntil:
    visible:
      id: "tasks_today_check_${output.garageId}"
    timeout: 30000
- assertVisible:
    id: "tasks_ring"
- assertVisible: ".*0 sur 2.*"
- assertNotVisible: ".*Qu'est-ce qui t'a aidé.*"
- assertNotVisible: "Bonne nuit"
- assertNotVisible: ".*C'est parti.*"

# « à 10:00 » and « Haute » in the garage task's pills, no timer on it.
- assertVisible:
    text: "à 10:00"
    childOf:
      id: "tasks_today_when_${output.garageId}"
- assertVisible:
    text: "Haute"
    childOf:
      id: "tasks_today_urgency_${output.garageId}"
- assertNotVisible:
    id: "tasks_today_timer_${output.garageId}"

# Only « Méditer » has the timer, « 20 min ».
- scrollUntilVisible:
    element:
      id: "tasks_today_timer_${output.meditateId}"
    timeout: 20000
- extendedWaitUntil:
    visible:
      text: "20 min"
      childOf:
        id: "tasks_today_timer_${output.meditateId}"
    timeout: 10000

# Ticked from the list: the Bravo, then back to the day, the ring at « 1 sur 2 ».
- runFlow: ../subflows/scroll-list-top.yaml
- tapOn:
    id: "tasks_today_check_${output.garageId}"
- extendedWaitUntil:
    visible:
      id: "bravo"
    timeout: 20000
- tapOn:
    id: "bravo_back"
- extendedWaitUntil:
    visible:
      id: "tasks_ring"
    timeout: 20000
- extendedWaitUntil:
    visible: ".*1 sur 2.*"
    timeout: 20000
- runScript:
    file: ../scripts/today-tasks-api.js
    env:
      ACTION: expect-done
      EMAIL: ${output.journeyEmail}
      TAG: ${output.tag}
      TODAY: ${TODAY}
      TASK_ID: ${output.garageId}
