appId: com.maggie.app.e2e
name: finance-overview
tags:
  - finance
---
# The finance home from the phone: the rings, the curve and the three tiles (MAG-420, extends MAG-102).
#
# Étant donné deux comptes dont un matelas, un salaire de référence déclaré et des enveloppes
#   (le compte du propriétaire, `api/fixtures/e2e/50-finance.yaml`)
# Quand j'ouvre les finances
# Alors je vois l'anneau de la semaine, celui du mois et la courbe du rythme
# Et la tuile Comptes, avec le matelas mis de côté
# Et la tuile Budget, avec le salaire attendu et le solde attendu avant le salaire
# Et la tuile Planification
# Et le bloc « Prochain projet » : le premier projet du planning (MAG-529), plus l'exemple figé, et rien à ouvrir
# Quand je touche la tuile Comptes
# Alors la liste des comptes s'ouvre
# Quand je touche « Comptes ▾ » puis « Revue »
# Alors le titre dit « Finance › Revue » et une seule rangée : Toutes · À qualifier · Reconnues
# Quand je touche « À qualifier »
# Alors la liste est filtrée sur ce qui reste à qualifier (MAG-537)
#
# A tile is one tappable card: Compose merges what is inside it, so its figures are read through
# the card's own text, not through ids of their own. The amounts are not asserted — they are drawn
# with the phone's locale (`FinanceDashboardTilesScreenTest` reads them) and the owner's account
# is shared with the other finance flows; only the labels and the absence of the empty states are.

- launchApp:
    clearState: true
    permissions:
      all: allow
    arguments:
      e2e_journey: e2e/mobile/flows/finance-overview.yaml

- runFlow: ../subflows/sign-in.yaml

- openLink: "maggie-e2e://finance"

- extendedWaitUntil:
    visible:
      id: "finance_score_ring_week"
    timeout: 30000
- assertVisible:
    id: "finance_score_ring_month"

- scrollUntilVisible:
    element:
      id: "finance_rhythm_curve"
    timeout: 30000
# With the chat panel the home has two columns, each its own list: the next project is under the
# rings and the curve on the left, and a scroll from the screen's centre lands in the right one.
- evalScript: ${0}
- runFlow:
    when:
      visible:
        id: "chat_panel"
    commands:
      - swipe:
          from:
            id: "finance_score_ring_week"
          direction: UP
# Scroll to the date, not to the card: a sliver of the card's top can peek above Maggie's bar and
# count as visible while the date row is still under it.
- scrollUntilVisible:
    element:
      id: "finance_next_project_date"
    timeout: 30000
# The block reads the planning: a purchase month under the name, and never the old frozen example.
# Which project is first is not asserted: `23-finance-projects.yaml` reorders the owner's two, and
# the sentence of a negative return needs an overrun the owner's account does not carry (the API
# and the ViewModel tests read it; the web journey walks it on an account of its own).
- extendedWaitUntil:
    visible:
      id: "finance_next_project_date"
    timeout: 30000
- assertNotVisible: ".*Vélo électrique.*"

- scrollUntilVisible:
    element:
      id: "finance_tile_accounts"
    visibilityPercentage: 50
    timeout: 30000
# The foldable's list ends above Maggie's bar: the tile's lines are scrolled to.
- scrollUntilVisible:
    element:
      text: ".*matelas.*"
    timeout: 30000

# The tile is taller than the screen: scroll to its lines, not to the card (50 % of it in view
# says nothing about its bottom half).
- scrollUntilVisible:
    element:
      text: ".*Salaire attendu.*"
    timeout: 30000
- scrollUntilVisible:
    element:
      text: ".*Solde attendu avant le salaire.*"
    timeout: 30000
# The salary is declared on the seeded matelas: never the « not declared » empty state.
- assertNotVisible: ".*salaire non déclaré.*"

- scrollUntilVisible:
    element:
      text: ".*Capacité d'épargne nette.*"
    timeout: 30000

# A tile leads to its menu. Back to the top first, then down to the tile: scrolling down from the
# bottom of the page leaves the tile as a sliver under the month header, and the tap lands on the header.
# On the two columns the rings are in the other list, scrolled apart: the tile is looked for upwards.
- evalScript: ${0}
- runFlow:
    when:
      notVisible:
        id: "chat_panel"
    commands:
      - scrollUntilVisible:
          element:
            id: "finance_score_ring_week"
          direction: UP
          timeout: 30000
      - scrollUntilVisible:
          element:
            id: "finance_tile_accounts"
          visibilityPercentage: 100
          centerElement: true
          timeout: 30000
- evalScript: ${0}
- runFlow:
    when:
      visible:
        id: "chat_panel"
    commands:
      - scrollUntilVisible:
          element:
            id: "finance_tile_accounts"
          direction: UP
          visibilityPercentage: 100
          centerElement: true
          timeout: 30000
- tapOn:
    id: "finance_tile_accounts"
- extendedWaitUntil:
    visible: "Comptes"
    timeout: 20000

# The header is « Finance › Section ▾ » (MAG-537): the section button opens the seven sections, the current one
# is checked, and choosing Revue opens it with its single row of sub-views.
- assertVisible:
    id: "breadcrumb_module"
- tapOn:
    id: "breadcrumb_section"
- extendedWaitUntil:
    visible:
      id: "breadcrumb_menu_planning"
    timeout: 20000
- assertVisible:
    id: "breadcrumb_menu_accounts"
    selected: true
- tapOn:
    id: "breadcrumb_menu_review"
- extendedWaitUntil:
    visible:
      id: "subview_all"
    timeout: 20000
- assertVisible:
    id: "breadcrumb_section"
    text: "Revue"
- assertVisible:
    id: "subview_all"
    selected: true
- assertVisible:
    id: "subview_to_qualify"
- assertVisible:
    id: "subview_recognised"
# « À qualifier » filters the list; the row follows the tap.
- tapOn:
    id: "subview_to_qualify"
- extendedWaitUntil:
    visible:
      id: "subview_to_qualify"
      selected: true
    timeout: 20000
- assertNotVisible:
    id: "review_list_section_recognised"
