appId: com.maggie.app.e2e
name: 20-grocery-product-search
tags:
  - grocery
---
# « Ajouter un article » finds an existing product whatever the case, the accents
# or a plural s/x (MAG-759): « timbre du voisins » proposes « Timbres du voisin »,
# the product the seed gives the neighbour. Nothing is written: the sheet is closed
# without adding.

- launchApp:
    clearState: true
    permissions:
      all: allow
    arguments:
      e2e_journey: e2e/mobile/flows/20-grocery-product-search.yaml
      e2e_email: e2e-other@maggie.local

- runFlow: ../subflows/sign-in.yaml

- runFlow:
    file: ../subflows/open-destination.yaml
    env:
      DEST: grocery
- extendedWaitUntil:
    visible:
      id: "grocery"
    timeout: 20000

- tapOn: "Ajouter un article"
- extendedWaitUntil:
    visible:
      id: "grocery_add_product"
    timeout: 20000
- tapOn:
    id: "grocery_add_product"
- extendedWaitUntil:
    visible: "Fermer la recherche"
    timeout: 20000
- tapOn:
    id: "product_search"
- inputText: "TIMBRE du voisins"
- extendedWaitUntil:
    visible: "Timbres du voisin"
    timeout: 20000
- assertVisible: "Produit · .*"
- eraseText: 30
- inputText: "Zzzqx inconnu"
- extendedWaitUntil:
    visible: "+ Créer.*Zzzqx inconnu.*"
    timeout: 20000

# The category is read in French, as on the product sheet (MAG-794), never « produce ».
- tapOn: "Fermer la recherche"
- extendedWaitUntil:
    visible:
      id: "grocery_add_product"
    timeout: 20000
- scrollUntilVisible:
    element: "Catégorie"
    timeout: 20000
- tapOn: "Catégorie"
- extendedWaitUntil:
    visible: "Fruits et légumes"
    timeout: 20000
- assertNotVisible: "produce"
