appId: com.maggie.app.e2e
name: 27-cooking-launch
tags:
  - cookbook
  - layout
# A failure while turned must not leave the phone in landscape for the next flow of the shard.
onFlowComplete:
  - setOrientation: PORTRAIT
---
# The Cuisine activity, launched from a recipe (MAG-580, extends 12-recipe-steps and 14-rotation), then
# followed step by step (MAG-581), with its timers (MAG-582) and the steps column (MAG-614).
#
# Étant donné une recette de deux portions avec ses étapes
# Quand je tape « Cuisiner » sur sa fiche
# Alors « Pour combien ? » est prérempli avec 2 ; « Continuer » ouvre la préparation, sans la barre de Maggie
# Et quand je commence la recette, le bandeau des étapes dit « 0 / 5 faites » ; tourné, la colonne des étapes
#   est à gauche, même étape, même progression
# Et quand je tape « Lancer et continuer » sur l'étape 1 (en fond), le minuteur « Eau » tourne et l'étape 2 s'ouvre,
#   l'étape 1 n'est pas cochée ; « Suivant » coche l'étape 2 : « 1 / 5 faites »
# Et quand j'ouvre la feuille des étapes depuis le bandeau et touche l'étape 5, elle s'affiche sans être cochée
#   et « Suivant » n'est jamais retenu
# Et tourné, la colonne montre le minuteur de l'eau sur la ligne de l'étape 1 ; je touche l'étape 3, « Lancer et
#   continuer » lance « Pâtes » : deux minuteurs sur leurs lignes
# Et quand je reviens à l'étape 3 et tape ✕ (MAG-615), aucune question : je suis sur la fiche, qui dit « ▶ Reprendre »
#   et « étape 3/5 » ; « Reprendre » rouvre l'étape 3, « 1 / 5 faites » ; « Recommencer » (colonne tournée) me remet
#   à la préparation
#
# What a JVM test cannot see is the real activity being recreated by a real rotation, the window's
# immersive mode, the sheet's own window, and the back stack that brings ✕ back to the sheet. The recipe is
# this flow's own, created over HTTP by `scripts/recipe-api.js` and deleted at the end. What is not here: each
# transition of the session (`CookingSessionTest`, `CookingViewModelTest`), what the screens draw
# (`CookingScreensTest`), the tablet's 64 dp buttons,
# a timer's end and its lit line (`CookingViewModelTest`, `CookingScreensTest`: ten minutes is too long for a journey).

- runFlow: ../subflows/new-user.yaml

- launchApp:
    clearState: true
    permissions:
      all: allow
    arguments:
      e2e_journey: e2e/mobile/flows/27-cooking-launch.yaml
      e2e_email: ${output.journeyEmail}

- runFlow: ../subflows/sign-in.yaml

- runScript:
    file: ../scripts/recipe-api.js
    env:
      EMAIL: ${output.journeyEmail}
      ACTION: create-method
      RECIPE: Pâtes aux légumes MAG-580

# Opened by its link: the cookbook list shows a page of the recipes of the whole test database.
- openLink: "maggie-e2e://recipe/${output.recipeId}"
- extendedWaitUntil:
    visible: "Matériel"
    timeout: 20000
- scrollUntilVisible:
    element:
      id: "recipe_cook"
    centerElement: true
- tapOn:
    id: "recipe_cook"

# « Pour combien ? », filled with the recipe's own two servings.
- extendedWaitUntil:
    visible:
      id: "cooking_servings"
    timeout: 20000
- assertVisible: "Pour combien ?"
- assertVisible:
    id: "cooking_servings_value"
- assertVisible: "La recette est prévue pour 2."
- tapOn:
    id: "cooking_continue"

# The preparation: everything on the counter, and Maggie's bottom bar nowhere.
- extendedWaitUntil:
    visible:
      id: "cooking_preparation"
    timeout: 20000
# Android's own « Viewing full screen » notice, shown once when the immersive mode starts, covers the title
# and ✕ until dismissed: dismissed before anything at the top is asserted.
- tapOn:
    text: "Got it"
    optional: true
- extendedWaitUntil:
    visible: "On sort tout"
    timeout: 10000
- extendedWaitUntil:
    visible:
      id: "cooking_start"
    timeout: 20000
- assertNotVisible:
    id: "chat_open"

# First step: the banner (phone upright) tells nothing is done yet.
- tapOn:
    id: "cooking_start"
- extendedWaitUntil:
    visible: "Étape 1 sur 5"
    timeout: 20000
- assertVisible: "Mettre l'eau à bouillir"
- assertVisible:
    id: "cooking_steps_banner_progress"
    text: "0 / 5 faites"

# Turned: the same step, still full screen, the steps column at the left of it.
- setOrientation: LANDSCAPE_LEFT
- extendedWaitUntil:
    visible:
      id: "cooking_steps_column"
    timeout: 20000
- assertVisible: "Étape 1 sur 5"
- assertVisible:
    id: "cooking_steps_progress"
    text: "0 / 5 faites"
- assertNotVisible:
    id: "chat_open"

- setOrientation: PORTRAIT
- extendedWaitUntil:
    visible: "Étape 1 sur 5"
    timeout: 20000

# Step 1 boils in the background: « Lancer et continuer » starts its timer and goes on, step 1 not ticked.
- assertVisible: "Lancer et continuer"
- tapOn:
    id: "cooking_next"
- extendedWaitUntil:
    visible: "Étape 2 sur 5"
    timeout: 20000
- assertVisible: "Couper les légumes"
- assertVisible:
    id: "cooking_steps_banner_progress"
    text: "0 / 5 faites"

# « Suivant » ticks step 2 and nothing holds step 3 back, whatever the water does.
- tapOn:
    id: "cooking_next"
- extendedWaitUntil:
    visible: "Étape 3 sur 5"
    timeout: 20000
- assertVisible:
    id: "cooking_steps_banner_progress"
    text: "1 / 5 faites"

# The banner opens the sheet of the steps; touching step 5 shows it, ticking nothing.
- tapOn:
    id: "cooking_steps_banner"
- extendedWaitUntil:
    visible:
      id: "cooking_steps_sheet"
    timeout: 20000
- assertVisible:
    id: "cooking_steps_progress"
    text: "1 / 5 faites"
- tapOn: "Égoutter, mélanger"
- extendedWaitUntil:
    visible: "Étape 5 sur 5"
    timeout: 20000
- assertVisible:
    id: "cooking_steps_banner_progress"
    text: "1 / 5 faites"
- assertVisible:
    id: "cooking_next"
    enabled: true

# Turned: the water's timer runs on the line of step 1, read back from the API.
- setOrientation: LANDSCAPE_LEFT
- extendedWaitUntil:
    visible:
      id: "cooking_steps_column"
    timeout: 20000
- assertVisible: "Étape 5 sur 5"
- assertVisible:
    id: "cooking_steps_progress"
    text: "1 / 5 faites"
- extendedWaitUntil:
    visible:
      id: "cooking_timer_row_clock"
      text: "[0-9][0-9]:[0-9][0-9]"
    timeout: 20000

# Back on step 3 by its line: « Lancer et continuer » starts « Pâtes », a second timer on its own line.
- tapOn: "Cuire les pâtes"
- extendedWaitUntil:
    visible: "Étape 3 sur 5"
    timeout: 20000
- tapOn:
    id: "cooking_next"
- extendedWaitUntil:
    visible: "Étape 4 sur 5"
    timeout: 20000
- extendedWaitUntil:
    visible:
      id: "cooking_timer_row_clock"
      text: "[0-9][0-9]:[0-9][0-9]"
      index: 1
    timeout: 20000

- setOrientation: PORTRAIT
- extendedWaitUntil:
    visible: "Étape 4 sur 5"
    timeout: 20000
- assertVisible:
    id: "cooking_steps_banner_progress"
    text: "1 / 5 faites"

# Back on step 3 by the sheet, then ✕: no question, the timers keep running, the recipe's sheet is back.
- tapOn:
    id: "cooking_steps_banner"
- extendedWaitUntil:
    visible:
      id: "cooking_steps_sheet"
    timeout: 20000
- tapOn: "Cuire les pâtes"
- extendedWaitUntil:
    visible: "Étape 3 sur 5"
    timeout: 20000
- tapOn:
    id: "activity_quit"
- assertNotVisible: "Quitter l'activité ?"
- extendedWaitUntil:
    notVisible:
      id: "cooking_step"
    timeout: 15000
- extendedWaitUntil:
    visible: "Matériel"
    timeout: 20000

# The recipe's sheet now says where the cook stood; « Reprendre » opens step 3 again, nothing lost.
- scrollUntilVisible:
    element:
      id: "recipe_cook_resume"
    centerElement: true
- extendedWaitUntil:
    visible:
      id: "recipe_cook_resume_detail"
      text: "étape 3/5.*"
    timeout: 20000
- assertNotVisible:
    id: "recipe_cook"
- tapOn:
    id: "recipe_cook_resume"
- extendedWaitUntil:
    visible: "Étape 3 sur 5"
    timeout: 20000
- assertVisible: "Cuire les pâtes"
- assertVisible:
    id: "cooking_steps_banner_progress"
    text: "1 / 5 faites"

# « Recommencer » at the head of the steps column: back to the preparation, the ticks gone.
- setOrientation: LANDSCAPE_LEFT
- extendedWaitUntil:
    visible:
      id: "cooking_steps_column"
    timeout: 20000
- tapOn:
    id: "cooking_restart"
- extendedWaitUntil:
    visible:
      id: "cooking_start"
    timeout: 20000
- setOrientation: PORTRAIT
- tapOn:
    id: "activity_quit"
- extendedWaitUntil:
    visible: "Matériel"
    timeout: 20000

# Left as found.
- runScript:
    file: ../scripts/recipe-api.js
    env:
      EMAIL: ${output.journeyEmail}
      ACTION: remove
      RECIPE: Pâtes aux légumes MAG-580
