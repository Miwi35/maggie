appId: com.maggie.app.e2e
name: open the calendar in week view
---
# From the Accueil to the week view, the way a person gets there: through the
# navigation — the burger and its drawer under 600 dp, the rail beyond, which
# `open-destination.yaml` chooses — then « Calendrier ». By id: « Calendrier » is
# also the title of the screen once it is open.
#
# Expects the Accueil on screen, which is what `sign-in.yaml` leaves.
- runFlow:
    file: open-destination.yaml
    env:
      DEST: calendar

# The week is pinned rather than assumed: it is a view type the screen is free to
# default differently one day, and the day cells these journeys read only exist
# there. Waiting on the switch first says « the calendar is not open » when it
# is not, instead of failing a tap two lines later.
- extendedWaitUntil:
    visible:
      id: "calendar_view_week"
    timeout: 20000

- tapOn:
    id: "calendar_view_week"

# Today's header is the proof the week is drawn. It is always in the current week,
# so a flow can wait on it before asking whether another day is — a
# `notVisible` evaluated one frame early would read « not there yet » as « not in
# this week ».
- extendedWaitUntil:
    visible:
      id: "calendar_day_${TODAY}"
    timeout: 20000
