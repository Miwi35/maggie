appId: com.maggie.app.e2e
name: sign in as the seeded user
---
# The login screen of the `e2e` flavor is the production one: same button, same
# logo. Only the door behind it differs — `src/e2e/E2eSignIn.kt` posts to
# `/api/auth/e2e/login` instead of opening Google Credential Manager, which is a
# system dialog Maestro cannot reach.
#
# Waited for, not asserted: this is the first frame after a cold `launchApp`, and
# everything in `MaggieApp.onCreate` — Koin, Room, Ktor, the voice manager, the
# notification channels — happens before it. `NavGraph` then starts on `Loading`
# and only routes to `Login` once the DataStore has answered that there is no
# token. A bare `assertVisible` here timed out on its default in CI, on a run
# where nothing was wrong.
#
# Each wait is sliced in `retry` attempts that start by dismissing a system app's
# « isn't responding » window (MAG-236): that window hides the whole app from
# Maestro, so a plain wait would sit behind it until its timeout.
#
# **A `timeout` here is not the wait it says** (MAG-346). Maestro deducts from every
# wait the time since the last *interaction* (a launch, a tap, a script — not an
# assertion, not a failed `retry` attempt, not a skipped `runFlow`). Without the
# `evalScript` lines below, the ANR check's `when: visible` burned ~7 s of the
# first wait and every further attempt started on a budget of zero: four « attempts »
# that were one wait of ~23 s, so a slower cold start read as « login_sign_in is not
# visible » with the app never having reached its first frame. `evalScript` counts as
# an interaction and touches nothing: the first one gives the ANR check its budget on a
# retry, the second gives the wait its full timeout (four attempts, two minutes).
- retry:
    maxRetries: 3
    commands:
      - evalScript: ${0}
      - runFlow: dismiss-system-anr.yaml
      - evalScript: ${0}
      - extendedWaitUntil:
          visible:
            id: "login_sign_in"
          timeout: 30000

- tapOn:
    id: "login_sign_in"

# The dashboard is the whole assertion: `NavGraph` only redirects there once the
# JWT is in the DataStore, so seeing it means the login round trip succeeded.
#
# 40–60 s because this is the app's first HTTP call: OkHttp, Ktor and the JSON
# serializer are all being class-loaded, on an emulator with no JIT warm-up. A
# failure here is almost always one of two things — `adb reverse` not bridging
# the stack's port, or `task e2e:seed` never having created the user, which the
# login answers 404 to.
- retry:
    maxRetries: 2
    commands:
      - evalScript: ${0}
      - runFlow: dismiss-system-anr.yaml
      - evalScript: ${0}
      - extendedWaitUntil:
          visible:
            id: "dashboard"
          timeout: 20000
