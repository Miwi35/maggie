; pcov for the nightly's coverage per journey — e2e image only, loaded only when
; E2E_COVERAGE=1 puts this directory on PHP_INI_SCAN_DIR (docker-compose.e2e.yml).
; Collection itself is started and stopped per request by
; api/modules/core/src/E2e/Coverage/JourneyCoverageListener.php.
extension=pcov
pcov.enabled=1
pcov.directory=/var/www/api
; Never instrumented: dependencies and the compiled container are not ours to map.
pcov.exclude="~/var/www/api/(vendor|var)/~"
