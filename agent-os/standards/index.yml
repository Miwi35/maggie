admin:
  google-oauth:
    description: Google OAuth 2.0 login — authorization code flow, JWT exchange, handleAuthCallback, refresh cookie and Mercure cookie renewal
  react-admin:
    description: React Admin with HydraAdmin, ResourceGuesser, Mercure SSE — stack versions, i18n, Bearer httpClient
  taskfile:
    description: Admin task commands — npm, dev/build, lint/typecheck
  testing:
    description: Vitest + Testing Library — what a component owes (render, interaction, error, Mercure), co-located .test.tsx, jsdom, vi.mock patterns

agenda:
  google-calendar-model:
    description: Event entity follows Google Calendar API structure (RRULE, exceptions, reminders), entity location

agent:
  architecture:
    description: Python FastAPI agent hub — MCP client, LLM gateway and shared tool loop, skills on demand, Markdown sub-agents and delegate, tool policy and pending approvals, app/ layout, uv and ruff
  memory:
    description: Memory folder (ADR-011) — Markdown files per user in an S3 bucket as the only truth, two-way sync, owner wins, outbox, degraded mode, disposable Postgres index, path validation
  testing:
    description: pytest — what a route or gateway owes (error branches, 401/422, tool-loop arguments), async auto mode, respx HTTP mocking, fake-LLM e2e check

api:
  entities:
    description: Entity conventions — ULID keys, MercurePublishable interface, modular bundles, ownership interfaces, Messenger commands and routing per entity
  mcp-tools:
    description: MCP tools — CRUD tools per entity enforced, write via bus, read via repo filtered by user, new entity checklist with migration step
  resources-only:
    description: L'API n'expose que des ressources et actions du domaine — pas d'endpoint d'écran (/api/home), ni ordre ni mise en page ; agréger par un filtre de domaine ou un index Elasticsearch, jamais une vue SQL ; calcul métier dans l'API, filtre simple dans le front
  taskfile:
    description: API task commands — composer, console passthrough, testing
  testing:
    description: PHPUnit — fixtures (nelmio/alice), MCP tool tests enforced, endpoint and service tests, Mercure publication tests enforced

backend:
  projection:
    description: ProjectionMiddleware publishes on Mercure and indexes the whole unit of work, to the row's owner, after the root handler — handlers never call the hub or the indexer
  domain-events:
    description: A business effect is the consequence of a domain event — Doctrine listener → Specification → event on event.bus → event handler → command → use case → service, postFlush dispatch, identifiers only
  module-boundaries:
    description: api/modules are independent — deptrac.yaml rules (task api:lint), core depends on no module (tagged interfaces, events), Recettes ↔ Courses bridge in modules/meal-grocery, ReminderSourceInterface, the catalogue exception

deployment:
  ci-cd-pipeline:
    description: GitHub Actions — ci.yml, main.yml (build, k3s deploy, smoke, rollback), nightlies, branch protection, GHCR registry and image mirror, secrets

docker:
  dockerfiles:
    description: Multi-stage Dockerfile pattern — base/dev/(e2e)/prod stages, UID/GID matching, ghcr mirror for every FROM
  traefik-routing:
    description: Traefik edge router — Docker label routing in dev (websecure, maggie.stack=dev), full route map, k3s Ingress in production

frontend:
  veilleuse:
    description: Veilleuse, the admin's identity — one accent, pills, Geist with tabular figures, contrast tested, radiant merge pitfalls, Maggie's interruption and the chat

global:
  design-system:
    description: One identity, two platforms — design/tokens.json as the source, a typed mirror and a contract test per platform, the two colour families, what is deliberately not a token
  e2e-environment:
    description: The e2e stack — task e2e:*, per-worktree isolation, APP_ENV=e2e, test login, app:e2e:seed and anchored fixtures, simulated external services
  real-time:
    description: Mercure SSE for all real-time — topics, private updates, 1.0 protocol, differential updates and action payloads, client patch-or-refetch, useMercure
  worktree-checks:
    description: task wt:* — minimal one-shot containers for lint, PHPStan and tests in a worktree, load guard, lockfile-keyed shared dependency cache
  taskfile:
    description: Task runner rules — Docker-first enforcement, naming, quick reference, agent and mobile commands, worktree caveat
  ux:
    description: UX rules for every module, admin and mobile — one menu entry per module entered by its dashboard, frequency-of-use order, forms, French empty/loading/error states, 48 dp and thumb reach, phone/Z Flip/tablet formats, real-time signalling, Maggie in the interface, accessibility
  testing:
    description: Definition of done and cross-component testing strategy — required coverage per unit touched, mandatory e2e journey, red-first bug fixes, coverage ratchet (baseline.json, task coverage:ratchet), pyramid, run commands, lint and targeted tests per component before commit

mobile:
  android-app:
    description: Android app — Kotlin/Compose, Koin DI, Ktor HTTP, Room, repository pattern, SDK versions, signing, dev/prod/e2e flavors
  screen-tests:
    description: Where a mobile verification lives — Compose on the JVM (Robolectric, ScreenRule, faked repositories) for screen logic, Maestro on an emulator only for what needs a real Android
  testing:
    description: JUnit + MockK — one test per ViewModel state transition, DTO deserialization, coroutine testing, backtick names, run command

recipes:
  api-write-use-case:
    description: Recipe — a write on the API, Command → Handler (ownership) → UseCase (+ Service), sync routing, projection by the middleware
  api-operation:
    description: Recipe — expose a resource or action over HTTP, API Platform operation (default, with an id) or dedicated controller (/me, non-CRUD, computed reads), contract regeneration
  api-mcp-tool:
    description: Recipe — one #[McpTool] class, McpUserContext, write via bus, read via repository filtered by user, scan_dirs, agent approval policy for destructive tools
  api-entity-field:
    description: Recipe — a field end to end on the API, entity → Mercure payload → Elasticsearch → commands and tools → migration → contract → client recipes
  api-domain-effect:
    description: Recipe — a business effect on a state change, specification → event → listener → event handler → command, routing and deptrac direction
  api-entity:
    description: Recipe — a new entity, order of steps over the new-entity skill and the API recipes
  admin-screen:
    description: Recipe — an admin screen from a mockup, LiveList or data hook, lazyPage and resources, menu and breadcrumb, Veilleuse, liveListSuite and Mercure tests
  admin-api-field:
    description: Recipe — consume a new or changed API field in the admin, types, hooks, tests reading api/contract/
  mobile-screen:
    description: Recipe — an Android screen, ApiService → Repository → ViewModel → Screen, Koin, NavGraph, DeepLinks, UiTags, ScreenRule vs ViewModel tests
  mobile-api-field:
    description: Recipe — consume a new or changed API field on Android, @SerialName and defaults, DtoContractTest, recorded fixtures, live updates
  agent-fake-llm-scenario:
    description: Recipe — a fake-LLM scenario for an e2e step, matching, ids, README line, impact map, scenario pytest
  agent-behaviour-change:
    description: Recipe — change what Maggie does (prompt rule, skill, sub-agent, policy, guard), the pytest each owes, prompt judged by hand with task e2e:eval
  e2e-web-journey:
    description: Recipe — a Playwright journey, fixtures and journey account, seed anchors, page objects and testids, impact map, worktree run
  e2e-mobile-journey:
    description: Recipe — a Maestro journey, new-user flow, scripts, subflows, UiTags, config and shards, impact map, task e2e:mobile:lint only
