admin:
  google-oauth:
    description: Google OAuth 2.0 login — authorization code flow, JWT exchange, handleAuthCallback
  react-admin:
    description: React Admin with HydraAdmin, ResourceGuesser, Mercure SSE
  taskfile:
    description: Admin task commands — npm, dev/build, lint/typecheck
  testing:
    description: Vitest + Testing Library — co-located .test.tsx, jsdom, vi.mock patterns

agenda:
  google-calendar-model:
    description: Event entity follows Google Calendar API structure (RRULE, exceptions, reminders)

agent:
  architecture:
    description: Python FastAPI agent hub — MCP client, LLM gateway and shared tool loop, skills on demand, Markdown sub-agents and delegate, tool policy and pending approvals, uv
  testing:
    description: pytest — async auto mode, respx HTTP mocking, conftest fixtures

api:
  entities:
    description: Entity conventions — ULID keys, MercurePublishable interface, Messenger commands per entity
  mcp-tools:
    description: MCP tools — CRUD tools per entity enforced, write via bus, read via repo, new entity checklist
  taskfile:
    description: API task commands — composer, console passthrough, testing
  testing:
    description: PHPUnit — fixtures (nelmio/alice), MCP tool tests enforced, Mercure publication tests enforced

docker:
  dockerfiles:
    description: Multi-stage Dockerfile pattern — base/dev/prod stages, UID/GID matching
  traefik-routing:
    description: Traefik edge router with Docker label-based path routing

global:
  agent-guard-rails:
    description: What an agent may merge alone — needs-human triggers, diff size limit, two red CIs, AGENT_ENABLED emergency stop, task guard:*
  design-system:
    description: One identity, two platforms — design/tokens.json as the source, a typed mirror and a contract test per platform, the two colour families, what is deliberately not a token
  e2e-environment:
    description: The e2e stack — task e2e:*, per-worktree isolation, APP_ENV=e2e, test login, app:e2e:seed and anchored fixtures, simulated external services
  real-time:
    description: Mercure SSE for all real-time — native API Platform integration
  worktree-checks:
    description: task wt:* — minimal one-shot containers for lint, PHPStan and tests in a worktree, load guard, lockfile-keyed shared dependency cache
  taskfile:
    description: Task runner rules — Docker-first enforcement, naming, quick reference
  ux:
    description: UX rules for every module, admin and mobile — one menu entry per module entered by its dashboard, frequency-of-use order, forms, French empty/loading/error states, 48 dp and thumb reach, phone/Z Flip/tablet formats, real-time signalling, Maggie in the interface, accessibility
  testing:
    description: Definition of done and cross-component testing strategy — required coverage per unit touched, mandatory e2e journey, red-first bug fixes, coverage ratchet (baseline.json, task coverage:ratchet), pyramid, run commands

mobile:
  android-app:
    description: Android app — Kotlin/Compose, Koin DI, Ktor HTTP, repository pattern
  screen-tests:
    description: Where a mobile verification lives — Compose on the JVM (Robolectric, ScreenRule, faked repositories) for screen logic, Maestro on an emulator only for what needs a real Android
  testing:
    description: JUnit + MockK — coroutine testing, backtick names, state verification
