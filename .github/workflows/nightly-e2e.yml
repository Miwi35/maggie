name: Nightly e2e

# Every e2e journey, once a night, on the head of main (owner's decision, 8 Oct.).
# A pull request only plays the journeys its files touch (e2e/impact-map.yml);
# this is where the rest is played: the whole Playwright suite and the whole
# Maestro suite on the three formats, quarantine included. It deploys nothing.
#
# It calls ci.yml with `suite: e2e` (the e2e jobs alone — `nightly.yml` runs the
# other half with `suite: no-e2e`) and `retry_failed_journeys`: a Maestro flow
# that fails plays once more, and one that passes then is reported flaky, a
# candidate for the quarantine (Playwright retries once on its own in CI).
#
# `report` then reads the verdict of every lot and says, for a red journey, its
# area in the map and the last commit that touched that area. A red night opens
# a Linear `Bug` labelled `nightly-e2e-failure`, or comments on the one already
# open (`infra/scripts/alert-ticket.sh`, as `nightly.yml` does for the rest of the CI). A
# green night writes its summary and nothing else.
#
# The journeys run with coverage (`coverage: true`, spec « Sélection e2e par
# couverture »): `coverage-map` turns what each journey executed into the line
# map (artifact `e2e-coverage-map`, 7 days) that pull requests select their
# journeys with. It never changes the night's verdict.

run-name: >-
  ${{ github.event_name == 'schedule' && 'Nuit · e2e complets' || 'Nuit · e2e complets · manuel' }}

on:
  schedule:
    # 03:07 in Paris all year: cron runs on UTC and Paris moves between UTC+2
    # (summer) and UTC+1 (winter). Both lines fire every night; `when` keeps the
    # one that is 03:07 in Paris today, and the other leaves a run whose jobs are
    # all skipped. Off the hour, so as not to queue behind everyone else's cron.
    - cron: '7 1 * * *'
    - cron: '7 2 * * *'
  workflow_dispatch:

concurrency:
  group: nightly-e2e
  cancel-in-progress: false

# Each job asks for what it needs; `e2e` holds the ceiling of what the called
# ci.yml asks for (MAG-105): a called workflow may not ask for more than its
# caller grants, even for a job it skips.
permissions:
  contents: read

jobs:
  when:
    name: 3 a.m. in Paris
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - name: Keep the cron line that is 03:07 in Paris today
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          # Decided on the cron line that fired, not on the clock: a run GitHub
          # starts late is still the night's run.
          offset="$(TZ=Europe/Paris date +%z)"
          case "$EVENT|$SCHEDULE|$offset" in
            workflow_dispatch*) run=true ;;
            'schedule|7 1 * * *|+0200') run=true ;;
            'schedule|7 2 * * *|+0100') run=true ;;
            *) run=false ;;
          esac
          echo "event=$EVENT schedule='$SCHEDULE' Paris offset=$offset → run=$run"
          echo "run=$run" >> "$GITHUB_OUTPUT"

  e2e:
    name: E2E
    needs: when
    if: needs.when.outputs.run == 'true'
    uses: ./.github/workflows/ci.yml
    with:
      suite: e2e
      retry_failed_journeys: true
      coverage: true
    permissions:
      contents: read
      packages: write
      actions: read
      pull-requests: write
      issues: write

  report:
    name: Nightly e2e report
    needs: [when, e2e]
    if: always() && needs.when.outputs.run == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    env:
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      E2E_RESULT: ${{ needs.e2e.result }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The last commit of each area of a red journey.
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: e2e-verdict-*
          path: verdicts

      - name: Report
        id: report
        run: |
          status=0
          scripts/e2e/nightly-report.sh verdicts "$E2E_RESULT" > report.md || status=$?
          cat report.md >> "$GITHUB_STEP_SUMMARY"
          echo "red=$([ "$status" -eq 0 ] && echo false || echo true)" >> "$GITHUB_OUTPUT"

      - name: Open or update the nightly e2e ticket
        if: steps.report.outputs.red == 'true'
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          ALERT_LABEL: nightly-e2e-failure
          ALERT_TITLE: "Nightly : les parcours e2e de nuit ont échoué"
        run: |
          ALERT_BODY="$({ cat report.md; printf '\nRun: %s\n' "$RUN_URL"; })"
          export ALERT_BODY
          bash infra/scripts/alert-ticket.sh

      - name: Red
        if: steps.report.outputs.red == 'true'
        run: |
          echo "::error::The nightly e2e suite is red — see the summary."
          exit 1

  # The line map (spec « Sélection e2e par couverture »): which journeys executed
  # each line tonight, from the raw coverage every lot uploaded — only when every
  # lot's coverage is complete. `Detect changes` in ci.yml downloads it from the
  # latest successful nightly that holds one and selects a pull
  # request's journeys by the lines it changes. Never part of the verdict: every
  # step only warns, and a night without a map leaves the pull requests on the
  # zones of e2e/impact-map.yml.
  coverage-map:
    name: E2E line map
    needs: [when, e2e]
    if: always() && needs.when.outputs.run == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        continue-on-error: true

      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: e2e-coverage-raw-*
          merge-multiple: true
          path: e2e/coverage/raw

      - name: Build the map
        id: build
        continue-on-error: true
        run: |
          # The lots tonight played, as ci.yml's `Detect changes` chose them on
          # this commit: every web lot, the phone's mobile lots. A lot that left
          # no complete coverage (a hook failed, a job skipped) means no map: a
          # partial one would play too few journeys on a pull request.
          expected="$(scripts/e2e/impacted.sh select --all </dev/null \
            | jq -r '(.web_lots[] | "web-\(.)"), (.mobile_lots[] | "mobile-phone-\(.index)")')"
          [ -n "$expected" ] || { echo "::warning::the lots of tonight are unknown: no e2e line map"; exit 0; }
          status=0
          # shellcheck disable=SC2086 # one argument per lot
          python3 scripts/e2e/coverage/build-map.py --raw e2e/coverage/raw --out e2e-coverage-map.json \
            --commit "$GITHUB_SHA" --expect $expected || status=$?
          if [ "$status" -ne 0 ]; then
            echo "::warning::no e2e line map tonight (build-map exit $status): pull requests keep the zones of e2e/impact-map.yml"
            exit 0
          fi
          jq -r '"### E2E line map\n\n\(.journeys | length) journeys, \(.files | length) files, commit \(.commit[:7]), \(.generatedAt)."' \
            e2e-coverage-map.json >> "$GITHUB_STEP_SUMMARY"
          echo "built=true" >> "$GITHUB_OUTPUT"

      - name: Line map
        if: steps.build.outputs.built == 'true'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: e2e-coverage-map
          path: e2e-coverage-map.json
          retention-days: 7
          if-no-files-found: ignore
