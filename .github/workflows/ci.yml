name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      agent: ${{ steps.filter.outputs.agent }}
      ciqual: ${{ steps.filter.outputs.ciqual }}
      admin: ${{ steps.filter.outputs.admin }}
      e2e: ${{ steps.filter.outputs.e2e }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            api:
              - 'api/**'
              - '.github/workflows/ci.yml'
            agent:
              - 'agent/**'
              - '.github/workflows/ci.yml'
            ciqual:
              - 'ciqual/**'
              - '.github/workflows/ci.yml'
            admin:
              - 'admin/**'
              # useMercure.contract.test.ts reads api/contract/, generated by
              # the API suite. A topic renamed there must run the admin tests,
              # or the one check that would catch it is the one that is
              # skipped.
              - 'api/contract/**'
              - '.github/workflows/ci.yml'
            e2e:
              - 'api/**'
              - 'admin/**'
              - 'agent/**'
              - 'ciqual/**'
              - '.docker/**'
              - 'e2e/**'
              - 'docker-compose.e2e.yml'
              - '.github/workflows/ci.yml'

  api-lint:
    name: API Lint (PHPStan)
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
      - uses: actions/cache@v4
        with:
          path: api/vendor
          key: vendor-php8.4-${{ hashFiles('api/composer.lock') }}
          restore-keys: vendor-php8.4-
      - run: composer install --no-interaction --prefer-dist
      - run: vendor/bin/phpstan analyse

  agent-lint:
    name: Agent Lint (Ruff)
    needs: changes
    if: needs.changes.outputs.agent == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
          enable-cache: true
          cache-dependency-glob: agent/uv.lock
      - run: uv sync --frozen --extra dev
      - run: uv run ruff check app/
      - run: uv run ruff format --check app/

  ciqual-lint:
    name: Ciqual Lint (Ruff)
    needs: changes
    if: needs.changes.outputs.ciqual == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ciqual
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
          enable-cache: true
          cache-dependency-glob: ciqual/pyproject.toml
      - run: uv venv && uv pip install -e ".[dev]"
      - run: uv run ruff check app/ tests/
      - run: uv run ruff format --check app/ tests/

  admin-lint:
    name: Admin Lint (ESLint + TypeScript)
    needs: changes
    if: needs.changes.outputs.admin == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - uses: actions/cache@v4
        id: node-modules
        with:
          path: admin/node_modules
          key: node-modules-node22-${{ hashFiles('admin/package-lock.json') }}
      - if: steps.node-modules.outputs.cache-hit != 'true'
        run: npm ci
      - run: npm run lint
      - run: npm run typecheck

  api-test:
    name: API Tests (PHPUnit)
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: maggie
          POSTGRES_PASSWORD: maggie
          POSTGRES_DB: maggie
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://maggie:maggie@localhost:5432/maggie?serverVersion=17&charset=utf8
      APP_ENV: test
      MESSENGER_TRANSPORT_DSN: sync://
      CIQUAL_SERVICE_URL: http://localhost:8002
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql
          tools: composer:v2
      - uses: actions/cache@v4
        with:
          path: api/vendor
          key: vendor-php8.4-${{ hashFiles('api/composer.lock') }}
          restore-keys: vendor-php8.4-
      - run: composer install --no-interaction --prefer-dist
      - name: Generate JWT keys
        run: |
          mkdir -p config/jwt
          openssl genpkey -algorithm RSA -out config/jwt/private.pem -pkeyopt rsa_keygen_bits:4096 -pass pass:test
          openssl rsa -pubout -in config/jwt/private.pem -out config/jwt/public.pem -passin pass:test
        env:
          JWT_PASSPHRASE: test
      - run: bin/console doctrine:database:create --env=test --no-interaction --if-not-exists
      - run: bin/console doctrine:schema:create --env=test --no-interaction
      - run: bin/phpunit
        env:
          JWT_PASSPHRASE: test

  agent-test:
    name: Agent Tests (pytest)
    needs: changes
    if: needs.changes.outputs.agent == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
          enable-cache: true
          cache-dependency-glob: agent/uv.lock
      - run: uv sync --frozen --extra dev
      - run: uv run pytest

  ciqual-test:
    name: Ciqual Tests (pytest)
    needs: changes
    if: needs.changes.outputs.ciqual == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ciqual
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
          enable-cache: true
          cache-dependency-glob: ciqual/pyproject.toml
      - run: uv venv && uv pip install -e ".[dev]"
      - run: uv run pytest

  admin-test:
    name: Admin Tests (Vitest)
    needs: changes
    if: needs.changes.outputs.admin == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - uses: actions/cache@v4
        id: node-modules
        with:
          path: admin/node_modules
          key: node-modules-node22-${{ hashFiles('admin/package-lock.json') }}
      - if: steps.node-modules.outputs.cache-hit != 'true'
        run: npm ci
      - run: npm run test

  e2e-stack:
    name: E2E Stack (smoke journey)
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    env:
      # Same derivation the Taskfile does, except the run id replaces the
      # worktree hash: concurrent jobs must not share containers or a network.
      COMPOSE_PROJECT_NAME: maggie-e2e-ci-${{ github.run_id }}-${{ github.run_attempt }}
      E2E_LOGIN_TOKEN: ci-e2e-login-token
    steps:
      - uses: actions/checkout@v4

      - uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Start the stack
        run: task e2e:up

      - name: Seed
        # No --now. Pinning the anchor to a past date would move the whole
        # seeded world into that month while the containers' clock stays real,
        # so every endpoint that derives its period from `new DateTimeImmutable`
        # — the finance dashboard, the daily score, "upcoming events" — would
        # return an empty list in CI and only in CI. Journeys that need a fixed
        # date should template the stub instead (response templating is on).
        run: task e2e:seed

      - name: Smoke journey
        run: task e2e:smoke

      - name: API tests inside the stack
        # Proof that the worktree-safe path agents are told to use actually
        # works. It is close to the api-test job by design: `when@test` still
        # forces `in-memory://` for the async transport, which no container
        # variable can displace, so only ELASTICSEARCH_URL really differs.
        run: task e2e:test:api

      - name: Stack logs
        if: failure()
        run: task e2e:logs:dump || true

      - name: Tear down
        if: always()
        run: task e2e:down
