name: Pull request

# One line per push on a pull request (MAG-244): this workflow is the whole
# pipeline of a PR — path detection, the agent guard, the CI jobs, the mobile
# unit tests and the incident gate. A job that has nothing to
# do is skipped, not a workflow. Job names are the required checks, so they do
# not change when a job moves here.
#
# `main.yml` (a merge) and `nightly.yml` call it with `workflow_call`: the night
# runs every job, a merge applies the path filters, and neither runs the jobs that
# only mean something on a pull request (guard, Incident gate).
# A draft's run says so (` · draft`): every job is skipped, nothing turns red.
run-name: >-
  ${{ github.event_name == 'pull_request'
      && format('PR #{0} · {1}{2}', github.event.pull_request.number, github.event.pull_request.title, github.event.pull_request.draft && ' · draft' || '')
      || 'CI' }}

on:
  # A draft pull request runs nothing (MAG-243): the merge train opens agent PRs as
  # drafts and the dispatcher marks one ready when its turn comes, which is what
  # starts this workflow (`ready_for_review`). Every job below hangs on `changes`,
  # which is skipped for a draft; the ones that run `if: always()` carry the
  # condition themselves.
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  # `main.yml` and the nightly runs (MAG-96) call this workflow: the night runs
  # every job, a merge applies the path filters.
  workflow_call:
    inputs:
      # Which half of the night: `nightly.yml` runs everything but the e2e
      # journeys (`no-e2e`), `nightly-e2e.yml` the e2e journeys alone (`e2e`).
      # A merge leaves it to `all`.
      suite:
        type: string
        required: false
        default: all
      # Re-play once a Maestro flow that failed, and call it flaky if it passes
      # then (the nightly; Playwright retries once on its own in CI).
      retry_failed_journeys:
        type: boolean
        required: false
        default: false

concurrency:
  # `github.workflow` is the caller's name in a called workflow, so the nightly and
  # main runs never share a group with a pull request on the same ref.
  #
  # The draft state is part of the key (MAG-267): the merge train rebases a draft
  # and then marks it ready, so the run of a draft push used to share the group of
  # the `ready_for_review` run and cancel it. What was left was a run whose jobs
  # were all skipped, which branch protection reads as green. A draft run now
  # only ever cancels another draft run. `PR checks passed` is what turns the
  # remaining skipped runs red.
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event.pull_request.draft && 'draft' || 'ready' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect changes
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    outputs:
      # `suite` (a `workflow_call` input, empty on a pull request): `e2e` runs the
      # e2e jobs alone (nightly-e2e.yml), `no-e2e` everything but them (nightly.yml).
      api: ${{ inputs.suite != 'e2e' && ((github.event_name != 'pull_request' && github.event_name != 'push') || steps.filter.outputs.api == 'true') }}
      agent: ${{ inputs.suite != 'e2e' && ((github.event_name != 'pull_request' && github.event_name != 'push') || steps.filter.outputs.agent == 'true') }}
      ciqual: ${{ inputs.suite != 'e2e' && ((github.event_name != 'pull_request' && github.event_name != 'push') || steps.filter.outputs.ciqual == 'true') }}
      admin: ${{ inputs.suite != 'e2e' && ((github.event_name != 'pull_request' && github.event_name != 'push') || steps.filter.outputs.admin == 'true') }}
      # The e2e journeys this change plays (owner's decision, 8 Oct.): the ones
      # its files touch in e2e/impact-map.yml, plus the critical core of each
      # platform that plays at all — every journey on the nightly run. `e2e` and
      # `mobile` say whether a platform plays at all; the lots are the matrices of
      # `e2e-shard` and `e2e-mobile-device`.
      e2e: ${{ inputs.suite != 'no-e2e' && steps.select.outputs.e2e == 'true' }}
      mobile: ${{ inputs.suite != 'no-e2e' && steps.select.outputs.mobile == 'true' }}
      web_specs: ${{ steps.select.outputs.web_specs }}
      web_lots: ${{ steps.select.outputs.web_lots }}
      web_lot_count: ${{ steps.select.outputs.web_lot_count }}
      mobile_lots: ${{ steps.select.outputs.mobile_lots }}
      mobile_lot_count: ${{ steps.select.outputs.mobile_lot_count }}
      cron: ${{ inputs.suite != 'e2e' && ((github.event_name != 'pull_request' && github.event_name != 'push') || steps.filter.outputs.cron == 'true') }}
      mobile_unit: ${{ inputs.suite != 'e2e' && ((github.event_name != 'pull_request' && github.event_name != 'push') || steps.filter.outputs.mobile_unit == 'true') }}
      # The emulators the Maestro journeys run on (MAG-98). One phone on a pull
      # request — an emulator costs minutes and the layout formats are not what a
      # feature branch usually breaks — and the three formats MAG-35 and MAG-91
      # care about on the nightly run, which is the only consumer of the
      # `workflow_call` trigger. `github.event_name` is the caller's event in a
      # called workflow, so `schedule` here means nightly.
      mobile_devices: >-
        ${{ (github.event_name != 'pull_request' && github.event_name != 'push')
            && '[{"name":"phone","profile":"pixel_6"},{"name":"foldable","profile":"7.6in Foldable"},{"name":"tablet","profile":"10.1in WXGA (Tablet)"}]'
            || '[{"name":"phone","profile":"pixel_6"}]' }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        # The nightly run (scheduled or manual) has no base to compare with, and needs none: it runs
        # everything (the outputs above).
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        with:
          # The files behind the `all` match, for the journey selection below.
          list-files: json
          filters: |
            api:
              - 'api/**'
              - '.github/actions/coverage/**'
              - '.github/workflows/ci.yml'
            agent:
              - 'agent/**'
              - '.github/actions/coverage/**'
              - '.github/workflows/ci.yml'
            ciqual:
              - 'ciqual/**'
              - '.github/actions/coverage/**'
              - '.github/workflows/ci.yml'
            admin:
              - 'admin/**'
              - '.github/actions/coverage/**'
              # useMercure.contract.test.ts reads api/contract/ and
              # agent/contract/, generated by the API and agent suites. A topic
              # renamed there must run the admin tests, or the one check that
              # would catch it is the one that is skipped.
              - 'api/contract/**'
              - 'agent/contract/**'
              # tokens.contract.test.ts reads design/tokens.json. Edited with
              # one mirror only, the other platform's contract test must still
              # run, or the drift is the one change that merges green.
              - 'design/**'
              - '.github/workflows/ci.yml'
            cron:
              - '.docker/php/**'
              - 'infra/k8s/cron-deployment.yaml'
              - 'infra/scripts/tests/cron-image.test.sh'
              - '.github/workflows/ci.yml'
            # The unit tests of the release variant (formerly mobile.yml). The DTO
            # and Mercure-topic contract tests read api/contract/ and
            # agent/contract/, which the API and agent suites generate: a change
            # there is a change to what the app receives, so it runs these tests —
            # filtered on mobile/** alone, the one job that would have caught it is
            # the one that does not run.
            mobile_unit:
              - 'mobile/**'
              - 'api/contract/**'
              - 'agent/contract/**'
              # TokensContractTest reads design/tokens.json (MAG-286).
              - 'design/**'
              - '.github/actions/coverage/**'
              - '.github/workflows/ci.yml'
            # Every changed file, for the journey selection below: the `e2e` and
            # `mobile` filters this list used to hold are e2e/impact-map.yml now.
            all:
              - '**'

      # The journeys of this change (owner's decision, 8 Oct.), read off
      # e2e/impact-map.yml by scripts/e2e/impacted.sh: the ones its files
      # touch, plus the critical core of each platform that plays. A change that
      # is only Markdown plays nothing (MAG-180) — it must not start eleven
      # containers. A file the map does not know plays the suite of its platform;
      # a transversal one (the core module, the contract, the config, auth, the
      # stack, the harness, a lockfile, this workflow) plays everything. The
      # eval scenarios are in the map too: `e2e:eval:check` in the first web lot
      # is their only guard, and a typo'd expectation must not merge green. The
      # nightly run has no base and plays every journey.
      #
      # `e2e-stack` and `e2e-mobile` still report, green, when nothing plays — a
      # skipped job satisfies branch protection, and the aggregator tells a skip
      # from a failure.
      - name: Select the e2e journeys
        id: select
        env:
          FILES: ${{ steps.filter.outputs.all_files }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = pull_request ] || [ "$EVENT" = push ]; then
            jq -r '.[]' <<<"${FILES:-[]}" | scripts/e2e/impacted.sh select --github-output > selection.json
          else
            scripts/e2e/impacted.sh select --all --github-output > selection.json
          fi
          jq -c 'del(.files)' selection.json

  api-lint:
    name: API Lint (PHPStan)
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
      - uses: actions/cache@v4
        with:
          path: api/vendor
          key: vendor-php8.4-${{ hashFiles('api/composer.lock') }}
          restore-keys: vendor-php8.4-
      - run: composer install --no-interaction --prefer-dist
      - name: PHP-CS-Fixer
        run: vendor/bin/php-cs-fixer fix --dry-run --diff --no-interaction
      - run: vendor/bin/phpstan analyse

  agent-lint:
    name: Agent Lint (Ruff)
    needs: changes
    if: needs.changes.outputs.agent == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
          enable-cache: true
          cache-dependency-glob: agent/uv.lock
      - run: uv sync --frozen --extra dev
      - run: uv run ruff check app/ evals/
      - run: uv run ruff format --check app/ evals/

  ciqual-lint:
    name: Ciqual Lint (Ruff)
    needs: changes
    if: needs.changes.outputs.ciqual == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ciqual
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
          enable-cache: true
          cache-dependency-glob: ciqual/pyproject.toml
      - run: uv venv && uv pip install -e ".[dev]"
      - run: uv run ruff check app/ tests/
      - run: uv run ruff format --check app/ tests/

  admin-lint:
    name: Admin Lint (ESLint + TypeScript)
    needs: changes
    if: needs.changes.outputs.admin == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - uses: actions/cache@v4
        id: node-modules
        with:
          path: admin/node_modules
          key: node-modules-node22-${{ hashFiles('admin/package-lock.json') }}
      - if: steps.node-modules.outputs.cache-hit != 'true'
        run: npm ci
      - run: npm run lint
      - run: npm run typecheck

  api-test:
    name: API Tests (PHPUnit)
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: maggie
          POSTGRES_PASSWORD: maggie
          POSTGRES_DB: maggie
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://maggie:maggie@localhost:5432/maggie?serverVersion=17&charset=utf8
      APP_ENV: test
      MESSENGER_TRANSPORT_DSN: sync://
      CIQUAL_SERVICE_URL: http://localhost:8002
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql
          tools: composer:v2
          # Line coverage (MAG-105). pcov only looks at `src/` unless told
          # otherwise, and the modules live in `modules/*/src`.
          coverage: pcov
          ini-values: pcov.directory=., pcov.exclude="~vendor~"
      - uses: actions/cache@v4
        with:
          path: api/vendor
          key: vendor-php8.4-${{ hashFiles('api/composer.lock') }}
          restore-keys: vendor-php8.4-
      - run: composer install --no-interaction --prefer-dist
      - name: Generate JWT keys
        run: |
          mkdir -p config/jwt
          openssl genpkey -algorithm RSA -out config/jwt/private.pem -pkeyopt rsa_keygen_bits:4096 -pass pass:test
          openssl rsa -pubout -in config/jwt/private.pem -out config/jwt/public.pem -passin pass:test
        env:
          JWT_PASSPHRASE: test
      - run: bin/console doctrine:database:create --env=test --no-interaction --if-not-exists
      - run: bin/console doctrine:schema:create --env=test --no-interaction
      - run: bin/phpunit --coverage-clover var/coverage/clover.xml
        env:
          JWT_PASSPHRASE: test
      - uses: ./.github/actions/coverage
        with:
          component: api
          format: clover
          report: api/var/coverage/clover.xml

  agent-test:
    name: Agent Tests (pytest)
    needs: changes
    if: needs.changes.outputs.agent == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
          enable-cache: true
          cache-dependency-glob: agent/uv.lock
      - run: uv sync --frozen --extra dev
      - run: uv run pytest --cov --cov-report=xml
      - uses: ./.github/actions/coverage
        with:
          component: agent
          format: cobertura
          report: agent/coverage.xml

  ciqual-test:
    name: Ciqual Tests (pytest)
    needs: changes
    if: needs.changes.outputs.ciqual == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ciqual
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
          enable-cache: true
          cache-dependency-glob: ciqual/pyproject.toml
      - run: uv venv && uv pip install -e ".[dev]"
      - run: uv run pytest --cov --cov-report=xml
      - uses: ./.github/actions/coverage
        with:
          component: ciqual
          format: cobertura
          report: ciqual/coverage.xml

  admin-test:
    name: Admin Tests (Vitest)
    needs: changes
    if: needs.changes.outputs.admin == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - uses: actions/cache@v4
        id: node-modules
        with:
          path: admin/node_modules
          key: node-modules-node22-${{ hashFiles('admin/package-lock.json') }}
      - if: steps.node-modules.outputs.cache-hit != 'true'
        run: npm ci
      - run: npm run test:coverage
      - uses: ./.github/actions/coverage
        with:
          component: admin
          format: vitest
          report: admin/coverage/coverage-summary.json

  # One comment on the pull request with every component's coverage against its
  # baseline (MAG-105), updated on each push. The ratchet itself is enforced in
  # the test jobs above, so this job never fails the run: a comment that cannot
  # be posted (a fork's read-only token) is a warning. A component that did not
  # run on this change has no measure and is left out of the comment.
  coverage-report:
    name: Coverage report
    needs: [api-test, agent-test, ciqual-test, admin-test, mobile-unit]
    if: ${{ !cancelled() && github.event_name == 'pull_request' && !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      # No match (no component changed) is not an error.
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: coverage-*
          path: coverage-out
          merge-multiple: true
      - name: Comment the report
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if ! compgen -G 'coverage-out/*.json' > /dev/null; then
            echo "No component measured on this change."
            exit 0
          fi
          scripts/coverage/report.sh 'Coverage — API, agent, ciqual, admin, mobile' coverage-report-ci coverage-out | tee report.md >> "$GITHUB_STEP_SUMMARY"
          scripts/coverage/comment.sh "$PR" coverage-report-ci report.md

  # The Playwright journeys in up to four shards (MAG-180), each on a stack of its own
  # — a stack is ~1 min to start and the journeys 2.5 min to run, so four of
  # them in parallel beat one. Two workers per shard, not more: a 4-vCPU runner
  # already hosts the whole stack, and at four workers pages time out (see
  # e2e/web/playwright.config.ts).
  #
  # Only the journeys `Detect changes` selected (e2e/impact-map.yml), in as many
  # shards as they need: one per ten spec files, four at most — four on the
  # nightly run. A journey in quarantine plays, but its failure only warns in the
  # job summary (`scripts/e2e/verdict.sh`).
  #
  # Not a required check, on purpose: the shards are named after their index.
  # `e2e-stack` below carries the required name and waits for all of them.
  e2e-shard:
    name: E2E shard ${{ matrix.shard }}/${{ needs.changes.outputs.web_lot_count }}
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    strategy:
      # A red shard must not hide what the others found.
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.changes.outputs.web_lots) }}
    permissions:
      contents: read
      # The stack's images are pushed once per set of build inputs (MAG-135).
      packages: write
    env:
      # Same derivation the Taskfile does, except the run id replaces the
      # worktree hash: concurrent jobs must not share containers or a network.
      COMPOSE_PROJECT_NAME: maggie-e2e-ci-${{ github.run_id }}-${{ github.run_attempt }}
      E2E_LOGIN_TOKEN: ci-e2e-login-token
    steps:
      # `lfs: true`, like `build-ciqual` in main.yml and for the same reason:
      # `ciqual/data/ciqual/compo.xml` is 69 MB and stored in Git LFS, and a
      # plain checkout leaves a pointer file in its place. `task e2e:up` builds
      # the food base out of it (MAG-101), and a pointer makes that die on
      # `ParseError: syntax error: line 1, column 0`.
      #
      # It did not matter until this branch: the ciqual image is reused by the
      # hash of its build inputs (MAG-135) and had not been rebuilt in CI since
      # the LFS pointer existed, so nothing ever read the file here.
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # Dependencies the stack would otherwise install at every start. Keyed on
      # the lockfile, like the jobs above, but under their own keys: the stack
      # installs inside containers (alpine for the admin, where the native
      # binaries are musl ones), so a tree built on this runner would not do.
      - uses: actions/cache@v4
        with:
          path: api/vendor
          key: e2e-vendor-php8.4-${{ hashFiles('api/composer.lock') }}

      - uses: actions/cache@v4
        id: admin-dist
        with:
          # The built bundle (tsc + vite, ~55 s, the longest step of the stack's
          # start-up). Keyed on its sources, listed one by one: an `admin/**` glob
          # walks node_modules, 5 s at restore and again at save. Bump v1 if the
          # build env in the Compose file changes. A PR that does not touch the
          # admin restores main's.
          path: admin/dist
          key: e2e-admin-dist-v1-${{ hashFiles('admin/src/**', 'admin/public/**', 'admin/index.html', 'admin/package*.json', 'admin/tsconfig*.json', 'admin/vite.config.*') }}

      - name: Skip the admin build when its bundle was restored
        if: steps.admin-dist.outputs.cache-hit == 'true'
        run: echo "E2E_ADMIN_PREBUILT=1" >> "$GITHUB_ENV"

      # Not needed when the bundle was restored: nothing installs then.
      - uses: actions/cache@v4
        if: steps.admin-dist.outputs.cache-hit != 'true'
        with:
          path: admin/node_modules
          key: e2e-admin-node-modules-node22-alpine-${{ hashFiles('admin/package-lock.json') }}

      - uses: actions/cache@v4
        with:
          path: e2e/web/node_modules
          key: e2e-web-node-modules-${{ hashFiles('e2e/web/package-lock.json') }}

      - uses: actions/cache@v4
        with:
          # The agent reinstalls its dependencies at every start; this makes it
          # a copy instead of a download. A near miss is still a good start.
          path: .e2e-cache/uv
          key: e2e-uv-${{ hashFiles('agent/pyproject.toml', 'agent/uv.lock') }}
          restore-keys: e2e-uv-

      - name: Mark the restored node_modules as current
        # The stack reinstalls when package-lock.json is newer than node_modules,
        # and a cache restore keeps the mtime of the day it was saved. The key
        # is the lockfile's hash, so a restored tree is by construction current.
        run: |
          for d in admin/node_modules e2e/web/node_modules; do
            if [ -d "$d" ]; then touch "$d"; fi
          done

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # No buildx setup here (7 to 12 s): the runner's own builder imports a
      # registry cache and exports an inline one, which is all `e2e/images.sh`
      # asks of it when an image's hash changes.
      - name: Pull or build the stack's images
        # An image is named after the hash of what its Dockerfile reads, so a pull
        # request that changes none of it builds nothing: four pulls, run beside
        # the third-party ones. Only a changed .docker/ file or build arg builds
        # — from the layers of the previous image, and pushes it for every run
        # after. The four shards race to do it when the hash changed; they all
        # produce the same image, so the last push wins harmlessly.
        run: |
          e2e/images.sh env >> "$GITHUB_ENV"
          echo "E2E_PREBUILT=1" >> "$GITHUB_ENV"
          e2e/images.sh ensure

      # The journeys run at a fixed instant (MAG-267), not on the week they
      # happen to run in: the meals and agenda journeys read "Tuesday" and the
      # days around it (MAG-117). `E2E_NOW` is read by `task e2e:up` (the services'
      # clock), the seed, the browser and the emulator. Change it by hand with the
      # repository variable `E2E_NOW` (Settings > Variables), no commit needed.
      - name: Pin the e2e clock
        env:
          E2E_CI_NOW: ${{ vars.E2E_NOW }}
        run: |
          # Assigned first: a failure inside `$(...)` would not fail an `echo`.
          now="$(e2e/clock.sh ci)"
          echo "E2E_NOW=$now" | tee -a "$GITHUB_ENV"

      - name: Start the stack
        run: task e2e:up

      # What follows up to the journeys runs in one shard only, the first — the
      # one every selection has: none of it depends on how the Playwright tests
      # are split.
      - name: Seed
        if: matrix.shard == 1
        # No --now. The seed anchors on the containers' clock, which follows
        # `E2E_NOW` (pinned above): passing --now would move the seeded world away
        # from it, and every endpoint that derives its period from `new
        # DateTimeImmutable` — the finance dashboard, the daily score, "upcoming
        # events" — would return an empty list in CI and only in CI. Journeys that
        # need a fixed date should template the stub instead (response templating
        # is on).
        run: task e2e:seed

      - name: Smoke journey
        if: matrix.shard == 1
        run: task e2e:smoke

      - name: The web journeys lint and type-check
        if: matrix.shard == 1
        # Seconds, in the container the journeys themselves run in, and it
        # catches a renamed page object or an `expect` nobody awaited before
        # eleven services have been driven through a browser to find out.
        run: task e2e:web:lint && task e2e:web:typecheck

      - name: Web journeys (Playwright)
        id: web
        # Reseeds on its own — the smoke journey above writes, and these
        # assert on the seeded world. This shard's share of the selected spec
        # files only. Playwright's exit status is not the verdict: verdict.sh
        # reads its JSON report and lets a journey in quarantine fail without
        # failing the shard.
        env:
          SPECS: ${{ needs.changes.outputs.web_specs }}
          SHARD: ${{ matrix.shard }}/${{ needs.changes.outputs.web_lot_count }}
          E2E_VERDICT_LABEL: web shard ${{ matrix.shard }}/${{ needs.changes.outputs.web_lot_count }}
          E2E_VERDICT_OUT: e2e/verdicts/web-${{ matrix.shard }}.json
        run: |
          status=0
          # shellcheck disable=SC2086 # one argument per spec file
          task e2e:web -- --shard="$SHARD" $SPECS || status=$?
          scripts/e2e/verdict.sh web e2e/web/results/results.json "$status"

      - name: The eval scenarios parse
        if: matrix.shard == 1
        # Cheap — no key, no model call — and the only place a scenario file
        # that went missing or grew a typo'd expectation fails loudly. Without
        # it the first symptom is the nightly going red at 03:17 for a reason
        # that has nothing to do with prompts.
        run: task e2e:eval:check

      # Read by the nightly report (nightly-e2e.yml): which journey failed,
      # passed on a retry or failed in quarantine, lot by lot.
      - name: Verdict
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-verdict-web-${{ matrix.shard }}
          path: e2e/verdicts
          retention-days: 3
          if-no-files-found: ignore
          overwrite: true

      - name: Playwright blob report
        # Also when only a journey in quarantine failed: its trace is how it
        # leaves quarantine.
        if: failure() || steps.web.outputs.quarantine_failed == 'true'
        # This shard's part of the report, traces and videos included. The
        # `e2e-report` job merges the shards' into the one artifact people open.
        uses: actions/upload-artifact@v4
        with:
          name: blob-report-${{ matrix.shard }}
          path: e2e/web/blob-report
          retention-days: 1
          if-no-files-found: ignore

      - name: Stack logs
        if: failure()
        run: task e2e:logs:dump || true

      - name: Tear down
        if: always()
        run: task e2e:down -- --timeout 1

  # The required check. It keeps the name branch protection already lists, so
  # that sharding the journeys needs no change there (MAG-180), and it is the
  # only place that knows what "the e2e passed" means: every shard green, or the
  # job skipped because nothing a stack runs has changed. `if: always()` so it
  # runs — and fails — when a shard is red, instead of being skipped with them,
  # which a branch protection would read as a pass.
  e2e-stack:
    name: E2E Stack (smoke journey)
    needs: [changes, e2e-shard]
    if: always() && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    runs-on: ubuntu-latest
    steps:
      - name: Every shard passed, or none was needed
        env:
          CHANGES: ${{ needs.changes.result }}
          SHARDS: ${{ needs.e2e-shard.result }}
          WANTED: ${{ needs.changes.outputs.e2e }}
        run: |
          echo "changes=$CHANGES shards=$SHARDS e2e wanted=$WANTED"
          [ "$CHANGES" = success ] || { echo "::error::Detect changes did not succeed"; exit 1; }
          if [ "$WANTED" = true ]; then
            [ "$SHARDS" = success ] || { echo "::error::an e2e shard did not succeed ($SHARDS)"; exit 1; }
          fi

  # One report from four halves, only when a shard failed. The traces are the
  # point: `npx playwright show-trace` replays the failing journey step by
  # step, which beats reading a stack trace out of a log for a browser failure
  # nobody can reproduce locally.
  e2e-report:
    name: E2E merged report
    needs: e2e-shard
    if: always() && needs.e2e-shard.result == 'failure'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: e2e/web

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/web/package-lock.json

      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: blob-report-?
          merge-multiple: true
          path: e2e/web/all-blob-reports

      - name: Merge the shards' reports
        id: merge
        continue-on-error: true
        working-directory: e2e/web
        env:
          PLAYWRIGHT_HTML_OPEN: never
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx playwright merge-reports --reporter html ./all-blob-reports

      - name: Playwright report
        if: steps.merge.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_id }}
          path: e2e/web/playwright-report
          retention-days: 7

  # The e2e flavor's APK, compiled once for every Maestro shard and device
  # (MAG-233). The shards used to compile and install it themselves, and the job
  # compiled it a second time after the unit tests, which is 3 minutes of Gradle
  # on a run of 15. The APK is built against a fixed port on the device's
  # loopback that `run.sh` bridges with `adb reverse`, so the one file works on
  # every emulator and every stack.
  #
  # Not a required check: `E2E Mobile (phone)` below is.
  e2e-mobile-build:
    name: E2E Mobile APK
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      # Compiled into the APK, and what the stack the shards start expects.
      E2E_LOGIN_TOKEN: ci-e2e-login-token
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - uses: actions/cache@v4
        with:
          # The lint runs `maestro check-syntax`: same pinned CLI, same key as the shards'.
          path: .e2e-cache/maestro
          key: maestro-${{ hashFiles('e2e/mobile/maestro.sh') }}

      # Here and not in each shard (MAG-233): 37 s that three emulator jobs
      # each spent before their stack, now beside the build. A red flow lint
      # fails this job, so the shards that wait for it never start.
      - name: The flows lint
        # A renamed testTag or a command Maestro does not know fails here rather
        # than ten minutes into an emulator job.
        run: e2e/mobile/lint.sh

      - name: Build the APK
        run: e2e/mobile/build-apk.sh

      # Right after the build, before the unit tests: the shards wait for this
      # job, not for the tests.
      - name: APK
        uses: actions/upload-artifact@v4
        with:
          name: maggie-e2e-apk
          path: e2e/mobile/apk/maggie-e2e.apk
          retention-days: 1
          if-no-files-found: error
          # A re-run of all jobs is a new attempt of the same run: the name exists.
          overwrite: true

  # The e2e flavor's unit tests, beside the shards rather than before them:
  # the `mobile-unit` job runs the prod variant, where `src/e2e/` does not exist, so
  # `E2eSignInTest` only ever runs here. Cheap, and it is the test that says the
  # login posts its token before an emulator says "the dashboard never came".
  #
  # Run through `build-apk.sh`, so with the APK's Gradle properties: under other
  # ones BuildConfig changes and the whole app is compiled again. It assembles the
  # APK too, which this job discards.
  e2e-mobile-unit:
    name: E2E Mobile unit tests (e2e flavor)
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      E2E_LOGIN_TOKEN: ci-e2e-login-token
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
      # Robolectric downloads its Android runtime (`android-all-instrumented`,
      # ~150 MB) into ~/.m2, which setup-gradle does not cover (MAG-247). Keyed on
      # the Robolectric version and on the API level `robolectric.properties` pins,
      # the two things that decide which jar is fetched.
      - uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-runtime-${{ runner.os }}-${{ hashFiles('mobile/gradle/libs.versions.toml', 'mobile/app/src/test/resources/robolectric.properties') }}

      - name: Unit tests of the e2e flavor
        run: e2e/mobile/build-apk.sh :app:testE2eDebugUnitTest

  # The Android app, driven on a headless emulator against the e2e stack
  # (MAG-98). MAG-93 counted seven past regressions no other suite can reach:
  # the voice overlay re-speaking an old answer, a sheet laid out under the
  # keyboard, multi-day events missing from the days they cross. They are all
  # about what a real app does on a real screen.
  #
  # Its own job rather than a step of `e2e-stack`, for two reasons: an emulator
  # is the flakiest thing in this pipeline and a flake here must not block a
  # pull request that only touched the API, and the nightly matrix below needs
  # three of them in parallel. The cost is a second stack; the stacks are
  # isolated by `COMPOSE_PROJECT_NAME`, so they do not collide.
  #
  # The journeys are split in three shards (MAG-233, e2e/mobile/shards.txt), each
  # on its own emulator and its own stack, in parallel: nine flows in a row on one
  # emulator took 7.5 minutes. The nightly run multiplies that by the three
  # formats. A pull request plays only the flows `Detect changes` selected
  # (e2e/impact-map.yml): a shard of shards.txt left with none is not started.
  # The flows in quarantine play in a second run of their shard, under a time
  # limit, and never fail it (scripts/e2e/mobile-journeys.sh).
  #
  # Not the required check, and not named `E2E Mobile (…)`: a job skipped by its
  # `if` never expands its matrix, so it reports the literal name
  # `E2E Mobile (${{ matrix.device.name }})` and the required `E2E Mobile
  # (phone)` would wait forever on a PR that leaves the app alone (MAG-213).
  # `e2e-mobile` below is the required one.
  e2e-mobile-device:
    name: E2E Mobile journeys (${{ matrix.device.name }} ${{ matrix.lot.index }}/${{ needs.changes.outputs.mobile_lot_count }})
    needs: [changes, e2e-mobile-build]
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    # A shard takes 4 to 8 minutes. One flow hung for 17 minutes once (02-voice-overlay,
    # green in the end): a stuck emulator is cut here instead of holding the run for an hour.
    # 35 and not 25: the flows in quarantine play in a second run, which
    # mobile-journeys.sh stops after 10 minutes — a hang there must end as a
    # warning, not as this job's timeout.
    # The nightly re-plays the failed flows once (`retry_failed_journeys`): up to
    # two more runs, hence 50 there.
    timeout-minutes: ${{ inputs.retry_failed_journeys && 50 || 35 }}
    strategy:
      # The three formats are independent: a failure on the foldable says
      # nothing about the phone, and cancelling it would hide whether the
      # regression is layout-specific.
      fail-fast: false
      matrix:
        device: ${{ fromJSON(needs.changes.outputs.mobile_devices) }}
        # {index, flows}: the shards of shards.txt that kept a selected flow,
        # numbered again from 1 (scripts/e2e/impacted.sh).
        lot: ${{ fromJSON(needs.changes.outputs.mobile_lots) }}
    permissions:
      contents: read
      # Same as `e2e-stack`: the stack's images are pulled by hash, and pushed
      # when a build input moved (MAG-135).
      packages: write
    env:
      COMPOSE_PROJECT_NAME: maggie-e2e-mobile-${{ matrix.device.name }}-${{ matrix.lot.index }}-${{ github.run_id }}-${{ github.run_attempt }}
      E2E_LOGIN_TOKEN: ci-e2e-login-token
    steps:
      # lfs: true for the same reason as `e2e-stack`: `task e2e:up` builds the
      # Ciqual food base from a 69 MB file stored in Git LFS, and a pointer makes
      # that die on a parse error.
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # The Maestro CLI runs on it. Nothing is compiled here any more: the APK
      # comes from `e2e-mobile-build`.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/cache@v4
        with:
          path: api/vendor
          key: e2e-vendor-php8.4-${{ hashFiles('api/composer.lock') }}

      - uses: actions/cache@v4
        with:
          path: admin/node_modules
          key: e2e-admin-node-modules-node22-alpine-${{ hashFiles('admin/package-lock.json') }}

      - uses: actions/cache@v4
        id: admin-dist
        with:
          # The built bundle (tsc + vite, ~55 s, the longest step of the stack's
          # start-up). Keyed on its sources, listed one by one: a `admin/**` glob walks
          # node_modules, 5 s, twice (bump v1 if the build env in the Compose
          # file changes); a PR that does not
          # touch the admin restores main's.
          path: admin/dist
          key: e2e-admin-dist-v1-${{ hashFiles('admin/src/**', 'admin/public/**', 'admin/index.html', 'admin/package*.json', 'admin/tsconfig*.json', 'admin/vite.config.*') }}

      - name: Skip the admin build when its bundle was restored
        if: steps.admin-dist.outputs.cache-hit == 'true'
        run: echo "E2E_ADMIN_PREBUILT=1" >> "$GITHUB_ENV"

      - uses: actions/cache@v4
        with:
          path: .e2e-cache/uv
          key: e2e-uv-${{ hashFiles('agent/pyproject.toml', 'agent/uv.lock') }}
          restore-keys: e2e-uv-

      - uses: actions/cache@v4
        with:
          # ~300 MB of CLI, pinned by version and checksum in maestro.sh — so
          # the key is that file's hash and a bump is what invalidates it.
          path: .e2e-cache/maestro
          key: maestro-${{ hashFiles('e2e/mobile/maestro.sh') }}

      - name: Mark the restored node_modules as current
        run: |
          if [ -d admin/node_modules ]; then touch admin/node_modules; fi

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Pull or build the stack's images
        run: |
          e2e/images.sh env >> "$GITHUB_ENV"
          echo "E2E_PREBUILT=1" >> "$GITHUB_ENV"
          e2e/images.sh ensure

      # The journeys run at a fixed instant (MAG-267), not on the week they
      # happen to run in: the meals and agenda journeys read "Tuesday" and the
      # days around it (MAG-117). `E2E_NOW` is read by `task e2e:up` (the services'
      # clock), the seed, the browser and the emulator. Change it by hand with the
      # repository variable `E2E_NOW` (Settings > Variables), no commit needed.
      - name: Pin the e2e clock
        env:
          E2E_CI_NOW: ${{ vars.E2E_NOW }}
        run: |
          # Assigned first: a failure inside `$(...)` would not fail an `echo`.
          now="$(e2e/clock.sh ci)"
          echo "E2E_NOW=$now" | tee -a "$GITHUB_ENV"

      - name: Start the stack
        run: task e2e:up

      - name: Seed
        # `task e2e:mobile` reseeds on its own; this is here so that a broken
        # fixture fails as a seed and not as an emulator step.
        run: task e2e:seed

      # The runner's /dev/kvm is owned by root, and without this the emulator
      # falls back to software emulation — minutes per boot instead of seconds,
      # and often a timeout.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Download the APK
        uses: actions/download-artifact@v4
        with:
          name: maggie-e2e-apk
          path: e2e/mobile/apk

      # The booted emulator, saved as a snapshot (MAG-233): a cold boot is a minute
      # on a runner, a snapshot load a few seconds. One per device profile; the
      # first run after the key changes boots cold once and saves it. Bump `v1`
      # when the emulator options below change: a snapshot taken with other
      # options is refused and the emulator boots cold again.
      - name: AVD snapshot cache
        id: avd-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-v1-34-google_apis-x86_64-${{ matrix.device.profile }}

      - name: Create the AVD and its snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: ${{ matrix.device.profile }}
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none -timezone Europe/Paris
          disable-animations: false
          script: echo "AVD snapshot generated for the cache."

      - name: Journeys (Maestro)
        uses: reactivecircus/android-emulator-runner@v2
        env:
          E2E_MOBILE_APK: ${{ github.workspace }}/e2e/mobile/apk/maggie-e2e.apk
          # This lot's flows, the ones in quarantine last (scripts/e2e/impacted.sh).
          E2E_MOBILE_FLOWS: ${{ matrix.lot.flows }}
          E2E_VERDICT_LABEL: mobile ${{ matrix.device.name }} ${{ matrix.lot.index }}/${{ needs.changes.outputs.mobile_lot_count }}
          E2E_VERDICT_DIR: ${{ github.workspace }}/e2e/verdicts
          # The nightly re-plays a failed flow once, and calls it flaky if it passes.
          E2E_RETRY_FAILED: ${{ inputs.retry_failed_journeys && '1' || '' }}
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: ${{ matrix.device.profile }}
          force-avd-creation: false
          # -timezone: the seed anchors on midnight in Paris and a runner boots
          # on UTC, so between 22:00 and midnight UTC the device's "today" is
          # the seed's yesterday and the dashboard assertion fails for an hour a
          # day. -noaudio stays: there is no sound card, so recording fails and
          # the voice overlay lands in its ERROR state — 02-voice-overlay.yaml is
          # written around that and never asserts listening succeeded.
          # -no-snapshot-save: the snapshot in the cache is the clean one, not
          # the state this run leaves behind.
          #
          # disable-animations also zeroes the animation scale, which is why that
          # flow cannot use waitForAnimationToEnd as a timer; see its header and
          # MAG-205.
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none -timezone Europe/Paris -no-snapshot-save
          disable-animations: true
          # The blocking flows, then the ones in quarantine, each judged by
          # scripts/e2e/verdict.sh: only the first run's verdict fails the job.
          script: scripts/e2e/mobile-journeys.sh

      # Read by the nightly report (nightly-e2e.yml), as the web shards' are.
      - name: Verdict
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-verdict-mobile-${{ matrix.device.name }}-${{ matrix.lot.index }}
          path: e2e/verdicts
          retention-days: 3
          if-no-files-found: ignore
          overwrite: true

      - name: Maestro report
        # Always, not only on failure (MAG-233): the junit.xml of a green shard says
        # which flow was slow, which is how a 17-minute flow gets diagnosed.
        if: always()
        # The screenshots are the point: Maestro writes one per failed command,
        # which is the only way to see what the screen looked like on a headless
        # emulator nobody can attach to.
        uses: actions/upload-artifact@v4
        with:
          name: maestro-report-${{ matrix.device.name }}-${{ matrix.lot.index }}-${{ github.run_id }}
          overwrite: true
          path: e2e/mobile/report
          retention-days: 7
          if-no-files-found: ignore

      - name: Stack logs
        if: failure()
        run: task e2e:logs:dump || true

      - name: Tear down
        if: always()
        run: task e2e:down -- --timeout 1

  # The required check, always reported (MAG-213): green when no device ran
  # because nothing the app or its stack depends on changed, red when the APK,
  # its unit tests or any shard of any device failed or was cancelled. Same shape
  # as `e2e-stack`. The name says `phone` because that is the one device a pull
  # request runs; on the nightly run it aggregates the three. `if: always()` so a
  # red job fails it instead of skipping it, which branch protection would read as
  # a pass. A shard skipped because the APK failed is not `success` either.
  e2e-mobile:
    name: E2E Mobile (phone)
    needs: [changes, e2e-mobile-build, e2e-mobile-unit, e2e-mobile-device]
    if: always() && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    runs-on: ubuntu-latest
    steps:
      - name: Every job passed, or none was needed
        env:
          CHANGES: ${{ needs.changes.result }}
          BUILD: ${{ needs.e2e-mobile-build.result }}
          UNIT: ${{ needs.e2e-mobile-unit.result }}
          DEVICES: ${{ needs.e2e-mobile-device.result }}
          WANTED: ${{ needs.changes.outputs.mobile }}
        run: |
          echo "changes=$CHANGES build=$BUILD unit=$UNIT devices=$DEVICES mobile wanted=$WANTED"
          [ "$CHANGES" = success ] || { echo "::error::Detect changes did not succeed"; exit 1; }
          if [ "$WANTED" = true ]; then
            [ "$BUILD" = success ] || { echo "::error::the e2e APK did not build ($BUILD)"; exit 1; }
            [ "$UNIT" = success ] || { echo "::error::the e2e flavor's unit tests did not succeed ($UNIT)"; exit 1; }
            [ "$DEVICES" = success ] || { echo "::error::a mobile journey did not succeed ($DEVICES)"; exit 1; }
          fi

  # The cron pod's scheduler (MAG-147): busybox crond ran the jobs as a
  # non-root user with a redirection to /proc/1/fd/1 that user cannot open, so
  # no job ever started. Starts the image as that user and checks a job runs,
  # and that a failing one is logged.
  cron-image:
    name: Cron image (scheduler runs jobs as non-root)
    needs: changes
    if: needs.changes.outputs.cron == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build the php image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .docker/php/Dockerfile
          target: e2e
          load: true
          tags: maggie-php-cron-test:ci
          cache-from: type=gha,scope=php-cron-test
          cache-to: type=gha,mode=max,scope=php-cron-test

      - name: Test the scheduler
        env:
          IMAGE: maggie-php-cron-test:ci
        run: bash infra/scripts/tests/cron-image.test.sh

  # The unit tests of the app as it ships (formerly the `Mobile CI` workflow, a
  # second line per push). Behind `changes` like every other job: skipped when
  # nothing the app reads moved.
  mobile-unit:
    name: Mobile Unit Tests (release)
    needs: changes
    if: needs.changes.outputs.mobile_unit == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      # Robolectric downloads its Android runtime (`android-all-instrumented`,
      # ~150 MB) into ~/.m2, which setup-gradle does not cover (MAG-247). Keyed on
      # the Robolectric version and on the API level `robolectric.properties` pins,
      # the two things that decide which jar is fetched.
      - uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-runtime-${{ runner.os }}-${{ hashFiles('mobile/gradle/libs.versions.toml', 'mobile/app/src/test/resources/robolectric.properties') }}
      # The variant that ships, not the dev debug one: three CI fixes came from
      # the gap between what was tested and what was delivered (MAG-96).
      #
      # Kover runs that same test task and reads the line coverage off it (MAG-105).
      - run: ./gradlew :app:koverXmlReportProdRelease -Dorg.gradle.java.home="$JAVA_HOME"
      - uses: ./.github/actions/coverage
        with:
          component: mobile
          format: jacoco
          report: mobile/app/build/reports/kover/reportProdRelease.xml

  # Guard rails of the autonomous agent (MAG-128). Not a required check: a pull
  # request that trips a rail is not blocked, it is handed to a human — labelled
  # `needs-human`, auto-merge switched off, the reason in a comment. The diff
  # touches infra, the CD, secrets, auth, permissions, a destructive migration or
  # policy.yaml; is bigger than the limit; disables a test or skips the hooks
  # (scripts/agent-guard/check.sh). A batch of the merge train (label `batch`,
  # MAG-262) is judged PR by PR, each listed PR with these same rules, and must be
  # exactly their sum (scripts/agent-guard/judge.sh). AGENT_ENABLED=false hands
  # every agent pull request over. The fix of an « Emergency » ticket merges its infra change alone
  # (emergency.sh, MAG-184).
  #
  # This job runs the pull request's own copy of the scripts, so a PR could edit
  # its own guard: `agent-guard.yml` re-runs the same check from the default
  # branch when auto-merge is switched on, which is the one that cannot be edited.
  guard:
    name: Sensitive changes and limits
    if: github.event_name == 'pull_request' && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PR: ${{ github.event.pull_request.number }}
      BRANCH: ${{ github.event.pull_request.head.ref }}
      AGENT_ENABLED: ${{ vars.AGENT_ENABLED }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the diff
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
        run: |
          # A pull request labelled `batch` is judged PR by PR (judge.sh, MAG-262).
          status=0
          scripts/agent-guard/judge.sh "$PR" > findings.txt || status=$?
          if [ "$AGENT_ENABLED" = false ] && [[ "$BRANCH" == cyrus/* || "$BRANCH" == train/batch-* ]]; then
            echo "agent-disabled: AGENT_ENABLED is false, the autonomous agent is stopped" >> findings.txt
            status=10
          fi
          [ "$status" -eq 0 ] || [ "$status" -eq 10 ] || exit "$status"
          # The fix of an « Emergency » ticket merges its infra change alone; any
          # other finding, or any doubt, still goes to a human.
          if [ "$status" -eq 10 ] && scripts/agent-guard/emergency.sh "$BRANCH" < findings.txt > waived.txt; then
            mv waived.txt findings.txt
            status=0
          fi
          grep -v '^info: ' findings.txt > reasons.txt || true
          echo "status=$status" >> "$GITHUB_ENV"

      - name: Hand over to a human
        if: env.status == '10'
        run: |
          {
            echo "A human has to merge this pull request: auto-merge is off and \`needs-human\` is set."
            echo
            sed 's/^/- /' reasons.txt
          } | scripts/agent-guard/hand-over.sh "$PR" guard

  # While production is frozen (MAG-184) — a ticket in « Emergency » after a
  # failed deploy, or an open `incident` ticket — only the PR that carries one
  # of those keys may merge. A required check; it fails closed when Linear does
  # not answer, and the last job of main.yml (or the hourly incident-gate-release.yml)
  # re-runs it once the freeze lifts.
  #
  # It runs last, after every other job: checked at the start, it could pass a
  # PR whose slow jobs end after a deploy failed, and the armed auto-merge would
  # merge it into a frozen production. Last, that window shrinks to seconds.
  incident-gate:
    name: Incident gate
    needs: [changes, api-lint, agent-lint, ciqual-lint, admin-lint, api-test, agent-test, ciqual-test, admin-test, mobile-unit, e2e-stack, e2e-mobile, cron-image, infra-scripts]
    if: always() && github.event_name == 'pull_request' && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Hold the PR while production is frozen, unless it is the fix
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BRANCH: ${{ github.head_ref }}
        run: bash infra/scripts/incident-gate.sh

  # The one check that cannot be skipped (MAG-267). GitHub counts a skipped
  # required check as green, so a draft run, a run cancelled by a newer one or a
  # job skipped because its `needs` failed all looked like a pass, and an armed
  # auto-merge merged pull requests no test had run on. `if: always()` makes this
  # job run on every ready pull request, and infra/scripts/pr-checks-gate.sh turns every skip
  # that `Detect changes` did not decide into red. Pull requests only: a merge or
  # the nightly run has no branch protection to satisfy.
  #
  # The list below is the script's (infra/scripts/pr-checks-gate.sh), kept in step
  # by its test. The old required checks stay required beside this one.
  pr-checks:
    name: PR checks passed
    needs: [changes, api-lint, agent-lint, ciqual-lint, admin-lint, api-test, agent-test, ciqual-test, admin-test, mobile-unit, e2e-stack, e2e-mobile, cron-image, infra-scripts, incident-gate]
    # Not on a draft (owner's decision, 7 Oct.): GitHub never merges a draft, so its skipped aggregator lets nothing
    # through, while the red one it used to post was noise — and, read back by the merge train, it spent repairs on
    # PRs whose real run had not even started. The real run starts when the PR is marked ready, on its final head.
    if: always() && github.event_name == 'pull_request' && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: infra/scripts
      - name: Everything that had to run ran, and is green
        env:
          DRAFT: ${{ github.event.pull_request.draft }}
          NEEDS: ${{ toJSON(needs) }}
        run: bash infra/scripts/pr-checks-gate.sh

  # The scripts the CD workflow runs on the VPS (MAG-106). They only execute
  # after a merge, so a typo would otherwise surface as a failed deploy. The agent
  # guard rails (MAG-128) are checked here for the same reason.
  infra-scripts:
    name: Infra scripts and workflows
    if: (github.event_name != 'pull_request' || !github.event.pull_request.draft) && inputs.suite != 'e2e'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint workflows
        run: |
          docker run --rm -v "$PWD":/repo -w /repo rhysd/actionlint:latest -color -ignore 'SC2129' .github/workflows/ci.yml \
            .github/workflows/main.yml .github/workflows/nightly.yml .github/workflows/nightly-e2e.yml .github/workflows/agent-guard.yml \
            .github/workflows/incident-gate-release.yml
      - name: Lint shell scripts
        run: |
          docker run --rm -v "$PWD":/mnt -w /mnt koalaman/shellcheck:stable -x --severity=warning \
            infra/scripts/*.sh infra/scripts/tests/*.sh scripts/agent-guard/*.sh scripts/coverage/*.sh scripts/e2e/*.sh \
            e2e/*.sh e2e/mobile/*.sh
      # Every journey of e2e/ is in e2e/impact-map.yml, and the map is sound: a
      # journey forgotten there would only ever play on the nightly run.
      - name: The e2e impact map covers every journey
        run: scripts/e2e/impacted.sh check
      - name: Test the PR aggregator, the e2e reference clock, the e2e journey selection and quarantine, the smoke suite, the rollback, the failed-deploy report, the incident gate, the deploy gate, the skipped CI of main, the mobile publication range, the freeze lift and the agent guard rails
        run: |
          bash infra/scripts/tests/smoke-prod.test.sh
          bash infra/scripts/tests/rollback-k3s.test.sh
          bash infra/scripts/tests/backup-k3s.test.sh
          bash infra/scripts/tests/deploy-k3s.test.sh
          bash infra/scripts/tests/deploy-tickets.test.sh
          bash infra/scripts/tests/report-failed-deploy.test.sh
          bash infra/scripts/tests/release-emergency.test.sh
          bash infra/scripts/tests/incident-gate.test.sh
          bash infra/scripts/tests/verify-digests.test.sh
          bash infra/scripts/tests/should-deploy.test.sh
          bash infra/scripts/tests/tested-tree.test.sh
          bash infra/scripts/tests/mobile-release.test.sh
          bash infra/scripts/tests/cd-lift-freeze.test.sh
          bash infra/scripts/tests/agent-guard.test.sh
          bash infra/scripts/tests/agent-guard-batch.test.sh
          bash infra/scripts/tests/agent-guard-emergency.test.sh
          bash infra/scripts/tests/merge-ready.test.sh
          bash infra/scripts/tests/coverage.test.sh
          bash infra/scripts/tests/pr-checks-gate.test.sh
          bash infra/scripts/tests/clock.test.sh
          bash infra/scripts/tests/e2e-impacted.test.sh
          bash infra/scripts/tests/e2e-verdict.test.sh
          bash infra/scripts/tests/e2e-nightly-report.test.sh
