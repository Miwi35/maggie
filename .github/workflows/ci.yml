name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'mobile/**'
      - '**.md'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'mobile/**'
      - '**.md'

jobs:
  api-lint:
    name: API Lint (PHPStan)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
      - run: composer install --no-interaction --prefer-dist
      - run: vendor/bin/phpstan analyse

  agent-lint:
    name: Agent Lint (Ruff)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install ruff
      - run: ruff check app/
      - run: ruff format --check app/

  ciqual-lint:
    name: Ciqual Lint (Ruff)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ciqual
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install ruff
      - run: ruff check app/ tests/
      - run: ruff format --check app/ tests/

  admin-lint:
    name: Admin Lint (ESLint + TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck

  api-test:
    name: API Tests (PHPUnit)
    needs: api-lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: maggie
          POSTGRES_PASSWORD: maggie
          POSTGRES_DB: maggie
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://maggie:maggie@localhost:5432/maggie?serverVersion=17&charset=utf8
      APP_ENV: test
      MESSENGER_TRANSPORT_DSN: sync://
      CIQUAL_SERVICE_URL: http://localhost:8002
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql
          tools: composer:v2
      - run: composer install --no-interaction --prefer-dist
      - name: Generate JWT keys
        run: |
          mkdir -p config/jwt
          openssl genpkey -algorithm RSA -out config/jwt/private.pem -pkeyopt rsa_keygen_bits:4096 -pass pass:test
          openssl rsa -pubout -in config/jwt/private.pem -out config/jwt/public.pem -passin pass:test
        env:
          JWT_PASSPHRASE: test
      - run: bin/console doctrine:database:create --env=test --no-interaction --if-not-exists
      - run: bin/console doctrine:schema:create --env=test --no-interaction
      - run: bin/phpunit
        env:
          JWT_PASSPHRASE: test

  agent-test:
    name: Agent Tests (pytest)
    needs: agent-lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e ".[dev]"
      - run: pytest

  ciqual-test:
    name: Ciqual Tests (pytest)
    needs: ciqual-lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ciqual
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e ".[dev]"
      - run: pytest

  admin-test:
    name: Admin Tests (Vitest)
    needs: admin-lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - run: npm ci
      - run: npm run test
