name: Incident gate release

# The hourly safety net of the freeze (MAG-184, MAG-244). The usual release is the
# last job of main.yml: a green deploy lifts the freeze and, right after, re-runs
# the red `Incident gate` of every open PR, so their auto-merge fires on its own.
# What that job cannot see is a freeze lifted by hand — someone closes an incident
# ticket or moves an « Emergency » ticket out — so this re-runs the same script,
# which does nothing while production is frozen. It was every ten minutes (144
# lines a day in the Actions list) for what is a rare, manual case: a PR held for
# up to an hour then, and `workflow_dispatch` releases it at once.

run-name: Gel d'incident · filet de sécurité horaire

on:
  schedule:
    - cron: "11 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: write
  pull-requests: read
  checks: read

concurrency:
  group: incident-gate-release
  cancel-in-progress: false

jobs:
  release:
    name: Re-run the held gates
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Re-run the red Incident gates if the freeze lifted
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
        run: bash infra/scripts/rerun-incident-gates.sh
