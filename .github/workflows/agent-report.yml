name: Agent report

# The agent's day (MAG-128): pull requests opened, merged, waiting for a human.
# Always in the run's summary; also posted as a Linear comment when the secret
# LINEAR_API_KEY and the variable AGENT_REPORT_ISSUE_ID (the UUID of the issue
# that collects the reports) are set. The cost is not here: GitHub does not know it.

on:
  schedule:
    # 06:07 UTC, 08:07 in Paris: off the hour.
    - cron: '7 6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  report:
    name: Daily report
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
      ISSUE_ID: ${{ vars.AGENT_REPORT_ISSUE_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Build the report
        run: |
          scripts/agent-guard/daily-report.sh 24 | tee report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Post it on Linear
        if: env.LINEAR_API_KEY != '' && env.ISSUE_ID != ''
        run: |
          jq -n --arg id "$ISSUE_ID" --rawfile body report.md \
            '{query: "mutation($id: String!, $body: String!) { commentCreate(input: {issueId: $id, body: $body}) { success } }", variables: {id: $id, body: $body}}' \
            | curl -sS --fail-with-body https://api.linear.app/graphql \
              -H "Authorization: $LINEAR_API_KEY" -H 'Content-Type: application/json' -d @- \
            | tee response.json
          jq -e '.data.commentCreate.success == true' response.json > /dev/null
