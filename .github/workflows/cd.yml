name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

# One deployment at a time: two runs 10 s apart once raced in the same pod.
# Queued, never cancelled, so the last merge always ends up deployed.
# GitHub keeps a single pending run per group and cancels the one it replaces: the
# late CI of an older commit (its SHA is not the head of main, which is what
# github.sha is for this trigger) gets a group of its own, or it would push the
# head's run out of the queue and then stop at the gate, deploying nothing.
concurrency:
  group: ${{ github.event.workflow_run.head_sha == github.sha && 'cd-production' || format('cd-stale-{0}', github.run_id) }}
  cancel-in-progress: false

env:
  # Everything is built, tagged, copied and verified on the commit of the CI that
  # triggered this run. github.sha is the head of main when the run was
  # triggered, which is another commit when a late CI finishes (MAG-189).
  RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
  REGISTRY: ghcr.io
  PHP_IMAGE: ghcr.io/miwi35/maggie-php
  NGINX_IMAGE: ghcr.io/miwi35/maggie-nginx
  AGENT_IMAGE: ghcr.io/miwi35/maggie-agent
  CIQUAL_IMAGE: ghcr.io/miwi35/maggie-ciqual

jobs:
  # Only the CI of the head of main, not yet in production, deploys (MAG-189).
  # Any other run ends here: every other job is skipped, no incident, no rollback.
  # A run is never left green by a stop, or "a successful CD run" (the base of the
  # change detection, the "already deployed" check) would name a commit nobody
  # deployed: a commit that is not the head of main when the run is triggered gets
  # a skipped run (the condition below), one that stops later cancels itself.
  # Checked out from the default branch: the SHA of an old CI may predate the script.
  gate:
    name: Should this commit deploy
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_sha == github.sha }}
    outputs:
      proceed: ${{ steps.decide.outputs.proceed }}
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: infra/scripts

      - name: Decide
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          CI_SHA: ${{ env.RELEASE_SHA }}
        run: |
          set -o pipefail
          bash infra/scripts/should-deploy.sh | tee -a "$GITHUB_STEP_SUMMARY"

  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    needs: gate
    if: ${{ needs.gate.outputs.proceed == 'true' }}
    outputs:
      app: ${{ steps.filter.outputs.app }}
      agent: ${{ steps.filter.outputs.agent }}
      ciqual: ${{ steps.filter.outputs.ciqual }}
      infra: ${{ steps.filter.outputs.infra }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 0

      - name: Detect changed paths
        id: filter
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Compare against the last commit we actually deployed. Diffing HEAD~1
          # only exposes the final commit of a push, so a batch of commits could
          # ship an API change while silently skipping the agent image it needs.
          BASE=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/cd.yml/runs?status=success&per_page=1" \
            --jq '.workflow_runs[0].head_sha' 2>/dev/null || true)
          if [ -z "$BASE" ] || ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            BASE=$(git rev-parse HEAD~1)
          fi
          echo "Comparing $BASE...HEAD"
          CHANGED=$(git diff --name-only "$BASE" HEAD)
          echo "$CHANGED"
          echo "app=$(echo "$CHANGED" | grep -qE '^(api/|admin/|\.docker/(php|nginx)/)' && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "agent=$(echo "$CHANGED" | grep -qE '^(agent/|\.docker/python/)' && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "ciqual=$(echo "$CHANGED" | grep -qE '^(ciqual/|\.docker/ciqual/)' && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "infra=$(echo "$CHANGED" | grep -qE '^(infra/(k8s|scripts)/|\.github/workflows/cd\.yml)' && echo true || echo false)" >> "$GITHUB_OUTPUT"

  # ===========================================================================
  # Build PHP image (needed by nginx build)
  # ===========================================================================
  build-php:
    name: Build PHP
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SHA }}

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .docker/php/Dockerfile
          target: prod
          push: true
          tags: |
            ${{ env.PHP_IMAGE }}:${{ env.RELEASE_SHA }}
            ${{ env.PHP_IMAGE }}:latest
          cache-from: type=gha,scope=php
          cache-to: type=gha,mode=max,scope=php

  # ===========================================================================
  # Build Agent image (parallel with PHP)
  # ===========================================================================
  build-agent:
    name: Build Agent
    needs: changes
    if: needs.changes.outputs.agent == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SHA }}

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .docker/python/Dockerfile
          target: prod
          push: true
          tags: |
            ${{ env.AGENT_IMAGE }}:${{ env.RELEASE_SHA }}
            ${{ env.AGENT_IMAGE }}:latest
          cache-from: type=gha,scope=agent
          cache-to: type=gha,mode=max,scope=agent

  # ===========================================================================
  # Build Ciqual image (parallel with PHP and Agent)
  # ===========================================================================
  build-ciqual:
    name: Build Ciqual
    needs: changes
    if: needs.changes.outputs.ciqual == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SHA }}
          lfs: true

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .docker/ciqual/Dockerfile
          target: prod
          push: true
          tags: |
            ${{ env.CIQUAL_IMAGE }}:${{ env.RELEASE_SHA }}
            ${{ env.CIQUAL_IMAGE }}:latest
          cache-from: type=gha,scope=ciqual
          cache-to: type=gha,mode=max,scope=ciqual

  # ===========================================================================
  # Build Nginx image (depends on PHP for public assets)
  # ===========================================================================
  build-nginx:
    name: Build Nginx
    needs: [changes, build-php]
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SHA }}

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .docker/nginx/Dockerfile
          target: prod
          build-args: |
            PHP_IMAGE=${{ env.PHP_IMAGE }}:${{ env.RELEASE_SHA }}
            MERCURE_PUBLIC_URL=https://maggieai.fr/.well-known/mercure
          push: true
          tags: |
            ${{ env.NGINX_IMAGE }}:${{ env.RELEASE_SHA }}
            ${{ env.NGINX_IMAGE }}:latest
          cache-from: type=gha,scope=nginx
          cache-to: type=gha,mode=max,scope=nginx

  # ===========================================================================
  # Deploy to k3s via SSH
  # ===========================================================================
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: [changes, build-nginx, build-agent, build-ciqual]
    if: >-
      always() && !failure() && !cancelled() &&
      (needs.build-nginx.result == 'success' ||
       needs.build-agent.result == 'success' ||
       needs.build-ciqual.result == 'success' ||
       needs.changes.outputs.infra == 'true')
    environment: production
    outputs:
      script_started: ${{ steps.mark.outputs.started }}
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SHA }}

      - name: Copy k8s manifests and deploy script to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "infra/k8s/,infra/scripts/deploy-k3s.sh,infra/scripts/backup-k3s.sh,infra/scripts/rollback-k3s.sh,infra/scripts/verify-digests.sh"
          target: /opt/maggie/

      # Lets the rollback job tell "the deploy script ran and failed" from "it
      # never reached the cluster": in the second case the record it would find
      # belongs to the previous, healthy deploy and must not be undone.
      - name: Mark the deploy script as started
        id: mark
        run: echo "started=true" >> "$GITHUB_OUTPUT"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE_TAG: ${{ env.RELEASE_SHA }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: IMAGE_TAG
          command_timeout: 15m
          script: |
            set -e
            chmod +x /opt/maggie/infra/scripts/deploy-k3s.sh
            /opt/maggie/infra/scripts/deploy-k3s.sh "$IMAGE_TAG"

  # ===========================================================================
  # Smoke tests on production (MAG-106)
  #
  # Read-only, as a technical account. Covers what CI cannot see: production
  # config, image digests, a stale index. A failure rolls the deploy back.
  # ===========================================================================
  smoke:
    name: Smoke test production
    runs-on: ubuntu-latest
    # The build jobs are listed for their digests (MAG-96). `always()` because a
    # build that did not run is skipped, and a skipped need would skip this job.
    needs: [deploy, build-php, build-nginx, build-agent, build-ciqual]
    if: always() && !cancelled() && needs.deploy.result == 'success'
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SHA }}

      - name: Configure SSH to the VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          printf 'Host vps\n  HostName %s\n  User %s\n  IdentityFile ~/.ssh/vps_key\n  StrictHostKeyChecking accept-new\n  BatchMode yes\n' \
            "$VPS_HOST" "$VPS_USER" > ~/.ssh/config

      # A green rollout says the pods are healthy, not that they run what was
      # just built: eleven fixes were one stale-tag redeploy (MAG-96). Every
      # service is held to the digest this run pushed, or, when it was not
      # rebuilt, to the one it ran before the deploy.
      - name: Assert every service runs the image just built
        env:
          PHP_DIGEST: ${{ needs.build-php.outputs.digest }}
          NGINX_DIGEST: ${{ needs.build-nginx.outputs.digest }}
          AGENT_DIGEST: ${{ needs.build-agent.outputs.digest }}
          CIQUAL_DIGEST: ${{ needs.build-ciqual.outputs.digest }}
        run: |
          expected="php=$PHP_DIGEST nginx=$NGINX_DIGEST agent=$AGENT_DIGEST ciqual=$CIQUAL_DIGEST"
          # Interpolated into a remote command line: nothing but the expected
          # shape may get through. An empty digest is a service not rebuilt.
          d='(sha256:[0-9a-f]{64})?'
          if ! [[ "$expected" =~ ^php=$d\ nginx=$d\ agent=$d\ ciqual=$d$ ]]; then
            echo "::error::unexpected build digest output: $expected"
            exit 1
          fi
          # shellcheck disable=SC2029 # expanded here on purpose, validated above
          ssh vps "EXPECTED_DIGESTS='$expected' bash /opt/maggie/infra/scripts/verify-digests.sh"

      # Google sign-in cannot be driven from CI, so the php pod mints a JWT for
      # the technical account. The runner's logs are public: the token is masked
      # before it is stored and never echoed.
      - name: Get a token for the technical account
        run: |
          token=$(ssh vps 'sudo k3s kubectl exec deployment/php -n maggie -- bin/console app:smoke:token --no-interaction')
          if ! printf '%s' "$token" | grep -qE '^[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+$'; then
            echo "::error::app:smoke:token did not print a JWT"
            exit 1
          fi
          echo "::add-mask::$token"
          echo "SMOKE_TOKEN=$token" >> "$GITHUB_ENV"

      - name: Run the smoke suite
        env:
          BASE_URL: https://maggieai.fr
          ES_CHECK_CMD: ssh vps 'sudo k3s kubectl exec deployment/php -n maggie -- bin/console app:elasticsearch:status --check --no-interaction'
        run: infra/scripts/smoke-prod.sh

      # A green release needs no rollback record. Left behind, it would let a
      # later deploy that dies before reaching the cluster (SSH down) undo this
      # healthy one.
      - name: Drop the rollback record
        run: ssh vps 'rm -f /opt/maggie/state/pre-deploy-revisions' || echo "::warning::could not drop the rollback record"

  # ===========================================================================
  # A green release lifts the freeze (MAG-184)
  #
  # A ticket of the range still in « Emergency » has had its fix deployed green:
  # it goes to Recette, or Done for a Task. The GitHub integration usually did
  # it on merge already; this is the net, since a ticket left in « Emergency »
  # holds every PR.
  # ===========================================================================
  lift-freeze:
    name: Lift the freeze
    runs-on: ubuntu-latest
    # `always()` because without a status function GitHub adds an implicit
    # success() over every ancestor job: a build skipped (image unchanged) would
    # skip this job on a green release, and the ticket would stay in « Emergency »
    # (MAG-199). The deploy and smoke results are the whole condition.
    needs: [deploy, smoke]
    if: always() && needs.deploy.result == 'success' && needs.smoke.result == 'success'
    permissions:
      contents: read
      actions: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 0

      - name: Take the shipped tickets out of « Emergency »
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          SHA: ${{ env.RELEASE_SHA }}
        run: |
          # The same range as the `changes` job: since the last green CD run.
          base=$(gh api "repos/$GH_REPO/actions/workflows/cd.yml/runs?status=success&per_page=1" \
            --jq '.workflow_runs[0].head_sha' 2>/dev/null || true)
          # Never turns a green release red: the run's success is what the next
          # deploy counts its range from.
          DEPLOY_TICKETS=$(bash infra/scripts/deploy-tickets.sh "$SHA" "$base") bash infra/scripts/release-emergency.sh \
            || echo "::warning::could not take the shipped tickets out of « Emergency »: move them by hand"

  # ===========================================================================
  # Roll back, then report, when a build, the deploy or the smoke suite failed
  #
  # A failed build never reached the cluster: nothing is rolled back, but the
  # release is broken all the same, so it is reported like the others (MAG-184).
  # ===========================================================================
  rollback:
    name: Roll back and report
    runs-on: ubuntu-latest
    needs: [build-php, build-nginx, build-agent, build-ciqual, deploy, smoke]
    if: >-
      always() &&
      (needs.build-php.result == 'failure' ||
       needs.build-nginx.result == 'failure' ||
       needs.build-agent.result == 'failure' ||
       needs.build-ciqual.result == 'failure' ||
       needs.deploy.result == 'failure' ||
       needs.smoke.result == 'failure')
    permissions:
      contents: read
      actions: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 0

      - name: Configure SSH to the VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          printf 'Host vps\n  HostName %s\n  User %s\n  IdentityFile ~/.ssh/vps_key\n  StrictHostKeyChecking accept-new\n  BatchMode yes\n' \
            "$VPS_HOST" "$VPS_USER" > ~/.ssh/config

      # Restores only the deployments this deploy moved, to the revision
      # deploy-k3s.sh recorded. Nothing recorded means nothing was applied.
      # A failed build skips the deploy: no script started, no smoke, so this
      # step is skipped too and the cluster is left alone.
      - name: Roll back with kubectl rollout undo
        id: rollback
        if: needs.deploy.outputs.script_started == 'true' || needs.smoke.result == 'failure'
        run: |
          set -o pipefail
          ssh vps bash /opt/maggie/infra/scripts/rollback-k3s.sh 2>&1 | tee "$RUNNER_TEMP/rollback.log"

      # GitHub issues are disabled on this repository: Linear carries it
      # (MAG-146). The shipped tickets move to « Emergency », which freezes
      # production; an incident ticket is opened when they cannot carry it or the
      # rollback failed (MAG-184). The summary below is the trace that survives
      # even when the Linear calls fail.
      - name: Report the failed deploy in Linear
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          SHA: ${{ env.RELEASE_SHA }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_ID: ${{ github.run_id }}
          BUILD_PHP_RESULT: ${{ needs.build-php.result }}
          BUILD_NGINX_RESULT: ${{ needs.build-nginx.result }}
          BUILD_AGENT_RESULT: ${{ needs.build-agent.result }}
          BUILD_CIQUAL_RESULT: ${{ needs.build-ciqual.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          SMOKE_RESULT: ${{ needs.smoke.result }}
          ROLLBACK_OUTCOME: ${{ steps.rollback.outcome }}
          SCRIPT_STARTED: ${{ needs.deploy.outputs.script_started }}
        run: |
          build_failed=false
          for result in "$BUILD_PHP_RESULT" "$BUILD_NGINX_RESULT" "$BUILD_AGENT_RESULT" "$BUILD_CIQUAL_RESULT"; do
            if [ "$result" = "failure" ]; then build_failed=true; fi
          done

          rollback_failed=false
          if [ "$build_failed" = "true" ]; then
            cause="the image build failed"
            cause_fr="le build d'une image a échoué"
            state="The image build failed before the deploy: the cluster was not touched, nothing to roll back."
            state_fr="Le build a échoué avant le déploiement : le cluster n'a pas été touché, rien à remettre en arrière."
          else
            if [ "$DEPLOY_RESULT" = "failure" ]; then
              cause="the deploy itself failed"
              cause_fr="le déploiement lui-même a échoué"
            else
              cause="the post-deploy smoke suite failed"
              cause_fr="la suite de smoke après déploiement a échoué"
            fi

            if [ "$ROLLBACK_OUTCOME" = "success" ]; then
              state="Production was rolled back to the previous release."
              state_fr="La prod a été remise sur la version précédente."
            elif [ "$ROLLBACK_OUTCOME" = "skipped" ] && [ "$SCRIPT_STARTED" != "true" ] && [ "$SMOKE_RESULT" != "failure" ]; then
              state="The deploy failed before its script started: the cluster was not touched, nothing to roll back."
              state_fr="Le déploiement a échoué avant son script : le cluster n'a pas été touché, rien à remettre en arrière."
            else
              rollback_failed=true
              state="**The rollback itself failed: production may be running the broken release. Act now.**"
              state_fr="**Le rollback lui-même a échoué : la prod tourne peut-être sur la version cassée.**"
            fi
          fi

          # shellcheck disable=SC2016 # `$job` is a jq variable, not a shell one
          failed_step=$(gh api "repos/$GH_REPO/actions/runs/$RUN_ID/jobs" \
            --jq '[.jobs[] | .name as $job | .steps[] | select(.conclusion == "failure") | "\($job) › \(.name)"] | join(", ")' 2>/dev/null || true)
          restored=$(grep -E ': revision [0-9]+ → back to [0-9]+' "$RUNNER_TEMP/rollback.log" 2>/dev/null | sed 's/^==> /- /' || true)

          # The tickets shipped since the last green CD run, as the `changes` job counts them.
          base=$(gh api "repos/$GH_REPO/actions/workflows/cd.yml/runs?status=success&per_page=1" \
            --jq '.workflow_runs[0].head_sha' 2>/dev/null || true)
          tickets=$(bash infra/scripts/deploy-tickets.sh "$SHA" "$base" || true)

          body=$(printf '%s\n\n- Commit: %s\n- Run: %s\n- Failed step: %s\n- Builds: php %s, nginx %s, agent %s, ciqual %s\n- Deploy: %s, smoke: %s\n- Revisions restored:\n%s\n\nMigrations, Elasticsearch mappings, the ConfigMap and the Secret are not reverted by the rollback; the pre-deploy database dump is in /opt/maggie/backups on the VPS.\n' \
            "$state" "$SHA" "$RUN_URL" "${failed_step:-unknown}" \
            "$BUILD_PHP_RESULT" "$BUILD_NGINX_RESULT" "$BUILD_AGENT_RESULT" "$BUILD_CIQUAL_RESULT" \
            "$DEPLOY_RESULT" "$SMOKE_RESULT" "${restored:-none}")

          printf '## Production incident: %s for %s\n\n%s\n\nTickets: %s\n' "$cause" "${SHA:0:7}" "$body" "$(printf '%s' "${tickets:-none}" | paste -sd' ')" >> "$GITHUB_STEP_SUMMARY"

          INCIDENT_TITLE="Production: ${cause} for ${SHA:0:7}" INCIDENT_BODY="$body" \
          FAILURE_CAUSE="${cause_fr} (commit ${SHA:0:7})" PROD_STATE="$state_fr" \
          DEPLOY_TICKETS="$tickets" ROLLBACK_FAILED="$rollback_failed" \
            bash infra/scripts/report-failed-deploy.sh
