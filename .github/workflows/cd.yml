name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

env:
  REGISTRY: ghcr.io
  PHP_IMAGE: ghcr.io/miwi35/maggie-php
  NGINX_IMAGE: ghcr.io/miwi35/maggie-nginx
  AGENT_IMAGE: ghcr.io/miwi35/maggie-agent
  CIQUAL_IMAGE: ghcr.io/miwi35/maggie-ciqual

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    outputs:
      app: ${{ steps.filter.outputs.app }}
      agent: ${{ steps.filter.outputs.agent }}
      ciqual: ${{ steps.filter.outputs.ciqual }}
      infra: ${{ steps.filter.outputs.infra }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 2

      - name: Detect changed paths
        id: filter
        run: |
          CHANGED=$(git diff --name-only HEAD~1 HEAD)
          echo "$CHANGED"
          echo "app=$(echo "$CHANGED" | grep -qE '^(api/|admin/|\.docker/(php|nginx)/)' && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "agent=$(echo "$CHANGED" | grep -qE '^(agent/|\.docker/python/)' && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "ciqual=$(echo "$CHANGED" | grep -qE '^(ciqual/|\.docker/ciqual/)' && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "infra=$(echo "$CHANGED" | grep -qE '^(infra/k8s/|\.github/workflows/cd\.yml)' && echo true || echo false)" >> "$GITHUB_OUTPUT"

  # ===========================================================================
  # Build PHP image (needed by nginx build)
  # ===========================================================================
  build-php:
    name: Build PHP
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: .docker/php/Dockerfile
          target: prod
          push: true
          tags: |
            ${{ env.PHP_IMAGE }}:${{ github.sha }}
            ${{ env.PHP_IMAGE }}:latest
          cache-from: type=gha,scope=php
          cache-to: type=gha,mode=max,scope=php

  # ===========================================================================
  # Build Agent image (parallel with PHP)
  # ===========================================================================
  build-agent:
    name: Build Agent
    needs: changes
    if: needs.changes.outputs.agent == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: .docker/python/Dockerfile
          target: prod
          push: true
          tags: |
            ${{ env.AGENT_IMAGE }}:${{ github.sha }}
            ${{ env.AGENT_IMAGE }}:latest
          cache-from: type=gha,scope=agent
          cache-to: type=gha,mode=max,scope=agent

  # ===========================================================================
  # Build Ciqual image (parallel with PHP and Agent)
  # ===========================================================================
  build-ciqual:
    name: Build Ciqual
    needs: changes
    if: needs.changes.outputs.ciqual == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: .docker/ciqual/Dockerfile
          target: prod
          push: true
          tags: |
            ${{ env.CIQUAL_IMAGE }}:${{ github.sha }}
            ${{ env.CIQUAL_IMAGE }}:latest
          cache-from: type=gha,scope=ciqual
          cache-to: type=gha,mode=max,scope=ciqual

  # ===========================================================================
  # Build Nginx image (depends on PHP for public assets)
  # ===========================================================================
  build-nginx:
    name: Build Nginx
    needs: [changes, build-php]
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: .docker/nginx/Dockerfile
          target: prod
          build-args: |
            PHP_IMAGE=${{ env.PHP_IMAGE }}:${{ github.sha }}
            MERCURE_PUBLIC_URL=https://maggieai.fr/.well-known/mercure
          push: true
          tags: |
            ${{ env.NGINX_IMAGE }}:${{ github.sha }}
            ${{ env.NGINX_IMAGE }}:latest
          cache-from: type=gha,scope=nginx
          cache-to: type=gha,mode=max,scope=nginx

  # ===========================================================================
  # Deploy to k3s via SSH
  # ===========================================================================
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: [changes, build-nginx, build-agent, build-ciqual]
    if: >-
      always() && !failure() && !cancelled() &&
      (needs.build-nginx.result == 'success' ||
       needs.build-agent.result == 'success' ||
       needs.build-ciqual.result == 'success' ||
       needs.changes.outputs.infra == 'true')
    environment: production
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Copy k8s manifests to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: infra/k8s/
          target: /opt/maggie/

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE_TAG: ${{ github.sha }}
          APP_CHANGED: ${{ needs.changes.outputs.app }}
          AGENT_CHANGED: ${{ needs.changes.outputs.agent }}
          CIQUAL_CHANGED: ${{ needs.changes.outputs.ciqual }}
          INFRA_CHANGED: ${{ needs.changes.outputs.infra }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: IMAGE_TAG,APP_CHANGED,AGENT_CHANGED,CIQUAL_CHANGED,INFRA_CHANGED
          script: |
            set -e

            # Apply manifest changes if infra files changed
            if [ "$INFRA_CHANGED" = "true" ]; then
              kubectl apply -k /opt/maggie/infra/k8s/
            fi

            # Update image tags for changed services
            if [ "$APP_CHANGED" = "true" ]; then
              kubectl set image deployment/php -n maggie php=ghcr.io/miwi35/maggie-php:$IMAGE_TAG
              kubectl set image deployment/nginx -n maggie nginx=ghcr.io/miwi35/maggie-nginx:$IMAGE_TAG
              kubectl set image deployment/worker -n maggie worker=ghcr.io/miwi35/maggie-php:$IMAGE_TAG
              kubectl set image deployment/cron -n maggie cron=ghcr.io/miwi35/maggie-php:$IMAGE_TAG
            fi
            if [ "$AGENT_CHANGED" = "true" ]; then
              kubectl set image deployment/agent -n maggie agent=ghcr.io/miwi35/maggie-agent:$IMAGE_TAG
            fi
            if [ "$CIQUAL_CHANGED" = "true" ]; then
              kubectl set image deployment/ciqual -n maggie ciqual=ghcr.io/miwi35/maggie-ciqual:$IMAGE_TAG
            fi

            # Wait for rollout
            kubectl rollout status deployment/php -n maggie --timeout=120s
            kubectl rollout status deployment/nginx -n maggie --timeout=60s

            # Run database migrations
            kubectl exec deployment/php -n maggie -- bin/console doctrine:migrations:migrate --no-interaction

            # Verify
            kubectl get pods -n maggie
