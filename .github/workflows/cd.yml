name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

# One deployment at a time: two runs 10 s apart once raced on cache:clear in the same pod.
# Queued, never cancelled, so the last merge always ends up deployed.
concurrency:
  group: cd-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  PHP_IMAGE: ghcr.io/miwi35/maggie-php
  NGINX_IMAGE: ghcr.io/miwi35/maggie-nginx
  AGENT_IMAGE: ghcr.io/miwi35/maggie-agent
  CIQUAL_IMAGE: ghcr.io/miwi35/maggie-ciqual

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    outputs:
      app: ${{ steps.filter.outputs.app }}
      agent: ${{ steps.filter.outputs.agent }}
      ciqual: ${{ steps.filter.outputs.ciqual }}
      infra: ${{ steps.filter.outputs.infra }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Detect changed paths
        id: filter
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Compare against the last commit we actually deployed. Diffing HEAD~1
          # only exposes the final commit of a push, so a batch of commits could
          # ship an API change while silently skipping the agent image it needs.
          BASE=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/cd.yml/runs?status=success&per_page=1" \
            --jq '.workflow_runs[0].head_sha' 2>/dev/null || true)
          if [ -z "$BASE" ] || ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            BASE=$(git rev-parse HEAD~1)
          fi
          echo "Comparing $BASE...HEAD"
          CHANGED=$(git diff --name-only "$BASE" HEAD)
          echo "$CHANGED"
          echo "app=$(echo "$CHANGED" | grep -qE '^(api/|admin/|\.docker/(php|nginx)/)' && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "agent=$(echo "$CHANGED" | grep -qE '^(agent/|\.docker/python/)' && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "ciqual=$(echo "$CHANGED" | grep -qE '^(ciqual/|\.docker/ciqual/)' && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "infra=$(echo "$CHANGED" | grep -qE '^(infra/(k8s|scripts)/|\.github/workflows/cd\.yml)' && echo true || echo false)" >> "$GITHUB_OUTPUT"

  # ===========================================================================
  # Build PHP image (needed by nginx build)
  # ===========================================================================
  build-php:
    name: Build PHP
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: .docker/php/Dockerfile
          target: prod
          push: true
          tags: |
            ${{ env.PHP_IMAGE }}:${{ github.sha }}
            ${{ env.PHP_IMAGE }}:latest
          cache-from: type=gha,scope=php
          cache-to: type=gha,mode=max,scope=php

  # ===========================================================================
  # Build Agent image (parallel with PHP)
  # ===========================================================================
  build-agent:
    name: Build Agent
    needs: changes
    if: needs.changes.outputs.agent == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: .docker/python/Dockerfile
          target: prod
          push: true
          tags: |
            ${{ env.AGENT_IMAGE }}:${{ github.sha }}
            ${{ env.AGENT_IMAGE }}:latest
          cache-from: type=gha,scope=agent
          cache-to: type=gha,mode=max,scope=agent

  # ===========================================================================
  # Build Ciqual image (parallel with PHP and Agent)
  # ===========================================================================
  build-ciqual:
    name: Build Ciqual
    needs: changes
    if: needs.changes.outputs.ciqual == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: .docker/ciqual/Dockerfile
          target: prod
          push: true
          tags: |
            ${{ env.CIQUAL_IMAGE }}:${{ github.sha }}
            ${{ env.CIQUAL_IMAGE }}:latest
          cache-from: type=gha,scope=ciqual
          cache-to: type=gha,mode=max,scope=ciqual

  # ===========================================================================
  # Build Nginx image (depends on PHP for public assets)
  # ===========================================================================
  build-nginx:
    name: Build Nginx
    needs: [changes, build-php]
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: .docker/nginx/Dockerfile
          target: prod
          build-args: |
            PHP_IMAGE=${{ env.PHP_IMAGE }}:${{ github.sha }}
            MERCURE_PUBLIC_URL=https://maggieai.fr/.well-known/mercure
          push: true
          tags: |
            ${{ env.NGINX_IMAGE }}:${{ github.sha }}
            ${{ env.NGINX_IMAGE }}:latest
          cache-from: type=gha,scope=nginx
          cache-to: type=gha,mode=max,scope=nginx

  # ===========================================================================
  # Deploy to k3s via SSH
  # ===========================================================================
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: [changes, build-nginx, build-agent, build-ciqual]
    if: >-
      always() && !failure() && !cancelled() &&
      (needs.build-nginx.result == 'success' ||
       needs.build-agent.result == 'success' ||
       needs.build-ciqual.result == 'success' ||
       needs.changes.outputs.infra == 'true')
    environment: production
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Copy k8s manifests and deploy script to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "infra/k8s/,infra/scripts/deploy-k3s.sh"
          target: /opt/maggie/

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE_TAG: ${{ github.sha }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: IMAGE_TAG
          command_timeout: 15m
          script: |
            set -e
            chmod +x /opt/maggie/infra/scripts/deploy-k3s.sh
            /opt/maggie/infra/scripts/deploy-k3s.sh "$IMAGE_TAG"
