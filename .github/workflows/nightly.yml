name: Nightly

# Everything that runs once a night, in one run (MAG-244): the whole CI with no
# path filter (MAG-96) — a regression that slipped past a filtered pull-request
# run, or a flaky stack, shows up within a day — and the prompt-lab scenarios on
# the real model (MAG-95). They were two workflows, `nightly.yml` and `eval.yml`.
# Nothing here is a required check, which is what makes the eval "non-blocking" a
# fact rather than a promise: it calls Claude, so it is slow and billed, and its
# verdict is about judgement rather than correctness.
#
# A failure of the CI opens a Linear `Bug` labelled `nightly-failure` (or comments
# on the one already open): GitHub issues are disabled on this repository, the
# owner is notified through Linear, and a run that stays red for a week is one
# ticket, not seven (MAG-151). The eval does not: a colder prompt is worth
# knowing about, not an alert.
#
# On demand from the Actions tab: `what` picks the half to run, and `only` narrows
# the eval to one scenario while iterating on a prompt (`--only <name>`).

run-name: >-
  ${{ github.event_name == 'schedule'
      && 'Nuit · CI complète + eval du modèle réel'
      || format('Nuit · manuel · {0}{1}', inputs.what, inputs.only && format(' · {0}', inputs.only) || '') }}

on:
  schedule:
    # 02:43 UTC: off the hour, so it does not queue behind everyone else's cron.
    - cron: '43 2 * * *'
  workflow_dispatch:
    inputs:
      what:
        description: 'What to run'
        required: false
        type: choice
        default: everything
        options: [everything, ci, eval]
      only:
        description: 'Eval: run only the scenarios whose name contains this'
        required: false
        type: string

concurrency:
  group: nightly
  cancel-in-progress: false

# What the called workflows ask for: the e2e stack pushes its images to GHCR, and
# their coverage-report jobs (which skip here) comment on pull requests — a called
# workflow may not ask for more than its caller grants (MAG-105).
permissions:
  contents: read
  packages: write
  pull-requests: write

jobs:
  ci:
    name: CI
    if: github.event_name == 'schedule' || inputs.what != 'eval'
    uses: ./.github/workflows/ci.yml
    # The ceiling of the pull-request-only jobs the called file also holds
    # (guard, streak): a called workflow may not ask for more than its caller.
    permissions:
      contents: read
      packages: write
      actions: read
      pull-requests: write
      issues: write

  alert:
    name: Alert on failure
    needs: [ci]
    if: always() && needs.ci.result == 'failure'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Open or update the nightly ticket
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          ALERT_LABEL: nightly-failure
          ALERT_TITLE: "Nightly : la suite de nuit a échoué"
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          CI_RESULT: ${{ needs.ci.result }}
        run: |
          ALERT_BODY="$(printf 'La suite de nuit a échoué.\n\n- Run : %s\n- CI : %s\n' "$RUN_URL" "$CI_RESULT")"
          export ALERT_BODY
          bash infra/scripts/alert-ticket.sh

  # The prompt-lab scenarios on the real model, in parallel with the CI: another
  # runner, another stack. Nothing depends on it. The `only` input goes through
  # the environment below, never interpolated into the command line.
  eval:
    name: Eval suite (real model)
    if: github.event_name == 'schedule' || inputs.what != 'ci'
    runs-on: ubuntu-latest
    env:
      COMPOSE_PROJECT_NAME: maggie-eval-${{ github.run_id }}-${{ github.run_attempt }}
      E2E_LOGIN_TOKEN: ci-e2e-login-token
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      # The subject is whatever production serves (read below); the grader has to
      # be stronger than it, or the suite mostly measures a model agreeing with
      # itself. Production runs Haiku 4.5 for cost; the judge does not have to.
      EVAL_JUDGE_MODEL: claude-sonnet-5-5
    steps:
      - uses: actions/checkout@v4

      - name: Check the key is there
        id: key
        # Without it the run can only fail, and a red nightly that means "no
        # secret configured" trains everyone to ignore the nightly. Skip loudly
        # instead.
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::notice::ANTHROPIC_API_KEY is not configured — skipping the eval suite."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Use the model production serves
        if: steps.key.outputs.skip == 'false'
        # Read from the production configmap rather than pinned here, because
        # the eval's whole job is to watch *that* model. Note it is not
        # necessarily `anthropic_model` in agent/app/config.py: the configmap
        # wins in production, and the two have differed.
        run: |
          # `|| true`: the runner's shell is `bash -e`, and grep exiting 1 on no
          # match would kill the step before the message below could explain it.
          model=$(grep -oP '^\s*ANTHROPIC_MODEL:\s*\K\S+' infra/k8s/configmap.yaml || true)
          if [ -z "$model" ]; then
            echo "::error::no ANTHROPIC_MODEL in infra/k8s/configmap.yaml — the eval has no model to test"
            exit 1
          fi
          echo "ANTHROPIC_MODEL=$model" >> "$GITHUB_ENV"
          echo "::notice::Eval suite running on $model"

      - uses: arduino/setup-task@v2
        if: steps.key.outputs.skip == 'false'
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Start the stack
        if: steps.key.outputs.skip == 'false'
        run: task e2e:up

      - name: Seed
        # No --now, for the reason ci.yml gives: the seeded world has to stay in
        # step with the containers' clock, or every "upcoming" query comes back
        # empty and the model is blamed for it.
        if: steps.key.outputs.skip == 'false'
        run: task e2e:seed

      - name: Eval suite
        if: steps.key.outputs.skip == 'false'
        # The report path is inside the agent container, which mounts ./agent —
        # so it comes out at agent/eval-report.md on the runner. stdout stays the
        # log; the file is just the verdict table.
        #
        # `only` goes through the environment, never interpolated into the
        # command line.
        env:
          ONLY: ${{ inputs.only }}
        run: |
          # Validated rather than quoted around: the value is a scenario name
          # fragment, and Task joins everything after `--` into one string, so
          # whitespace could not survive the trip anyway. Refusing it says that,
          # where a quoting trick would only look safe.
          case "$ONLY" in
            *[[:space:]]*)
              echo "::error::--only takes one scenario name fragment, without spaces: got '$ONLY'"
              exit 1
              ;;
          esac
          # shellcheck disable=SC2086  # unquoted on purpose: empty must add no argument
          task e2e:eval -- --report /app/eval-report.md ${ONLY:+--only "$ONLY"}

      - name: Report
        if: always() && steps.key.outputs.skip == 'false'
        run: cat agent/eval-report.md >> "$GITHUB_STEP_SUMMARY" || true

      - uses: actions/upload-artifact@v4
        if: always() && steps.key.outputs.skip == 'false'
        with:
          name: eval-report
          path: agent/eval-report.md
          if-no-files-found: ignore

      - name: Stack logs
        if: failure() && steps.key.outputs.skip == 'false'
        run: task e2e:logs:dump || true

      - name: Tear down
        if: always() && steps.key.outputs.skip == 'false'
        run: task e2e:down || true
