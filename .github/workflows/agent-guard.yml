name: Agent guard

# The trusted copy of the guard rails (MAG-128), run only when auto-merge is
# switched on. The everyday guard is a job of the pull
# request pipeline (ci.yml, MAG-244): one line per push instead of three.
# Nothing here is a required check: a pull request that trips a rail is not
# blocked, it is handed to a human — labelled `needs-human`, auto-merge switched
# off, the reason in a comment — and the owner merges it, or does not.
#
# Why this one stays: `pull_request_target` runs the workflow file and the scripts
# of the default branch and never checks out the pull request, so a pull request
# cannot edit this guard. The copy in ci.yml runs the PR's own scripts and could be
# edited away by the PR it judges; arming auto-merge, which is what makes a merge
# happen without a human, always goes through this one. It runs once per PR.
#
# What it checks: the diff touches infra, the CD, secrets, auth, permissions, a
# destructive migration or policy.yaml; is bigger than the limit; disables a test
# or skips the hooks (scripts/agent-guard/check.sh). A batch of the merge train
# (label `batch`, MAG-262) is judged PR by PR, each listed PR with the same rules,
# and must be exactly their sum (scripts/agent-guard/judge.sh). AGENT_ENABLED=false
# (repo variable, `task guard:stop`) hands every agent pull request over.
# Emergency (MAG-184): when infra or CD files are the only reason, and the
# branch's ticket is in the Linear state « Emergency », the PR may merge itself:
# the ambulance ships its fix (scripts/agent-guard/emergency.sh).

on:
  pull_request_target:
    types: [auto_merge_enabled]

run-name: >-
  Agent guard · auto-merge armed · PR #${{ github.event.pull_request.number }}

permissions:
  contents: read
  pull-requests: write
  issues: write

env:
  GH_TOKEN: ${{ github.token }}
  GH_REPO: ${{ github.repository }}

jobs:
  guard:
    name: Sensitive changes and limits
    if: github.event_name == 'pull_request_target' && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    concurrency:
      group: agent-guard-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    env:
      PR: ${{ github.event.pull_request.number }}
      BRANCH: ${{ github.event.pull_request.head.ref }}
      AGENT_ENABLED: ${{ vars.AGENT_ENABLED }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the diff
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
        run: |
          # A pull request labelled `batch` is judged PR by PR (judge.sh, MAG-262).
          status=0
          scripts/agent-guard/judge.sh "$PR" > findings.txt || status=$?
          if [ "$AGENT_ENABLED" = false ] && [[ "$BRANCH" == cyrus/* || "$BRANCH" == train/batch-* ]]; then
            echo "agent-disabled: AGENT_ENABLED is false, the autonomous agent is stopped" >> findings.txt
            status=10
          fi
          [ "$status" -eq 0 ] || [ "$status" -eq 10 ] || exit "$status"
          # The fix of an « Emergency » ticket merges its infra change alone; any
          # other finding, or any doubt, still goes to a human.
          if [ "$status" -eq 10 ] && scripts/agent-guard/emergency.sh "$BRANCH" < findings.txt > waived.txt; then
            mv waived.txt findings.txt
            status=0
          fi
          grep -v '^info: ' findings.txt > reasons.txt || true
          echo "status=$status" >> "$GITHUB_ENV"

      - name: Hand over to a human
        if: env.status == '10'
        run: |
          {
            echo "A human has to merge this pull request: auto-merge is off and \`needs-human\` is set."
            echo
            sed 's/^/- /' reasons.txt
          } | scripts/agent-guard/hand-over.sh "$PR" guard
