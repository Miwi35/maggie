name: E2E clock

# The web and mobile journeys at the hours that break them (MAG-234).
#
# A journey that passes at 15:00 and fails at 00:30 depends on the hour it was
# started at (MAG-177, MAG-212, the mobile calendar flow). Instead of waiting for
# the night to find out, this runs the whole web suite and the phone's Maestro
# flows four times, each on a stack whose clock is fixed (`E2E_NOW`) to a
# boundary instant:
#
#   sunday-2350-paris          the week is about to change, in Paris
#   monday-0050-paris          the week just changed in Paris, not yet in UTC
#   dst-fall-back-0230-paris   02:30 on the last Sunday of October, winter time
#   saturday-2230-utc          Saturday in UTC, already Sunday in Paris
#
# Each name resolves to its next occurrence (e2e/clock.sh), in the called
# workflow's first job.
#
# On a pull request only when it can change the answer; every night in any case.
# Not a required check: the nightly alert (an issue) is how a red night reaches
# the owner, and a pull request touching the stack sees the result on its checks.

on:
  pull_request:
    branches: [main]
    paths:
      - 'e2e/**'
      - 'docker-compose.e2e.yml'
      - '.docker/php/**'
      - '.docker/python/**'
      - '.docker/e2e/**'
      - '.github/workflows/e2e-clock.yml'
      - '.github/workflows/ci.yml'
  schedule:
    # 01:23 UTC: off the hour, between nightly.yml (02:43) and the evening, so the
    # four stacks do not compete with the nightly suite for runners.
    - cron: '23 1 * * *'
  workflow_dispatch:

concurrency:
  group: e2e-clock-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  packages: write

jobs:
  clock:
    name: ${{ matrix.instant }}
    strategy:
      # An hour that breaks says nothing about the others.
      fail-fast: false
      matrix:
        instant:
          - sunday-2350-paris
          - monday-0050-paris
          - dst-fall-back-0230-paris
          - saturday-2230-utc
    uses: ./.github/workflows/ci.yml
    with:
      e2e_now: ${{ matrix.instant }}

  alert:
    name: Alert on failure
    needs: clock
    if: always() && needs.clock.result == 'failure' && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Open or update the nightly issue
        run: |
          gh label create nightly-failure --color B60205 --description "The nightly suite failed" 2>/dev/null || true

          body="$(printf 'The e2e suites failed at a boundary hour.\n\n- Run: %s\n- Which instant: see the failed clock jobs; e2e/clock.sh names lists them.\n' "$RUN_URL")"

          open="$(gh issue list --label nightly-failure --state open --json number --jq '.[0].number // empty')"
          if [ -n "$open" ]; then
            gh issue comment "$open" --body "$body"
          else
            gh issue create --label nightly-failure --title "E2E clock matrix failed" --body "$body"
          fi
