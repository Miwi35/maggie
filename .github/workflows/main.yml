name: Main

# What a merge on main does, in one run (MAG-244): the CI, then the deployment,
# then the freeze lifted. It used to be three workflows chained by `workflow_run`
# (CI, CD, Incident gate release) and four or five lines per merge.
#
# `run-name` says what the line is: the pipeline of main (CI then deployment),
# then the commit message. The expression language cannot split a message to keep
# its subject, and a squash message has a body: the fixed words come first so a
# truncated title still says what the line is.
run-name: main · CI puis déploiement · ${{ github.event.head_commit.message }}

on:
  push:
    branches: [main]

# One pipeline at a time: two deployments 10 s apart once raced in the same pod.
# Queued, never cancelled once started, so the last merge always ends up deployed.
# GitHub keeps a single pending run per group and cancels the one it replaces: a
# commit merged while another is being deployed waits, and if a third arrives
# first the second never runs, which is right — the third contains it. The gate
# below still refuses a run whose commit is no longer the head of main.
# The called `ci.yml` has its own group (`ci-Main-…`), a different string: a group
# shared by caller and callee would deadlock.
concurrency:
  group: main-pipeline
  cancel-in-progress: false

env:
  # Everything is built, tagged, copied and verified on the commit that was merged.
  RELEASE_SHA: ${{ github.sha }}
  REGISTRY: ghcr.io
  PHP_IMAGE: ghcr.io/miwi35/maggie-php
  NGINX_IMAGE: ghcr.io/miwi35/maggie-nginx
  AGENT_IMAGE: ghcr.io/miwi35/maggie-agent
  CIQUAL_IMAGE: ghcr.io/miwi35/maggie-ciqual

jobs:
  # The merge train rebases a pull request on main and squash-merges it, so the
  # commit that lands has the file tree the CI of the pull request already passed
  # (MAG-262). When the trees are the same and that CI was green, the suite is not
  # run a second time: ~20 minutes saved per merge. Anything else — a branch merged
  # out of date, a direct push, a revert, a red or missing run, an API that does
  # not answer — runs it in full. The reason is in this job's log and summary. The
  # nightly run calls `ci.yml` itself and always runs everything.
  tested:
    name: Was this tree already tested
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.decide.outputs.skip }}
    permissions:
      contents: read
      actions: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: infra/scripts

      - name: Compare the tree with the one the pull request tested
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          CI_SHA: ${{ env.RELEASE_SHA }}
        run: |
          set -o pipefail
          bash infra/scripts/tested-tree.sh | tee -a "$GITHUB_STEP_SUMMARY"

  # The whole suite of a pull request, whatever changed except what the path
  # filters skip on a push (`github.event_name` is `push` in the called workflow,
  # as it was when CI ran on main by itself). The write permissions are the
  # ceiling of the pull-request-only jobs (guard) the file also holds: a
  # called workflow may not ask for more than its caller, even for a job it skips.
  # `always()`: a `tested` job that dies runs the suite rather than skip it.
  ci:
    name: CI
    needs: tested
    if: ${{ always() && !cancelled() && needs.tested.outputs.skip != 'true' }}
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      packages: write
      actions: read
      pull-requests: write
      issues: write

  # Only the head of main, not yet in production, deploys (MAG-189).
  # Any other run ends here: every other job is skipped, no incident, no rollback.
  # A run is never left green by a stop, or "a successful run of this workflow"
  # (the base of the change detection, the "already deployed" check) would name a
  # commit nobody deployed: a run that stops cancels itself.
  # Checked out at the merged commit, which is where the script is.
  #
  # The CI is skipped when the tree was already tested (`tested`): that skip is a
  # pass, a failed or cancelled CI is not.
  gate:
    name: Should this commit deploy
    needs: [tested, ci]
    if: >-
      !cancelled() &&
      (needs.ci.result == 'success' ||
       (needs.ci.result == 'skipped' && needs.tested.outputs.skip == 'true'))
    runs-on: ubuntu-latest
    outputs:
      proceed: ${{ steps.decide.outputs.proceed }}
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: infra/scripts

      - name: Decide
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          CI_SHA: ${{ env.RELEASE_SHA }}
        run: |
          set -o pipefail
          bash infra/scripts/should-deploy.sh | tee -a "$GITHUB_STEP_SUMMARY"

  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    needs: gate
    # always(): the CI job above is skipped when the PR already tested this tree
    # (MAG-262), and without a status function GitHub adds an implicit success()
    # over every ancestor, so this job and the whole deploy chain were skipped.
    if: ${{ always() && !cancelled() && needs.gate.result == 'success' && needs.gate.outputs.proceed == 'true' }}
    outputs:
      app: ${{ steps.filter.outputs.app }}
      agent: ${{ steps.filter.outputs.agent }}
      ciqual: ${{ steps.filter.outputs.ciqual }}
      infra: ${{ steps.filter.outputs.infra }}
      mobile: ${{ steps.mobile.outputs.mobile }}
      mobile_base: ${{ steps.mobile.outputs.mobile_base }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 0

      - name: Detect changed paths
        id: filter
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Compare against the last commit we actually deployed. Diffing HEAD~1
          # only exposes the final commit of a push, so a batch of commits could
          # ship an API change while silently skipping the agent image it needs.
          # The base is the last commit that was really deployed: a green run whose
          # Deploy job succeeded. A green run that deployed nothing (its tests
          # skipped, or no image to build) is not a release, and diffing from it
          # would leave out what it carried.
          BASE=""
          for run in $(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/main.yml/runs?status=success&per_page=20" \
              --jq '.workflow_runs[] | "\(.id):\(.head_sha)"' 2>/dev/null); do
            deployed=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/${run%%:*}/jobs?per_page=100" \
              --jq '[.jobs[] | select(.name == "Deploy" and .conclusion == "success")] | length' 2>/dev/null || echo 0)
            if [ "$deployed" -gt 0 ]; then BASE=${run#*:}; break; fi
          done
          if [ -z "$BASE" ] || ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            BASE=$(git rev-parse HEAD~1)
          fi
          echo "Comparing $BASE...HEAD"
          CHANGED=$(git diff --name-only "$BASE" HEAD)
          echo "$CHANGED"
          echo "app=$(echo "$CHANGED" | grep -qE '^(api/|admin/|\.docker/(php|nginx)/)' && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "agent=$(echo "$CHANGED" | grep -qE '^(agent/|\.docker/python/)' && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "ciqual=$(echo "$CHANGED" | grep -qE '^(ciqual/|\.docker/ciqual/)' && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "infra=$(echo "$CHANGED" | grep -qE '^(infra/(k8s|scripts)/|\.github/workflows/main\.yml)' && echo true || echo false)" >> "$GITHUB_OUTPUT"

      # Its own base, not the last deploy's (MAG-254): a merge that only touches
      # mobile/ deploys nothing, and one that deploys without touching mobile/ must
      # not publish the app again. The base is the tag of the last publication.
      - name: Does the app need a new publication
        id: mobile
        run: |
          set -o pipefail
          bash infra/scripts/mobile-release.sh range "$RELEASE_SHA" | tee -a "$GITHUB_OUTPUT"

  # ===========================================================================
  # Build PHP image (needed by nginx build)
  # ===========================================================================
  build-php:
    name: Build PHP
    needs: changes
    if: always() && !cancelled() && needs.changes.result == 'success' && needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SHA }}

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .docker/php/Dockerfile
          target: prod
          # The release the Sentry SDK reports to GlitchTip.
          build-args: |
            SENTRY_RELEASE=${{ env.RELEASE_SHA }}
          push: true
          tags: |
            ${{ env.PHP_IMAGE }}:${{ env.RELEASE_SHA }}
            ${{ env.PHP_IMAGE }}:latest
          cache-from: type=gha,scope=php
          cache-to: type=gha,mode=max,scope=php

  # ===========================================================================
  # Build Agent image (parallel with PHP)
  # ===========================================================================
  build-agent:
    name: Build Agent
    needs: changes
    if: always() && !cancelled() && needs.changes.result == 'success' && needs.changes.outputs.agent == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SHA }}

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .docker/python/Dockerfile
          target: prod
          # The release the Sentry SDK reports to GlitchTip.
          build-args: |
            SENTRY_RELEASE=${{ env.RELEASE_SHA }}
          push: true
          tags: |
            ${{ env.AGENT_IMAGE }}:${{ env.RELEASE_SHA }}
            ${{ env.AGENT_IMAGE }}:latest
          cache-from: type=gha,scope=agent
          cache-to: type=gha,mode=max,scope=agent

  # ===========================================================================
  # Build Ciqual image (parallel with PHP and Agent)
  # ===========================================================================
  build-ciqual:
    name: Build Ciqual
    needs: changes
    if: always() && !cancelled() && needs.changes.result == 'success' && needs.changes.outputs.ciqual == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SHA }}
          lfs: true

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .docker/ciqual/Dockerfile
          target: prod
          push: true
          tags: |
            ${{ env.CIQUAL_IMAGE }}:${{ env.RELEASE_SHA }}
            ${{ env.CIQUAL_IMAGE }}:latest
          cache-from: type=gha,scope=ciqual
          cache-to: type=gha,mode=max,scope=ciqual

  # ===========================================================================
  # Build Nginx image (depends on PHP for public assets)
  # ===========================================================================
  build-nginx:
    name: Build Nginx
    needs: [changes, build-php]
    if: always() && !cancelled() && needs.build-php.result == 'success' && needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SHA }}

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .docker/nginx/Dockerfile
          target: prod
          build-args: |
            PHP_IMAGE=${{ env.PHP_IMAGE }}:${{ env.RELEASE_SHA }}
            MERCURE_PUBLIC_URL=https://maggieai.fr/.well-known/mercure
            SENTRY_RELEASE=${{ env.RELEASE_SHA }}
            SENTRY_DSN=${{ vars.SENTRY_DSN_ADMIN }}
          push: true
          tags: |
            ${{ env.NGINX_IMAGE }}:${{ env.RELEASE_SHA }}
            ${{ env.NGINX_IMAGE }}:latest
          cache-from: type=gha,scope=nginx
          cache-to: type=gha,mode=max,scope=nginx

  # ===========================================================================
  # Deploy to k3s via SSH
  # ===========================================================================
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: [changes, build-nginx, build-agent, build-ciqual]
    if: >-
      always() && !failure() && !cancelled() &&
      (needs.build-nginx.result == 'success' ||
       needs.build-agent.result == 'success' ||
       needs.build-ciqual.result == 'success' ||
       needs.changes.outputs.infra == 'true')
    environment: production
    outputs:
      script_started: ${{ steps.mark.outputs.started }}
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SHA }}

      - name: Copy k8s manifests and deploy script to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "infra/k8s/,infra/scripts/deploy-k3s.sh,infra/scripts/backup-k3s.sh,infra/scripts/rollback-k3s.sh,infra/scripts/verify-digests.sh"
          target: /opt/maggie/

      # Lets the rollback job tell "the deploy script ran and failed" from "it
      # never reached the cluster": in the second case the record it would find
      # belongs to the previous, healthy deploy and must not be undone.
      - name: Mark the deploy script as started
        id: mark
        run: echo "started=true" >> "$GITHUB_OUTPUT"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE_TAG: ${{ env.RELEASE_SHA }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: IMAGE_TAG
          command_timeout: 15m
          script: |
            set -e
            chmod +x /opt/maggie/infra/scripts/deploy-k3s.sh
            /opt/maggie/infra/scripts/deploy-k3s.sh "$IMAGE_TAG"

  # ===========================================================================
  # Smoke tests on production (MAG-106)
  #
  # Read-only, as a technical account. Covers what CI cannot see: production
  # config, image digests, a stale index. A failure rolls the deploy back.
  # ===========================================================================
  smoke:
    name: Smoke test production
    runs-on: ubuntu-latest
    # The build jobs are listed for their digests (MAG-96). `always()` because a
    # build that did not run is skipped, and a skipped need would skip this job.
    needs: [deploy, build-php, build-nginx, build-agent, build-ciqual]
    if: always() && !cancelled() && needs.deploy.result == 'success'
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SHA }}

      - name: Configure SSH to the VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          printf 'Host vps\n  HostName %s\n  User %s\n  IdentityFile ~/.ssh/vps_key\n  StrictHostKeyChecking accept-new\n  BatchMode yes\n' \
            "$VPS_HOST" "$VPS_USER" > ~/.ssh/config

      # A green rollout says the pods are healthy, not that they run what was
      # just built: eleven fixes were one stale-tag redeploy (MAG-96). Every
      # service is held to the digest this run pushed, or, when it was not
      # rebuilt, to the one it ran before the deploy.
      - name: Assert every service runs the image just built
        env:
          PHP_DIGEST: ${{ needs.build-php.outputs.digest }}
          NGINX_DIGEST: ${{ needs.build-nginx.outputs.digest }}
          AGENT_DIGEST: ${{ needs.build-agent.outputs.digest }}
          CIQUAL_DIGEST: ${{ needs.build-ciqual.outputs.digest }}
        run: |
          expected="php=$PHP_DIGEST nginx=$NGINX_DIGEST agent=$AGENT_DIGEST ciqual=$CIQUAL_DIGEST"
          # Interpolated into a remote command line: nothing but the expected
          # shape may get through. An empty digest is a service not rebuilt.
          d='(sha256:[0-9a-f]{64})?'
          if ! [[ "$expected" =~ ^php=$d\ nginx=$d\ agent=$d\ ciqual=$d$ ]]; then
            echo "::error::unexpected build digest output: $expected"
            exit 1
          fi
          # shellcheck disable=SC2029 # expanded here on purpose, validated above
          ssh vps "EXPECTED_DIGESTS='$expected' bash /opt/maggie/infra/scripts/verify-digests.sh"

      # Google sign-in cannot be driven from CI, so the php pod mints a JWT for
      # the technical account. The runner's logs are public: the token is masked
      # before it is stored and never echoed.
      - name: Get a token for the technical account
        run: |
          token=$(ssh vps 'sudo k3s kubectl exec deployment/php -n maggie -- bin/console app:smoke:token --no-interaction')
          if ! printf '%s' "$token" | grep -qE '^[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+$'; then
            echo "::error::app:smoke:token did not print a JWT"
            exit 1
          fi
          echo "::add-mask::$token"
          echo "SMOKE_TOKEN=$token" >> "$GITHUB_ENV"

      - name: Run the smoke suite
        env:
          BASE_URL: https://maggieai.fr
          ES_CHECK_CMD: ssh vps 'sudo k3s kubectl exec deployment/php -n maggie -- bin/console app:elasticsearch:status --check --no-interaction'
        run: infra/scripts/smoke-prod.sh

      # A green release needs no rollback record. Left behind, it would let a
      # later deploy that dies before reaching the cluster (SSH down) undo this
      # healthy one.
      - name: Drop the rollback record
        run: ssh vps 'rm -f /opt/maggie/state/pre-deploy-revisions' || echo "::warning::could not drop the rollback record"

  # ===========================================================================
  # A green release lifts the freeze (MAG-184)
  #
  # A ticket of the range still in « Emergency » has had its fix deployed green:
  # it goes to Recette, or Done for a Task. The GitHub integration usually did
  # it on merge already; this is the net, since a ticket left in « Emergency »
  # holds every PR.
  # ===========================================================================
  lift-freeze:
    name: Lift the freeze
    runs-on: ubuntu-latest
    # `always()` because without a status function GitHub adds an implicit
    # success() over every ancestor job: a build skipped (image unchanged) would
    # skip this job on a green release, and the ticket would stay in « Emergency »
    # (MAG-199). The deploy and smoke results are the whole condition.
    needs: [deploy, smoke]
    if: always() && needs.deploy.result == 'success' && needs.smoke.result == 'success'
    permissions:
      contents: read
      actions: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 0

      - name: Take the shipped tickets out of « Emergency »
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          SHA: ${{ env.RELEASE_SHA }}
        run: |
          # The same range as the `changes` job: since the last green run of this workflow.
          base=$(gh api "repos/$GH_REPO/actions/workflows/main.yml/runs?status=success&per_page=1" \
            --jq '.workflow_runs[0].head_sha' 2>/dev/null || true)
          # Never turns a green release red: the run's success is what the next
          # deploy counts its range from.
          DEPLOY_TICKETS=$(bash infra/scripts/deploy-tickets.sh "$SHA" "$base") bash infra/scripts/release-emergency.sh \
            || echo "::warning::could not take the shipped tickets out of « Emergency »: move them by hand"

  # ===========================================================================
  # Publish the Android app to Firebase App Distribution (MAG-254)
  #
  # After the smoke test and the freeze lift, and only when the commit touched
  # mobile/ since the last publication: App Tester on the owner's phone shows the
  # new version, no cable. The signed `prodRelease` is the build the owner accepts
  # in recette; its versionCode is the run number and its versionName ends with
  # the short SHA, which Réglages shows too.
  #
  # A mobile-only merge deploys nothing, so smoke and lift-freeze are skipped and
  # this job still runs; a red build, deploy or smoke (any ancestor) stops it.
  # The tag `mobile-<versionCode>` is the record of a publication, created only
  # once Firebase accepted the build: the next one starts from it.
  #
  # The repository is public and so are its logs: every secret is read from the
  # environment of the step that needs it, written to a file under RUNNER_TEMP
  # with a private mode, and removed at the end. Nothing is echoed.
  # A failure here never turns the release red or rolls anything back: the
  # server is fine, the phone is just not updated, and the next merge retries.
  # ===========================================================================
  publish-mobile:
    name: Publish the mobile app
    runs-on: ubuntu-latest
    needs: [changes, lift-freeze]
    if: >-
      always() && !failure() && !cancelled() &&
      needs.changes.result == 'success' && needs.changes.outputs.mobile == 'true'
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      VERSION_CODE: ${{ github.run_number }}
      MOBILE_BASE: ${{ needs.changes.outputs.mobile_base }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: gradle/actions/setup-gradle@v4

      # Both files are ignored by git (.gitignore). google-services.json comes from
      # a base64 secret because the repository is public.
      - name: Rebuild the signing key and the Firebase config from the secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          umask 077
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD GOOGLE_SERVICES_JSON; do
            if [ -z "${!name}" ]; then echo "::error::the secret $name is not set"; exit 1; fi
          done
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          printf '%s' "$GOOGLE_SERVICES_JSON" | base64 -d > mobile/app/google-services.json
          {
            echo "storeFile=$RUNNER_TEMP/release.keystore"
            echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "keyPassword=$ANDROID_KEY_PASSWORD"
          } > mobile/keystore.properties

      - name: Build the signed prodRelease
        working-directory: mobile
        # GlitchTip DSN of the mobile project: a repository variable, not a
        # secret — a DSN ships inside the APK anyway. Unset: no crash reporting.
        env:
          MOBILE_SENTRY_DSN: ${{ vars.SENTRY_DSN_MOBILE }}
        run: |
          ./gradlew :app:assembleProdRelease --no-daemon \
            -Dorg.gradle.java.home="$JAVA_HOME" \
            -PVERSION_CODE="$VERSION_CODE" -PGIT_SHA="${RELEASE_SHA:0:7}" \
            -PSENTRY_DSN="$MOBILE_SENTRY_DSN"
          # An unsigned build is named `-unsigned.apk`: finding this one means the key was used.
          test -f app/build/outputs/apk/prod/release/app-prod-release.apk

      # The titles of the PRs that touched mobile/ since the last publication.
      - name: Write the release notes
        run: |
          set -o pipefail
          bash infra/scripts/mobile-release.sh notes "$RELEASE_SHA" "$MOBILE_BASE" | tee "$RUNNER_TEMP/release-notes.txt"

      - name: Distribute through Firebase App Distribution
        env:
          FIREBASE_APP_DISTRIBUTION_KEY: ${{ secrets.FIREBASE_APP_DISTRIBUTION_KEY }}
          FIREBASE_ANDROID_APP_ID: ${{ vars.FIREBASE_ANDROID_APP_ID }}
          FIREBASE_TESTERS: ${{ vars.FIREBASE_TESTERS }}
          FIREBASE_TESTER_GROUPS: ${{ vars.FIREBASE_TESTER_GROUPS }}
        run: |
          if [ -z "$FIREBASE_APP_DISTRIBUTION_KEY" ] || [ -z "$FIREBASE_ANDROID_APP_ID" ]; then
            echo "::error::FIREBASE_APP_DISTRIBUTION_KEY or FIREBASE_ANDROID_APP_ID is not set"; exit 1
          fi
          # Without a tester or a group the build is uploaded and nobody is told.
          if [ -z "$FIREBASE_TESTERS" ] && [ -z "$FIREBASE_TESTER_GROUPS" ]; then
            echo "::error::set the repository variable FIREBASE_TESTERS (e-mails, comma-separated) or FIREBASE_TESTER_GROUPS"; exit 1
          fi
          umask 077
          printf '%s' "$FIREBASE_APP_DISTRIBUTION_KEY" > "$RUNNER_TEMP/firebase-key.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-key.json"
          args=(--app "$FIREBASE_ANDROID_APP_ID" --release-notes-file "$RUNNER_TEMP/release-notes.txt")
          [ -z "$FIREBASE_TESTERS" ] || args+=(--testers "$FIREBASE_TESTERS")
          [ -z "$FIREBASE_TESTER_GROUPS" ] || args+=(--groups "$FIREBASE_TESTER_GROUPS")
          npx --yes firebase-tools@13.29.1 appdistribution:distribute \
            mobile/app/build/outputs/apk/prod/release/app-prod-release.apk "${args[@]}"

      - name: Record the publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "mobile-$VERSION_CODE" --target "$RELEASE_SHA" --latest=false \
            --title "Mobile $VERSION_CODE (${RELEASE_SHA:0:7})" --notes-file "$RUNNER_TEMP/release-notes.txt"
          {
            echo "## Mobile app published"
            echo
            echo "- versionCode: $VERSION_CODE"
            echo "- commit: $RELEASE_SHA"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove the secrets from the runner
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore" "$RUNNER_TEMP/firebase-key.json" mobile/keystore.properties mobile/app/google-services.json

  # ===========================================================================
  # Roll back, then report, when a build, the deploy or the smoke suite failed
  #
  # A failed build never reached the cluster: nothing is rolled back, but the
  # release is broken all the same, so it is reported like the others (MAG-184).
  # ===========================================================================
  rollback:
    name: Roll back and report
    runs-on: ubuntu-latest
    needs: [build-php, build-nginx, build-agent, build-ciqual, deploy, smoke]
    if: >-
      always() &&
      (needs.build-php.result == 'failure' ||
       needs.build-nginx.result == 'failure' ||
       needs.build-agent.result == 'failure' ||
       needs.build-ciqual.result == 'failure' ||
       needs.deploy.result == 'failure' ||
       needs.smoke.result == 'failure')
    permissions:
      contents: read
      actions: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 0

      - name: Configure SSH to the VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          printf 'Host vps\n  HostName %s\n  User %s\n  IdentityFile ~/.ssh/vps_key\n  StrictHostKeyChecking accept-new\n  BatchMode yes\n' \
            "$VPS_HOST" "$VPS_USER" > ~/.ssh/config

      # Restores only the deployments this deploy moved, to the revision
      # deploy-k3s.sh recorded. Nothing recorded means nothing was applied.
      # A failed build skips the deploy: no script started, no smoke, so this
      # step is skipped too and the cluster is left alone.
      - name: Roll back with kubectl rollout undo
        id: rollback
        if: needs.deploy.outputs.script_started == 'true' || needs.smoke.result == 'failure'
        run: |
          set -o pipefail
          ssh vps bash /opt/maggie/infra/scripts/rollback-k3s.sh 2>&1 | tee "$RUNNER_TEMP/rollback.log"

      # GitHub issues are disabled on this repository: Linear carries it
      # (MAG-146). The shipped tickets move to « Emergency », which freezes
      # production; an incident ticket is opened when they cannot carry it or the
      # rollback failed (MAG-184). The summary below is the trace that survives
      # even when the Linear calls fail.
      - name: Report the failed deploy in Linear
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          SHA: ${{ env.RELEASE_SHA }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_ID: ${{ github.run_id }}
          BUILD_PHP_RESULT: ${{ needs.build-php.result }}
          BUILD_NGINX_RESULT: ${{ needs.build-nginx.result }}
          BUILD_AGENT_RESULT: ${{ needs.build-agent.result }}
          BUILD_CIQUAL_RESULT: ${{ needs.build-ciqual.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          SMOKE_RESULT: ${{ needs.smoke.result }}
          ROLLBACK_OUTCOME: ${{ steps.rollback.outcome }}
          SCRIPT_STARTED: ${{ needs.deploy.outputs.script_started }}
        run: |
          build_failed=false
          for result in "$BUILD_PHP_RESULT" "$BUILD_NGINX_RESULT" "$BUILD_AGENT_RESULT" "$BUILD_CIQUAL_RESULT"; do
            if [ "$result" = "failure" ]; then build_failed=true; fi
          done

          rollback_failed=false
          if [ "$build_failed" = "true" ]; then
            cause="the image build failed"
            cause_fr="le build d'une image a échoué"
            state="The image build failed before the deploy: the cluster was not touched, nothing to roll back."
            state_fr="Le build a échoué avant le déploiement : le cluster n'a pas été touché, rien à remettre en arrière."
          else
            if [ "$DEPLOY_RESULT" = "failure" ]; then
              cause="the deploy itself failed"
              cause_fr="le déploiement lui-même a échoué"
            else
              cause="the post-deploy smoke suite failed"
              cause_fr="la suite de smoke après déploiement a échoué"
            fi

            if [ "$ROLLBACK_OUTCOME" = "success" ]; then
              state="Production was rolled back to the previous release."
              state_fr="La prod a été remise sur la version précédente."
            elif [ "$ROLLBACK_OUTCOME" = "skipped" ] && [ "$SCRIPT_STARTED" != "true" ] && [ "$SMOKE_RESULT" != "failure" ]; then
              state="The deploy failed before its script started: the cluster was not touched, nothing to roll back."
              state_fr="Le déploiement a échoué avant son script : le cluster n'a pas été touché, rien à remettre en arrière."
            else
              rollback_failed=true
              state="**The rollback itself failed: production may be running the broken release. Act now.**"
              state_fr="**Le rollback lui-même a échoué : la prod tourne peut-être sur la version cassée.**"
            fi
          fi

          # shellcheck disable=SC2016 # `$job` is a jq variable, not a shell one
          failed_step=$(gh api "repos/$GH_REPO/actions/runs/$RUN_ID/jobs" \
            --jq '[.jobs[] | .name as $job | .steps[] | select(.conclusion == "failure") | "\($job) › \(.name)"] | join(", ")' 2>/dev/null || true)
          restored=$(grep -E ': revision [0-9]+ → back to [0-9]+' "$RUNNER_TEMP/rollback.log" 2>/dev/null | sed 's/^==> /- /' || true)

          # The tickets shipped since the last green run of this workflow, as the `changes` job counts them.
          base=$(gh api "repos/$GH_REPO/actions/workflows/main.yml/runs?status=success&per_page=1" \
            --jq '.workflow_runs[0].head_sha' 2>/dev/null || true)
          tickets=$(bash infra/scripts/deploy-tickets.sh "$SHA" "$base" || true)

          body=$(printf '%s\n\n- Commit: %s\n- Run: %s\n- Failed step: %s\n- Builds: php %s, nginx %s, agent %s, ciqual %s\n- Deploy: %s, smoke: %s\n- Revisions restored:\n%s\n\nMigrations, Elasticsearch mappings, the ConfigMap and the Secret are not reverted by the rollback; the pre-deploy database dump is in /opt/maggie/backups on the VPS.\n' \
            "$state" "$SHA" "$RUN_URL" "${failed_step:-unknown}" \
            "$BUILD_PHP_RESULT" "$BUILD_NGINX_RESULT" "$BUILD_AGENT_RESULT" "$BUILD_CIQUAL_RESULT" \
            "$DEPLOY_RESULT" "$SMOKE_RESULT" "${restored:-none}")

          printf '## Production incident: %s for %s\n\n%s\n\nTickets: %s\n' "$cause" "${SHA:0:7}" "$body" "$(printf '%s' "${tickets:-none}" | paste -sd' ')" >> "$GITHUB_STEP_SUMMARY"

          INCIDENT_TITLE="Production: ${cause} for ${SHA:0:7}" INCIDENT_BODY="$body" \
          FAILURE_CAUSE="${cause_fr} (commit ${SHA:0:7})" PROD_STATE="$state_fr" \
          DEPLOY_TICKETS="$tickets" ROLLBACK_FAILED="$rollback_failed" \
            bash infra/scripts/report-failed-deploy.sh

  # ===========================================================================
  # Last job: the held pull requests are released (MAG-184, MAG-244)
  #
  # `Incident gate` is red on every PR while production is frozen. Once the freeze
  # lifts — the job above moved the shipped tickets out of « Emergency » — the red
  # gates are re-run so the armed auto-merges fire on their own. It was a workflow
  # of its own, started by `workflow_run` after each CD and by a cron every ten
  # minutes. Here it is the end of the run that lifts the freeze; the hourly
  # `incident-gate-release.yml` stays for a freeze someone lifts by hand.
  # Runs for any commit that passed the gate, deployed or rolled back: while the
  # freeze holds the script does nothing.
  # ===========================================================================
  release-gates:
    name: Re-run the held gates
    runs-on: ubuntu-latest
    needs: [gate, lift-freeze, rollback]
    if: always() && needs.gate.result == 'success'
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
      pull-requests: read
      checks: read
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: infra/scripts

      - name: Re-run the red Incident gates if the freeze lifted
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
        run: bash infra/scripts/rerun-incident-gates.sh
