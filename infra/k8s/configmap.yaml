apiVersion: v1
kind: ConfigMap
metadata:
  name: maggie-config
  namespace: maggie
data:
  APP_ENV: prod
  APP_DEBUG: "0"
  ELASTICSEARCH_URL: http://elasticsearch.shared.svc.cluster.local:9200
  CIQUAL_SERVICE_URL: http://ciqual:8002
  MERCURE_URL: http://mercure/.well-known/mercure
  MERCURE_PUBLIC_URL: https://maggieai.fr/.well-known/mercure
  MCP_SERVER_URL: http://nginx/_mcp
  AGENT_BASE_URL: https://maggieai.fr/agent
  TRUSTED_PROXIES: REMOTE_ADDR
  CORS_ALLOW_ORIGIN: '^https://maggieai\.fr$'
  GOOGLE_CLIENT_ID: "945014393623-rr1ja004uel8ml327e0gg0vsf51o2ajk.apps.googleusercontent.com"
  GOOGLE_REDIRECT_URI: https://maggieai.fr/api/auth/google/callback
  # Where Google pushes calendar changes (MAG-193). Without it Symfony falls
  # back to the example.com address of api/.env and nothing ever arrives.
  GOOGLE_WEBHOOK_URL: https://maggieai.fr/api/calendar/google/webhook
  ADMIN_URL: https://maggieai.fr/admin
  JWT_SECRET_KEY: "%kernel.project_dir%/config/jwt/private.pem"
  JWT_PUBLIC_KEY: "%kernel.project_dir%/config/jwt/public.pem"
  ANTHROPIC_MODEL: claude-haiku-4-5-20251001
  # Bank data provider. The application id is public — it travels as the JWT
  # key id — like the Google client id above. The signing key itself is
  # mounted from the bank-keys secret, which no deploy touches.
  ENABLE_BANKING_APPLICATION_ID: "017258f5-892c-4bef-97f5-a6c6adb7d897"
  ENABLE_BANKING_PRIVATE_KEY: "%kernel.project_dir%/config/bank/enablebanking.pem"
  ENABLE_BANKING_BASE_URL: https://api.enablebanking.com
  BANK_CALLBACK_URL: https://maggieai.fr/api/finance/bank-callback
  # Push through FCM HTTP v1 (MAG-26). The service account key is mounted from
  # the fcm-credentials secret, which no deploy touches.
  FCM_CREDENTIALS_PATH: /run/secrets/fcm/credentials.json
  FCM_PROJECT_ID: maggie-487318
