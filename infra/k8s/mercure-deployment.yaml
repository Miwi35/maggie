apiVersion: apps/v1
kind: Deployment
metadata:
  name: mercure
  namespace: maggie
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mercure
  template:
    metadata:
      labels:
        app: mercure
    spec:
      containers:
        - name: mercure
          # Pinned by tag and digest, never untagged (agent-os/standards/global/real-time.md).
          # An untagged `dunglas/mercure` follows `latest`: the 0.x -> 1.0 move renamed the
          # subscribe parameter and the token format and broke every subscriber at once
          # (MAG-97). The digest freezes the build; the tag says which version it is.
          image: dunglas/mercure:v1.0.2@sha256:e5d8f06a60f2feb5e91f7ba2046d9184f6339b3498b5d2f5adaeb5bcb080bfc7
          ports:
            - containerPort: 80
          env:
            - name: SERVER_NAME
              value: ":80"
            # Tokens are issued by `maggie`; `aud` is pinned to the public URL (plain HTTP behind the ingress).
            - name: MERCURE_TRUSTED_ISSUERS
              value: maggie
            - name: MERCURE_PUBLIC_URL
              valueFrom:
                configMapKeyRef:
                  name: maggie-config
                  key: MERCURE_PUBLIC_URL
            - name: MERCURE_PUBLISHER_JWT_KEY
              valueFrom:
                secretKeyRef:
                  name: maggie-env
                  key: MERCURE_JWT_SECRET
            - name: MERCURE_SUBSCRIBER_JWT_KEY
              valueFrom:
                secretKeyRef:
                  name: maggie-env
                  key: MERCURE_JWT_SECRET
            - name: MERCURE_EXTRA_DIRECTIVES
              value: |
                cors_origins https://maggieai.fr
                resource_identifier $(MERCURE_PUBLIC_URL)
                cookie_name mercureAuthorization
          readinessProbe:
            tcpSocket:
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            requests:
              memory: 32Mi
              cpu: 10m
            limits:
              memory: 128Mi
              cpu: 200m
