apiVersion: apps/v1
kind: Deployment
metadata:
  name: mercure
  namespace: maggie
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mercure
  template:
    metadata:
      labels:
        app: mercure
    spec:
      containers:
        - name: mercure
          # Pinned by digest, and it has to stay pinned. `dunglas/mercure`
          # untagged moved to a build that renamed the subscribe parameter from
          # `topic` to `match`/`match_urlpattern`; everything that subscribes
          # still speaks the old one, so an unpinned hub answers 400 and all
          # real-time dies. With imagePullPolicy: Always and no tag, that was
          # one pod restart away. This digest is what the running pod already
          # serves. Found by the web journeys (MAG-97).
          image: dunglas/mercure@sha256:916834e499613d475e9ad5118cd2349875338f52d99d65b58aeff82f97ccb0c6
          ports:
            - containerPort: 80
          env:
            - name: SERVER_NAME
              value: ":80"
            - name: MERCURE_PUBLISHER_JWT_KEY
              valueFrom:
                secretKeyRef:
                  name: maggie-env
                  key: MERCURE_JWT_SECRET
            - name: MERCURE_SUBSCRIBER_JWT_KEY
              valueFrom:
                secretKeyRef:
                  name: maggie-env
                  key: MERCURE_JWT_SECRET
            - name: MERCURE_EXTRA_DIRECTIVES
              value: |
                cors_origins https://maggieai.fr
          readinessProbe:
            tcpSocket:
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            requests:
              memory: 32Mi
              cpu: 10m
            limits:
              memory: 128Mi
              cpu: 200m
