# Maggie k8s Secrets — DO NOT COMMIT real values
# Copy, fill in, and apply manually on the server:
#   cp secrets.example.yaml secrets.yaml
#   # edit secrets.yaml with real values
#   kubectl apply -f secrets.yaml

apiVersion: v1
kind: Secret
metadata:
  name: maggie-env
  namespace: maggie
type: Opaque
stringData:
  # Symfony
  APP_SECRET: change-me

  # Database (full composed URLs — k8s can't do env var substitution)
  DATABASE_URL: postgresql://maggie:CHANGE_ME@postgres.shared.svc.cluster.local:5432/maggie?serverVersion=17
  AGENT_DATABASE_URL: postgresql://maggie:CHANGE_ME@postgres.shared.svc.cluster.local:5432/maggie_agent

  # RabbitMQ
  MESSENGER_TRANSPORT_DSN: amqp://maggie:CHANGE_ME@rabbitmq.shared.svc.cluster.local:5672/%2f/messages
  RABBITMQ_URL: amqp://maggie:CHANGE_ME@rabbitmq.shared.svc.cluster.local:5672/

  # Mercure
  # At least 32 bytes, shared by the API, the agent and the hub; the API refuses
  # to start below that. Generate: openssl rand -hex 32
  MERCURE_JWT_SECRET: replace-with-openssl-rand-hex-32-output

  # JWT
  JWT_PASSPHRASE: change-me

  # Service Token (agent -> API auth)
  SERVICE_TOKEN: change-me

  # Google OAuth
  GOOGLE_CLIENT_SECRET: change-me

  # Memory bucket (MAG-195) — the notes' source of truth, S3-compatible (OVH), versioning ON.
  # Provisioned by the owner; while MEMORY_BUCKET is empty the agent runs without it.
  MEMORY_BUCKET: maggie-memory
  MEMORY_BUCKET_ENDPOINT: https://s3.gra.io.cloud.ovh.net
  MEMORY_BUCKET_REGION: gra
  MEMORY_BUCKET_KEY: change-me
  MEMORY_BUCKET_SECRET: change-me

  # LLM API keys
  ANTHROPIC_API_KEY: sk-ant-api03-...
  OPENAI_API_KEY: sk-...

---
# JWT RSA key pair shared between php and agent
# Create with:
#   kubectl create secret generic jwt-keys \
#     --from-file=private.pem=private.pem \
#     --from-file=public.pem=public.pem \
#     -n maggie
apiVersion: v1
kind: Secret
metadata:
  name: jwt-keys
  namespace: maggie
type: Opaque

---
# Bank data provider (Enable Banking).
# The application id is public — it travels as the JWT key id — but it lives
# here next to the key it belongs to.
#
# Create the key secret from the .pem the provider generated:
#   kubectl -n maggie create secret generic bank-keys --from-file=enablebanking.pem=/path/to/key.pem
apiVersion: v1
kind: Secret
metadata:
  name: bank-keys
  namespace: maggie
type: Opaque
stringData:
  enablebanking.pem: "-----BEGIN PRIVATE KEY-----\n...\n-----END PRIVATE KEY-----"
