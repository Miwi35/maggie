apiVersion: apps/v1
kind: Deployment
metadata:
  name: php
  namespace: maggie
spec:
  replicas: 1
  selector:
    matchLabels:
      app: php
  template:
    metadata:
      labels:
        app: php
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: php
          image: ghcr.io/miwi35/maggie-php:latest
          ports:
            - containerPort: 9000
          envFrom:
            - configMapRef:
                name: maggie-config
            - secretRef:
                name: maggie-env
          volumeMounts:
            - name: jwt-keys
              mountPath: /var/www/api/config/jwt
              readOnly: true
            # Bank provider signing key — mounted, never baked into the image.
            - name: bank-keys
              mountPath: /var/www/api/config/bank
              readOnly: true
          readinessProbe:
            tcpSocket:
              port: 9000
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              memory: 64Mi
              cpu: 50m
            limits:
              memory: 256Mi
              cpu: 500m
      volumes:
        - name: jwt-keys
          secret:
            secretName: jwt-keys
        - name: bank-keys
          secret:
            secretName: bank-keys
            # Absent on a cluster that has not connected a bank yet: the app
            # starts anyway and the bank screen says it is unavailable.
            optional: true
