apiVersion: apps/v1
kind: Deployment
metadata:
  name: cron
  namespace: maggie
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cron
  template:
    metadata:
      labels:
        app: cron
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: cron
          image: ghcr.io/miwi35/maggie-php:latest
          command: ["supercronic", "/etc/maggie/crontab"]
          securityContext:
            runAsUser: 1000
            runAsNonRoot: true
          envFrom:
            - configMapRef:
                name: maggie-config
            - secretRef:
                name: maggie-env
          volumeMounts:
            - name: jwt-keys
              mountPath: /var/www/api/config/jwt
              readOnly: true
          # One console command peaks at ~58 MiB. Jobs start one per minute
          # (.docker/php/crontab), but a slow one can still run when the next
          # starts, and check-reminders runs every minute (MAG-27): 384Mi holds
          # five; 128Mi got the pod OOMKilled (MAG-186).
          resources:
            requests:
              memory: 64Mi
              cpu: 10m
            limits:
              memory: 384Mi
              cpu: 300m
      volumes:
        - name: jwt-keys
          secret:
            secretName: jwt-keys
