# MAG-770's scenario: test_user fasts 16:8 from 12:00 (the defaults). On the
# 9th the last intake is at 20:05, on the 10th the first at 12:10: the night's
# fast is 16 h 05 (965 min). no_fast_user stopped fasting; other_user's
# intakes prove every reading is filtered by user.
Maggie\Core\Entity\User:
  test_user:
    email: fasting-test@example.com
    googleId: google-fasting-test
    name: Fasting Test User
  no_fast_user:
    email: fasting-none@example.com
    googleId: google-fasting-none
    name: No Fasting User
  other_user:
    email: fasting-other@example.com
    googleId: google-fasting-other
    name: Other Fasting User

Maggie\Health\Entity\HealthProfile:
  profile:
    user: '@test_user'
  no_fast_profile:
    user: '@no_fast_user'
    fastingProtocol: null

Maggie\Health\Entity\FoodIntake:
  breakfast_9:
    date: '<(new \DateTimeImmutable("2026-11-09"))>'
    eatenAt: '<(new \DateTimeImmutable("2026-11-09T12:30:00+01:00"))>'
    label: Salade
    kcal: 400
    proteinG: 10.0
    carbsG: 30.0
    fatG: 20.0
    source: '<(Maggie\Health\Enum\FoodIntakeSource::Manual)>'
    user: '@test_user'
  dinner_9:
    date: '<(new \DateTimeImmutable("2026-11-09"))>'
    eatenAt: '<(new \DateTimeImmutable("2026-11-09T20:05:00+01:00"))>'
