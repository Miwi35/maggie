# MAG-708's scenario: what an earlier Health Connect pass left — a watch run,
# a weighing and the steps of the 20th — and another user's rows under the
# same externalIds and date, which prove the batch only matches the user's.
Maggie\Core\Entity\User:
  test_user:
    email: health-sync-test@example.com
    googleId: google-health-sync-test
    name: Health Sync Test User
  other_user:
    email: health-sync-other@example.com
    googleId: google-health-sync-other
    name: Other Health Sync User

Maggie\Health\Entity\Workout:
  run:
    type: '<(Maggie\Health\Enum\WorkoutType::Run)>'
    title: Course du matin
    startedAt: '<(new \DateTimeImmutable("2026-10-20T07:10:00+02:00"))>'
    durationMinutes: 32
    distanceMeters: 5400
    source: '<(Maggie\Health\Enum\WorkoutSource::Watch)>'
    externalId: hc-run-1
    user: '@test_user'
  others_run:
    type: '<(Maggie\Health\Enum\WorkoutType::Run)>'
    title: Course
    startedAt: '<(new \DateTimeImmutable("2026-10-20T07:10:00+02:00"))>'
    durationMinutes: 50
    source: '<(Maggie\Health\Enum\WorkoutSource::Watch)>'
    externalId: hc-run-2
    user: '@other_user'

Maggie\Health\Entity\BodyMeasurement:
