    source: '<(Maggie\Health\Enum\MeasurementSource::HealthConnect)>'
    externalId: hc-weight-1
    user: '@test_user'

Maggie\Health\Entity\DailyActivity:
  day_20:
    date: '<(new \DateTimeImmutable("2026-10-20"))>'
    steps: 8432
