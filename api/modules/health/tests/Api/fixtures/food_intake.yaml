# MAG-748's scenario: test_user is a man of 40 (1986), 180 cm, 71.8 kg — a
# basal metabolism of 1 648 — and Health Connect counts 400 active kcal on the
# 5th: 2 048 kcal spent. That day, a lunch of one serving of « Bol du midi »
# (100 g at 515 kcal, 20 g protein, 50 g carbs, 25 g fat per 100 g, for one)
# is planned and not eaten; the dinner's recipe has no figure. The 4th, an
# apple typed by hand. other_user's meal and intake on the 5th prove every
# reading is filtered by user.
Maggie\Core\Entity\User:
  test_user:
    email: food-intake-test@example.com
    googleId: google-food-intake-test
    name: Food Intake Test User
  other_user:
    email: food-intake-other@example.com
    googleId: google-food-intake-other
    name: Other Food Intake User

Maggie\Health\Entity\HealthProfile:
  profile:
    user: '@test_user'
    sex: '<(Maggie\Health\Enum\Sex::Male)>'
    birthYear: 1986
    heightCm: 180

Maggie\Health\Entity\BodyMeasurement:
  weighing:
    measuredAt: '<(new \DateTimeImmutable("2026-11-01T07:00:00+01:00"))>'
    weightKg: 71.8
    user: '@test_user'

Maggie\Health\Entity\DailyActivity:
  day_5:
    date: '<(new \DateTimeImmutable("2026-11-05"))>'
    steps: 8000
    activeKcal: 400
    user: '@test_user'

Maggie\Cookbook\Entity\Ingredient:
  bowl_food:
    name: Bol complet
    category: '<(Maggie\Grocery\Enum\ProductCategory::Grain)>'
    defaultUnit: '<(Maggie\Grocery\Enum\Unit::Gram)>'
    kcalPer100g: 515.0
    proteinPer100g: 20.0
    carbsPer100g: 50.0
    fatPer100g: 25.0
    user: '@test_user'
  mystery_food:
    name: Mystère
    category: '<(Maggie\Grocery\Enum\ProductCategory::Produce)>'
    defaultUnit: '<(Maggie\Grocery\Enum\Unit::Gram)>'
    user: '@test_user'
  other_food:
    name: Tarte
    category: '<(Maggie\Grocery\Enum\ProductCategory::Grain)>'
    defaultUnit: '<(Maggie\Grocery\Enum\Unit::Gram)>'
    kcalPer100g: 300.0
    user: '@other_user'

Maggie\Cookbook\Entity\Recipe:
  bowl:
    name: Bol du midi
    servings: 1
    user: '@test_user'
  mystery:
    name: Plat mystère
    servings: 2
    user: '@test_user'
  other_recipe:
    name: Tarte de l'autre
    servings: 1
    user: '@other_user'

Maggie\Cookbook\Entity\RecipeIngredient:
  bowl_line:
    recipe: '@bowl'
    ingredient: '@bowl_food'
    quantity: 100.0
    unit: '<(Maggie\Grocery\Enum\Unit::Gram)>'
  mystery_line:
    recipe: '@mystery'
    ingredient: '@mystery_food'
    quantity: 100.0
    unit: '<(Maggie\Grocery\Enum\Unit::Gram)>'
  other_line:
    recipe: '@other_recipe'
    ingredient: '@other_food'
    quantity: 100.0
    unit: '<(Maggie\Grocery\Enum\Unit::Gram)>'

Maggie\Calendar\Entity\Agenda:
  test_agenda:
    name: Repas
    module: cookbook
    color: '#FF6B35'
    user: '@test_user'
  other_agenda:
    name: Repas
    module: cookbook
    color: '#FF6B35'
    user: '@other_user'

Maggie\Cookbook\Entity\Meal:
  lunch_5:
    summary: Bol du midi
    slot: '<(Maggie\Cookbook\Enum\MealSlot::Lunch)>'
    date: '<(new \DateTimeImmutable("2026-11-05"))>'
    agenda: '@test_agenda'
    recipes: ['@bowl']
  dinner_5:
    summary: Plat mystère
    slot: '<(Maggie\Cookbook\Enum\MealSlot::Dinner)>'
    date: '<(new \DateTimeImmutable("2026-11-05"))>'
    agenda: '@test_agenda'
    recipes: ['@mystery']
  others_lunch_5:
    summary: Tarte de l'autre
    slot: '<(Maggie\Cookbook\Enum\MealSlot::Lunch)>'
    date: '<(new \DateTimeImmutable("2026-11-05"))>'
    agenda: '@other_agenda'
    recipes: ['@other_recipe']

Maggie\Health\Entity\FoodIntake:
  apple_4:
    date: '<(new \DateTimeImmutable("2026-11-04"))>'
    eatenAt: '<(new \DateTimeImmutable("2026-11-04T16:00:00+01:00"))>'
    label: Pomme
    quantityGrams: 150.0
    kcal: 78
    proteinG: 0.4
    carbsG: 18.0
    fatG: 0.3
    source: '<(Maggie\Health\Enum\FoodIntakeSource::Manual)>'
    user: '@test_user'
  others_snack_5:
    date: '<(new \DateTimeImmutable("2026-11-05"))>'
    eatenAt: '<(new \DateTimeImmutable("2026-11-05T10:00:00+01:00"))>'
    label: Croissant
