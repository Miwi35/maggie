# MAG-771's scenario, in Paris (UTC+1 in November): three planned sessions
# kept in a row (streak 3), then a run planned Tuesday 10 at 18:30 for 45 min
# that nothing keeps yet, and one planned Thursday 12. other_user's missed
# session already has a proposal, which proves the isolation.
Maggie\Core\Entity\User:
  test_user:
    email: makeup-test@example.com
    googleId: google-makeup-test
    name: Makeup Test User
  other_user:
    email: makeup-other@example.com
    googleId: google-makeup-other
    name: Other Makeup User

Maggie\Health\Entity\Workout:
  planned_1:
    type: '<(Maggie\Health\Enum\WorkoutType::Run)>'
    title: Course
    startedAt: '<(new \DateTimeImmutable("2026-11-02T18:30:00+01:00"))>'
    durationMinutes: 45
    source: '<(Maggie\Health\Enum\WorkoutSource::Planned)>'
    user: '@test_user'
  done_1:
    type: '<(Maggie\Health\Enum\WorkoutType::Run)>'
    title: Course
    startedAt: '<(new \DateTimeImmutable("2026-11-02T18:35:00+01:00"))>'
    durationMinutes: 40
    source: '<(Maggie\Health\Enum\WorkoutSource::Watch)>'
    keeps: '@planned_1'
    streak: 1
    user: '@test_user'
  planned_2:
    type: '<(Maggie\Health\Enum\WorkoutType::Run)>'
    title: Course
    startedAt: '<(new \DateTimeImmutable("2026-11-04T18:30:00+01:00"))>'
    durationMinutes: 45
    source: '<(Maggie\Health\Enum\WorkoutSource::Planned)>'
    user: '@test_user'
  done_2:
