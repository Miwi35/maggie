services:
    _defaults:
        autowire: true
        autoconfigure: true

    Maggie\Health\:
        resource: '../src/'
        exclude:
            - '../src/Entity/'
            - '../src/Enum/'
            - '../src/MaggieHealthBundle.php'

    Maggie\Health\Service\ExerciseCatalog:
        arguments:
            $referenceDir: '%kernel.project_dir%/modules/health/config/reference'
