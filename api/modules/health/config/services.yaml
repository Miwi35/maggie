services:
    _defaults:
        autowire: true
        autoconfigure: true

    Maggie\Health\:
        resource: '../src/'
        exclude:
            - '../src/Entity/'
            - '../src/Enum/'
            - '../src/MaggieHealthBundle.php'

    Maggie\Health\Service\ExerciseCatalog:
        arguments:
            $referenceDir: '%kernel.project_dir%/modules/health/config/reference'

    # Makes <workoutExercise(...)> usable in the fixture files (MAG-775).
    Maggie\Health\Fixture\WorkoutExerciseProvider:
        tags: ['nelmio_alice.faker.provider']
