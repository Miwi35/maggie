Maggie\Core\Entity\User:
  push_user:
    email: push@example.com
    googleId: google-push
    name: Push User
  other_user:
    email: push-other@example.com
    googleId: google-push-other
    name: Other Push User
  silent_user:
    email: push-silent@example.com
    googleId: google-push-silent
    name: Silent Push User

  night_user:
    email: push-night@example.com
    googleId: google-push-night
    name: Night Push User
  lunch_user:
    email: push-lunch@example.com
    googleId: google-push-lunch
    name: Lunch Push User
  open_user:
    email: push-open@example.com
    googleId: google-push-open
    name: Open Push User

Maggie\Core\Entity\UserPreference:
  night_preference:
    user: '@night_user'
    timezone: Europe/Paris
    quietHoursStart: '22:00'
    quietHoursEnd: '07:00'
  lunch_preference:
    user: '@lunch_user'
    timezone: Europe/Paris
    quietHoursStart: '13:00'
    quietHoursEnd: '14:00'
  open_preference:
    user: '@open_user'
    timezone: Europe/Paris
  silent_preference:
    user: '@silent_user'
    notificationsEnabled: false

Maggie\Notification\Entity\DeviceToken:
  phone:
    user: '@push_user'
    token: 'phone-token'
  tablet:
    user: '@push_user'
    token: 'tablet-token'
  someone_elses_phone:
    user: '@other_user'
    token: 'other-token'

  night_phone:
    user: '@night_user'
    token: 'night-token'
  lunch_phone:
    user: '@lunch_user'
    token: 'lunch-token'
  open_phone:
    user: '@open_user'
    token: 'open-token'

Maggie\Notification\Entity\Notification:
  night_message:
    user: '@night_user'
    type: '<(Maggie\Notification\Enum\NotificationType::Message)>'
    title: 'Message de nuit'
    relatedEntityIri: '/chat?message=01JMSG'
  night_proaction:
    user: '@night_user'
    type: '<(Maggie\Notification\Enum\NotificationType::Proaction)>'
    title: 'Proaction de nuit'
  lunch_message:
    user: '@lunch_user'
    type: '<(Maggie\Notification\Enum\NotificationType::Message)>'
    title: 'Message du midi'
  open_message:
    user: '@open_user'
    type: '<(Maggie\Notification\Enum\NotificationType::Message)>'
    title: 'Message libre'
  unread:
    user: '@push_user'
    type: '<(Maggie\Notification\Enum\NotificationType::Proaction)>'
    title: 'J''ai déplacé ton rendez-vous'
    relatedEntityIri: '/api/events/01JEVENT'
  already_read:
    user: '@push_user'
    type: '<(Maggie\Notification\Enum\NotificationType::Proaction)>'
    title: 'Déjà vue'
    readAt: '<(new \DateTimeImmutable("2026-03-01 09:00"))>'
