Maggie\Core\Entity\User:
  test_user:
    email: recipe-facts@example.com
    googleId: google-recipe-facts
    name: Recipe Facts User
  other_user:
    email: recipe-facts-other@example.com
    googleId: google-recipe-facts-other
    name: Recipe Facts Other User

Maggie\Cookbook\Entity\Ingredient:
  pasta_food:
    name: Pâtes
    category: '<(Maggie\Grocery\Enum\ProductCategory::Grain)>'
    defaultUnit: '<(Maggie\Grocery\Enum\Unit::Gram)>'
    kcalPer100g: 350.0
    user: '@test_user'
  tomato_food:
    name: Tomate
    category: '<(Maggie\Grocery\Enum\ProductCategory::Produce)>'
    defaultUnit: '<(Maggie\Grocery\Enum\Unit::Gram)>'
    kcalPer100g: 18.0
    user: '@test_user'
  mystery_food:
    name: Mystère
    category: '<(Maggie\Grocery\Enum\ProductCategory::Produce)>'
    defaultUnit: '<(Maggie\Grocery\Enum\Unit::Gram)>'
    user: '@test_user'

Maggie\Cookbook\Entity\Recipe:
  pasta:
    name: Pâtes à la tomate
    servings: 4
    user: '@test_user'
  couscous:
    name: Couscous
    servings: 4
    user: '@test_user'
  mystery:
    name: Plat mystère
    servings: 2
    user: '@test_user'
  other_recipe:
    name: Tarte de l'autre
    servings: 4
    user: '@other_user'

Maggie\Cookbook\Entity\RecipeIngredient:
  # 200 g at 350 kcal per 100 g, for 4: 175. The three tomatoes are counted in pieces: left out.
  pasta_line:
    recipe: '@pasta'
    ingredient: '@pasta_food'
    quantity: 200.0
    unit: '<(Maggie\Grocery\Enum\Unit::Gram)>'
  tomato_line:
    recipe: '@pasta'
    ingredient: '@tomato_food'
    quantity: 3.0
    unit: '<(Maggie\Grocery\Enum\Unit::Piece)>'
  # 1 kg of pasta and 0.5 l of tomato juice at 18 kcal, for 4: (3500 + 90) / 4 = 897.5, read 898.
  couscous_semolina:
    recipe: '@couscous'
    ingredient: '@pasta_food'
    quantity: 1.0
    unit: '<(Maggie\Grocery\Enum\Unit::Kilogram)>'
  couscous_juice:
    recipe: '@couscous'
    ingredient: '@tomato_food'
    quantity: 0.5
    unit: '<(Maggie\Grocery\Enum\Unit::Liter)>'
  # A product with no nutrition: no figure rather than a wrong one.
  mystery_line:
    recipe: '@mystery'
    ingredient: '@mystery_food'
    quantity: 100.0
    unit: '<(Maggie\Grocery\Enum\Unit::Gram)>'

Maggie\Calendar\Entity\Agenda:
  test_agenda:
    name: Repas
    module: cookbook
    color: '#FF6B35'
    user: '@test_user'

Maggie\Cookbook\Entity\Meal:
  couscous_old:
    summary: 'Dîner : Couscous'
    slot: '<(Maggie\Cookbook\Enum\MealSlot::Dinner)>'
    date: '<(new \DateTimeImmutable("2020-01-14"))>'
    agenda: '@test_agenda'
    recipes: ['@couscous']
  couscous_last:
    summary: 'Déjeuner : Couscous, Pâtes à la tomate'
    slot: '<(Maggie\Cookbook\Enum\MealSlot::Lunch)>'
    date: '<(new \DateTimeImmutable("2020-10-24"))>'
    agenda: '@test_agenda'
    recipes: ['@couscous', '@pasta']
  couscous_planned:
    summary: 'Dîner : Couscous'
    slot: '<(Maggie\Cookbook\Enum\MealSlot::Dinner)>'
    date: '<(new \DateTimeImmutable("2099-01-14"))>'
    agenda: '@test_agenda'
    recipes: ['@couscous']
