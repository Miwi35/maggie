Maggie\Core\Entity\User:
  test_user:
    email: nutrition-home@example.com
    googleId: google-nutrition-home
    name: Nutrition Home User
  other_user:
    email: nutrition-home-other@example.com
    googleId: google-nutrition-home-other
    name: Nutrition Home Other

Maggie\Calendar\Entity\Agenda:
  test_agenda:
    name: Repas
    module: cookbook
    isDefault: true
    user: '@test_user'
  other_agenda:
    name: Repas
    module: cookbook
    isDefault: true
    user: '@other_user'

Maggie\Cookbook\Entity\MealSettings:
  test_settings:
    user: '@test_user'
    defaultGuests: 4

Maggie\Cookbook\Entity\Ingredient:
  pasta_food:
    name: Pâtes
    category: '<(Maggie\Grocery\Enum\ProductCategory::Grain)>'
    defaultUnit: '<(Maggie\Grocery\Enum\Unit::Gram)>'
    user: '@test_user'
  parmesan_food:
    name: Parmesan
    category: '<(Maggie\Grocery\Enum\ProductCategory::Dairy)>'
    defaultUnit: '<(Maggie\Grocery\Enum\Unit::Gram)>'
    stockState: '<(Maggie\Grocery\Enum\ProductStockState::Out)>'
    user: '@test_user'
  basil_food:
    name: Basilic
    category: '<(Maggie\Grocery\Enum\ProductCategory::Produce)>'
    defaultUnit: '<(Maggie\Grocery\Enum\Unit::Bunch)>'
    stockState: '<(Maggie\Grocery\Enum\ProductStockState::Low)>'
    user: '@test_user'
  other_leek_food:
    name: Poireau du voisin
    category: '<(Maggie\Grocery\Enum\ProductCategory::Produce)>'
    defaultUnit: '<(Maggie\Grocery\Enum\Unit::Piece)>'
    stockState: '<(Maggie\Grocery\Enum\ProductStockState::Out)>'
    user: '@other_user'

Maggie\Cookbook\Entity\Recipe:
  pasta:
    name: Pâtes au basilic
    servings: 4
    user: '@test_user'
  salad:
    name: Salade verte
    servings: 2
    user: '@test_user'
  gratin:
    name: Gratin
    servings: 4
    user: '@test_user'
  other_soup:
    name: Velouté du voisin
    servings: 2
    user: '@other_user'

Maggie\Cookbook\Entity\RecipeIngredient:
  pasta_line:
    recipe: '@pasta'
    ingredient: '@pasta_food'
    quantity: 400.0
    unit: '<(Maggie\Grocery\Enum\Unit::Gram)>'
  pasta_basil_line:
    recipe: '@pasta'
    ingredient: '@basil_food'
    quantity: 1.0
    unit: '<(Maggie\Grocery\Enum\Unit::Bunch)>'
  gratin_parmesan_line:
    recipe: '@gratin'
    ingredient: '@parmesan_food'
    quantity: 80.0
    unit: '<(Maggie\Grocery\Enum\Unit::Gram)>'
  # Both recipes ask for the basil: the meal lacks it once.
  gratin_basil_line:
    recipe: '@gratin'
    ingredient: '@basil_food'
    quantity: 1.0
    unit: '<(Maggie\Grocery\Enum\Unit::Bunch)>'
  other_soup_line:
    recipe: '@other_soup'
    ingredient: '@other_leek_food'
    quantity: 3.0
    unit: '<(Maggie\Grocery\Enum\Unit::Piece)>'

Maggie\Cookbook\Entity\Meal:
  lunch_today:
    summary: Repas
    slot: '<(Maggie\Cookbook\Enum\MealSlot::Lunch)>'
    date: '<(new \DateTimeImmutable("2026-10-14"))>'
    agenda: '@test_agenda'
    recipes: ['@salad']
  dinner_today:
    summary: Repas
    slot: '<(Maggie\Cookbook\Enum\MealSlot::Dinner)>'
    date: '<(new \DateTimeImmutable("2026-10-14"))>'
    guests: 3
    agenda: '@test_agenda'
    recipes: ['@pasta', '@salad', '@gratin']
  dinner_tomorrow:
    summary: Repas
    slot: '<(Maggie\Cookbook\Enum\MealSlot::Dinner)>'
    date: '<(new \DateTimeImmutable("2026-10-15"))>'
    agenda: '@test_agenda'
    recipes: ['@salad']
  dinner_next_week:
    summary: Repas
    slot: '<(Maggie\Cookbook\Enum\MealSlot::Dinner)>'
    date: '<(new \DateTimeImmutable("2026-10-21"))>'
    agenda: '@test_agenda'
    recipes: ['@gratin']
  other_lunch_today:
    summary: Repas
    slot: '<(Maggie\Cookbook\Enum\MealSlot::Lunch)>'
    date: '<(new \DateTimeImmutable("2026-10-14"))>'
    agenda: '@other_agenda'
    recipes: ['@other_soup']
