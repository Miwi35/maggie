Maggie\Grocery\Entity\GroceryList:
  grocery_list:
    user: '@test_user'

Maggie\Grocery\Entity\GroceryItem:
  item_butter:
    groceryList: '@grocery_list'
    product: '@butter'
    checked: false
    source: '<(Maggie\Grocery\Enum\GroceryItemSource::Manual)>'
    position: 1
  item_milk_checked:
    groceryList: '@grocery_list'
    product: '@milk'
    checked: true
    source: '<(Maggie\Grocery\Enum\GroceryItemSource::Manual)>'
    position: 2

Maggie\Calendar\Entity\Agenda:
  meals_agenda:
    name: Repas
    module: cookbook
    color: '#FF6B35'
    user: '@test_user'

Maggie\Cookbook\Entity\Recipe:
  gratin:
    name: Gratin
    servings: 4
    tags: ['plat']
    user: '@test_user'
  omelette:
    name: Omelette
    servings: 2
    tags: ['plat']
    user: '@test_user'
  tart:
    name: Tarte
    servings: 4
    tags: ['plat']
    user: '@test_user'
  carbonara:
    name: Pâtes à la crème
    servings: 4
    tags: ['plat']
    user: '@test_user'

Maggie\Cookbook\Entity\RecipeIngredient:
  gratin_parmesan:
    recipe: '@gratin'
    ingredient: '@parmesan'
    quantity: 100
    unit: '<(Maggie\Grocery\Enum\Unit::Gram)>'
  gratin_flour:
    recipe: '@gratin'
    ingredient: '@flour'
