# Recurring tasks (MAG-870): an owner in Paris, another in Auckland, twelve or
# thirteen hours ahead — the daily run reads each one's own today. The tests
# create the recurring tasks and pin the clock.
Maggie\Core\Entity\User:
  test_user:
    email: fixture@example.com
    googleId: google-fixture-id
    name: Fixture User
  other_user:
    email: other@example.com
    googleId: google-other-id
    name: Other User

Maggie\Core\Entity\UserPreference:
  preference:
    timezone: Europe/Paris
    user: '@test_user'
  other_preference:
    timezone: Pacific/Auckland
    user: '@other_user'
