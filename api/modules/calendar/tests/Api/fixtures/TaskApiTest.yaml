Maggie\Core\Entity\User:
  test_user:
    email: fixture@example.com
    googleId: google-fixture-id
    name: Fixture User
  other_user:
    email: other@example.com
    googleId: google-other-id
    name: Other User

Maggie\Calendar\Entity\Task:
  task_done:
    title: Done task
    description: Some notes
    priority: '<(Maggie\Calendar\Enum\TaskPriority::High)>'
    criticality: '<(Maggie\Calendar\Enum\TaskCriticality::Low)>'
    dueDate: '<(new \DateTimeImmutable("2026-03-20 10:00"))>'
    completedAt: '<(new \DateTimeImmutable("2026-03-19 10:00"))>'
    user: '@test_user'

  # Google's shape (MAG-404): a task with notes, a link, two subtasks in order.
  task_moving:
    title: Préparer le déménagement
    description: Les cartons sont à la cave
    position: '00000000000000000005'
    links: [{type: email, description: Le mail du déménageur, link: 'https://mail.google.com/mail/#all/abc'}]
    user: '@test_user'

  subtask_second:
    title: Changer d'adresse
    parent: '@task_moving'
    position: '00000000000000000001'
    user: '@test_user'

  subtask_first:
    title: Réserver le camion
    parent: '@task_moving'
    position: '00000000000000000000'
    user: '@test_user'

  other_users_task:
    title: Someone else's
    user: '@other_user'
