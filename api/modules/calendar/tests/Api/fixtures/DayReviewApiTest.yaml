# The evening (MAG-500). The tests pin the clock at Wednesday 2026-10-14 21:05 in Paris.
Maggie\Core\Entity\User:
  test_user:
    email: fixture@example.com
    googleId: google-fixture-id
    name: Fixture User
  other_user:
    email: other@example.com
    googleId: google-other-id
    name: Other User

Maggie\Core\Entity\UserPreference:
  preference:
    timezone: Europe/Paris
    user: '@test_user'

Maggie\Calendar\Entity\Task:
  # Three done today, two left: « 3 sur 5 ».
  t1:
    title: Rappeler le garage
    completedAt: '<(new \DateTimeImmutable("2026-10-14 08:30"))>'
    position: '00000000000000000001'
    user: '@test_user'
  t2:
    title: Trier le courrier
    completedAt: '<(new \DateTimeImmutable("2026-10-14 10:00"))>'
    position: '00000000000000000002'
    user: '@test_user'
  t3:
    title: Arroser les plantes
    completedAt: '<(new \DateTimeImmutable("2026-10-14 16:00"))>'
    position: '00000000000000000003'
    user: '@test_user'
  # Left: one for tomorrow, one let go — due Friday, it goes to « Un jour ».
  t4:
    title: Réserver le train
    position: '00000000000000000004'
    user: '@test_user'
  t5:
    title: Payer la cantine
    dueDate: '<(new \DateTimeImmutable("2026-10-16"))>'
    position: '00000000000000000005'
    user: '@test_user'
  t6:
    title: Ranger le garage
    position: '00000000000000000006'
    user: '@test_user'

Maggie\Calendar\Entity\DayReview:
  # Another user's review never answers for test_user.
  others_review:
    user: '@other_user'
    date: '<(new \DateTimeImmutable("2026-10-14"))>'
    helped: [timer]
