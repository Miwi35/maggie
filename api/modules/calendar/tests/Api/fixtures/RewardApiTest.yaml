# The bravo (MAG-508); the test writes the day of t1 to t5. The tests pin the clock at Wednesday 2026-10-14 12:00 UTC (14:00 in Paris).
Maggie\Core\Entity\User:
  test_user:
    email: fixture@example.com
    googleId: google-fixture-id
    name: Fixture User
  other_user:
    email: other@example.com
    googleId: google-other-id
    name: Other User

Maggie\Core\Entity\UserPreference:
  preference:
    timezone: Europe/Paris
    user: '@test_user'

Maggie\Calendar\Entity\Task:
  # The day of five, two done this morning.
  t1:
    title: Rappeler le garage
    completedAt: '<(new \DateTimeImmutable("2026-10-14 07:30 UTC"))>'
    position: '00000000000000000001'
    user: '@test_user'
  t2:
    title: Trier le courrier
    completedAt: '<(new \DateTimeImmutable("2026-10-14 08:00 UTC"))>'
    position: '00000000000000000002'
    user: '@test_user'
  t3:
    title: Arroser les plantes
    estimatedMinutes: 10
    position: '00000000000000000003'
    user: '@test_user'
  t4:
    title: Réserver le train
    position: '00000000000000000004'
    user: '@test_user'
  t5:
    title: Payer la cantine
    position: '00000000000000000005'
    user: '@test_user'
  # Out of the day: due Saturday, put off for four days.
  waiting:
    title: Ranger le garage
    dueDate: '<(new \DateTimeImmutable("2026-10-10"))>'
    position: '00000000000000000006'
    user: '@test_user'
  # Out of the day, due yesterday: put off for one day only.
  yesterday:
    title: Laver la voiture
    dueDate: '<(new \DateTimeImmutable("2026-10-13"))>'
    position: '00000000000000000007'
    user: '@test_user'
  # Out of the day, nothing waiting.
  spare1:
    title: Lire un chapitre
    position: '00000000000000000008'
    user: '@test_user'
  spare2:
    title: Appeler mamie
    position: '00000000000000000009'
    user: '@test_user'
  spare3:
    title: Sortir les poubelles
    position: '00000000000000000010'
    user: '@test_user'
  others_task:
    title: La tâche d'un autre
    completedAt: '<(new \DateTimeImmutable("2026-10-14 08:00 UTC"))>'
    position: '00000000000000000001'
    user: '@other_user'

Maggie\Calendar\Entity\Reward:
  # Another user's star never answers for test_user.
  others_reward:
    user: '@other_user'
    subjectType: task
    subjectId: 01JZ0THERS0000000000000000
    messageKey: doux.1
    message: Fait. Tu peux souffler un peu.
    earnedAt: '<(new \DateTimeImmutable("2026-10-14 08:00 UTC"))>'
