Maggie\Core\Entity\User:
  test_user:
    email: fixture@example.com
    googleId: google-fixture-id
    name: Fixture User
  neighbour:
    email: neighbour@example.com
    googleId: google-neighbour-id
    name: Neighbour

Maggie\Calendar\Entity\Agenda:
  test_agenda:
    name: Test
    isDefault: true
    user: '@test_user'
  neighbour_agenda:
    name: Neighbour agenda
    isDefault: true
    user: '@neighbour'

Maggie\Calendar\Entity\Event:
  event_tomorrow:
    summary: Tomorrow meeting
    startAt: '<(new \DateTimeImmutable("tomorrow 10:00"))>'
    endAt: '<(new \DateTimeImmutable("tomorrow 11:00"))>'
    agenda: '@test_agenda'

  event_far_future:
    summary: Far away
    startAt: '<(new \DateTimeImmutable("+60 days 10:00"))>'
    endAt: '<(new \DateTimeImmutable("+60 days 11:00"))>'
    agenda: '@test_agenda'

  event_cancelled:
    summary: Cancelled
    startAt: '<(new \DateTimeImmutable("tomorrow 14:00"))>'
    endAt: '<(new \DateTimeImmutable("tomorrow 15:00"))>'
    status: '<(Maggie\Calendar\Enum\EventStatus::Cancelled)>'
    agenda: '@test_agenda'

  event_in_nine_days:
    summary: Nine days away
    startAt: '<(new \DateTimeImmutable("+9 days 10:00"))>'
    endAt: '<(new \DateTimeImmutable("+9 days 11:00"))>'
    agenda: '@test_agenda'

  piano_series:
    summary: Piano
    startAt: '<(new \DateTimeImmutable("+10 days 17:00"))>'
    endAt: '<(new \DateTimeImmutable("+10 days 18:00"))>'
    rrule: 'FREQ=WEEKLY'
    agenda: '@test_agenda'

  neighbour_event:
    summary: Neighbour tomorrow
    startAt: '<(new \DateTimeImmutable("tomorrow 10:00"))>'
    endAt: '<(new \DateTimeImmutable("tomorrow 11:00"))>'
    agenda: '@neighbour_agenda'
