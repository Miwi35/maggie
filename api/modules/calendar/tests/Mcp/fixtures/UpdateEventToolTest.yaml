Maggie\Core\Entity\User:
  test_user:
    email: fixture@example.com
    googleId: google-fixture-id
    name: Fixture User
  foreign_user:
    email: foreign@example.com
    googleId: google-foreign-id
    name: Foreign User

Maggie\Calendar\Entity\Agenda:
  test_agenda:
    name: Test Agenda
    description: Agenda notes
    color: '#e91e63'
    isDefault: true
    user: '@test_user'
  foreign_agenda:
    name: Foreign Agenda
    color: '#000000'
    isDefault: true
    user: '@foreign_user'

Maggie\Calendar\Entity\Event:
  event_full:
    summary: Weekly sync
    description: Bring slides
    location: Room 4
    rrule: FREQ=WEEKLY
    startAt: '<(new \DateTimeImmutable("2026-03-15 10:00"))>'
    endAt: '<(new \DateTimeImmutable("2026-03-15 11:00"))>'
    reminders:
      useDefault: false
      overrides:
        - { method: 'popup', minutes: 15 }
    agenda: '@test_agenda'

  # "La soirée avec Julie" of MAG-321: Wednesday 19:00 to midnight, in Paris.
  event_evening:
    summary: Soirée avec Julie
    timeZone: Europe/Paris
    startAt: '<(new \DateTimeImmutable("2026-10-07 19:00", new \DateTimeZone("Europe/Paris")))>'
    endAt: '<(new \DateTimeImmutable("2026-10-08 00:00", new \DateTimeZone("Europe/Paris")))>'
    agenda: '@test_agenda'

  # All-day events end on the next day's midnight, the way the calendar and Google store them.
  event_all_day:
    summary: Randonnée
    allDay: true
    timeZone: Europe/Paris
    startAt: '<(new \DateTimeImmutable("2026-10-10 00:00", new \DateTimeZone("Europe/Paris")))>'
    endAt: '<(new \DateTimeImmutable("2026-10-11 00:00", new \DateTimeZone("Europe/Paris")))>'
    agenda: '@test_agenda'

  event_foreign:
    summary: Rendez-vous de quelqu'un d'autre
    timeZone: Europe/Paris
    startAt: '<(new \DateTimeImmutable("2026-10-07 19:00", new \DateTimeZone("Europe/Paris")))>'
    endAt: '<(new \DateTimeImmutable("2026-10-07 20:00", new \DateTimeZone("Europe/Paris")))>'
    agenda: '@foreign_agenda'
