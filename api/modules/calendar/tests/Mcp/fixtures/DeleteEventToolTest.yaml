Maggie\Core\Entity\User:
  test_user:
    email: fixture@example.com
    googleId: google-fixture-id
    name: Fixture User

Maggie\Calendar\Entity\Agenda:
  test_agenda:
    name: Test Agenda
    description: Agenda notes
    color: '#e91e63'
    isDefault: true
    user: '@test_user'

Maggie\Calendar\Entity\Event:
  event_full:
    summary: Weekly sync
    description: Bring slides
    location: Room 4
    rrule: FREQ=WEEKLY
    startAt: '<(new \DateTimeImmutable("2026-03-15 10:00"))>'
    endAt: '<(new \DateTimeImmutable("2026-03-15 11:00"))>'
    agenda: '@test_agenda'
  event_exception:
    summary: Weekly sync (moved)
    startAt: '<(new \DateTimeImmutable("2026-03-22 14:00"))>'
    endAt: '<(new \DateTimeImmutable("2026-03-22 15:00"))>'
    originalStartAt: '<(new \DateTimeImmutable("2026-03-22 10:00"))>'
    recurringEvent: '@event_full'
    agenda: '@test_agenda'
