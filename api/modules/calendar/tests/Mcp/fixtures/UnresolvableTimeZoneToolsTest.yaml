Maggie\Core\Entity\User:
  test_user:
    email: fixture@example.com
    googleId: google-fixture-id
    name: Fixture User

Maggie\Calendar\Entity\Agenda:
  test_agenda:
    name: Test
    isDefault: true
    user: '@test_user'

Maggie\Calendar\Entity\Event:
  event_unresolvable_zone:
    summary: Stand-up on Mars
    startAt: '<(new \DateTimeImmutable("tomorrow 10:00"))>'
    endAt: '<(new \DateTimeImmutable("tomorrow 10:30"))>'
    rrule: 'FREQ=DAILY;COUNT=3'
    timeZone: 'Mars/Olympus'
    agenda: '@test_agenda'
