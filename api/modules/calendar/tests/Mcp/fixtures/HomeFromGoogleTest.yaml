# The « Maison » from Google (MAG-664). Addresses and coordinates are made up.
# The test user has no home; the other one has, to see it left alone.
Maggie\Core\Entity\User:
  test_user:
    email: fixture@example.com
    googleId: google-fixture-id
    name: Fixture User
    googleAccessToken: fixture-access-token
    googleRefreshToken: fixture-refresh-token
    googleTokenExpiresAt: '<(new \DateTimeImmutable("+1 hour"))>'
  other_user:
    email: other@example.com
    googleId: google-other-id
    name: Other User
    googleAccessToken: other-access-token
    googleRefreshToken: other-refresh-token
    googleTokenExpiresAt: '<(new \DateTimeImmutable("+1 hour"))>'
  no_google_user:
    email: nogoogle@example.com
    googleId: google-none-id
    name: No Google

Maggie\Calendar\Entity\Agenda:
  own_agenda:
    name: Own agenda
    isDefault: true
    user: '@test_user'
  other_agenda:
    name: Other agenda
    isDefault: true
    user: '@other_user'

Maggie\Calendar\Entity\Place:
  other_home:
    user: '@other_user'
    name: Chez moi
    address: '3 impasse du Voisin Fictif, 35000 Rennes'
    __calls:
      - setCoordinates: [48.1101, -1.6801]
    isHome: true

Maggie\Calendar\Entity\Event:
  dentist:
    summary: Dentiste
    location: '5 allée du Sourire Fictif, 35000 Rennes'
    timeZone: Europe/Paris
    startAt: '<(new \DateTimeImmutable("2026-11-03 13:00:00", new \DateTimeZone("UTC")))>'
    endAt: '<(new \DateTimeImmutable("2026-11-03 14:00:00", new \DateTimeZone("UTC")))>'
    agenda: '@own_agenda'
  other_dentist:
    summary: Dentiste du voisin
    location: '5 allée du Sourire Fictif, 35000 Rennes'
    timeZone: Europe/Paris
    startAt: '<(new \DateTimeImmutable("2026-11-03 13:00:00", new \DateTimeZone("UTC")))>'
    endAt: '<(new \DateTimeImmutable("2026-11-03 14:00:00", new \DateTimeZone("UTC")))>'
    agenda: '@other_agenda'
