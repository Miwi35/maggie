Maggie\Core\Entity\User:
  test_user:
    email: fixture@example.com
    googleId: google-fixture-id
    name: Fixture User

  other_user:
    email: other-agenda@example.com
    googleId: google-other-agenda
    name: Other User

Maggie\Calendar\Entity\Agenda:
  default_agenda:
    name: Personal
    isDefault: true
    user: '@test_user'
  concerts_agenda:
    name: Concerts
    isDefault: false
    color: '#e91e63'
    user: '@test_user'

  other_user_agenda:
    name: Autre utilisateur
    isDefault: false
    user: '@other_user'

Maggie\Calendar\Entity\Event:
  concert_event:
    summary: Concert
    startAt: '<(new \DateTimeImmutable("2026-03-15 20:00"))>'
    endAt: '<(new \DateTimeImmutable("2026-03-15 22:00"))>'
    agenda: '@concerts_agenda'
