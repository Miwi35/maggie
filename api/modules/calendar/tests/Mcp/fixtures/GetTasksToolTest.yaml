Maggie\Core\Entity\User:
  test_user:
    email: fixture@example.com
    googleId: google-fixture-id
    name: Fixture User

Maggie\Calendar\Entity\Task:
  task_pending:
    title: Pending task
    priority: '<(Maggie\Calendar\Enum\TaskPriority::Medium)>'
    criticality: '<(Maggie\Calendar\Enum\TaskCriticality::Low)>'
    user: '@test_user'

  task_done:
    title: Done task
    priority: '<(Maggie\Calendar\Enum\TaskPriority::Medium)>'
    criticality: '<(Maggie\Calendar\Enum\TaskCriticality::Low)>'
    completedAt: '<(new \DateTimeImmutable())>'
    user: '@test_user'

  task_overdue:
    title: Overdue task
    priority: '<(Maggie\Calendar\Enum\TaskPriority::Medium)>'
    criticality: '<(Maggie\Calendar\Enum\TaskCriticality::Low)>'
    dueDate: '<(new \DateTimeImmutable("-2 days"))>'
    user: '@test_user'

  task_future:
    title: Future task
    priority: '<(Maggie\Calendar\Enum\TaskPriority::High)>'
    criticality: '<(Maggie\Calendar\Enum\TaskCriticality::Critical)>'
    dueDate: '<(new \DateTimeImmutable("+3 days"))>'
    user: '@test_user'

  task_with_subtask:
    title: Préparer le déménagement
    position: '00000000000000000004'
    links: [{type: email, description: Le mail, link: 'https://mail.google.com/mail/#all/abc'}]
    user: '@test_user'

  task_subtask:
    title: Réserver le camion
    parent: '@task_with_subtask'
    position: '00000000000000000000'
    user: '@test_user'
