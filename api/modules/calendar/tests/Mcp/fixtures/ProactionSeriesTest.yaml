Maggie\Core\Entity\User:
  test_user:
    email: proaction-series@example.com
    googleId: google-proaction-series
    name: Series User
  other_user:
    email: proaction-series-other@example.com
    googleId: google-proaction-series-other
    name: Other Series User

Maggie\Calendar\Entity\Agenda:
  maggie_agenda:
    name: Maggie
    module: agent
    user: '@test_user'
  other_maggie_agenda:
    name: Maggie
    module: agent
    user: '@other_user'

Maggie\Calendar\Entity\Proaction:
  series:
    prompt: Fais le point budget
    summary: Point budget
    kind: check
    startAt: '<(new \DateTimeImmutable("2037-01-09T18:00:00+01:00"))>'
    rrule: 'FREQ=WEEKLY;BYDAY=FR'
    agenda: '@maggie_agenda'
    origin: { kind: owner_message, ref: 01JM0000000000000000000009 }
  other_series:
    prompt: Série d'un autre
    summary: Autre
    startAt: '<(new \DateTimeImmutable("2037-03-06T18:00:00+01:00"))>'
    rrule: 'FREQ=WEEKLY;BYDAY=FR'
    agenda: '@other_maggie_agenda'
  future_series:
    prompt: Série qui n'a pas commencé
    summary: Plus tard
    startAt: '<(new \DateTimeImmutable("2037-02-06T18:00:00+01:00"))>'
    rrule: 'FREQ=WEEKLY;BYDAY=FR'
    agenda: '@maggie_agenda'
  done_instance:
    prompt: Série qui n'a pas commencé
    summary: Plus tard
    startAt: '<(new \DateTimeImmutable("2037-02-06T18:00:00+01:00"))>'
    originalStartAt: '<(new \DateTimeImmutable("2037-02-06T18:00:00+01:00"))>'
    recurringEvent: '@future_series'
    agenda: '@maggie_agenda'
    __calls:
      - markFailed: ['Le modèle ne répond pas', '<(new \DateTimeImmutable("2037-02-06T18:01:00+01:00"))>']
  coming_instance:
    prompt: Série qui n'a pas commencé
    summary: Plus tard
    startAt: '<(new \DateTimeImmutable("2037-02-13T18:00:00+01:00"))>'
    originalStartAt: '<(new \DateTimeImmutable("2037-02-13T18:00:00+01:00"))>'
    recurringEvent: '@future_series'
    agenda: '@maggie_agenda'
