Maggie\Core\Entity\User:
  test_user:
    email: fixture@example.com
    googleId: google-fixture-id
    name: Fixture User
  other_user:
    email: other@example.com
    googleId: google-other-id
    name: Other User

Maggie\Calendar\Entity\Agenda:
  default_agenda:
    name: Défaut
    isDefault: true
    user: '@test_user'
  garde_agenda:
    name: Garde Ael
    user: '@test_user'
  sport_agenda:
    name: Sport
    user: '@test_user'
  other_default_agenda:
    name: Défaut
    isDefault: true
    user: '@other_user'
  other_secret_agenda:
    name: Agenda secret du voisin
    user: '@other_user'

Maggie\Calendar\Entity\Event:
  default_event:
    summary: Dentiste
    startAt: '<(new \DateTimeImmutable("tomorrow 10:00", new \DateTimeZone("Europe/Paris")))>'
    endAt: '<(new \DateTimeImmutable("tomorrow 11:00", new \DateTimeZone("Europe/Paris")))>'
    timeZone: Europe/Paris
    agenda: '@default_agenda'
  garde_event:
    summary: Récupérer Ael à l'école
    startAt: '<(new \DateTimeImmutable("tomorrow 16:30", new \DateTimeZone("Europe/Paris")))>'
    endAt: '<(new \DateTimeImmutable("tomorrow 17:00", new \DateTimeZone("Europe/Paris")))>'
    timeZone: Europe/Paris
    agenda: '@garde_agenda'
  sport_event:
    summary: Squash
    startAt: '<(new \DateTimeImmutable("tomorrow 18:00", new \DateTimeZone("Europe/Paris")))>'
    endAt: '<(new \DateTimeImmutable("tomorrow 19:00", new \DateTimeZone("Europe/Paris")))>'
    timeZone: Europe/Paris
    agenda: '@sport_agenda'
  piano_series:
    summary: Piano
    startAt: '<(new \DateTimeImmutable("+8 days 17:00", new \DateTimeZone("Europe/Paris")))>'
    endAt: '<(new \DateTimeImmutable("+8 days 18:00", new \DateTimeZone("Europe/Paris")))>'
    timeZone: Europe/Paris
    rrule: FREQ=WEEKLY
    agenda: '@garde_agenda'
  ligature_event:
    summary: Bœuf bourguignon
    startAt: '<(new \DateTimeImmutable("+20 days 19:30", new \DateTimeZone("Europe/Paris")))>'
    endAt: '<(new \DateTimeImmutable("+20 days 20:30", new \DateTimeZone("Europe/Paris")))>'
    timeZone: Europe/Paris
    agenda: '@default_agenda'
  other_event:
    summary: Piano du voisin
    startAt: '<(new \DateTimeImmutable("tomorrow 10:00", new \DateTimeZone("Europe/Paris")))>'
    endAt: '<(new \DateTimeImmutable("tomorrow 11:00", new \DateTimeZone("Europe/Paris")))>'
    timeZone: Europe/Paris
    agenda: '@other_default_agenda'
  concert_event:
    summary: Black Wizards
    location: "L'UBU, Rennes"
    startAt: '<(new \DateTimeImmutable("+9 days 19:00", new \DateTimeZone("Europe/Paris")))>'
    endAt: '<(new \DateTimeImmutable("+9 days 22:00", new \DateTimeZone("Europe/Paris")))>'
    timeZone: Europe/Paris
    agenda: '@default_agenda'
