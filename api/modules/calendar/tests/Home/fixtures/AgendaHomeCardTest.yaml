Maggie\Core\Entity\User:
  test_user:
    email: agenda-home@example.com
    googleId: google-agenda-home
    name: Agenda Home User
  other_user:
    email: agenda-home-other@example.com
    googleId: google-agenda-home-other
    name: Agenda Home Other

Maggie\Calendar\Entity\Agenda:
  perso:
    name: Perso
    color: '#4285F4'
    isDefault: true
    user: '@test_user'
  other_agenda:
    name: Autre
    isDefault: true
    user: '@other_user'

# « Now » of the tests is 2026-10-14 14:12 in Paris.
Maggie\Calendar\Entity\Event:
  past:
    summary: Réunion équipe
    startAt: '<(new \DateTimeImmutable("2026-10-14T09:00:00+02:00"))>'
    endAt: '<(new \DateTimeImmutable("2026-10-14T10:00:00+02:00"))>'
    agenda: '@perso'

  upcoming:
    summary: Dentiste
    description: Contrôle annuel
    location: 'Cabinet Martin, 15 rue de la Paix'
    startAt: '<(new \DateTimeImmutable("2026-10-14T15:00:00+02:00"))>'
    endAt: '<(new \DateTimeImmutable("2026-10-14T16:00:00+02:00"))>'
    reminders:
      useDefault: false
      overrides:
        - { method: popup, minutes: 30 }
    agenda: '@perso'

  # Began the evening before and ends after midnight.
  over_midnight:
    summary: Soirée
    startAt: '<(new \DateTimeImmutable("2026-10-13T23:00:00+02:00"))>'
    endAt: '<(new \DateTimeImmutable("2026-10-14T01:00:00+02:00"))>'
    agenda: '@perso'

  # 13th, 14th and 15th: began the day before today.
  all_day_since_yesterday:
    summary: Séjour
    allDay: true
    startDate: '<(new \DateTimeImmutable("2026-10-13"))>'
    endDate: '<(new \DateTimeImmutable("2026-10-16"))>'
    agenda: '@perso'

  all_day_tomorrow_only:
    summary: Pont
    allDay: true
    startDate: '<(new \DateTimeImmutable("2026-10-15"))>'
    endDate: '<(new \DateTimeImmutable("2026-10-16"))>'
    agenda: '@perso'

  all_day_ended_yesterday:
    summary: Colloque
    allDay: true
    startDate: '<(new \DateTimeImmutable("2026-10-12"))>'
    endDate: '<(new \DateTimeImmutable("2026-10-14"))>'
    agenda: '@perso'

  tomorrow_morning:
    summary: Plombier
    startAt: '<(new \DateTimeImmutable("2026-10-15T08:30:00+02:00"))>'
    endAt: '<(new \DateTimeImmutable("2026-10-15T09:30:00+02:00"))>'
    agenda: '@perso'

  cancelled:
    summary: Annulé
    status: '<(Maggie\Calendar\Enum\EventStatus::Cancelled)>'
    startAt: '<(new \DateTimeImmutable("2026-10-14T17:00:00+02:00"))>'
    endAt: '<(new \DateTimeImmutable("2026-10-14T18:00:00+02:00"))>'
    agenda: '@perso'

  daily_pill:
    summary: Médicament
    rrule: 'FREQ=DAILY'
    startAt: '<(new \DateTimeImmutable("2026-10-01T08:00:00+02:00"))>'
    endAt: '<(new \DateTimeImmutable("2026-10-01T08:15:00+02:00"))>'
    agenda: '@perso'

  someone_elses:
    summary: Rendez-vous d'un autre
    startAt: '<(new \DateTimeImmutable("2026-10-14T16:00:00+02:00"))>'
    endAt: '<(new \DateTimeImmutable("2026-10-14T17:00:00+02:00"))>'
    agenda: '@other_agenda'
