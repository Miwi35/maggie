services:
    _defaults:
        autowire: true
        autoconfigure: true
        bind:
            string $googleClientId: '%env(GOOGLE_CLIENT_ID)%'
            string $googleClientSecret: '%env(GOOGLE_CLIENT_SECRET)%'
            string $googleWebhookUrl: '%env(GOOGLE_WEBHOOK_URL)%'
            string $googleWebhookToken: '%env(GOOGLE_WEBHOOK_TOKEN)%'
            # Only the e2e stack sets this; everywhere else it stays empty and
            # the Google libraries keep their own root URL.
            string $googleApiBaseUrl: '%env(string:default::GOOGLE_API_BASE_URL)%'
            string $kernelEnvironment: '%kernel.environment%'

    Maggie\Calendar\:
        resource: '../src/'
        exclude:
            - '../src/Entity/'
            - '../src/Dto/'
            - '../src/Trait/'
            - '../src/MaggieCalendarBundle.php'
