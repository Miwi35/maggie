services:
    _defaults:
        autowire: true
        autoconfigure: true
        bind:
            string $googleClientId: '%env(GOOGLE_CLIENT_ID)%'
            string $googleClientSecret: '%env(GOOGLE_CLIENT_SECRET)%'
            string $googleWebhookUrl: '%env(GOOGLE_WEBHOOK_URL)%'
            string $googleWebhookToken: '%env(GOOGLE_WEBHOOK_TOKEN)%'
            # Only the e2e stack sets this; everywhere else it stays empty and
            # the Google libraries keep their own root URL.
            string $googleApiBaseUrl: '%env(string:default::GOOGLE_API_BASE_URL)%'
            string $kernelEnvironment: '%kernel.environment%'

    Maggie\Calendar\:
        resource: '../src/'
        exclude:
            - '../src/Entity/'
            - '../src/Dto/'
            - '../src/Trait/'
            - '../src/MaggieCalendarBundle.php'

    # Google Routes and Geocoding (« Partir à l'heure », MAG-653). Without a key
    # both answer a RoutingException, which estimate_trip turns into an error.
    Maggie\Calendar\Routing\RoutingClient:
        arguments:
            $routesUrl: '%env(GOOGLE_ROUTES_URL)%'
            $googleMapsApiKey: '%env(GOOGLE_MAPS_API_KEY)%'

    Maggie\Calendar\Routing\GeocodingClient:
        arguments:
            $geocodingUrl: '%env(GOOGLE_GEOCODING_URL)%'
            $googleMapsApiKey: '%env(GOOGLE_MAPS_API_KEY)%'
