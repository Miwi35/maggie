Maggie\Core\Entity\User:
  test_user:
    email: finance-category-filter@example.com
    googleId: google-finance-category-filter
    name: Category Filter User
  other_user:
    email: finance-category-filter-other@example.com
    googleId: google-finance-category-filter-other
    name: Someone Else

Maggie\Finance\Entity\Account:
  checking:
    name: Compte courant
    type: '<(Maggie\Finance\Enum\AccountType::Checking)>'
    currency: EUR
    balanceCents: 0
    isCushion: false
    user: '@test_user'
  other_checking:
    name: Courant de l'autre
    type: '<(Maggie\Finance\Enum\AccountType::Checking)>'
    currency: EUR
    balanceCents: 0
    isCushion: false
    user: '@other_user'

Maggie\Finance\Entity\Category:
  salary_category:
    name: Salaire
    obligation: '<(Maggie\Finance\Enum\ObligationFlag::Income)>'
    user: '@test_user'
  bonus_category:
    name: Primes
    obligation: '<(Maggie\Finance\Enum\ObligationFlag::Income)>'
    parent: '@salary_category'
    user: '@test_user'
  food_category:
    name: Alimentation
    obligation: '<(Maggie\Finance\Enum\ObligationFlag::Mandatory)>'
    user: '@test_user'
  other_salary_category:
    name: Salaire de l'autre
    obligation: '<(Maggie\Finance\Enum\ObligationFlag::Income)>'
    user: '@other_user'

