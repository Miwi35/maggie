Maggie\Core\Entity\User:
  test_user:
    email: finance-test@example.com
    googleId: google-finance-test
    name: Finance Test User

Maggie\Finance\Entity\Account:
  checking:
    name: Compte courant
    type: '<(Maggie\Finance\Enum\AccountType::Checking)>'
    currency: EUR
    balanceCents: 200000
    isCushion: false
    user: '@test_user'
  livret:
    name: Livret A
    type: '<(Maggie\Finance\Enum\AccountType::Savings)>'
    currency: EUR
    balanceCents: 750000
    isCushion: true
    user: '@test_user'

Maggie\Finance\Entity\SafetyCushion:
  cushion:
    targetMonths: 3
    monthlyNetIncomeCents: 250000
    rechargeCapCents: 15000
    rechargeTargetMonths: 6
    completedAt: null
    user: '@test_user'

Maggie\Finance\Entity\Category:
  food:
    name: Alimentation
    obligation: '<(Maggie\Finance\Enum\ObligationFlag::Mandatory)>'
    user: '@test_user'
  leisure:
    name: Loisirs
    obligation: '<(Maggie\Finance\Enum\ObligationFlag::Optional)>'
    user: '@test_user'

Maggie\Finance\Entity\Envelope:
  food_september:
    category: '@food'
    mode: '<(Maggie\Finance\Enum\BudgetMode::Monthly)>'
    amountCents: 40000
    currency: EUR
    year: 2026
    month: 9
    user: '@test_user'
  leisure_september:
    category: '@leisure'
    mode: '<(Maggie\Finance\Enum\BudgetMode::Monthly)>'
    amountCents: 20000
    currency: EUR
    year: 2026
    month: 9
    user: '@test_user'

Maggie\Finance\Entity\Transaction:
  # September: well inside both envelopes.
  groceries:
    account: '@checking'
    category: '@food'
    amountCents: -20000
    currency: EUR
    bookedAt: '<(new \DateTimeImmutable("2026-09-04"))>'
    label: Supermarché
    status: '<(Maggie\Finance\Enum\TransactionStatus::Spent)>'
    isExceptional: false
    user: '@test_user'
  cinema:
    account: '@checking'
    category: '@leisure'
    amountCents: -5000
    currency: EUR
    bookedAt: '<(new \DateTimeImmutable("2026-09-06"))>'
    label: Cinéma
    status: '<(Maggie\Finance\Enum\TransactionStatus::Spent)>'
    isExceptional: false
    user: '@test_user'

  # Same month last year, spending more — so this year compares well.
  groceries_last_year:
    account: '@checking'
    category: '@food'
    amountCents: -45000
    currency: EUR
    bookedAt: '<(new \DateTimeImmutable("2025-09-04"))>'
    label: Supermarché
    status: '<(Maggie\Finance\Enum\TransactionStatus::Spent)>'
    isExceptional: false
    user: '@test_user'
