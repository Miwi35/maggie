# One category, « Essence », flagged optional — the old flag would call every
# line below optional — and lines of different qualifications under it (MAG-477).
# September: a mandatory fill-up pushes a 100 € envelope over. August: an
# optional one does. July: 30 € mandatory and 120 € optional — the optional
# part alone overruns. A roomy « Loisirs » envelope keeps the total budget
# out of the way, so only the category verdict is read. June: what the monthly review keeps and drops. March:
# what the measured lifestyle keeps and drops.
