# The month judged on the reference salary (MAG-274). Three users, one per way
# the mark is known, each with the same September 2026: 1 000 € of groceries in a
# 10 000 € envelope, against 9 000 € the September before — so, but for the
# reference, the score would be green. The salary series run on the real clock
# (anchored a year back); the measured user's payments are written by the tests.

Maggie\Core\Entity\User:
  declared_user:
    email: reference-judgement-declared@example.com
    googleId: google-reference-judgement-declared
    name: Reference Judgement Declared User
  measured_user:
    email: reference-judgement-measured@example.com
    googleId: google-reference-judgement-measured
    name: Reference Judgement Measured User
  empty_user:
    email: reference-judgement-empty@example.com
    googleId: google-reference-judgement-empty
    name: Reference Judgement Empty User

Maggie\Finance\Entity\Account:
  declared_checking:
    name: Courant declared
    type: '<(Maggie\Finance\Enum\AccountType::Checking)>'
    currency: EUR
    balanceCents: 300000
    isCushion: false
    user: '@declared_user'
  measured_checking:
    name: Courant measured
    type: '<(Maggie\Finance\Enum\AccountType::Checking)>'
    currency: EUR
    balanceCents: 300000
    isCushion: false
    user: '@measured_user'
  empty_checking:
    name: Courant empty
    type: '<(Maggie\Finance\Enum\AccountType::Checking)>'
    currency: EUR
    balanceCents: 300000
    isCushion: false
    user: '@empty_user'
  declared_livret:
    name: Livret declared
    type: '<(Maggie\Finance\Enum\AccountType::Savings)>'
    currency: EUR
    balanceCents: 2000000
    isCushion: true
    user: '@declared_user'
  measured_livret:
    name: Livret measured
    type: '<(Maggie\Finance\Enum\AccountType::Savings)>'
    currency: EUR
    balanceCents: 2000000
    isCushion: true
    user: '@measured_user'

Maggie\Finance\Entity\Category:
  declared_food:
    name: Alimentation
    obligation: '<(Maggie\Finance\Enum\ObligationFlag::Mandatory)>'
    user: '@declared_user'
  declared_salary:
    name: Salaire
    obligation: '<(Maggie\Finance\Enum\ObligationFlag::Income)>'
    standardKey: salary
    user: '@declared_user'
  measured_food:
    name: Alimentation
    obligation: '<(Maggie\Finance\Enum\ObligationFlag::Mandatory)>'
    user: '@measured_user'
  measured_salary:
    name: Salaire
    obligation: '<(Maggie\Finance\Enum\ObligationFlag::Income)>'
    standardKey: salary
    user: '@measured_user'
  empty_food:
    name: Alimentation
    obligation: '<(Maggie\Finance\Enum\ObligationFlag::Mandatory)>'
    user: '@empty_user'

Maggie\Finance\Entity\SafetyCushion:
  declared_cushion:
    targetMonths: 3
    monthlyNetIncomeCents: 520000
    rechargeCapCents: 15000
    rechargeTargetMonths: 6
    user: '@declared_user'
  measured_cushion:
    targetMonths: 3
    monthlyNetIncomeCents: 0
    rechargeCapCents: 15000
    rechargeTargetMonths: 6
    user: '@measured_user'
  empty_cushion:
    targetMonths: 3
    monthlyNetIncomeCents: 0
    rechargeCapCents: 15000
    rechargeTargetMonths: 6
    user: '@empty_user'

# The declared user also has a 4 950 € salary series: the declared 5 200 € still wins.
# The measured user's series follows its payments.
Maggie\Finance\Entity\RecurringOperation:
  declared_salary_op:
    label: Salaire Initech
    counterpartyName: INITECH
    category: '@declared_salary'
    account: '@declared_checking'
    period: '<(Maggie\Finance\Enum\RecurrencePeriod::Monthly)>'
    anchorOn: '<(new \DateTimeImmutable("first day of this month -12 months"))>'
    referenceAmountCents: 495000
    referenceSource: '<(Maggie\Finance\Enum\ReferenceAmountSource::Declared)>'
    user: '@declared_user'
  measured_salary_op:
    label: Salaire Globex
    counterpartyName: GLOBEX
    category: '@measured_salary'
    account: '@measured_checking'
    period: '<(Maggie\Finance\Enum\RecurrencePeriod::Monthly)>'
    anchorOn: '<(new \DateTimeImmutable("first day of this month -24 months +24 days"))>'
    referenceAmountCents: 500000
    referenceSource: '<(Maggie\Finance\Enum\ReferenceAmountSource::Measured)>'
    user: '@measured_user'

Maggie\Finance\Entity\Envelope:
  declared_food_september:
    category: '@declared_food'
    mode: '<(Maggie\Finance\Enum\BudgetMode::Monthly)>'
    amountCents: 1000000
    currency: EUR
    year: 2026
    month: 9
    user: '@declared_user'
  measured_food_september:
    category: '@measured_food'
    mode: '<(Maggie\Finance\Enum\BudgetMode::Monthly)>'
    amountCents: 1000000
    currency: EUR
    year: 2026
    month: 9
    user: '@measured_user'
  empty_food_september:
    category: '@empty_food'
    mode: '<(Maggie\Finance\Enum\BudgetMode::Monthly)>'
    amountCents: 1000000
    currency: EUR
    year: 2026
    month: 9
    user: '@empty_user'

Maggie\Finance\Entity\Transaction:
  declared_groceries_september:
    account: '@declared_checking'
    category: '@declared_food'
    amountCents: -100000
    currency: EUR
    bookedAt: '<(new \DateTimeImmutable("2026-09-04"))>'
    label: Supermarché
    status: '<(Maggie\Finance\Enum\TransactionStatus::Spent)>'
    isExceptional: false
    user: '@declared_user'
  declared_groceries_last_september:
    account: '@declared_checking'
    category: '@declared_food'
    amountCents: -900000
    currency: EUR
    bookedAt: '<(new \DateTimeImmutable("2025-09-04"))>'
    label: Supermarché
    status: '<(Maggie\Finance\Enum\TransactionStatus::Spent)>'
    isExceptional: false
    user: '@declared_user'
  measured_groceries_september:
    account: '@measured_checking'
    category: '@measured_food'
    amountCents: -100000
    currency: EUR
    bookedAt: '<(new \DateTimeImmutable("2026-09-04"))>'
    label: Supermarché
    status: '<(Maggie\Finance\Enum\TransactionStatus::Spent)>'
    isExceptional: false
    user: '@measured_user'
  measured_groceries_last_september:
    account: '@measured_checking'
    category: '@measured_food'
    amountCents: -900000
    currency: EUR
    bookedAt: '<(new \DateTimeImmutable("2025-09-04"))>'
    label: Supermarché
    status: '<(Maggie\Finance\Enum\TransactionStatus::Spent)>'
    isExceptional: false
    user: '@measured_user'
  empty_groceries_september:
    account: '@empty_checking'
    category: '@empty_food'
    amountCents: -100000
    currency: EUR
    bookedAt: '<(new \DateTimeImmutable("2026-09-04"))>'
    label: Supermarché
    status: '<(Maggie\Finance\Enum\TransactionStatus::Spent)>'
    isExceptional: false
    user: '@empty_user'
  empty_groceries_last_september:
    account: '@empty_checking'
    category: '@empty_food'
    amountCents: -900000
    currency: EUR
    bookedAt: '<(new \DateTimeImmutable("2025-09-04"))>'
    label: Supermarché
    status: '<(Maggie\Finance\Enum\TransactionStatus::Spent)>'
    isExceptional: false
    user: '@empty_user'
