# Savings advances (MAG-276). The reference salary is declared on the cushion
# (4 950 €), so it does not move with the day the suite runs; the movements
# are written by the tests, dated, and each read passes its own « today ».
Maggie\Core\Entity\User:
  test_user:
    email: savings-advances@example.com
    googleId: google-savings-advances
    name: Savings Advances User
  other_user:
    email: savings-advances-other@example.com
    googleId: google-savings-advances-other
    name: Someone Else
  bare_user:
    email: savings-advances-bare@example.com
    googleId: google-savings-advances-bare
    name: No Expected Day
  unknown_reference_user:
    email: savings-advances-unknown@example.com
    googleId: google-savings-advances-unknown
    name: No Reference Salary

Maggie\Finance\Entity\TreasurySettings:
  settings:
    salaryExpectedDay: 25
    user: '@test_user'
  other_settings:
    salaryExpectedDay: 25
    user: '@other_user'
  unknown_reference_settings:
    salaryExpectedDay: 25
    user: '@unknown_reference_user'

Maggie\Finance\Entity\SafetyCushion:
  cushion:
    targetMonths: 3
    monthlyNetIncomeCents: 495000
    rechargeCapCents: 15000
    rechargeTargetMonths: 6
    user: '@test_user'
  other_cushion:
    targetMonths: 3
    monthlyNetIncomeCents: 495000
    rechargeCapCents: 15000
    rechargeTargetMonths: 6
    user: '@other_user'
  bare_cushion:
    targetMonths: 3
    monthlyNetIncomeCents: 495000
    rechargeCapCents: 15000
    rechargeTargetMonths: 6
    user: '@bare_user'

