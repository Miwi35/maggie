# The overview as the REST endpoint and the tool read it, on the real clock:
# the one series is anchored on the first of the current month, with that
# month's debit attached, so nothing here moves with the day the suite runs.
Maggie\Core\Entity\User:
  test_user:
    email: recurring-overview-live@example.com
    googleId: google-recurring-overview-live
    name: Recurring Overview Live User
  other_user:
    email: recurring-overview-live-other@example.com
    googleId: google-recurring-overview-live-other
    name: Recurring Overview Live Other User

Maggie\Finance\Entity\Account:
  checking:
    name: Courant
    type: '<(Maggie\Finance\Enum\AccountType::Checking)>'
    currency: EUR
    balanceCents: 125000
    isCushion: false
    user: '@test_user'
  other_checking:
    name: Compte secret
    type: '<(Maggie\Finance\Enum\AccountType::Checking)>'
    currency: EUR
    balanceCents: 1000
    isCushion: false
    user: '@other_user'

Maggie\Finance\Entity\Category:
  subscriptions:
    name: Abonnements
    obligation: '<(Maggie\Finance\Enum\ObligationFlag::Optional)>'
    user: '@test_user'
  other_secret:
    name: Cadeaux secrets
    obligation: '<(Maggie\Finance\Enum\ObligationFlag::Optional)>'
    user: '@other_user'

Maggie\Finance\Entity\RecurringOperation:
  flixo:
    label: Abonnement Flixo
    counterpartyName: Flixo
    category: '@subscriptions'
    account: '@checking'
    period: '<(Maggie\Finance\Enum\RecurrencePeriod::Monthly)>'
    anchorOn: '<(new \DateTimeImmutable("first day of this month"))>'
    referenceAmountCents: -1349
    user: '@test_user'
  other_flixo:
    label: Abonnement secret
    counterpartyName: Flixo
    category: '@other_secret'
    account: '@other_checking'
    period: '<(Maggie\Finance\Enum\RecurrencePeriod::Monthly)>'
    anchorOn: '<(new \DateTimeImmutable("first day of this month"))>'
    referenceAmountCents: -999
    user: '@other_user'

Maggie\Finance\Entity\Transaction:
  flixo_this_month:
    account: '@checking'
    amountCents: -1349
    bookedAt: '<(new \DateTimeImmutable("first day of this month"))>'
    label: CB FLIXO
    counterpartyName: Flixo
    recurringOperation: '@flixo'
    recurringOccurrenceOn: '<(new \DateTimeImmutable("first day of this month"))>'
    user: '@test_user'
  other_flixo_this_month:
    account: '@other_checking'
    amountCents: -999
    bookedAt: '<(new \DateTimeImmutable("first day of this month"))>'
    label: CB FLIXO SECRET
    counterpartyName: Flixo
    recurringOperation: '@other_flixo'
    recurringOccurrenceOn: '<(new \DateTimeImmutable("first day of this month"))>'
    user: '@other_user'
