    category: '@dining'
    amountCents: -20000
    bookedAt: '<(new \DateTimeImmutable("2026-08-12"))>'
    label: Sorties août
    retrospect: '<(Maggie\Finance\Enum\RetrospectVerdict::Avoidable)>'

  dining_sep_spend (extends spend):
    category: '@dining'
    amountCents: -20000
    bookedAt: '<(new \DateTimeImmutable("2026-09-12"))>'
    label: Sorties septembre
