Maggie\Core\Entity\User:
  test_user:
    email: finance-nested-envelopes@example.com
    googleId: google-finance-nested-envelopes
    name: Nested Envelopes Test User

Maggie\Finance\Entity\Account:
  checking:
    name: Compte courant
    type: '<(Maggie\Finance\Enum\AccountType::Checking)>'
    currency: EUR
    balanceCents: 125000
    isCushion: false
    user: '@test_user'

# Loisirs > Bars > Obsydian: Loisirs and Obsydian carry an envelope, Bars none.
Maggie\Finance\Entity\Category:
  leisure:
    name: Loisirs
    obligation: '<(Maggie\Finance\Enum\ObligationFlag::Optional)>'
    user: '@test_user'
  bars:
    name: Bars
    obligation: '<(Maggie\Finance\Enum\ObligationFlag::Optional)>'
    parent: '@leisure'
    user: '@test_user'
  obsydian:
    name: Obsydian
    obligation: '<(Maggie\Finance\Enum\ObligationFlag::Optional)>'
    parent: '@bars'
    user: '@test_user'
  food:
    name: Alimentation
    obligation: '<(Maggie\Finance\Enum\ObligationFlag::Mandatory)>'
    user: '@test_user'

Maggie\Finance\Entity\Envelope:
  leisure_october:
    category: '@leisure'
    mode: '<(Maggie\Finance\Enum\BudgetMode::Monthly)>'
    amountCents: 30000
    currency: EUR
    year: 2026
    month: 10
    user: '@test_user'
  obsydian_october:
    category: '@obsydian'
    mode: '<(Maggie\Finance\Enum\BudgetMode::Monthly)>'
    amountCents: 10000
    currency: EUR
    year: 2026
    month: 10
    user: '@test_user'

Maggie\Finance\Entity\Transaction:
  obsydian_round:
    account: '@checking'
    category: '@obsydian'
    amountCents: -4000
    currency: EUR
    bookedAt: '<(new \DateTimeImmutable("2026-10-03"))>'
    label: Obsydian
    status: '<(Maggie\Finance\Enum\TransactionStatus::Spent)>'
    isExceptional: false
    user: '@test_user'
  obsydian_idea:
    account: '@checking'
    category: '@obsydian'
    amountCents: -500
    currency: EUR
    bookedAt: '<(new \DateTimeImmutable("2026-10-04"))>'
    label: Obsydian, à voir
    status: '<(Maggie\Finance\Enum\TransactionStatus::ToArbitrate)>'
    isExceptional: false
    user: '@test_user'
  bars_beer:
    account: '@checking'
    category: '@bars'
    amountCents: -2500
    currency: EUR
    bookedAt: '<(new \DateTimeImmutable("2026-10-10"))>'
    label: Bar du coin
    status: '<(Maggie\Finance\Enum\TransactionStatus::Spent)>'
    isExceptional: false
    user: '@test_user'
  leisure_planned:
