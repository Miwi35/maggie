# The cushion less what is lent to people (MAG-454), shared by the API, MCP and
# use-case suites: a Livret A of 5 200 € flagged as cushion, a target of 3 months
# of 2 500 €, and the créances of peer_allocations.yaml — the gîte de Crozon
# (Julie 200 €, Tom 200 €), Tom's birthday present (45 €), Hellfest (Lucas
# 90 €) — 535 € in all. Plus a créance Lucas gave back in full, a dette (the
# petrol Tom paid, 280 €), a treasury advance of 800 € from the Livret A, and
# another user's créance.
Maggie\Core\Entity\User:
  test_user:
    email: finance-cushion-claims-test@example.com
    googleId: google-finance-cushion-claims-test
    name: Finance Cushion Claims Test User
  other_user:
    email: finance-cushion-claims-other@example.com
    googleId: google-finance-cushion-claims-other
    name: Someone Else

Maggie\Finance\Entity\Account:
  checking:
    name: Compte courant
    type: '<(Maggie\Finance\Enum\AccountType::Checking)>'
    currency: EUR
    balanceCents: 125000
    isCushion: false
    user: '@test_user'
  livret:
    name: Livret A
    type: '<(Maggie\Finance\Enum\AccountType::Savings)>'
    currency: EUR
    balanceCents: 520000
    isCushion: true
    user: '@test_user'

Maggie\Finance\Entity\SafetyCushion:
  cushion:
    targetMonths: 3
    monthlyNetIncomeCents: 250000
    rechargeCapCents: 15000
    rechargeTargetMonths: 6
    completedAt: null
    user: '@test_user'

