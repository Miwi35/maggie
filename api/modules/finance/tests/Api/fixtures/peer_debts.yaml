    direction: '<(Maggie\Finance\Enum\PeerDebtDirection::OwedToMe)>'
    object: Dîner au Phare
    originTransaction: '@dinner'
    user: '@test_user'
  others_debt:
    direction: '<(Maggie\Finance\Enum\PeerDebtDirection::OwedToMe)>'
    object: Pas le mien
    user: '@other_user'

Maggie\Finance\Entity\PeerDebtShare:
  dinner_tom:
    peerDebt: '@dinner_debt'
    contact: '@tom'
    amountCents: 6000
    repaidCents: 1000
  others_share:
