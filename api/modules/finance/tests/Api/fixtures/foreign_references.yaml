    label: Supermarché
    status: '<(Maggie\Finance\Enum\TransactionStatus::Spent)>'
    isExceptional: false
    user: '@test_user'
  other_purchase:
    account: '@other_checking'
    category: '@other_secret'
    amountCents: -1500
    currency: EUR
    bookedAt: '<(new \DateTimeImmutable("2026-07-02"))>'
    label: Cadeau surprise
    status: '<(Maggie\Finance\Enum\TransactionStatus::Spent)>'
    isExceptional: false
    user: '@other_user'
