# Allocating transfers to créances and dettes (MAG-453), shared by the API and
# MCP suites. Créances: the gîte de Crozon (Julie 200 €, Tom 200 €), Tom's
# birthday present (45 €), Hellfest (Lucas 90 €); a dette: the road trip
# petrol Tom paid (280 €). Transfers received from Julie (200 €), Tom (400 €)
# and Lucas (50 €), one sent to Tom (280 €), each recognised by its
# counterparty; an internal transfer, which is no transfer with a person.
Maggie\Core\Entity\User:
  test_user:
    email: finance-peer-allocations-test@example.com
    googleId: google-finance-peer-allocations-test
    name: Finance Peer Allocations Test User
  other_user:
    email: finance-peer-allocations-other@example.com
    googleId: google-finance-peer-allocations-other
    name: Someone Else

Maggie\Finance\Entity\Account:
  checking:
    name: Compte courant
    type: '<(Maggie\Finance\Enum\AccountType::Checking)>'
    currency: EUR
    balanceCents: 125000
    isCushion: false
    user: '@test_user'

Maggie\Finance\Entity\Category:
  travel:
    name: Voyages
    obligation: '<(Maggie\Finance\Enum\ObligationFlag::Optional)>'
    user: '@test_user'
  gifts:
    name: Virements reçus
    obligation: '<(Maggie\Finance\Enum\ObligationFlag::Optional)>'
    user: '@test_user'

Maggie\Finance\Entity\Envelope:
