    user: '@test_user'
  tom_in:
    account: '@checking'
    category: '@gifts'
    amountCents: 40000
    currency: EUR
    bookedAt: '<(new \DateTimeImmutable("2026-07-09"))>'
    label: VIR DE TOM MARTIN
    status: '<(Maggie\Finance\Enum\TransactionStatus::Spent)>'
    isExceptional: false
    user: '@test_user'
  lucas_in:
