    amountCents: 5000
    currency: EUR
    bookedAt: '<(new \DateTimeImmutable("2026-07-10"))>'
    label: VIR DE LUCAS
    status: '<(Maggie\Finance\Enum\TransactionStatus::Spent)>'
    isExceptional: false
    user: '@test_user'
  tom_out:
