# MAG-549's scenario: rentes of 340 €, a train de vie of 1 860 €, a declared
# income of 3 860 € and a complete cushion — a saving capacity of 2 000 € a
# month. Measured over the three-month sample: 558 000 / 3 = 1 860 €, 102 000 / 3 = 340 €.
# Another user's far bigger rentes and capacity prove the isolation.
Maggie\Core\Entity\User:
  test_user:
    email: finance-projection-test@example.com
    googleId: google-finance-projection-test
    name: Finance Projection Test User
  other_user:
    email: finance-projection-other@example.com
    googleId: google-finance-projection-other
    name: Finance Projection Other User

Maggie\Finance\Entity\SafetyCushion:
  cushion:
    targetMonths: 3
    monthlyNetIncomeCents: 386000
    rechargeCapCents: 15000
    rechargeTargetMonths: 6
    completedAt: null
    user: '@test_user'
  other_cushion:
    targetMonths: 3
    monthlyNetIncomeCents: 900000
    rechargeCapCents: 15000
    rechargeTargetMonths: 6
    completedAt: null
    user: '@other_user'

Maggie\Finance\Entity\Account:
  checking:
    name: Compte courant
    type: '<(Maggie\Finance\Enum\AccountType::Checking)>'
    currency: EUR
    balanceCents: 200000
    isCushion: false
    user: '@test_user'
  livret_a:
    name: Livret A
    type: '<(Maggie\Finance\Enum\AccountType::Savings)>'
    currency: EUR
    balanceCents: 2000000
    isCushion: true
    user: '@test_user'
  other_checking:
    name: Compte courant du voisin
    type: '<(Maggie\Finance\Enum\AccountType::Checking)>'
    currency: EUR
    balanceCents: 900000
    isCushion: false
    user: '@other_user'

Maggie\Finance\Entity\Category:
  food:
    name: Alimentation
    obligation: '<(Maggie\Finance\Enum\ObligationFlag::Mandatory)>'
    user: '@test_user'
  rent_income:
    name: Loyers perçus
    obligation: '<(Maggie\Finance\Enum\ObligationFlag::Income)>'
    passiveIncome: true
    user: '@test_user'
  other_rent_income:
    name: Loyers du voisin
    obligation: '<(Maggie\Finance\Enum\ObligationFlag::Income)>'
    passiveIncome: true
    user: '@other_user'
  other_food:
    name: Courses du voisin
    obligation: '<(Maggie\Finance\Enum\ObligationFlag::Mandatory)>'
    user: '@other_user'

Maggie\Finance\Entity\Transaction:
  groceries:
    account: '@checking'
    category: '@food'
    amountCents: -558000
    currency: EUR
    bookedAt: '<(new \DateTimeImmutable("first day of last month"))>'
    label: Train de vie
    status: '<(Maggie\Finance\Enum\TransactionStatus::Spent)>'
    isExceptional: false
    user: '@test_user'
  rent_in:
    account: '@checking'
    category: '@rent_income'
    amountCents: 102000
    currency: EUR
    bookedAt: '<(new \DateTimeImmutable("first day of last month"))>'
    label: Loyers
    status: '<(Maggie\Finance\Enum\TransactionStatus::Spent)>'
    isExceptional: false
    user: '@test_user'
  other_groceries:
    account: '@other_checking'
    category: '@other_food'
    amountCents: -30000
    currency: EUR
    bookedAt: '<(new \DateTimeImmutable("first day of last month"))>'
    label: Train de vie du voisin
    status: '<(Maggie\Finance\Enum\TransactionStatus::Spent)>'
    isExceptional: false
    user: '@other_user'
  other_rent_in:
    account: '@other_checking'
    category: '@other_rent_income'
    amountCents: 600000
    currency: EUR
    bookedAt: '<(new \DateTimeImmutable("first day of last month"))>'
    label: Loyer du voisin
    status: '<(Maggie\Finance\Enum\TransactionStatus::Spent)>'
    isExceptional: false
    user: '@other_user'

Maggie\Finance\Entity\Project:
  car:
    name: Voiture
    amountCents: 1000000
    currency: EUR
    position: 0
    user: '@test_user'
