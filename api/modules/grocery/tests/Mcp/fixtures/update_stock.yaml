Maggie\Core\Entity\User:
  test_user:
    email: grocery-test@example.com
    googleId: google-grocery-test
    name: Grocery Test User
  other_user:
    email: other-grocery@example.com
    googleId: google-other-grocery
    name: Other Grocery User

Maggie\Grocery\Entity\Store:
  supermarket:
    name: Supermarché
    visitOrder: 1
    user: '@test_user'

Maggie\Grocery\Entity\Product:
  rice:
    name: Riz
    category: '<(Maggie\Grocery\Enum\ProductCategory::Grain)>'
    user: '@test_user'
    preferredStore: '@supermarket'
    packagingUnit: '<(Maggie\Grocery\Enum\Unit::Pack)>'
    packagingSize: 500
    packagingSizeUnit: '<(Maggie\Grocery\Enum\Unit::Gram)>'
    restockQuantity: 2
    autoRestock: true
  salt:
    name: Sel
    category: '<(Maggie\Grocery\Enum\ProductCategory::Other)>'
    user: '@test_user'
    autoRestock: true
  rice_noodles:
    name: Nouilles de riz
    category: '<(Maggie\Grocery\Enum\ProductCategory::Grain)>'
    user: '@test_user'
  other_rice:
    name: Riz
    category: '<(Maggie\Grocery\Enum\ProductCategory::Grain)>'
    user: '@other_user'
    packagingUnit: '<(Maggie\Grocery\Enum\Unit::Pack)>'
    restockQuantity: 5
    autoRestock: true

Maggie\Cookbook\Entity\Ingredient:
  couscous_vegetables:
    name: Légumes pour couscous
    category: '<(Maggie\Grocery\Enum\ProductCategory::Produce)>'
    user: '@test_user'
    packagingUnit: '<(Maggie\Grocery\Enum\Unit::Jar)>'

Maggie\Cookbook\Entity\Recipe:
  couscous:
    name: Couscous
    servings: 4
    tags: ['plat']
    user: '@test_user'

Maggie\Cookbook\Entity\RecipeIngredient:
  ri_couscous_vegetables:
    recipe: '@couscous'
    ingredient: '@couscous_vegetables'
    quantity: 1
    unit: '<(Maggie\Grocery\Enum\Unit::Jar)>'
