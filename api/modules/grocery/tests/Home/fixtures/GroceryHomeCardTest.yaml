  carbonara_pasta:
    recipe: '@carbonara'
    ingredient: '@pasta'
    quantity: 400
    unit: '<(Maggie\Grocery\Enum\Unit::Gram)>'
  carbonara_cream:
    recipe: '@carbonara'
    ingredient: '@cream'
    quantity: 10
    unit: '<(Maggie\Grocery\Enum\Unit::Centiliter)>'

Maggie\Cookbook\Entity\Meal:
  dinner_today:
    summary: 'Dîner : Gratin'
    slot: '<(Maggie\Cookbook\Enum\MealSlot::Dinner)>'
    date: '<(new \DateTimeImmutable("2026-10-14"))>'
