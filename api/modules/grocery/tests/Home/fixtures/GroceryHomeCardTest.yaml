Maggie\Core\Entity\User:
  test_user:
    email: grocery-home@example.com
    googleId: google-grocery-home
    name: Grocery Home User
  other_user:
    email: grocery-home-other@example.com
    googleId: google-grocery-home-other
    name: Grocery Home Other

Maggie\Grocery\Entity\Store:
  supermarket:
    name: Supermarché
    visitOrder: 1
    user: '@test_user'
  greengrocer:
    name: Primeur
    visitOrder: 2
    user: '@test_user'

Maggie\Grocery\Entity\Aisle:
  fruits:
    store: '@supermarket'
    name: Fruits et légumes
    position: 1
    user: '@test_user'
  dairy:
    store: '@supermarket'
    name: Crèmerie
    position: 2
    user: '@test_user'

Maggie\Cookbook\Entity\Ingredient:
  apples:
    name: Pommes
    category: '<(Maggie\Grocery\Enum\ProductCategory::Produce)>'
    user: '@test_user'
  butter:
    name: Beurre
    category: '<(Maggie\Grocery\Enum\ProductCategory::Dairy)>'
    user: '@test_user'
  parmesan:
    name: Parmesan
    category: '<(Maggie\Grocery\Enum\ProductCategory::Dairy)>'
    stockState: '<(Maggie\Grocery\Enum\ProductStockState::Low)>'
    user: '@test_user'
  cream:
    name: Crème fraîche
    category: '<(Maggie\Grocery\Enum\ProductCategory::Dairy)>'
    stockState: '<(Maggie\Grocery\Enum\ProductStockState::Out)>'
    user: '@test_user'
  flour:
    name: Farine
    category: '<(Maggie\Grocery\Enum\ProductCategory::Grain)>'
    user: '@test_user'
  pasta:
    name: Pâtes
    category: '<(Maggie\Grocery\Enum\ProductCategory::Grain)>'
    stockState: '<(Maggie\Grocery\Enum\ProductStockState::Out)>'
    user: '@test_user'

Maggie\Grocery\Entity\ProductAisle:
  apples_fruits:
    __construct: ['@apples', '@fruits']
  butter_dairy:
    __construct: ['@butter', '@dairy']

Maggie\Grocery\Entity\GroceryList:
  grocery_list:
    user: '@test_user'
  other_list:
    user: '@other_user'

Maggie\Grocery\Entity\GroceryItem:
  item_butter:
    groceryList: '@grocery_list'
    product: '@butter'
    checked: false
    source: '<(Maggie\Grocery\Enum\GroceryItemSource::Manual)>'
    store: '@supermarket'
    position: 1
  item_apples:
    groceryList: '@grocery_list'
    product: '@apples'
    quantity: 6
    unit: '<(Maggie\Grocery\Enum\Unit::Piece)>'
    checked: false
    source: '<(Maggie\Grocery\Enum\GroceryItemSource::Manual)>'
    store: '@supermarket'
    position: 2
  item_bread:
    groceryList: '@grocery_list'
    customLabel: Pain
    checked: false
    source: '<(Maggie\Grocery\Enum\GroceryItemSource::Manual)>'
    store: '@supermarket'
    position: 3
  item_salt:
    groceryList: '@grocery_list'
    customLabel: Sel
    needed: [{quantity: 300, unit: g}]
    checked: false
    source: '<(Maggie\Grocery\Enum\GroceryItemSource::Manual)>'
    store: '@supermarket'
    position: 4
  item_sugar:
    groceryList: '@grocery_list'
    customLabel: Sucre
    checked: false
    source: '<(Maggie\Grocery\Enum\GroceryItemSource::Manual)>'
    store: '@supermarket'
    position: 5
  item_coffee:
    groceryList: '@grocery_list'
    customLabel: Café
    checked: false
    source: '<(Maggie\Grocery\Enum\GroceryItemSource::Manual)>'
    store: '@supermarket'
    position: 6
  item_radish:
    groceryList: '@grocery_list'
    customLabel: Radis
    checked: false
    source: '<(Maggie\Grocery\Enum\GroceryItemSource::Manual)>'
    store: '@greengrocer'
    position: 7
  item_batteries:
    groceryList: '@grocery_list'
    customLabel: Piles
    checked: false
    source: '<(Maggie\Grocery\Enum\GroceryItemSource::Manual)>'
    position: 8
  item_milk_checked:
    groceryList: '@grocery_list'
    customLabel: Lait
    checked: true
    source: '<(Maggie\Grocery\Enum\GroceryItemSource::Manual)>'
    store: '@supermarket'
    position: 9
  item_tree_deferred:
    groceryList: '@grocery_list'
    customLabel: Sapin
    buyAfter: '<(new \DateTimeImmutable("2026-12-20"))>'
    checked: false
    source: '<(Maggie\Grocery\Enum\GroceryItemSource::Manual)>'
    store: '@supermarket'
    position: 10
  item_other_users:
    groceryList: '@other_list'
    customLabel: Secret
    checked: false
    source: '<(Maggie\Grocery\Enum\GroceryItemSource::Manual)>'
    position: 1

Maggie\Calendar\Entity\Agenda:
  meals_agenda:
    name: Repas
    module: cookbook
    color: '#FF6B35'
    user: '@test_user'

Maggie\Cookbook\Entity\Recipe:
