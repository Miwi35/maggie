    name: Gratin
    servings: 4
    tags: ['plat']
    user: '@test_user'
  tart:
    name: Tarte
    servings: 4
    tags: ['plat']
    user: '@test_user'
  carbonara:
    name: Pâtes à la crème
    servings: 4
    tags: ['plat']
    user: '@test_user'

Maggie\Cookbook\Entity\RecipeIngredient:
