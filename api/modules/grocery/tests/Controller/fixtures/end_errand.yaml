Maggie\Core\Entity\User:
  test_user:
    email: end-errand-test@example.com
    googleId: google-end-errand-test
    name: End Errand Test User

Maggie\Grocery\Entity\Store:
  store_lidl:
    name: Lidl
    visitOrder: 1
