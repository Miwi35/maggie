Maggie\Core\Entity\User:
  test_user:
    email: grocery-handler-test@example.com
    googleId: google-grocery-handler-test
    name: Grocery Handler Test User
  other_user:
    email: grocery-other-user@example.com
    googleId: google-grocery-other-user
    name: Grocery Other User

Maggie\Grocery\Entity\Store:
  halles:
    name: Halles du voisin
    visitOrder: 1
    user: '@test_user'
  bio:
    name: Biocoop
    visitOrder: 2
    user: '@test_user'
  other_user_store:
    name: Magasin d'un autre
    visitOrder: 1
    user: '@other_user'

Maggie\Grocery\Entity\Product:
  product:
    name: Riz
    category: '<(Maggie\Grocery\Enum\ProductCategory::Other)>'
    defaultUnit: '<(Maggie\Grocery\Enum\Unit::Kilogram)>'
    user: '@test_user'
  product_with_stores:
    name: Câpres
    category: '<(Maggie\Grocery\Enum\ProductCategory::Other)>'
    user: '@test_user'
    preferredStore: '@halles'
    fallbackStore: '@bio'
    shelfLifeDays: 30
  product_in_lists:
    name: Lentilles
    category: '<(Maggie\Grocery\Enum\ProductCategory::Other)>'
    user: '@test_user'

Maggie\Grocery\Entity\GroceryList:
  grocery_list:
    user: '@test_user'

Maggie\Grocery\Entity\GroceryItem:
  grocery_item_from_product:
    groceryList: '@grocery_list'
    product: '@product_in_lists'
    quantity: 2
    source: '<(Maggie\Grocery\Enum\GroceryItemSource::Manual)>'
    position: 1
  grocery_item_with_label:
    groceryList: '@grocery_list'
    product: '@product_in_lists'
    customLabel: Lentilles corail
    source: '<(Maggie\Grocery\Enum\GroceryItemSource::Manual)>'
    position: 2

Maggie\Grocery\Entity\RecurringGroceryItem:
  recurring_from_product:
    product: '@product_in_lists'
    frequency: '<(Maggie\Grocery\Enum\RecurringFrequency::Weekly)>'
    user: '@test_user'
