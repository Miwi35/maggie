security:
    providers:
        app_user_provider:
            entity:
                class: Maggie\Core\Entity\User
                property: email

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false
        auth:
            pattern: ^/api/auth
            stateless: true
            security: false
        google_webhook:
            pattern: ^/api/calendar/google/webhook
            stateless: true
            security: false
        token_refresh:
            pattern: ^/api/token/(refresh|invalidate)$
            stateless: true
            refresh_jwt:
                check_path: /api/token/refresh
            # Signing out deletes the refresh token and clears its cookie; the
            # bundle's listener on this firewall does both, with no JWT needed.
            logout:
                path: api_token_invalidate
        bank_callback:
            # The user comes back from their bank carrying no token of ours.
            # What authenticates the answer is the single-use state we handed
            # the bank, checked in the controller.
            pattern: ^/api/finance/bank-callback
            stateless: true
            security: false
        api:
            pattern: ^/api
            stateless: true
            jwt: ~

    access_control:
        - { path: ^/api/auth, roles: PUBLIC_ACCESS }
        - { path: ^/api/token/(refresh|invalidate)$, roles: PUBLIC_ACCESS }
        - { path: ^/api/calendar/google/webhook, roles: PUBLIC_ACCESS }
        - { path: ^/api/finance/bank-callback, roles: PUBLIC_ACCESS }
        - { path: ^/api/docs, roles: PUBLIC_ACCESS }
        - { path: ^/api/contexts, roles: PUBLIC_ACCESS }
        - { path: ^/api$, roles: PUBLIC_ACCESS }
        - { path: ^/api/, roles: ROLE_USER }
