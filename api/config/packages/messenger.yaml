framework:
    messenger:
        failure_transport: failed
        default_bus: messenger.bus.default

        buses:
            messenger.bus.default:
                middleware:
                    - 'Maggie\Core\Projection\ProjectionMiddleware'
            # Business events: handled on the spot, and an event nobody listens to is fine.
            event.bus:
                default_middleware:
                    allow_no_handlers: true

        transports:
            async: '%env(MESSENGER_TRANSPORT_DSN)%'
            failed: 'doctrine://default?queue_name=failed'
            sync: 'sync://'

        routing:
            'Maggie\Calendar\Message\CreateEventCommand': sync
