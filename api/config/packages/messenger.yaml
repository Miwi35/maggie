framework:
    messenger:
        failure_transport: failed

        buses:
            messenger.bus.default:
                middleware:
                    - 'Maggie\Core\Mercure\Middleware\MercurePublishMiddleware'
                    - 'Maggie\Core\Elasticsearch\Middleware\ElasticsearchIndexMiddleware'

        transports:
            async: '%env(MESSENGER_TRANSPORT_DSN)%'
            failed: 'doctrine://default?queue_name=failed'
            sync: 'sync://'

        routing:
            'Maggie\Calendar\Message\CreateEventCommand': sync
            'Maggie\Calendar\Message\UpdateEventCommand': sync
            'Maggie\Calendar\Message\DeleteEventCommand': sync
            'Maggie\Calendar\Message\CreateAgendaCommand': sync
            'Maggie\Calendar\Message\UpdateAgendaCommand': sync
            'Maggie\Calendar\Message\DeleteAgendaCommand': sync
            'Maggie\Calendar\Message\CreateTaskCommand': sync
