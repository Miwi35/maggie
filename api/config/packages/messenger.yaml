when@test:
    framework:
        messenger:
            transports:
                async: 'in-memory://'
                # The dashboard rebuild queued by every finance write, apart from `async`:
                # tests that assert what that transport holds do not see it.
                dashboard: 'in-memory://'
            # Production indexes inside the request; tests assert the dispatch instead.
            routing:
                'Maggie\Finance\Message\RefreshFinanceDashboardCommand': dashboard
                'Maggie\Core\Elasticsearch\Message\IndexDocumentCommand': async
                'Maggie\Core\Elasticsearch\Message\DeleteDocumentCommand': async
