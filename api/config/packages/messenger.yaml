            'Maggie\Calendar\Message\DeleteTaskCommand': sync
            'Maggie\Calendar\Message\PushEventToGoogleCommand': sync
            'Maggie\Calendar\Message\DeleteEventFromGoogleCommand': sync
            'Maggie\Calendar\Message\PullFromGoogleCommand': async
            'Maggie\Calendar\Message\PushTaskToGoogleCommand': sync
            'Maggie\Calendar\Message\DeleteTaskFromGoogleCommand': sync
            'Maggie\Calendar\Message\PullTasksFromGoogleCommand': async
            'Maggie\Core\Message\UpdateUserCommand': sync
            'Maggie\Core\Message\UpdateUserPreferenceCommand': sync
            'Maggie\Notification\Message\CreateNotificationCommand': sync
            'Maggie\Notification\Message\MarkNotificationReadCommand': sync
            'Maggie\Notification\Message\DeleteNotificationCommand': sync
            'Maggie\Notification\Message\RegisterDeviceTokenCommand': sync
            'Maggie\Notification\Message\UnregisterDeviceTokenCommand': sync
            'Maggie\Notification\Message\SendPushNotificationCommand': async
            'Maggie\Grocery\Message\CreateProductCommand': sync
            'Maggie\Grocery\Message\UpdateProductCommand': sync
            'Maggie\Grocery\Message\DeleteProductCommand': sync
            'Maggie\Cookbook\Message\CreateIngredientCommand': sync
            'Maggie\Cookbook\Message\UpdateIngredientCommand': sync
            'Maggie\Cookbook\Message\DeleteIngredientCommand': sync
            'Maggie\Cookbook\Message\CreateRecipeCommand': sync
            'Maggie\Cookbook\Message\UpdateRecipeCommand': sync
            'Maggie\Cookbook\Message\DeleteRecipeCommand': sync
            'Maggie\Cookbook\Message\CreateMealCommand': sync
            'Maggie\Cookbook\Message\UpdateMealCommand': sync
            'Maggie\Cookbook\Message\DeleteMealCommand': sync
            'Maggie\Cookbook\Message\ChooseMealGroceriesCommand': sync
            'Maggie\Cookbook\Message\GenerateGroceryListCommand': sync
            'Maggie\Grocery\Message\AddGroceryItemCommand': sync
            'Maggie\Grocery\Message\RestockProductCommand': sync
            'Maggie\Grocery\Message\CheckGroceryItemCommand': sync
            'Maggie\Grocery\Message\EndErrandCommand': sync
            'Maggie\Grocery\Message\MoveToFallbackCommand': sync
            'Maggie\Grocery\Message\RemoveGroceryItemCommand': sync
            'Maggie\Grocery\Message\EditGroceryItemCommand': sync
            'Maggie\Grocery\Message\ReorderGroceryItemsCommand': sync
            'Maggie\Grocery\Message\CreateStoreCommand': sync
            'Maggie\Grocery\Message\UpdateStoreCommand': sync
            'Maggie\Grocery\Message\DeleteStoreCommand': sync
            'Maggie\Grocery\Message\CreateRecurringGroceryItemCommand': sync
            'Maggie\Grocery\Message\UpdateRecurringGroceryItemCommand': sync
            'Maggie\Grocery\Message\DeleteRecurringGroceryItemCommand': sync
            'Maggie\Finance\Message\CreateAccountCommand': sync
            'Maggie\Finance\Message\UpdateAccountCommand': sync
            'Maggie\Finance\Message\DeleteAccountCommand': sync
