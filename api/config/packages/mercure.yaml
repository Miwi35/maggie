mercure:
    hubs:
        default:
            url: '%env(MERCURE_URL)%'
            public_url: '%env(MERCURE_PUBLIC_URL)%'
            jwt:
                # The bundle's `secret` signs the 0.x `mercure.publish` claim, which
                # a 1.0 hub refuses (401): the provider mints the OAuth 2.0 token.
                provider: 'Maggie\Core\Mercure\MercurePublisherTokenProvider'
