# The world the recorded responses are taken from.
#
# Deliberately small and deliberately not round: a nullable field left null
# everywhere, or an amount of zero, records a response that proves nothing
# about how the clients read a real one. Every optional field is filled at
# least once across the set.

Maggie\Core\Entity\User:
  recorded_user:
    email: recorded@example.com
    googleId: google-recorded
    name: Recorded User

Maggie\Core\Entity\UserPreference:
  recorded_preference:
    user: '@recorded_user'
    theme: dark
    locale: en
    timezone: Europe/Lisbon
    defaultCalendarView: week
    defaultCity: Rennes
    enabledAgendaIds: ['01JAAAAAAAAAAAAAAAAAAAAAAA']
    notificationsEnabled: false

Maggie\Calendar\Entity\Agenda:
  recorded_agenda:
    name: Recorded Agenda
    description: The agenda the recorded events belong to
    color: '#336699'
    isDefault: true
    googleCalendarId: recorded@group.calendar.google.com
    user: '@recorded_user'

  recorded_maggie_agenda:
    name: Maggie
    color: '#7C4DFF'
    module: agent
    user: '@recorded_user'

Maggie\Calendar\Entity\Event:
  recorded_event:
    summary: Recorded event
    description: An event with every optional field filled
    location: Lisbon
    startAt: '<(new \DateTimeImmutable("2026-03-15 10:00"))>'
    endAt: '<(new \DateTimeImmutable("2026-03-15 11:00"))>'
    # Every optional field means the reminders too, now that a client sets them
    # (MAG-121): what a client reads back has to carry the shape it wrote.
    reminders:
      useDefault: false
      overrides:
        - { method: 'popup', minutes: 30 }
    agenda: '@recorded_agenda'

  recorded_recurring_event:
    summary: Recorded recurring event
    startAt: '<(new \DateTimeImmutable("2026-03-01 08:00"))>'
    endAt: '<(new \DateTimeImmutable("2026-03-01 08:30"))>'
    rrule: 'FREQ=WEEKLY;BYDAY=MO'
    agenda: '@recorded_agenda'

  # The only all-day member of the recording: a client's startDate/endDate are
  # proved by it, now that the meal no longer sits in the events collection.
  recorded_all_day_event:
    summary: Recorded all-day event
    allDay: true
    startDate: '<(new \DateTimeImmutable("2026-03-12"))>'
    endDate: '<(new \DateTimeImmutable("2026-03-13"))>'
    agenda: '@recorded_agenda'

  recorded_exception_event:
    summary: Recorded recurring event
    startAt: '<(new \DateTimeImmutable("2026-03-09 09:00"))>'
    endAt: '<(new \DateTimeImmutable("2026-03-09 09:30"))>'
    recurringEvent: '@recorded_recurring_event'
    originalStartAt: '<(new \DateTimeImmutable("2026-03-09 08:00"))>'
    agenda: '@recorded_agenda'

Maggie\Calendar\Entity\Task:
  recorded_open_task:
    title: Recorded open task
    description: A task with a due date and no completion
    priority: '<(Maggie\Calendar\Enum\TaskPriority::High)>'
    criticality: '<(Maggie\Calendar\Enum\TaskCriticality::High)>'
    dueDate: '<(new \DateTimeImmutable("2026-03-20 10:00"))>'
    position: '00000000000000000000'
    estimatedMinutes: 20
    firstStep: Ouvrir le dossier
    user: '@recorded_user'

  # A subtask as Google sends one (MAG-404): its parent, its place, a link.
  recorded_subtask:
    title: Recorded subtask
    priority: '<(Maggie\Calendar\Enum\TaskPriority::Medium)>'
    criticality: '<(Maggie\Calendar\Enum\TaskCriticality::Low)>'
    parent: '@recorded_open_task'
    position: '00000000000000000001'
    links: [{type: email, description: 'Le mail du déménageur', link: 'https://mail.google.com/mail/#all/abc'}]
    user: '@recorded_user'

  # Open, undated, in no slot: the day's reserve (MAG-497).
  recorded_reserve_task:
    title: Recorded reserve task
    priority: '<(Maggie\Calendar\Enum\TaskPriority::Medium)>'
    criticality: '<(Maggie\Calendar\Enum\TaskCriticality::Low)>'
    position: '00000000000000000002'
    user: '@recorded_user'

  recorded_done_task:
    title: Recorded completed task
    priority: '<(Maggie\Calendar\Enum\TaskPriority::Low)>'
    criticality: '<(Maggie\Calendar\Enum\TaskCriticality::Low)>'
    completedAt: '<(new \DateTimeImmutable("2026-03-19 10:00"))>'
    user: '@recorded_user'

Maggie\Cookbook\Entity\RecipeIngredient:
  recorded_recipe_line:
    recipe: '@recorded_recipe'
    ingredient: '@recorded_ingredient'
    quantity: 200.0
    unit: '<(Maggie\Grocery\Enum\Unit::Gram)>'

Maggie\Cookbook\Entity\Utensil:
  recorded_utensil:
    name: Recorded Utensil
    user: '@recorded_user'

Maggie\Cookbook\Entity\Recipe:
  recorded_recipe:
    name: Recorded Recipe
    servings: 2
    tags: ['quick', 'vegetarian']
    notes: The notes the client renders
    user: '@recorded_user'
    utensils: ['@recorded_utensil']

Maggie\Cookbook\Entity\RecipeStep:
  recorded_step_first:
    recipe: '@recorded_recipe'
    position: 1
    text: The first step the client renders
    utensils: ['@recorded_utensil']
  recorded_step_second:
    recipe: '@recorded_recipe'
    position: 2
    text: The second step, run in the background
    durationMinutes: 12
    background: true
    ingredients: ['@recorded_ingredient']
    waitsFor: ['@recorded_step_first']

Maggie\Calendar\Entity\Proaction:
  recorded_proaction:
    prompt: Recorded proaction prompt
    summary: Recorded proaction
    startAt: '<(new \DateTimeImmutable("2026-03-17 08:30"))>'
    endAt: '<(new \DateTimeImmutable("2026-03-17 08:35"))>'
    agenda: '@recorded_maggie_agenda'
    __calls:
      - markCompleted: ['Recorded answer', '<(new \DateTimeImmutable("2026-03-17 08:31"))>']

  # The failed one carries `error`, which the completed one leaves out.
  recorded_failed_proaction:
    prompt: Recorded failed proaction prompt
    summary: Recorded failed proaction
    startAt: '<(new \DateTimeImmutable("2026-03-17 18:00"))>'
    endAt: '<(new \DateTimeImmutable("2026-03-17 18:05"))>'
    agenda: '@recorded_maggie_agenda'
    __calls:
      - markFailed: ['Recorded error', '<(new \DateTimeImmutable("2026-03-17 18:01"))>']

Maggie\Cookbook\Entity\Meal:
  recorded_meal:
    summary: Recorded meal
    # The owner's own title (MAG-378): the mobile DTO declares it, so the recording must carry it.
    customTitle: Recorded meal
    slot: '<(Maggie\Cookbook\Enum\MealSlot::Dinner)>'
    # A day and a slot, no time (MAG-251): the instants are derived from it.
    date: '<(new \DateTimeImmutable("2026-03-16"))>'
    agenda: '@recorded_agenda'
    recipes: ['@recorded_recipe']

Maggie\Grocery\Entity\Store:
  recorded_store:
    name: Recorded Store
    description: The shop the recorded products are bought at
    visitOrder: 2
    user: '@recorded_user'

  recorded_fallback_store:
    name: Recorded Fallback Store
    visitOrder: 9
    user: '@recorded_user'

Maggie\Grocery\Entity\Product:
  recorded_product:
    name: Recorded Product
    category: '<(Maggie\Grocery\Enum\ProductCategory::Produce)>'
    defaultUnit: '<(Maggie\Grocery\Enum\Unit::Gram)>'
    preferredStore: '@recorded_store'
    fallbackStore: '@recorded_fallback_store'
    shelfLifeDays: 5
    packagingUnit: '<(Maggie\Grocery\Enum\Unit::Pack)>'
    packagingSize: 500
    packagingSizeUnit: '<(Maggie\Grocery\Enum\Unit::Gram)>'
    restockQuantity: 2
    # The recording runs in April: in season, so inSeason is recorded too.
    seasonMonths: [4, 5, 6]
    kcalPer100g: 52.0
    proteinPer100g: 0.3
    carbsPer100g: 14.0
    fatPer100g: 0.2
    user: '@recorded_user'

Maggie\Cookbook\Entity\Ingredient:
