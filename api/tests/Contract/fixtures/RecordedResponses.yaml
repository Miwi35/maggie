    category: '<(Maggie\Grocery\Enum\ProductCategory::Grain)>'
    defaultUnit: '<(Maggie\Grocery\Enum\Unit::Kilogram)>'
    ciqualAlimCode: '9810'
    # Out of season in April: inSeason is recorded as false.
    seasonMonths: [9, 10]
    kcalPer100g: 340.0
    proteinPer100g: 12.5
    carbsPer100g: 71.0
    fatPer100g: 1.5
    user: '@recorded_user'

Maggie\Grocery\Entity\Aisle:
