# The world of the project planning recording (MAG-526), read on 2026-10-21:
# a complete cushion, 800 € of savings outside it, a net capacity of 500 €/month,
# a move with a fixed date, a sofa waiting for it, a car part-paid by a projected
# loan and a trip whose deadline the queue cannot keep. Its own file: the other
# recordings must not see these projects.
Maggie\Core\Entity\User:
  planning_user:
    email: recorded-planning@example.com
    googleId: google-recorded-planning
    name: Recorded Planning User

Maggie\Finance\Entity\SafetyCushion:
  planning_cushion:
    targetMonths: 3
    monthlyNetIncomeCents: 50000
    rechargeCapCents: 15000
    rechargeTargetMonths: 6
    completedAt: '<(new \DateTimeImmutable("2026-01-10"))>'
    user: '@planning_user'

Maggie\Finance\Entity\Account:
  planning_livret:
    name: Livret jeune
    bank: Recorded Bank
    type: '<(Maggie\Finance\Enum\AccountType::Savings)>'
    currency: EUR
    balanceCents: 80000
    isCushion: false
    user: '@planning_user'
  planning_cushion_account:
    name: Livret A
    bank: Recorded Bank
    type: '<(Maggie\Finance\Enum\AccountType::Savings)>'
    currency: EUR
    balanceCents: 150000
    isCushion: true
    user: '@planning_user'

Maggie\Finance\Entity\Loan:
  planning_car_loan:
    name: Voiture · emprunt
    principalRemainingCents: 1000000
    monthlyPaymentCents: 43425
    annualRateBasisPoints: 400
    durationMonths: 24
    projected: true
    user: '@planning_user'

Maggie\Finance\Entity\Project:
