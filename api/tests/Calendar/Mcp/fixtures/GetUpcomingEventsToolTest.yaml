Maggie\Calendar\Entity\Agenda:
  test_agenda:
    name: Test
    isDefault: true

Maggie\Calendar\Entity\Event:
  event_tomorrow:
    summary: Tomorrow meeting
    startAt: '<(new \DateTimeImmutable("tomorrow 10:00"))>'
    endAt: '<(new \DateTimeImmutable("tomorrow 11:00"))>'
    agenda: '@test_agenda'

  event_far_future:
    summary: Far away
    startAt: '<(new \DateTimeImmutable("+60 days 10:00"))>'
    endAt: '<(new \DateTimeImmutable("+60 days 11:00"))>'
    agenda: '@test_agenda'

  event_cancelled:
    summary: Cancelled
    startAt: '<(new \DateTimeImmutable("tomorrow 14:00"))>'
    endAt: '<(new \DateTimeImmutable("tomorrow 15:00"))>'
    status: '<(Maggie\Calendar\Entity\EventStatus::Cancelled)>'
    agenda: '@test_agenda'
