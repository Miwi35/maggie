# The account every e2e journey signs in as, and a second one that exists only
# to prove nothing leaks between users.
#
# Loaded by app:e2e:seed, in file-name order — everything below depends on this
# user, so it has to come first.
#
# Dates come from <e2eDate(...)>, never from date() or a literal: see
# Maggie\Core\E2e\Fixture\E2eDateProvider for why.

Maggie\Core\Entity\User:
    e2e_user:
        email: 'e2e@maggie.local'
        googleId: 'e2e-google-id'
        name: 'Camille Test'
        avatar: 'https://example.invalid/avatar.png'
        # Placeholder Google credentials. They authenticate nothing — WireMock
        # checks no signature — but without them the Google sync has no user to
        # run for, and the smoke journey could not prove the redirect holds.
        googleAccessToken: 'e2e-google-access-token'
        googleRefreshToken: 'e2e-google-refresh-token'
        # NOT anchored, deliberately. This date is compared against the real
        # clock, not against the anchor: Google's client library refreshes an
        # expired token by calling oauth2.googleapis.com directly, an URL no
        # base URL redirects. Anchored, a run with --now in the past would let
        # the e2e stack reach the real internet and fail on "invalid_client".
        # Anything measured against wall-clock time belongs here, not in
        # <e2eDate()>.
        googleTokenExpiresAt: '<(new \DateTimeImmutable("2099-01-01T00:00:00+00:00"))>'
        googleTaskListId: 'e2e-task-list'

    # The neighbour. Journeys never sign in as this account: it is here so the
    # harness can prove that what one user does never reaches another —
    # Mercure topics scoped per user (MAG-93, b333376 and c2d3758), and reads
    # filtered by user everywhere else. You cannot demonstrate isolation with a
    # single account, and a second one invented at runtime would not be
    # deterministic.
    #
    # It owns an agenda, an event and a task (20-calendar.yaml), and nothing
    # else. MAG-114 found several agenda reads that forgot the user filter, so
    # the isolation journey needs something of theirs that *would* show up in
    # the signed-in user's day if a query dropped its `WHERE user`. Everything
    # beyond that stays empty: data no journey reads would only be one more
    # count to keep.
    #
    # No Google credentials on purpose: nothing syncs for this user, and a
    # token here would give the Google journeys a second candidate to pick up.
    e2e_other_user:
        email: 'e2e-other@maggie.local'
        googleId: 'e2e-other-google-id'
        name: 'Dominique Voisin'

Maggie\Core\Entity\UserPreference:
    e2e_user_preference:
        user: '@e2e_user'
        theme: 'light'
        locale: 'fr'
        timezone: 'Europe/Paris'
        defaultCalendarView: 'week'
        notificationsEnabled: true

    # Its own row, so the neighbour's settings page renders instead of hanging
    # on a preference the API would have to create on first write.
    e2e_other_user_preference:
        user: '@e2e_other_user'
        theme: 'light'
        locale: 'fr'
        timezone: 'Europe/Paris'
        defaultCalendarView: 'week'
        notificationsEnabled: true
