# The account every e2e journey signs in as, and a second one that exists only
# to prove nothing leaks between users.
#
# Loaded by app:e2e:seed, in file-name order — everything below depends on this
# user, so it has to come first.
#
# Dates come from <e2eDate(...)>, never from date() or a literal: see
# Maggie\Core\E2e\Fixture\E2eDateProvider for why.

Maggie\Core\Entity\User:
    e2e_user:
        email: 'e2e@maggie.local'
        googleId: 'e2e-google-id'
        name: 'Camille Test'
        avatar: 'https://example.invalid/avatar.png'
        # Placeholder Google credentials. They authenticate nothing — WireMock
        # checks no signature — but without them the Google sync has no user to
        # run for, and the smoke journey could not prove the redirect holds.
        googleAccessToken: 'e2e-google-access-token'
        googleRefreshToken: 'e2e-google-refresh-token'
        # NOT anchored, deliberately. This date is compared against the real
        # clock, not against the anchor: Google's client library refreshes an
        # expired token by calling oauth2.googleapis.com directly, an URL no
        # base URL redirects. Anchored, a run with --now in the past would let
        # the e2e stack reach the real internet and fail on "invalid_client".
        # Anything measured against wall-clock time belongs here, not in
        # <e2eDate()>.
        googleTokenExpiresAt: '<(new \DateTimeImmutable("2099-01-01T00:00:00+00:00"))>'
        googleTaskListId: 'e2e-task-list'

    # The neighbour. Journeys never sign in as this account: it is here so the
    # harness can prove that what one user does never reaches another —
    # Mercure topics scoped per user (MAG-93, b333376 and c2d3758), and reads
    # filtered by user everywhere else. You cannot demonstrate isolation with a
    # single account, and a second one invented at runtime would not be
    # deterministic.
    #
    # It owns an agenda, an event and a task (20-calendar.yaml), a recipe, an
    # ingredient and a meal (30-grocery, 40-cookbook), and a grocery list of
    # its own. MAG-114 found several agenda reads that forgot the user filter,
    # so the isolation journey needs something of theirs that *would* show up in
    # the signed-in user's day if a query dropped its `WHERE user`. Everything
    # beyond that stays empty: data no journey reads would only be one more
    # count to keep.
    #
    # The second account also became **the shopper** (MAG-101), and that is a
    # deliberate second job rather than drift. Two promises of the grocery
    # journeys cannot be kept on a list anybody else writes to:
    #
    #   "this write published"  every writer publishes the *whole* list on one
    #                           topic, so a payload showing the new state proves
    #                           nothing about who published it — another
    #                           worker's add would satisfy the assertion with
    #                           the middleware mute, which is `afc1a70` all over
    #                           again.
    #   "the errand is over"    ending one deletes *every* ticked line on the
    #                           list, so a file that ticks cannot share one.
    #
    # The same reasoning covers the chat: `GET /agent/messages` is scoped to the
    # user and returns the last twenty, and `chat.spec.ts` says in so many words
    # that six more exchanges would push its own question off the page. So the
    # journeys that talk to Maggie about groceries talk to her as this account,
    # and the owner's history stays exactly as that file expects.
    #
    # `cookbook-isolation.spec.ts` still reads this account as the neighbour,
    # and that is unaffected: it asserts on rows *by name*, so extra rows of
    # theirs change nothing.
    #
    # No Google credentials on purpose: nothing syncs for this user, and a
    # token here would give the Google journeys a second candidate to pick up.
    e2e_other_user:
        email: 'e2e-other@maggie.local'
        googleId: 'e2e-other-google-id'
        name: 'Dominique Voisin'

    # Maggie's interruptions (MAG-311). One covers the whole screen of every
    # window its user has open, and the journey publishes it to the user rather
    # than to a test: on an account another file drives at the same time, it
    # pops over that file's clicks. So this account is for that journey alone,
    # and owns nothing else.
    e2e_interrupt_user:
        email: 'e2e-interrupt@maggie.local'
        googleId: 'e2e-interrupt-google-id'
        name: 'Alix Veilleuse'

    # The stock journey (MAG-294). Telling Maggie « presque plus de riz » puts a
    # line on the grocery list and publishes it, and talking to her adds to the
    # chat history: on the owner's account that pushes `chat.spec.ts` off its
    # twenty-message page, and on the shopper's it lands inside the windows
    # `grocery-errand.spec.ts` asserts the first Mercure message of. So this
    # account is for that journey alone.
    e2e_stock_user:
        email: 'e2e-stock@maggie.local'
        googleId: 'e2e-stock-google-id'
        name: 'Camille Garde-Manger'

Maggie\Core\Entity\UserPreference:
    e2e_user_preference:
        user: '@e2e_user'
        theme: 'light'
        locale: 'fr'
        timezone: 'Europe/Paris'
        defaultCalendarView: 'month'
        # The weather tool's default place; .docker/e2e/wiremock/mappings/open-meteo.json answers for it.
        defaultCity: 'Rennes'
        notificationsEnabled: true

    # Its own row, so the neighbour's settings page renders instead of hanging
    # on a preference the API would have to create on first write.
    e2e_other_user_preference:
        user: '@e2e_other_user'
        theme: 'light'
        locale: 'fr'
        timezone: 'Europe/Paris'
        defaultCalendarView: 'month'
        notificationsEnabled: true

    e2e_interrupt_user_preference:
        user: '@e2e_interrupt_user'
        theme: 'light'
        locale: 'fr'
        timezone: 'Europe/Paris'
        defaultCalendarView: 'month'
        notificationsEnabled: true

    e2e_stock_user_preference:
        user: '@e2e_stock_user'
        theme: 'light'
        locale: 'fr'
        timezone: 'Europe/Paris'
        defaultCalendarView: 'month'
        notificationsEnabled: true
