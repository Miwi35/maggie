# Three journeys that wrote state shared by the owner's account and collided with
# another file running beside them in a Playwright lot (MAG-745):
# - agenda-trip-estimate and agenda-replan each set the user's position, and one
#   read the other's (48.128 instead of home);
# - the dictated sentence of chat.spec.ts adds four tomatoes to the owner's list,
#   which grocery-list.spec.ts reads as six.
# The two trip accounts hold the owner's home and dentist (21-places.yaml).
# One account each, so no other file can move what they set.

Maggie\Core\Entity\User:
  e2e_trip_estimate_user:
    email: 'e2e-trip-estimate@maggie.local'
    googleId: 'e2e-trip-estimate-google-id'
    name: 'Théo Estimation'
  e2e_replan_user:
    email: 'e2e-replan@maggie.local'
    googleId: 'e2e-replan-google-id'
    name: 'Rose Replanification'
  e2e_voice_user:
    email: 'e2e-voice@maggie.local'
    googleId: 'e2e-voice-google-id'
    name: 'Victor Dictée'

Maggie\Calendar\Entity\Agenda:
  e2e_trip_estimate_agenda:
    name: Perso
    isDefault: true
    color: '#3f51b5'
    timeZone: 'Europe/Paris'
    user: '@e2e_trip_estimate_user'
  e2e_replan_agenda:
    name: Perso
    isDefault: true
    color: '#3f51b5'
    timeZone: 'Europe/Paris'
    user: '@e2e_replan_user'

Maggie\Calendar\Entity\Place:
  e2e_trip_estimate_place_home:
    user: '@e2e_trip_estimate_user'
    name: Maison
    address: '12 rue des Glycines Imaginaires, 35000 Rennes'
    __calls:
      - setCoordinates: [48.1100, -1.6800]
    isHome: true
  e2e_trip_estimate_place_dentist:
    user: '@e2e_trip_estimate_user'
    name: Dentiste
    address: '5 allée du Sourire Fictif, 35000 Rennes'
    parkingAddress: 'Parking du Square Inventé, 35000 Rennes'
    __calls:
      - setCoordinates: [48.1180, -1.6680]
      - setParkingCoordinates: [48.1190, -1.6672]
  e2e_replan_place_home:
    user: '@e2e_replan_user'
    name: Maison
    address: '12 rue des Glycines Imaginaires, 35000 Rennes'
    __calls:
      - setCoordinates: [48.1100, -1.6800]
    isHome: true
  e2e_replan_place_dentist:
    user: '@e2e_replan_user'
    name: Dentiste
    address: '5 allée du Sourire Fictif, 35000 Rennes'
    parkingAddress: 'Parking du Square Inventé, 35000 Rennes'
    __calls:
      - setCoordinates: [48.1180, -1.6680]
      - setParkingCoordinates: [48.1190, -1.6672]

Maggie\Grocery\Entity\Store:
  e2e_voice_store:
    name: Primeur du marché
    description: Fruits et légumes
    visitOrder: 1
    user: '@e2e_voice_user'

Maggie\Cookbook\Entity\Ingredient:
  # Its own tomato: the shared one belongs to the standard users' recipes, and an entry
  # that refers to it would pull this account into their slice (FixtureSlice).
  e2e_voice_ingredient_tomato:
    name: Tomate
    category: '<(Maggie\Grocery\Enum\ProductCategory::Produce)>'
    defaultUnit: '<(Maggie\Grocery\Enum\Unit::Piece)>'
    user: '@e2e_voice_user'

Maggie\Grocery\Entity\GroceryList:
  e2e_voice_list:
    user: '@e2e_voice_user'

Maggie\Grocery\Entity\GroceryItem:
  e2e_voice_item_tomato:
    groceryList: '@e2e_voice_list'
    product: '@e2e_voice_ingredient_tomato'
    quantity: 6
    unit: '<(Maggie\Grocery\Enum\Unit::Piece)>'
    checked: false
    source: '<(Maggie\Grocery\Enum\GroceryItemSource::Recipe)>'
    store: '@e2e_voice_store'
    position: 1
