# The Santé › Sport journey (MAG-705): three finished sessions on the owner's
# account, in the last five days, so that the week card and the table have
# something to show before the journey adds its own « Vélo ».
#
#   Course         32 min   5,4 km  watch   yesterday
#   Haut du corps  45 min           manual  3 days ago
#   Marche rapide  70 min   6,9 km  watch   5 days ago
#
# The Santé › Suivi journey (MAG-706): ten weighings on the owner's account
# over the last 30 days, 73,6 kg down to 72,2 kg, four with a body fat, one
# excluded (66,2 kg, someone else on the scale). None today: the 71,8 kg the
# web journey adds is the only value of today.
#
#   -28 d 73,6   -24 d 73,4   -20 d 73,3 (22,1 %)   -17 d 73,1   -14 d 72,9 (21,8 %)
#   -11 d 66,2 excluded   -8 d 72,7   -5 d 72,5 (21,5 %)   -3 d 72,4   -1 d 72,2 (21,3 %)
#
# Fictitious data. Mobile journeys sign in with a fresh account and add theirs.

