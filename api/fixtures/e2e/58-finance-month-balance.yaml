# The finance home with a review due and a project under way (MAG-457, MAG-631):
# Dashboard › État courant.
#
# Two envelopes this month, one held and one overrun:
#   Alimentation  300 € budget, 100 € spent  → held
#   Transport     100 € budget, 150 € spent  → over
# 400 € of budget, 250 € spent whatever the month. Both spends are
# booked on the 1st, so they are in the past whatever the stack's day is.
#
# Since MAG-631 the home no longer draws the month balance; this account now
# carries what the review card and the « Prochain projet » card need: a line of
# last month nobody rated (the review is due) and a 1 000 € « Vélo » project
# with a complete matelas behind it. The file keeps its name and the account
# its email, the seed test knows them.
#
# No other journey signs in here: the owner's account carries no overrun, and
# giving it one would move what the other finance journeys compute.

Maggie\Core\Entity\User:
  e2e_balance_user:
    email: 'e2e-balance@maggie.local'
    googleId: 'e2e-balance-google-id'
    name: 'Sacha Bilan'

Maggie\Finance\Entity\Account:
  e2e_balance_checking:
    name: Compte courant
    type: '<(Maggie\Finance\Enum\AccountType::Checking)>'
    currency: EUR
    balanceCents: 200000
    isCushion: false
    user: '@e2e_balance_user'
  e2e_balance_livret_a:
    name: Livret A
    type: '<(Maggie\Finance\Enum\AccountType::Savings)>'
    currency: EUR
    balanceCents: 900000
    isCushion: true
    user: '@e2e_balance_user'

Maggie\Finance\Entity\SafetyCushion:
  e2e_balance_cushion:
    user: '@e2e_balance_user'
    targetMonths: 3
    monthlyNetIncomeCents: 50000
    rechargeCapCents: 15000
    rechargeTargetMonths: 6

Maggie\Finance\Entity\Project:
  e2e_balance_bike:
    name: Vélo
    amountCents: 100000
    currency: EUR
    position: 0
    user: '@e2e_balance_user'

Maggie\Finance\Entity\Category:
  e2e_balance_food:
    name: Alimentation
    obligation: '<(Maggie\Finance\Enum\ObligationFlag::Optional)>'
    user: '@e2e_balance_user'
  e2e_balance_transport:
    name: Transport
    obligation: '<(Maggie\Finance\Enum\ObligationFlag::Optional)>'
    user: '@e2e_balance_user'

Maggie\Finance\Entity\Envelope:
  e2e_balance_food_envelope:
    category: '@e2e_balance_food'
    mode: '<(Maggie\Finance\Enum\BudgetMode::Monthly)>'
    amountCents: 30000
    currency: EUR
    year: '<e2eYear()>'
    month: '<e2eMonth()>'
    user: '@e2e_balance_user'
  e2e_balance_transport_envelope:
    category: '@e2e_balance_transport'
    mode: '<(Maggie\Finance\Enum\BudgetMode::Monthly)>'
    amountCents: 10000
    currency: EUR
    year: '<e2eYear()>'
    month: '<e2eMonth()>'
    user: '@e2e_balance_user'

Maggie\Finance\Entity\Transaction:
  e2e_balance_groceries:
    account: '@e2e_balance_checking'
    category: '@e2e_balance_food'
    amountCents: -10000
    currency: EUR
    bookedAt: '<e2eDate("first day of this month")>'
    label: 'SUPERMARCHE'
    status: '<(Maggie\Finance\Enum\TransactionStatus::Spent)>'
    categorySource: '<(Maggie\Finance\Enum\CategorySource::Manual)>'
    categorizedAt: '<e2eDate("first day of this month")>'
    user: '@e2e_balance_user'
  e2e_balance_train:
    account: '@e2e_balance_checking'
    category: '@e2e_balance_transport'
    amountCents: -15000
    currency: EUR
    bookedAt: '<e2eDate("first day of this month")>'
    label: 'TRAIN'
    status: '<(Maggie\Finance\Enum\TransactionStatus::Spent)>'
    categorySource: '<(Maggie\Finance\Enum\CategorySource::Manual)>'
    categorizedAt: '<e2eDate("first day of this month")>'
    user: '@e2e_balance_user'
  e2e_balance_last_month_groceries:
    account: '@e2e_balance_checking'
    category: '@e2e_balance_food'
    amountCents: -4000
    currency: EUR
    bookedAt: '<e2eDate("first day of last month")>'
    label: 'SUPERMARCHE DU MOIS DERNIER'
    status: '<(Maggie\Finance\Enum\TransactionStatus::Spent)>'
    categorySource: '<(Maggie\Finance\Enum\CategorySource::Manual)>'
    categorizedAt: '<e2eDate("first day of last month")>'
    user: '@e2e_balance_user'
