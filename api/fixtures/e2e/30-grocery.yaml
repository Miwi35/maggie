# Stores, products and a grocery list for the MAG-101 journey.
#
# Ingredients are Products (Ingredient extends Product), so they live here
# rather than in the cookbook file — the recipes below reference them.

Maggie\Grocery\Entity\Store:
  e2e_store_supermarket:
    name: Supermarché Leclerc
    description: Magasin principal
    visitOrder: 1
    user: '@e2e_user'
  e2e_store_greengrocer:
    name: Primeur du marché
    description: Fruits et légumes
    visitOrder: 2
    user: '@e2e_user'

  # The neighbour's two shops. They exist because that account is also the
  # shopper of `grocery-errand.spec.ts` — the one journey that has to own a
  # grocery list outright (see 10-core.yaml). Visit orders of their own, so the
  # aisle order it reads is theirs and not a copy of the owner's.
  e2e_other_store_market:
    name: Halles du voisin
    description: Magasin principal du voisin
    visitOrder: 1
    user: '@e2e_other_user'
  e2e_other_store_corner:
    name: Épicerie du coin
    description: Magasin de repli du voisin
    visitOrder: 2
    user: '@e2e_other_user'

Maggie\Cookbook\Entity\Ingredient:
  e2e_ingredient_tomato:
    name: Tomate
    category: '<(Maggie\Grocery\Enum\ProductCategory::Produce)>'
    defaultUnit: '<(Maggie\Grocery\Enum\Unit::Piece)>'
    user: '@e2e_user'
    preferredStore: '@e2e_store_greengrocer'
    fallbackStore: '@e2e_store_supermarket'
    shelfLifeDays: 7

  e2e_ingredient_pasta:
    name: Pâtes complètes
    category: '<(Maggie\Grocery\Enum\ProductCategory::Grain)>'
    defaultUnit: '<(Maggie\Grocery\Enum\Unit::Gram)>'
    user: '@e2e_user'
    preferredStore: '@e2e_store_supermarket'

  e2e_ingredient_parmesan:
    name: Parmesan
    category: '<(Maggie\Grocery\Enum\ProductCategory::Dairy)>'
    defaultUnit: '<(Maggie\Grocery\Enum\Unit::Gram)>'
    user: '@e2e_user'
    preferredStore: '@e2e_store_supermarket'

  e2e_ingredient_basil:
    name: Basilic
    category: '<(Maggie\Grocery\Enum\ProductCategory::Produce)>'
    defaultUnit: '<(Maggie\Grocery\Enum\Unit::Bunch)>'
    user: '@e2e_user'
    preferredStore: '@e2e_store_greengrocer'

  # The neighbour's, and the one thing of theirs the cookbook journeys read
  # (MAG-114 § 3). Named so a leak is unmistakable in a failure message: an
  # assertion that finds "du voisin" in Camille's products, in her searches or
  # on her grocery list is reporting a missing user filter and nothing else.
  # Preferred shop *and* a fallback: this is the line the closed-shop journey
  # moves, and the only one of the neighbour's that can move — which is what
  # makes its control (a line whose product has no fallback) worth asserting.
  e2e_other_ingredient_leek:
    name: Poireau du voisin
    category: '<(Maggie\Grocery\Enum\ProductCategory::Produce)>'
    defaultUnit: '<(Maggie\Grocery\Enum\Unit::Piece)>'
    user: '@e2e_other_user'
    preferredStore: '@e2e_other_store_market'
    fallbackStore: '@e2e_other_store_corner'

Maggie\Grocery\Entity\Product:
  e2e_product_milk:
    name: Lait demi-écrémé
    category: '<(Maggie\Grocery\Enum\ProductCategory::Dairy)>'
    defaultUnit: '<(Maggie\Grocery\Enum\Unit::Liter)>'
    user: '@e2e_user'
    preferredStore: '@e2e_store_supermarket'
  e2e_product_soap:
    name: Liquide vaisselle
    category: '<(Maggie\Grocery\Enum\ProductCategory::Cleaning)>'
    defaultUnit: '<(Maggie\Grocery\Enum\Unit::Bottle)>'
    user: '@e2e_user'
    preferredStore: '@e2e_store_supermarket'

  # What the neighbour's weekly recurring item puts on their list. No fallback
  # shop, on purpose: the closed-shop journey needs a line that must *not* move.
  e2e_other_product_rice:
    name: Riz du voisin
    category: '<(Maggie\Grocery\Enum\ProductCategory::Grain)>'
    defaultUnit: '<(Maggie\Grocery\Enum\Unit::Gram)>'
    user: '@e2e_other_user'
    preferredStore: '@e2e_other_store_market'

  # The other half of the closed-shop control: a product that *does* have a
  # fallback, sitting in the shop that stays open. `move_to_fallback` has two
  # filters — the item's store and the product's fallback — and only a line
  # that satisfies the second but not the first can tell them apart. Its
  # fallback is deliberately the market, so a handler that dropped the store
  # filter would move it to the very shop that just closed.
  e2e_other_product_stamps:
    name: Timbres du voisin
    category: '<(Maggie\Grocery\Enum\ProductCategory::Household)>'
    defaultUnit: '<(Maggie\Grocery\Enum\Unit::Piece)>'
    user: '@e2e_other_user'
    preferredStore: '@e2e_other_store_corner'
    fallbackStore: '@e2e_other_store_market'

Maggie\Grocery\Entity\GroceryList:
  e2e_grocery_list:
    user: '@e2e_user'

  # The shopper's own, written by `grocery-errand.spec.ts` and by nothing else
  # in the suite — which is the only way that file can prove a write published
  # (10-core.yaml says why).
  e2e_other_grocery_list:
    user: '@e2e_other_user'

Maggie\Grocery\Entity\GroceryItem:
  # Unchecked, in a known position: the "check an item in the shop" step.
  e2e_grocery_item_tomato:
    groceryList: '@e2e_grocery_list'
    product: '@e2e_ingredient_tomato'
    quantity: 6
    unit: '<(Maggie\Grocery\Enum\Unit::Piece)>'
    checked: false
    source: '<(Maggie\Grocery\Enum\GroceryItemSource::Recipe)>'
    store: '@e2e_store_greengrocer'
    position: 1

  e2e_grocery_item_pasta:
    groceryList: '@e2e_grocery_list'
    product: '@e2e_ingredient_pasta'
    quantity: 500
    unit: '<(Maggie\Grocery\Enum\Unit::Gram)>'
    checked: false
    source: '<(Maggie\Grocery\Enum\GroceryItemSource::Recipe)>'
    store: '@e2e_store_supermarket'
    position: 2

  # Already checked, so "end the errand" has both states to sort out.
  e2e_grocery_item_milk:
    groceryList: '@e2e_grocery_list'
    product: '@e2e_product_milk'
    quantity: 1
    unit: '<(Maggie\Grocery\Enum\Unit::Liter)>'
    checked: true
    source: '<(Maggie\Grocery\Enum\GroceryItemSource::Recurring)>'
    store: '@e2e_store_supermarket'
    position: 3

  # Free text, no product: the path where a label carries the whole item.
  e2e_grocery_item_custom:
    groceryList: '@e2e_grocery_list'
    customLabel: Pile LR03
    quantity: 4
    unit: '<(Maggie\Grocery\Enum\Unit::Piece)>'
    checked: false
    source: '<(Maggie\Grocery\Enum\GroceryItemSource::Manual)>'
    position: 4

  # Deferred: must stay out of today's list and appear later.
  e2e_grocery_item_deferred:
    groceryList: '@e2e_grocery_list'
    product: '@e2e_product_soap'
    quantity: 1
    unit: '<(Maggie\Grocery\Enum\Unit::Bottle)>'
    checked: false
    source: '<(Maggie\Grocery\Enum\GroceryItemSource::Manual)>'
    store: '@e2e_store_supermarket'
    buyAfter: '<e2eDate("+5 days")>'
    position: 5

  # The shopper's list: one line in a known aisle, and one in no aisle at all.
  # The leek is the only line of theirs whose product has a fallback shop, so
  # it is the one the closed-shop journey moves and the rice is its control.
  e2e_other_item_leek:
    groceryList: '@e2e_other_grocery_list'
    product: '@e2e_other_ingredient_leek'
    quantity: 3
    unit: '<(Maggie\Grocery\Enum\Unit::Piece)>'
    checked: false
    source: '<(Maggie\Grocery\Enum\GroceryItemSource::Recipe)>'
    store: '@e2e_other_store_market'
    position: 1

  # The second shop needs a line of its own: the view builds a group only for a
  # shop a line sits in, so without this one the aisle order has nothing to be
  # an order *of*. Its product carries a fallback, which is what makes it the
  # closed-shop journey's real control — it must stay put because it is not in
  # the shop that closed, and not merely because it has nowhere to go.
  e2e_other_item_corner:
    groceryList: '@e2e_other_grocery_list'
    product: '@e2e_other_product_stamps'
    quantity: 2
    unit: '<(Maggie\Grocery\Enum\Unit::Piece)>'
    checked: false
    source: '<(Maggie\Grocery\Enum\GroceryItemSource::Manual)>'
    store: '@e2e_other_store_corner'
    position: 2

  e2e_other_item_note:
    groceryList: '@e2e_other_grocery_list'
    customLabel: Sacs du voisin
    quantity: 1
    unit: '<(Maggie\Grocery\Enum\Unit::Pack)>'
    checked: false
    source: '<(Maggie\Grocery\Enum\GroceryItemSource::Manual)>'
    position: 3

Maggie\Grocery\Entity\RecurringGroceryItem:
  e2e_recurring_milk:
    product: '@e2e_product_milk'
    quantity: 2
    unit: '<(Maggie\Grocery\Enum\Unit::Liter)>'
    frequency: '<(Maggie\Grocery\Enum\RecurringFrequency::Weekly)>'
    user: '@e2e_user'

  e2e_recurring_soap:
    product: '@e2e_product_soap'
    quantity: 1
    unit: '<(Maggie\Grocery\Enum\Unit::Bottle)>'
    frequency: '<(Maggie\Grocery\Enum\RecurringFrequency::Monthly)>'
    user: '@e2e_user'

  # The shopper's, and it is not on their list: nothing but
  # `generate_grocery_list` ever puts a recurring item there — no cron, no
  # screen, no button — so its appearance is the whole assertion.
  e2e_other_recurring_rice:
    product: '@e2e_other_product_rice'
    quantity: 500
    unit: '<(Maggie\Grocery\Enum\Unit::Gram)>'
    frequency: '<(Maggie\Grocery\Enum\RecurringFrequency::Weekly)>'
    user: '@e2e_other_user'
