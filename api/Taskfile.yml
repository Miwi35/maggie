version: '3'

vars:
  COMPOSE_FILE: '{{.ROOT_DIR}}/docker-compose.yml'

tasks:
  # ===========================================================================
  # Composer / Dependencies
  # ===========================================================================
  install:
    desc: Install PHP dependencies
    cmds:
      - docker compose -f {{.COMPOSE_FILE}} exec php composer install --prefer-source

  update:
    desc: Update PHP dependencies
    cmds:
      - docker compose -f {{.COMPOSE_FILE}} exec php composer update --prefer-source

  require:
    desc: Add a new PHP dependency
    cmds:
      - docker compose -f {{.COMPOSE_FILE}} exec php composer require {{.CLI_ARGS}}

  validate:
    desc: Validate composer.json files
    cmds:
      - docker compose -f {{.COMPOSE_FILE}} exec php composer validate --no-check-publish

  dump-autoload:
    desc: Regenerate autoloader
    cmds:
      - docker compose -f {{.COMPOSE_FILE}} exec php composer dump-autoload

  # ===========================================================================
  # Symfony Console (passthrough)
  # ===========================================================================
  console:
    desc: Run any Symfony console command
    cmds:
      - docker compose -f {{.COMPOSE_FILE}} exec php bin/console {{.CLI_ARGS}}

  # ===========================================================================
  # Testing
  # ===========================================================================
  test:
    desc: Run PHPUnit tests
    cmds:
      - docker compose -f {{.COMPOSE_FILE}} exec php bin/phpunit {{.CLI_ARGS}}

  test:coverage:
    desc: Run tests with coverage report
    cmds:
      - docker compose -f {{.COMPOSE_FILE}} exec php bin/phpunit --coverage-html var/coverage

  # ===========================================================================
  # Code Quality
  # ===========================================================================
  lint:
    desc: Run all linting tools
    cmds:
      - task: cs:check
      - task: phpstan

  phpstan:
    desc: Run PHPStan static analysis
    cmds:
      - docker compose -f {{.COMPOSE_FILE}} exec php vendor/bin/phpstan analyse {{.CLI_ARGS}}

  phpstan:changed:
    desc: PHPStan on the PHP files changed since origin/main, on the code of the checkout you run it from
    # Delegates to the worktree-local runner: the dev stack behind `api:phpstan`
    # mounts the main checkout, so in a worktree it would analyse the wrong code.
    cmds:
      - task: :wt:phpstan:changed

  cs:fix:
    desc: Fix PHP code style (PHP-CS-Fixer, dev stack — from a worktree use `task wt:cs:fix`)
    cmds:
      - docker compose -f {{.COMPOSE_FILE}} exec php vendor/bin/php-cs-fixer fix --diff {{.CLI_ARGS}}

  cs:check:
    desc: Check PHP code style without changing anything (CI mode)
    cmds:
      - docker compose -f {{.COMPOSE_FILE}} exec php vendor/bin/php-cs-fixer fix --dry-run --diff {{.CLI_ARGS}}

  # ===========================================================================
  # Elasticsearch
  # ===========================================================================
  es:reindex:
    desc: Reindex all entities into Elasticsearch
    cmds:
      - docker compose -f {{.COMPOSE_FILE}} exec php bin/console app:elasticsearch:reindex --all

  es:status:
    desc: Show Elasticsearch index status
    cmds:
      - docker compose -f {{.COMPOSE_FILE}} exec php bin/console app:elasticsearch:status

  es:mapping:
    desc: Create or update Elasticsearch index mappings
    cmds:
      - docker compose -f {{.COMPOSE_FILE}} exec php bin/console app:elasticsearch:mapping:update --all
